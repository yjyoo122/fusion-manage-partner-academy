<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fusion Manage 파트너 아카데미</title>
<style>/* Fusion Manage partner academy — Autodesk brand: Black/White primaries, Hello Yellow single accent,
   Warm Slate/Slate secondary, 4px grid, sentence case. Artifakt if installed; CJK falls back to system fonts. */
:root {
  --black: #000000; --white: #FFFFFF; --yellow: #FFFF00;
  --ws100: #F5F5F0; --ws300: #E4E4DB; --ws: #D5D5CB;
  --sl100: #E8E8E8; --sl200: #C9C9C9; --sl300: #A3A3A3; --slate: #666666;
  --tw700: #136B9A; --dusk700: #D34621; --morn700: #21A183;
  --side: 296px; --r4: 4px; --r8: 8px; --r16: 16px; --r24: 24px;
  --font-body: "Artifakt Element", var(--cjk), Arial, sans-serif;
  --font-head: "Artifakt Legend", "Artifakt Element", var(--cjk), Arial, sans-serif;
}
html[lang="ko"] { --cjk: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", "Nanum Gothic"; }
html[lang="ja"] { --cjk: "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "Meiryo", "Hiragino Sans"; }
html[lang="en"] { --cjk: Arial; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--font-body); font-size: 16px; line-height: 28px; color: var(--black); background: var(--white); word-break: keep-all; overflow-wrap: anywhere; }
html[lang="ja"] body { word-break: normal; line-break: strict; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--tw700); outline-offset: 2px; }

/* ---------- layout ---------- */
.side { position: fixed; inset: 0 auto 0 0; width: var(--side); background: var(--black); color: var(--white); display: flex; flex-direction: column; z-index: 20; }
.side .brand { padding: 32px 24px 20px; }
.side .brand img { width: 160px; height: auto; display: block; }
.side .brand .prod { margin-top: 16px; font-family: var(--font-head); font-weight: 700; font-size: 20px; line-height: 24px; }
.side .brand .sub { color: var(--sl200); font-size: 13px; line-height: 20px; margin-top: 4px; }
.side .prog { padding: 0 24px 16px; font-size: 12px; line-height: 16px; color: var(--sl200); }
.side .prog .track { height: 4px; background: var(--slate); margin-top: 8px; }
.side .prog .fill { height: 4px; background: var(--yellow); width: 0; transition: width .3s; }
.side .search { margin: 0 24px 12px; }
.side .search input { width: 100%; padding: 8px 12px; border-radius: var(--r4); border: 1px solid var(--slate); background: #111; color: var(--white); font: inherit; font-size: 14px; }
.side nav { overflow-y: auto; flex: 1; padding: 4px 0 24px; }
.side nav .grp { padding: 16px 24px 4px; font-size: 11px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--sl300); }
.side nav a { display: grid; grid-template-columns: 32px 1fr 16px; gap: 4px; align-items: baseline; padding: 8px 24px; text-decoration: none; color: var(--sl100); font-size: 14px; line-height: 20px; border-left: 4px solid transparent; }
.side nav a .n { font-family: var(--font-head); font-weight: 700; color: var(--sl300); }
.side nav a:hover { background: #151515; color: var(--white); }
.side nav a.on { border-left-color: var(--yellow); color: var(--white); background: #151515; }
.side nav a.on .n { color: var(--yellow); }
.side nav a .ok { color: var(--sl300); font-size: 12px; }
.side .langs { padding: 12px 24px 20px; border-top: 1px solid #222; display: flex; gap: 8px; font-size: 13px; }
.side .langs a { padding: 4px 8px; border-radius: var(--r4); text-decoration: none; color: var(--sl200); border: 1px solid #333; }
.side .langs a.cur { color: var(--black); background: var(--white); border-color: var(--white); }
.side .langs span.na { padding: 4px 8px; color: #555; border: 1px dashed #333; border-radius: var(--r4); }
.main { margin-left: var(--side); min-height: 100vh; }
.menu-btn { display: none; }

/* ---------- module hero ---------- */
.hero { background: var(--black); color: var(--white); padding: 64px 64px 48px; display: grid; grid-template-columns: 1fr 280px; gap: 48px; align-items: end; }
.hero .kicker { font-size: 13px; line-height: 20px; letter-spacing: .08em; text-transform: uppercase; color: var(--sl200); }
.hero h1 { font-family: var(--font-head); font-weight: 700; font-size: 48px; line-height: 56px; margin: 12px 0 16px; letter-spacing: -.01em; }
.hero h1 em { font-style: normal; color: var(--yellow); }
.hero .goal { color: var(--sl100); max-width: 720px; font-size: 18px; line-height: 28px; margin: 0; }
.hero .facts { border-top: 1px solid var(--slate); }
.hero .facts div { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; font-size: 13px; line-height: 20px; color: var(--sl200); }
.hero .facts b { color: var(--white); font-weight: 700; }
.content { padding: 48px 64px 32px; max-width: 1120px; }
.content > section + section { margin-top: 48px; }

/* ---------- blocks ---------- */
h2.sec { font-family: var(--font-head); font-weight: 700; font-size: 28px; line-height: 36px; margin: 0 0 16px; padding-top: 24px; border-top: 1px solid var(--black); }
h3 { font-family: var(--font-body); font-weight: 700; font-size: 18px; line-height: 28px; margin: 32px 0 8px; }
p { margin: 0 0 16px; }
.lead { font-size: 20px; line-height: 32px; max-width: 860px; }
ul.l, ol.l { margin: 0 0 16px; padding-left: 24px; }
ul.l li, ol.l li { margin-bottom: 4px; }
code { font-family: Consolas, "Courier New", monospace; font-size: 14px; background: var(--ws100); padding: 0 4px; border-radius: var(--r4); }
.muted { color: var(--slate); }
.small { font-size: 13px; line-height: 20px; }

table.t { width: 100%; border-collapse: collapse; margin: 8px 0 8px; font-size: 14px; line-height: 20px; }
table.t th { text-align: left; font-weight: 700; padding: 12px 12px 8px; border-bottom: 2px solid var(--black); vertical-align: bottom; white-space: nowrap; }
table.t td { padding: 10px 12px; border-bottom: 1px solid var(--sl200); vertical-align: top; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.total td { font-weight: 700; border-top: 2px solid var(--black); border-bottom: none; }
.tnote { font-size: 12px; line-height: 16px; color: var(--slate); margin: 0 0 24px; }
.twrap { overflow-x: auto; }

.callout { border-radius: var(--r16); padding: 20px 24px; margin: 16px 0 24px; background: var(--ws100); }
.callout .ct { font-weight: 700; margin-bottom: 4px; display: flex; gap: 8px; align-items: baseline; }
.callout .ct .tag { font-size: 11px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: var(--r4); background: var(--black); color: var(--white); }
.callout.warn { background: var(--black); color: var(--white); }
.callout.warn .ct .tag { background: var(--yellow); color: var(--black); }
.callout.rule { background: var(--white); border: 2px solid var(--black); }
.callout.source { background: var(--white); border: 1px solid var(--sl200); font-size: 13px; line-height: 20px; color: var(--slate); }
.callout p:last-child, .callout ul:last-child { margin-bottom: 0; }

.steps { list-style: none; margin: 8px 0 24px; padding: 0; counter-reset: s; }
.steps > li { display: grid; grid-template-columns: 64px 1fr; gap: 16px; padding: 16px 0; border-top: 1px solid var(--sl200); counter-increment: s; }
.steps > li:last-child { border-bottom: 1px solid var(--sl200); }
.steps > li::before { content: counter(s, decimal-leading-zero); font-family: var(--font-head); font-weight: 700; font-size: 28px; line-height: 32px; }
.steps .st { font-weight: 700; }
.steps .sm { font-size: 13px; line-height: 20px; color: var(--slate); margin-top: 4px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); background: var(--black); color: var(--white); margin: 16px 0 24px; border-radius: 0 var(--r24) 0 0; }
.stats div { padding: 24px; border-right: 1px solid #333; }
.stats div:last-child { border-right: none; }
.stats .v { font-family: var(--font-head); font-weight: 700; font-size: 40px; line-height: 48px; color: var(--yellow); }
.stats .k { font-size: 13px; line-height: 20px; color: var(--sl100); margin-top: 4px; }

.bars { margin: 16px 0 24px; }
.bars .bt { font-family: var(--font-head); font-weight: 700; font-size: 20px; line-height: 28px; }
.bars .bs { color: var(--slate); margin-bottom: 16px; }
.bars .row { display: grid; grid-template-columns: 1fr 112px; align-items: center; gap: 12px; border-bottom: 1px dotted var(--sl300); padding: 6px 0; }
.bars .bar { height: 32px; background: var(--ws); display: flex; align-items: center; min-width: 2px; border-radius: 0 var(--r4) var(--r4) 0; }
.bars .bar.hi { background: var(--yellow); }
.bars .bar span { font-size: 13px; line-height: 20px; padding: 0 8px; white-space: nowrap; }
.bars .lbl { font-size: 13px; line-height: 20px; margin-bottom: 2px; }
.bars .val { font-family: var(--font-head); font-weight: 700; font-size: 22px; line-height: 28px; text-align: left; }
.bars .val small { font-size: 12px; font-weight: 400; color: var(--slate); }
.bars .bn { font-size: 12px; line-height: 16px; color: var(--slate); margin-top: 8px; }

.gantt { margin: 16px 0 24px; overflow-x: auto; }
.gantt .gt { font-family: var(--font-head); font-weight: 700; font-size: 20px; line-height: 28px; }
.gantt .gs { color: var(--slate); margin-bottom: 12px; }
.gantt .grid { display: grid; min-width: 760px; font-size: 13px; line-height: 20px; }
.gantt .hd { color: var(--slate); font-size: 11px; border-bottom: 1px solid var(--black); padding: 4px 0; text-align: center; }
.gantt .lab { padding: 6px 12px 6px 0; border-bottom: 1px solid var(--sl100); }
.gantt .cell { border-bottom: 1px solid var(--sl100); border-left: 1px solid var(--sl100); position: relative; }
.gantt .bar { position: absolute; top: 6px; bottom: 6px; border-radius: var(--r4); background: var(--ws); font-size: 12px; line-height: 20px; padding: 0 6px; white-space: nowrap; overflow: hidden; }
.gantt .bar.k-gate { background: var(--yellow); }
.gantt .bar.k-run { background: var(--black); color: var(--white); }
.gantt .bar.k-opt { background: repeating-linear-gradient(45deg, var(--ws100), var(--ws100) 4px, var(--ws300) 4px, var(--ws300) 8px); }
.gantt .legend { display: flex; gap: 16px; font-size: 12px; color: var(--slate); margin-top: 8px; flex-wrap: wrap; }
.gantt .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }

.flow { display: grid; grid-template-columns: repeat(var(--n), 1fr); margin: 16px 0 24px; border: 1px solid var(--black); }
.flow > div { padding: 16px; border-right: 1px solid var(--black); min-height: 160px; }
.flow > div:last-child { border-right: none; }
.flow .fn { font-family: var(--font-head); font-weight: 700; font-size: 28px; line-height: 32px; }
.flow .ft { font-weight: 700; margin: 8px 0 4px; line-height: 24px; }
.flow .fx { font-size: 13px; line-height: 20px; color: var(--slate); }
.flow > div.hi { background: var(--black); color: var(--white); }
.flow > div.hi .fn { color: var(--yellow); }
.flow > div.hi .fx { color: var(--sl200); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0; margin: 16px 0 24px; border-top: 1px solid var(--black); border-left: 1px solid var(--black); }
.tiles > div { padding: 20px; border-right: 1px solid var(--black); border-bottom: 1px solid var(--black); }
.tiles .tt { font-weight: 700; margin-bottom: 4px; }
.tiles .tg { font-size: 11px; line-height: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--slate); margin-bottom: 8px; }
.tiles .tx { font-size: 14px; line-height: 20px; }
.tiles .tx ul { margin: 4px 0 0; padding-left: 18px; }

.check { list-style: none; padding: 0; margin: 8px 0 24px; }
.check li { border-bottom: 1px solid var(--sl200); }
.check label { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 10px 0; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 4px; accent-color: var(--black); }
.check input:checked + span { color: var(--slate); text-decoration: line-through; text-decoration-color: var(--sl300); }
.check .cmeta { font-size: 12px; color: var(--slate); margin-top: -4px; padding-bottom: 8px; display: flex; justify-content: space-between; }
.check .cmeta button { font: inherit; background: none; border: none; text-decoration: underline; cursor: pointer; color: var(--slate); }

details.d { border-top: 1px solid var(--sl200); }
details.d:last-of-type { border-bottom: 1px solid var(--sl200); }
details.d > summary { cursor: pointer; padding: 14px 0; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
details.d > summary::after { content: "+"; font-family: var(--font-head); font-size: 22px; }
details.d[open] > summary::after { content: "−"; }
details.d > .db { padding: 0 0 16px; }

.tpl { border-radius: var(--r16); border: 1px solid var(--black); margin: 16px 0 24px; overflow: hidden; }
.tpl .th { background: var(--black); color: var(--white); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.tpl .th b { font-weight: 700; }
.tpl .th button, .btn { font: inherit; font-size: 13px; line-height: 20px; padding: 6px 14px; border-radius: var(--r4); border: 1px solid var(--white); background: transparent; color: var(--white); cursor: pointer; }
.tpl .tb { padding: 8px 20px 16px; font-size: 14px; line-height: 22px; }
.tpl .tb .sh { font-weight: 700; margin-top: 12px; }
.tpl .tb ul { margin: 4px 0 0; padding-left: 20px; }

.raci td.v { text-align: center; font-weight: 700; width: 64px; }
.raci td.v.R { background: var(--black); color: var(--white); }
.raci td.v.A { background: var(--yellow); }
.raci td.v.C { background: var(--ws); }
.raci td.v.I { color: var(--slate); }

.quiz { margin: 16px 0 24px; }
.quiz .q { border-top: 1px solid var(--black); padding: 16px 0; }
.quiz .qq { font-weight: 700; margin-bottom: 8px; }
.quiz button.o { display: block; width: 100%; text-align: left; font: inherit; padding: 10px 14px; margin: 6px 0; border: 1px solid var(--sl300); background: var(--white); border-radius: var(--r8); cursor: pointer; }
.quiz button.o:hover { border-color: var(--black); }
.quiz button.o.right { background: var(--black); color: var(--white); border-color: var(--black); }
.quiz button.o.wrong { background: var(--ws100); color: var(--slate); text-decoration: line-through; }
.quiz .why { font-size: 14px; line-height: 20px; color: var(--slate); margin-top: 8px; display: none; }
.quiz .q.done .why { display: block; }

/* estimator */
.est { border: 1px solid var(--black); border-radius: 0 var(--r24) 0 0; margin: 16px 0 24px; }
.est .eh { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; padding: 20px; border-bottom: 1px solid var(--black); background: var(--ws100); border-radius: 0 var(--r24) 0 0; }
.est label.f { font-size: 13px; line-height: 20px; display: block; }
.est label.f b { display: block; margin-bottom: 4px; }
.est select, .est input[type=number], .est input[type=text] { width: 100%; font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--slate); border-radius: var(--r4); background: var(--white); }
.est .eg { padding: 0 20px; }
.est .eg h4 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--slate); margin: 20px 0 4px; }
.est .ei { display: grid; grid-template-columns: 28px 1fr 160px 80px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--sl200); font-size: 14px; line-height: 20px; }
.est .ei .eh2 { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.est .ei .desc { font-size: 12px; color: var(--slate); }
.est .out { background: var(--black); color: var(--white); padding: 24px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-top: 16px; }
.est .out .v { font-family: var(--font-head); font-weight: 700; font-size: 36px; line-height: 44px; color: var(--yellow); }
.est .out .k { font-size: 13px; color: var(--sl100); }
.est .brk { padding: 16px 20px 20px; font-size: 13px; line-height: 20px; }
.est .brk table { width: 100%; border-collapse: collapse; }
.est .brk td { padding: 6px 8px; border-bottom: 1px solid var(--sl200); }
.est .brk td.num { text-align: right; font-variant-numeric: tabular-nums; }
.est .acts { padding: 0 20px 20px; display: flex; gap: 8px; flex-wrap: wrap; }
.est .acts .btn { color: var(--black); border-color: var(--black); }

/* sidebar save + builder link */
.side .prog .tt { margin-top: 8px; color: var(--sl300); }
.savebox { padding: 0 24px 12px; font-size: 12px; line-height: 16px; color: var(--sl300); }
.savebox .sbtn { width: 100%; font: inherit; font-size: 13px; line-height: 20px; padding: 6px 12px; border-radius: var(--r4); border: 1px solid var(--white); background: var(--white); color: var(--black); cursor: pointer; font-weight: 700; }
.savebox .smsg { margin-top: 6px; }
.savebox .sio { margin-top: 4px; }
.lnk { font: inherit; background: none; border: none; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; }
.side .bldlink { display: block; margin: 0 24px 12px; padding: 8px 12px; border: 1px solid var(--yellow); border-radius: var(--r4); color: var(--yellow); text-decoration: none; font-size: 13px; line-height: 20px; font-weight: 700; }
.side .bldlink:hover { background: var(--yellow); color: var(--black); }

/* disclaimer banner, resume card, gate */
.banner { background: var(--yellow); color: var(--black); padding: 8px 64px; font-size: 13px; line-height: 20px; font-weight: 700; display: flex; gap: 16px; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 15; }
.banner .lnk { white-space: nowrap; font-weight: 400; }
.resume { background: var(--ws100); border-bottom: 1px solid var(--sl200); padding: 12px 64px; display: flex; gap: 16px; align-items: center; font-size: 14px; }
.btn.dark { background: var(--black); color: var(--white); border-color: var(--black); text-decoration: none; }
body.gated { overflow: hidden; }
.gate { position: fixed; inset: 0; background: rgba(0, 0, 0, .92); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }
.gbox { background: var(--white); color: var(--black); max-width: 760px; width: 100%; border-radius: 0 var(--r24) 0 0; padding: 40px 40px 32px; }
.gbox .gk { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--slate); }
.gbox h2 { font-family: var(--font-head); font-weight: 700; font-size: 32px; line-height: 40px; margin: 8px 0 20px; }
.gbox h2 em { font-style: normal; background: var(--black); color: var(--yellow); padding: 0 6px; }
.gbox ol { margin: 0 0 20px; padding-left: 24px; }
.gbox ol li { margin-bottom: 10px; line-height: 24px; }
.gbox .gchk { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 16px; background: var(--ws100); border-radius: var(--r8); font-weight: 700; cursor: pointer; }
.gbox .gchk input { width: 20px; height: 20px; accent-color: var(--black); }
.gbox .gact { margin-top: 20px; text-align: right; }
.gbox .gbtn { font: inherit; font-weight: 700; padding: 12px 24px; border-radius: var(--r4); border: 2px solid var(--black); background: var(--black); color: var(--white); cursor: pointer; }
.gbox .gbtn:disabled { background: var(--sl200); border-color: var(--sl200); color: var(--slate); cursor: not-allowed; }

/* quiz header */
.quiz .qh { display: flex; gap: 16px; align-items: baseline; }
.quiz .qh h3 { margin-right: auto; }
.quiz .qs { font-weight: 700; }
.quiz .qr, .acts .btn, .bld .btn { color: var(--black); border-color: var(--black); }

/* builder */
.bld { border: 1px solid var(--black); border-radius: 0 var(--r24) 0 0; margin: 16px 0 24px; padding: 0 20px 20px; }
.bld .bstep h4 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--slate); margin: 20px 0 8px; }
.bld .bpick { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); border-top: 1px solid var(--black); border-left: 1px solid var(--black); }
.bld .bt { font: inherit; text-align: left; background: var(--white); border: none; border-right: 1px solid var(--black); border-bottom: 1px solid var(--black); padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; }
.bld .bt .tg { font-family: var(--font-head); font-weight: 700; font-size: 20px; line-height: 24px; }
.bld .bt .bd { font-size: 12px; line-height: 16px; color: var(--slate); }
.bld .bt.on { background: var(--black); color: var(--white); }
.bld .bt.on .tg { color: var(--yellow); }
.bld .bt.on .bd { color: var(--sl200); }
.bld .eh { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; padding: 16px; background: var(--ws100); }
.bld label.f { font-size: 13px; line-height: 20px; display: block; }
.bld label.f b { display: block; margin-bottom: 4px; }
.bld select, .bld input[type=number], .bld input[type=text] { width: 100%; font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--slate); border-radius: var(--r4); background: var(--white); }
.bld .ei { display: grid; grid-template-columns: 28px 1fr 180px 80px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--sl200); font-size: 14px; line-height: 20px; }
.bld .ei .eh2 { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.bld .ei .desc { font-size: 12px; color: var(--slate); }

 25–45분 분량이며, 하단의 **완료로 표시** 버튼으로 진행률을 기록할 수 있습니다. 체크리스트와 견적 계산기 입력값은 이 브라우저에 자동 저장됩니다."}, {"t": "sec", "id": "big5", "text": "먼저 기억할 다섯 가지"}, {"t": "steps", "items": [{"title": "SOW는 짧고, 상한은 명확하게", "text": "관측된 SOW는 2쪽 분량의 요청서였습니다. 대신 회의·워크숍·UAT 라운드·결함 수정 일수·운영 전환 지원에 모두 \"최대 N\" 상한이 붙어 있었습니다.", "meta": "상세: [[sow|05 SOW 작성]]"}, {"title": "디스커버리와 설계는 반드시 초과한다고 가정", "text": "구축 단계 견적은 대체로 지켜지거나 남았지만, 현행 분석·목표 설계·데이터 정의는 +10%~+213% 초과했습니다.", "meta": "상세: [[estimate|03 스코핑과 견적]]"}, {"title": "고객 책임을 문서에 적기", "text": "UAT 수행, 결함 우선순위, 데이터 준비, 최종 사용자 교육, 자체 연동 테스트는 고객 몫으로 명시해야 최선 노력(best effort) 모델이 안전합니다.", "meta": "상세: [[risk|07 리스크와 안전장치]]"}, {"title": "To-Be 승인 전에는 구축하지 않기", "text": "일정 지연의 가장 큰 원인은 목표 설계 승인 대기(수주~수개월)였습니다. 승인 기한을 합의하고 범위 변경서로 관리하십시오.", "meta": "상세: [[method|08 딜리버리 방법론]]"}, {"title": "운영 전환은 끝이 아니라 시작", "text": "도입 확산은 설정보다 스폰서십과 변경 관리에 좌우되었습니다. 지원 체계·관리자 자립·활성 사용자 측정을 계약 단계부터 설계하십시오.", "meta": "상세: [[support|12 지원·유지보수·도입 확산]]"}]}, {"t": "sec", "id": "plan90", "text": "신규 파트너 90일 준비 계획 (권장)"}, {"t": "gantt", "title": "첫 프로젝트 수주 전 90일", "subtitle": "역량·자산·영업 파이프라인을 동시에 준비합니다", "cols": ["1–2주", "3–4주", "5–6주", "7–8주", "9–10주", "11–13주"], "rows": [{"label": "제품 학습·데모 테넌트", "start": 0, "len": 2, "kind": "std", "text": "표준 앱·워크플로 익히기"}, {"label": "표준 데모 시나리오", "start": 1, "len": 2, "kind": "std", "text": "변경 → BOM 개정 폐루프"}, {"label": "SOW·견적 템플릿 확정", "start": 2, "len": 2, "kind": "run", "text": "법무 검토 포함"}, {"label": "관리자 인증·교육", "start": 0, "len": 4, "kind": "std", "text": "관리자 기본 과정"}, {"label": "타깃 고객 선정·자격 검증", "start": 3, "len": 3, "kind": "std", "text": "디스커버리 질문 활용"}, {"label": "첫 디스커버리 워크숍", "start": 5, "len": 1, "kind": "gate", "text": "제안 준비"}], "legend": [{"kind": "std", "text": "준비 활동"}, {"kind": "run", "text": "필수 산출물"}, {"kind": "gate", "text": "관문"}]}, {"t": "checklist", "id": "start-90", "title": "90일 준비 체크리스트", "items": ["데모용 Fusion Manage 테넌트를 확보하고 표준 워크스페이스 구조를 익혔다", "문제 보고 → 변경 요청 → 변경 지시 → BOM 개정으로 이어지는 폐루프 데모를 15분 안에 시연할 수 있다", "귀사 SOW 템플릿에 상한(\"최대 N\") 조항, 고객 책임, 제외 범위, 범위 변경 절차를 반영했다", "SOW·계약 템플릿에 대한 귀사 법무 검토를 마쳤다", "귀사 내부 단가와 역할별 원가 기준을 정하고 견적 계산기로 표준 패키지 2–3개를 만들었다", "PM·컨설턴트·스크립트 개발자·연동 담당 역할을 내부에 지정했다", "Autodesk 파트너 담당자와 첫 공동 영업 대상 계정을 합의했다"]}, {"t": "sec", "id": "features", "text": "이 가이드의 기능"}, {"t": "table", "head": ["기능", "위치", "쓰임"], "rows": [["견적 계산기", "03 스코핑과 견적", "라인 아이템을 골라 공수·기간·금액(귀사 단가)을 계산하고 엑셀로 복사"], ["복사 가능한 템플릿", "05, 14", "SOW·범위 변경서·RAID·RACI·현황 보고 등 목차를 복사해 문서 초안으로 사용"], ["체크리스트", "대부분 모듈, 15", "착수·설계 승인·운영 전환 준비 상태를 자동 저장"], ["셀프 체크", "모든 모듈 끝", "핵심 개념 이해 확인"], ["검색", "왼쪽 상단", "용어·수치를 전체 모듈에서 검색"]]}, {"t": "quiz", "items": [{"q": "이 가이드의 공수 수치를 고객 견적에 쓰기 전에 반드시 해야 할 일은?", "options": ["그대로 견적서에 옮긴다", "고객 디스커버리로 범위와 복잡도를 검증한다", "모든 항목을 L 값으로 잡는다"], "answer": 1, "why": "수치는 엔터프라이즈 관측치입니다. 고객 규모·복잡도를 디스커버리로 확인한 뒤 S/M/L을 고르고 예비 공수를 더해야 합니다."}, {"q": "관측 프로젝트에서 견적 초과가 가장 자주 발생한 단계는?", "options": ["구축(구성)", "현행 분석·목표 설계·데이터 정의", "종료 보고"], "answer": 1, "why": "구축 단계는 대체로 견적 내였지만, 디스커버리·설계 단계는 +10%~+213% 초과했습니다."}, {"q": "이 가이드가 금액 정보를 다루는 방식은?", "options": ["Autodesk 단가를 참고용으로 제공한다", "금액을 제공하지 않고 귀사 단가로 계산하게 한다", "업계 평균 단가를 제시한다"], "answer": 1, "why": "모든 금액 정보는 제거했습니다. 견적 계산기에 귀사 단가를 넣으면 참고 금액이 계산됩니다."}]}]}, {"id": "product", "num": "01", "group": "start", "title": "Fusion Manage를 *15분 만에* 설명하기", "short": "제품 이해", "goal": "Fusion Manage가 무엇이고 어떤 구성 요소로 프로세스를 만드는지, 표준 앱과 폐루프, PDM·PLM·ERP 역할 분담, 테넌트 구성과 플랫폼 한계를 고객에게 15분 안에 정확하게 설명할 수 있습니다.", "facts": [["학습 시간", "35분"], ["대상", "영업·프리세일즈·컨설턴트"], ["산출물", "15분 설명 스크립트"]], "blocks": [{"t": "lead", "text": "Fusion Manage는 **코딩이 아니라 구성(configure)으로 프로세스를 만드는 클라우드 PLM**입니다. 영업은 개념을 정확하게, 컨설턴트는 한계를 미리 알아야 고객과의 약속을 지킬 수 있습니다. 이 모듈은 고객 앞에서 15분 안에 설명할 내용과, 견적 전에 알아야 할 설계상 함정을 함께 정리합니다."}, {"t": "sec", "id": "pitch", "text": "한 문장 정의와 15분 흐름"}, {"t": "p", "text": "**Fusion Manage = 워크스페이스를 구성해 제품 데이터와 프로세스를 연결하는 SaaS형 클라우드 PLM.** 브라우저에서 쓰고 설치가 없습니다. 책임은 분명히 나뉩니다. 고객은 **데이터와 구성**을, Autodesk는 **인프라·애플리케이션(유지보수, 버그 수정, 업데이트)·가용성**을 책임집니다(관측: 고객 교육 자료의 SaaS 책임 모델)."}, {"t": "callout", "kind": "source", "title": "공개 포지셔닝 메시지 (Autodesk 공개 자료 인용)", "items": ["처음부터 SaaS로 설계되어 무중단 업데이트로 모든 사용자가 항상 최신 버전을 씁니다.", "인스턴트 온(instant-on): 서버 구축 없이 바로 시작하고, 협력사도 같은 테넌트에 초대할 수 있습니다.", "CAD 플러그인이 필요 없습니다. CAD 데이터는 Vault를 통해 가져옵니다.", "워크스페이스 수에 제한이 없고 워크스페이스당 추가 과금이 없습니다. 앱 스토어의 다중 워크스페이스 앱도 추가 비용 없이 설치합니다.", "보안 인증(ISO 27001, SOC 2)을 공개적으로 제시합니다."], "text": "고객 자료에 옮길 때는 '(Autodesk 공개 자료 인용)'을 붙이고, 라이선스 조건은 Autodesk 파트너 담당자에게 최신 내용을 확인하십시오."}, {"t": "list", "title": "고객에게 통하는 세 문장 (관측된 제안 메시지)", "items": ["**\"PDM을 대체하지 않습니다. 결합하고 연결합니다.\"** PDM은 설계자용 전문 도구, PLM은 전사 사용자용 프로세스 도구입니다.", "**\"PLM은 PDM 앞과 뒤에서 일어나는 일입니다.\"** 요청·승인·품질·구매·제조 준비가 PLM의 영역입니다.", "**\"문서 기반 프로세스를 디지털 프로세스로 바꿉니다.\"** 엑셀 양식과 이메일 결재를 워크플로로 대체합니다."]}, {"t": "steps", "title": "15분 설명 시나리오 (권장)", "items": [{"title": "정의 (2분)", "text": "한 문장 정의와 SaaS 책임 모델을 말합니다. 먼저 고객의 현재 도구(엑셀 양식, 이메일 결재, PDM)를 묻고 그 위에 PLM을 놓습니다.", "meta": "핵심 메시지: 대체가 아니라 결합"}, {"title": "구성 요소 (3분)", "text": "워크스페이스·필드·워크플로·BOM·권한을 블록으로 설명합니다. 개발이 아니라 구성이라는 점을 강조합니다.", "meta": "근거: 이 모듈 '핵심 구성 요소'"}, {"title": "표준 앱 맵 (3분)", "text": "변경·제품 개발·포트폴리오·NPI·품질·공급망 6개 영역을 한 장으로 보여주고, 고객이 우선순위 영역을 고르게 합니다.", "meta": "근거: '표준 앱 맵과 폐루프'"}, {"title": "폐루프 데모 (4분)", "text": "문제 보고 → 변경 요청 → 변경 지시 → Items & BOMs 개정을 실제 테넌트에서 시연합니다. 간이 변경(fast track) 경로도 함께 보여줍니다.", "meta": "준비: 데모 테넌트와 시나리오 데이터"}, {"title": "시스템 역할 분담 (2분)", "text": "PDM = 버전, PLM = 개정, ERP = 품번. 이 자리에서 ERP 연동 질문을 꺼냅니다.", "meta": "다음: [[data|10 데이터·연동]]"}, {"title": "다음 단계 (1분)", "text": "디스커버리 워크숍을 제안합니다. 범위와 견적은 별도 모듈에서 다룹니다.", "meta": "다음: [[sell|02 영업과 디스커버리]] · [[estimate|03 스코핑과 견적]]"}]}, {"t": "sec", "id": "blocks", "text": "핵심 구성 요소"}, {"t": "p", "text": "Fusion Manage의 모든 앱은 같은 블록으로 만들어집니다. 블록을 알면 고객 요구를 **구성으로 가능 / 스크립트 필요 / 확장 개발 필요**로 바로 분류할 수 있고, 그 분류가 곧 견적의 출발점입니다."}, {"t": "tiles", "title": "데이터를 담는 블록", "items": [{"tag": "워크스페이스", "title": "워크스페이스 유형 3가지", "text": "모든 데이터와 프로세스의 그릇입니다. 유형이 쓰임을 정합니다.", "items": ["**기본(분류·참조)**: 사이트, 단위, 분류 코드, 승인자 목록 같은 참조 데이터", "**워크플로 기반**: 변경 요청·변경 지시·NCR·CAPA처럼 시작과 끝이 있는 프로세스", "**개정 관리**: Items & BOMs, 문서처럼 개정과 라이프사이클을 가지는 객체"]}, {"tag": "필드·섹션", "title": "필드와 섹션", "text": "필드 유형은 자동 번호, 단일·다중 선택 목록, 정수·실수, 날짜, 텍스트, 체크박스, 이미지, URL, 사용자, 파생(derived)·계산(computed) 등입니다. 섹션은 필드를 묶고, 그룹별 보기·편집 권한과 워크플로 상태별 잠금을 겁니다.", "items": ["연동·스크립트 전용 필드는 숨김 섹션에 둡니다(관측)", "필드 유형 변경은 데이터 손실 위험이 있으므로 설계 단계에서 확정합니다"]}, {"tag": "탭", "title": "그리드·BOM 탭", "text": "레코드 안의 표(그리드)와 제품 구조(BOM)를 다룹니다.", "items": ["그리드: 작업 목록, 승인 공급업체 목록 같은 행 단위 데이터", "BOM: 부서별 BOM 뷰, 사용자 정의 BOM 필드, 개정 고정(pinning), 과거·현재·미래(변경 대기) 비교, Where Used"]}, {"tag": "관계", "title": "관계·관리 항목", "text": "레코드 간 연결이 폐루프를 만듭니다.", "items": ["관계(Relationships) 탭: 문제 보고 ↔ 변경 요청처럼 프로세스 간 연결", "관리 항목(affected items): 변경 지시가 개정할 품목. 한 품목은 한 번에 하나의 개정 레코드에만 잠깁니다", "첨부: 파일당 512 MB, 약 75개 형식 미리보기, 같은 파일명은 새 버전(관측)"]}]}, {"t": "table", "title": "워크플로 vs 라이프사이클", "head": ["구분", "워크플로", "라이프사이클"], "rows": [["대상", "변경 요청, 변경 지시, NCR, CAPA 등 프로세스 레코드", "Items & BOMs, 문서 등 개정 관리 객체"], ["형태", "시작과 끝이 있음 (예: 작성 → 검토 → CCB → 완료)", "순환함 (예: 작업 중 → 릴리스 → 개정 → 단종)"], ["구동", "전이(transition)마다 권한·조건·검증·액션 스크립트", "변경 지시의 릴리스가 개정과 상태 변경을 일으킴"], ["설명 포인트", "\"모든 워크플로는 결국 하나의 개정 증가로 끝납니다\"", "개정 관리 워크스페이스에는 자체 워크플로가 없습니다(관측)"]], "note": "관측 사례: 품목 릴리스가 변경 지시에 묶여 있어서, 변경 관리를 Items & BOMs보다 먼저 또는 함께 구축하지 않으면 품목 관련 요구사항이 보류되었습니다. Fusion Manage의 변경 요청(CR)·변경 지시(CO)는 설계 변경 요청(ECR)·설계 변경 지시(ECO)에 해당하며, 상업적 범위 변경서(Change Request)와는 다릅니다."}, {"t": "tiles", "title": "동작과 통제 블록", "items": [{"tag": "스크립트", "title": "스크립트 4종", "text": "JavaScript로 작성합니다. 대부분의 맞춤 동작이 여기서 나옵니다.", "items": ["**조건(condition)**: 전이를 보여줄지 결정. 실행 제한 4초", "**검증(validation)**: 입력·전이 조건 확인. 실행 제한 9초", "**액션(action)**: 전이·편집·생성·온디맨드 시 자동 처리. 실행 제한 9초, 연쇄 90초", "**라이브러리(library)**: 공통 함수 재사용"]}, {"tag": "보안", "title": "역할·그룹·권한", "text": "사용자 → 그룹 → 역할 → 워크스페이스 권한 구조입니다. 통제 수준은 테넌트(SSO) → 워크스페이스 → 레코드 → 탭 → 섹션입니다.", "items": ["워크스페이스마다 최소 2개 역할(읽기/쓰기, 읽기)과 비즈니스 관리자·관리자 역할(관측)", "레코드 접근은 그룹을 추가 소유자(additional owner)로 넣어 부여(관측)", "라이선스 유형: Participant(조회 중심) / Professional(전체 기능)", "협력사도 워크스페이스·레코드·탭·섹션·필드 단위 권한으로 초대"]}, {"tag": "워크플로", "title": "워크플로 기능", "text": "상태와 전이로 프로세스를 정의합니다.", "items": ["전이마다 최소 1개 권한, 사전 조건·검증·액션, Outstanding Work 표시, 알림", "알림, 경과 시간 리마인더, 에스컬레이션, 위임, 필수 코멘트, 전자 서명(비밀번호 재입력)", "되돌리기는 스크립트 결과를 취소하지 않으므로 관리자 전용 재설정 전이를 따로 설계"]}]}, {"t": "tiles", "title": "활용과 확장 블록", "items": [{"tag": "보고", "title": "보고서·대시보드", "text": "기본 테넌트에 약 49개 사전 정의 보고서가 있습니다(관측).", "items": ["보고서 빌더: 그룹핑 최대 5단계, 정렬 최대 4열, 집계·필터·차트", "결과를 대시보드에 고정하거나 API로 호출", "워크스페이스 뷰·필터·My Outstanding Work도 보고 화면"]}, {"tag": "API", "title": "REST API·웹훅", "text": "연동의 표준 경로입니다.", "items": ["REST API v3 중심. 2-legged OAuth(APS 앱 등록 + 테넌트에 클라이언트 ID 허용)와 사용자 가장(impersonation)", "웹훅: 생성·전이 같은 이벤트를 구독하고, 미들웨어가 레코드 상세를 조회", "연동 전용 사용자는 Professional 라이선스가 필요하고, 한 번 로그인하기 전에는 API에서 쓸 수 없는 상태로 남습니다(관측)"]}, {"tag": "확장", "title": "확장·웹 앱", "text": "구성으로 안 되는 화면은 확장으로 만듭니다.", "items": ["앱 스토어: 다중 워크스페이스 앱 추가 설치", "UI 확장·맞춤 웹 앱(예: eBOM → mBOM 편집기): 계산 필드 링크로 워크스페이스·레코드 ID를 넘겨 새 탭에서 실행", "맞춤 코드는 벤더 지원 대상이 아니므로 소스 코드 라이선스·호스팅·보안 점검·지원 책임자를 계약 전에 합의([[risk|07 리스크와 안전장치]])"]}]}, {"t": "sec", "id": "apps", "text": "표준 앱 맵과 폐루프"}, {"t": "p", "text": "표준 테넌트에는 영역별 워크스페이스가 미리 구성되어 있습니다. 고객 요구를 이 지도에 먼저 대 보고 **없는 것만 새로 만드는 것**이 견적과 일정 모두에 유리합니다."}, {"t": "table", "title": "표준 테넌트 워크스페이스 맵", "head": ["영역", "대표 워크스페이스", "설명 포인트"], "rows": [["변경 관리", "Change Requests, Problem Reports, Change Orders, Change Tasks, Change Approval Templates, Approval List, Quick Releases", "변경의 '왜'(CR 승인)와 '어떻게'(CO 실행)를 분리"], ["제품 개발", "Items and BOMs, Vault Items and BOMs, Documents, Document Change Order, Manufacturer P/N", "개정 관리 객체. 릴리스는 변경 지시가 구동"], ["포트폴리오", "Products, Product Lines, Product Categories, Portfolios", "제품·라인·포트폴리오 계층과 라이프사이클 마일스톤"], ["NPI", "Projects, Project Templates, Project Phases, Project Tasks, Checklists, Checklist Templates, Design Reviews, Design Review Tasks, Teams, People", "APQP 같은 단계·게이트 프로젝트를 템플릿으로 운영"], ["품질", "Non-Conformances, CAPA, Quality Inspections, Quality Inspection Plans, Claims, Audits, RMA", "검사 → NCR → CAPA → 감사로 이어지는 개선 루프"], ["공급망", "Suppliers (감사·공급업체 패키지·제조사 P/N과 연계)", "협력사를 테넌트에 초대해 규제 정보 갱신·견적 참여"]], "note": "기존 표준 테넌트 구성 기준(관측). 테넌트 버전에 따라 이름과 구성이 다를 수 있으므로 데모 테넌트에서 확인하십시오. 8D, FMEA, 교정 관리, 5S 감사 등은 템플릿 라이브러리 앱으로 추가합니다."}, {"t": "flow", "title": "대표 폐루프: 문제에서 개정까지", "items": [{"title": "문제 보고", "text": "현장·고객·설계에서 발견한 문제를 등록"}, {"title": "변경 요청(CR)", "text": "영향 분석과 CCB 승인. 간이 변경은 fast track"}, {"title": "변경 지시(CO)", "text": "작업 할당, 결과 검토, 릴리스", "hi": true}, {"title": "Items & BOMs 개정", "text": "개정 증가와 라이프사이클 변경, ERP로 전달"}]}, {"t": "table", "title": "세 가지 폐루프 체인", "head": ["시작점", "체인", "데모 포인트"], "rows": [["문제 보고", "Problem Report → CR → CO → Items & BOMs 개정", "다음 레코드가 자동 생성·연결되고 정보가 이어짐"], ["부적합(NC)", "NC → CAPA → CR → CO", "품질 문제가 설계 변경으로 닫히는 흐름"], ["반품(RMA)", "RMA → CAPA → CR → CO", "고객 반품이 시정 조치와 변경으로 이어지는 흐름"]]}, {"t": "callout", "kind": "tip", "title": "간이 변경(fast track) 경로를 함께 보여주십시오", "text": "대부분의 고객 SOP에는 '물리적 변경이 없는 오탈자·번호 수정, 원가 영향이 없는 ERP 갱신' 같은 간이 변경 규정이 있습니다. CCB를 건너뛰는 경로를 시연하면 '단계가 더 늘어난다'는 우려를 줄일 수 있습니다. 관측 설계에서는 고객 전용 제품(PPAP·카피 이그잭트)과 외부 승인이 필요한 변경은 간이 변경을 막는 검증을 두었습니다."}, {"t": "sec", "id": "sor", "text": "시스템 역할 분담과 Vault 연동"}, {"t": "p", "text": "PLM 설명에서 가장 흔한 오해는 'PDM을 바꾸는 일'이라는 생각입니다. 세 시스템이 각각 무엇의 기준(system of record)인지 먼저 합의하십시오."}, {"t": "table", "title": "기준 시스템 분담", "head": ["시스템", "소유하는 것", "예시", "설명 문장"], "rows": [["PDM", "**버전**: 설계 반복과 CAD 파일", "Vault", "설계자는 매일 버전을 만들고, 그중 승인된 것만 개정이 됩니다"], ["PLM", "**개정**: 승인된 변경, 라이프사이클, 전사 프로세스", "Fusion Manage", "변경·품질·NPI가 모두 하나의 개정 증가로 모입니다"], ["ERP", "**품번**: 품목 간 키, 구매·생산·원가", "SAP, Oracle 등 각종 ERP", "품번 체계와 ERP 필드가 품목·BOM 모델을 결정합니다"]]}, {"t": "callout", "kind": "warn", "title": "ERP 연동은 첫 미팅에서 꺼내십시오", "text": "고객은 ERP 연동을 '나중 일'로 과소평가하는 경향이 있습니다. 그러나 ERP가 품번을 소유하므로 ERP 필드·단위·BOM 규칙이 PLM의 품목·BOM 모델을 결정합니다. 관측 사례에서 연동에 의존한 작업은 계획보다 8–12개월 늦어졌습니다. 상세는 [[data|10 데이터·연동]]을 보십시오."}, {"t": "tiles", "title": "Vault–Fusion Manage 연동 사용 사례 3가지", "items": [{"tag": "사례 1", "title": "NPI가 Fusion Manage에서 시작", "text": "준비가 되면 Fusion Manage가 구조·품번 접두어·템플릿 정보를 Vault로 보냅니다. 설계는 Vault에서 반복하고, 구조와 중립 뷰어 파일이 돌아와 제품 BOM에 eBOM으로 추가됩니다.", "items": ["Fusion Manage가 개발 프로세스 전체를 통제"]}, {"tag": "사례 2", "title": "Vault BOM을 Fusion Manage로 게시", "text": "품번, 개정, 버전, 설명, 구조, 관련 파일 같은 데이터 'DNA'를 Fusion Manage로 보냅니다. 라이프사이클 통제는 Vault에 남습니다.", "items": ["가장 빨리 가치를 보여주는 출발점"]}, {"tag": "사례 3", "title": "현장에서 경영까지 폐루프 변경", "text": "문제 → 품질 → ECO. Fusion Manage가 Vault의 라이프사이클 상태를 바꾸고 파일 잠금을 풉니다. 작업은 Vault에서 하고 최종 승인은 Fusion Manage로 돌아옵니다.", "items": ["가장 성숙한 단계. 마지막에 도입 권장"]}]}, {"t": "list", "title": "연동 전에 합의할 설계 질문", "items": ["역할과 그룹은 시스템 간에 어떻게 대응하는가", "어떤 속성을 어느 시스템이 마스터하는가 (ERP·PDM·PLM 소유권)", "PDM 볼트 하나에서 게시하는가, 여러 개에서 게시하는가", "ECO를 PDM에서 하는가, PLM에서 하는가 (PLM 권장)", "품번은 누가, 언제 채번하는가", "문서 관리 같은 PDM 단독 기능 중 무엇을 PLM으로 옮기는가"]}, {"t": "p", "text": "연동 방식, 단계별 도입 경로, 공수는 [[data|10 데이터·연동]]에서 다룹니다."}, {"t": "sec", "id": "tenant", "text": "테넌트 구성"}, {"t": "p", "text": "SaaS라 설치는 없지만, 처음 몇 가지 결정은 되돌릴 수 없습니다. 아래 순서를 SOW의 착수 항목으로 넣으십시오. 견적 기준: 샌드박스 테넌트 구성 24 / 40 / 60h, 운영 테넌트 전환 46 / 80 / 156h."}, {"t": "steps", "title": "테넌트 스탠드업 순서", "items": [{"title": "데이터 센터 리전 선택", "text": "데이터 보관 법규에 맞는 리전을 고릅니다. 관측 사례에서는 실데이터로 테스트하려고 호스팅 리전을 옮겨야 했습니다. 운영 테넌트도 개발 테넌트와 같은 리전으로 맞춥니다.", "meta": "결정: 고객 IT·법무"}, {"title": "테넌트 이름 확정", "text": "테넌트 이름은 한 번 정하면 바꿀 수 없습니다. 고객사 명명 규칙을 착수 전에 받습니다.", "meta": "결정: 고객 측 관리자"}, {"title": "컨디셔닝(conditioning)", "text": "표준 테넌트에서 쓰지 않을 앱을 정리하고 필요한 앱 스토어 앱을 추가합니다. 쓰지 않는 엔티티는 삭제하지 않고 [UNUSED] 접두어로 숨깁니다.", "meta": "산출물: 워크스페이스 목록"}, {"title": "브랜딩과 접근", "text": "고객 로고, SSO, 초기 관리자와 그룹을 설정합니다. 연동 사용자와 APS 앱 클라이언트 ID도 이때 준비합니다.", "meta": "관측: 샌드박스 구성 40h"}, {"title": "샌드박스·개발 테넌트에서 구축", "text": "UAT를 통과하지 않은 엔티티는 [DEV] 접두어로 구분하고 개발 그룹에만 보이게 합니다. 접두어는 운영 전환 직전에 제거합니다.", "meta": "규칙: 이름 규칙은 1일차부터"}, {"title": "개발 → 운영 복제", "text": "첫 운영 테넌트는 Autodesk 운영팀이 개발 테넌트를 복제해 만듭니다. 이어서 스모크 테스트, 그룹·역할 확정, 테스트 레코드 퍼지, 진행 중 레코드 이행을 진행합니다.", "meta": "관측: 운영 전환 패키지 약 5주"}, {"title": "이후 변경은 앱 단위로 이관", "text": "운영 테넌트가 생긴 뒤에는 내부 이관 도구가 없어 앱 단위로 문서화된 수동 재구성을 합니다. 워크스페이스 비교 도구로 개발과 운영의 차이를 확인합니다.", "meta": "관측: 1회 이관 약 2일, 업무 시간 외·접근 제한"}]}, {"t": "callout", "kind": "rule", "title": "테넌트 운영 규칙 (관측 → 권장)", "items": ["운영 테넌트에는 1일차부터 컨설턴트 접근을 막습니다. 변경은 개발 → 변경 추적 워크스페이스 → 고객 변경 심의 → 고객 관리자 반영 순으로 흐릅니다.", "개발·미리보기 테넌트에서는 외부 시스템 호출을 꺼 둡니다.", "개발 테넌트는 분기 또는 반기마다 운영 기준으로 다시 맞춥니다.", "추가 샌드박스는 표준 구성이 아니므로 필요하면 계약 단계에서 명시합니다.", "운영에서 반드시 다시 테스트합니다. 개발에서 통과한 기능이 운영에서 실패한 사례가 있었습니다.", "운영 전환일을 주말 직전으로 잡지 않습니다."]}, {"t": "p", "text": "운영 전환 패키지의 상세 단계는 [[method|08 딜리버리 방법론]]을 보십시오."}, {"t": "sec", "id": "limits", "text": "프로젝트에서 부딪힌 플랫폼 한계"}, {"t": "p", "text": "아래 한계는 관측 프로젝트에서 실제로 일정이나 공수를 늘린 항목입니다. 제품은 계속 개선되므로 견적 전에 현재 버전에서 다시 확인하되, 설계는 **한계가 있다고 가정하고** 시작하십시오."}, {"t": "stats", "items": [{"value": "4초 / 9초", "label": "조건 스크립트 / 검증·액션 스크립트 실행 제한 (연쇄 90초)"}, {"value": "~1,000", "label": "대량 생성·갱신 1회 배치의 권장 상한 (관측)"}, {"value": "1개", "label": "기본 보고서 하나가 다루는 워크스페이스 수 (교차 보고 불가)"}, {"value": "512 MB", "label": "첨부 파일 1개당 최대 크기 (관측)"}]}, {"t": "table", "title": "설계 함정과 대응", "head": ["한계 (관측)", "영향", "대응 (권장)"], "rows": [["그리드 행 삭제를 권한으로 막을 수 없음 (추가·편집·삭제 권한이 한 묶음)", "필수 템플릿 작업을 사용자가 지울 수 있음", "취소(Cancel) 상태와 사유 필수, 코디네이터만 복원, 템플릿에서 복원하는 기능, 교육. 작업은 하드코딩하지 말고 템플릿으로 관리"], ["워크플로 상태 이름 변경", "이름으로 상태를 참조한 스크립트가 깨짐 (순차 작업 기능이 멈춘 사례)", "스크립트는 상태 ID로 참조. 이름 변경 요청에는 스크립트 점검 시간을 견적에 추가"], ["기본 가져오기 도구의 적재 불가 항목", "관계·링크·다중 선택 목록·BOM 필드·중복 BOM 행·첨부·이미지·그리드·워크플로 상태·부 개정·과거 작성일/작성자를 넣을 수 없음", "대량·반복 적재는 REST 기반 델타 동기화 도구로. 가져오기 뒤 워크플로 보정 작업을 계획"], ["보고 한계", "워크스페이스 간 교차 보고 불가, 상태별 체류 시간 미추적, 실행 시 편집 필터가 있으면 API 호출 보고서가 실패", "상태별 타임스탬프 필드 또는 전이마다 JSON 이력 필드를 스크립트로 누적, 증분 추출 → 고객 BI(Power BI 등)"], ["대량 처리 규모", "한 번에 많은 레코드를 만들거나 고치면 테넌트 부하와 대량 훼손 위험", "배치 약 1,000건, maxCreates/maxUpdates 같은 안전 상한 설정"], ["스크립트 실행 시간", "관리 항목·작업이 많은 변경 지시에서 타임아웃, 큰 재귀 검증 실패", "다사이트 변경 패턴 선택(사이트별 CR/CO 분리), 무거운 검증은 프록시·미들웨어로 이동"], ["가져오기와 스크립트의 상호작용", "경로에 따라 스크립트가 돌지 않아 검증을 우회하거나, 반대로 갱신이 스크립트를 다시 돌려 데이터를 훼손", "대량 변경 전 내보내기로 백업하고 사본에서 먼저 테스트"], ["중복 통제는 워크스페이스 단위", "워크스페이스를 넘는 고유성 검사 불가, 스크립트가 바꾼 값은 검증을 우회", "고유성이 중요한 코드 체계는 워크스페이스 분리 설계 (관측: 분류 코드를 2개 워크스페이스로 분리)"], ["워크플로 되돌리기", "스크립트 결과는 되돌아가지 않아 레코드가 비정상 상태로 남음", "되돌리기 대신 숨김·관리자 전용 재설정 전이"], ["구성 변경의 즉시 반영", "워크플로 수정은 기존 레코드에 즉시 적용, 필드 유형 변경은 데이터 손실, 단일 → 다중 선택 변경은 스크립트 전체에 파급", "운영 중 변경은 변경 심의를 거쳐 개발에서 먼저 검증"]], "note": "출처: 관측 프로젝트의 이슈 로그와 설계 문서. 일부는 이후 제품 업데이트로 개선되었을 수 있습니다."}, {"t": "details", "items": [{"title": "기타 관측된 동작과 주의점", "blocks": [{"t": "list", "items": ["자동 번호 필드는 유형을 바꿀 수 없고 엄격한 연번을 보장하지 않습니다.", "알파벳 개정이 두 글자(AA 등)로 넘어가는 방식이 기존 ERP의 개정 규칙과 맞지 않을 수 있습니다. ERP 제약을 디스커버리에서 확인하십시오.", "그리드 탭은 파생 필드와 이미지 필드를 지원하지 않습니다. 편집 불가 섹션에는 파생 필드를 두지 마십시오.", "열린 변경 지시에 이미 올라간 품목을 다른 변경에 추가하는 것을 미리 막는 기본 기능이 없었습니다. 잠금은 개정 시점에 걸립니다.", "조건 스크립트가 많으면 Outstanding Work 목록이 느려집니다. 사전 조건 스크립트를 우선 쓰십시오.", "워크플로 이력에는 상태 이름이 아니라 전이 이름이 남습니다. 보고 설계 때 고려하십시오.", "인쇄 뷰는 HTML 기반이라 종이 양식을 그대로 재현하려면 시간이 더 듭니다.", "품번에 슬래시(/)가 들어간 검색이 실패한 사례가 있었습니다(이후 수정).", "Vault 연동은 Vault 버전에 좌우됩니다. 관측 시점의 표준 커넥터는 Vault 2026 이상 서버가 필요했고, 품번은 양쪽이 같고 25자 이하여야 했습니다."]}]}]}, {"t": "callout", "kind": "warn", "title": "한계를 숨기지 말고 견적에 넣으십시오", "text": "관측 프로젝트에서는 플랫폼 한계를 우회하는 스크립트와 웹 앱이 일정의 임계 경로가 되었습니다(예: 맞춤 mBOM 편집기의 반복 수정과 소스 코드 라이선스 대기). 한계에 걸리는 요구사항은 디스커버리에서 '구성 / 스크립트 / 확장 개발'로 분류하고, 확장 개발은 별도 라인 아이템으로 견적하십시오([[estimate|03 스코핑과 견적]])."}, {"t": "sec", "id": "ootb", "text": "OOTB 우선 원칙"}, {"t": "p", "text": "표준 구성(OOTB)을 먼저 쓰고 **차이만 바꾸는 것**이 Fusion Manage 프로젝트의 기본 원칙입니다. 관측 사례에서 품질 워크플로를 처음부터 맞춤화한 다른 고객은 진행이 멈춰 결국 OOTB로 되돌아갔습니다. 그래서 품질 관리 착수 전에는 OOTB 시연과 '바꿔도 되는 것 / 바꾸지 않을 것' 지침을 먼저 공유했습니다."}, {"t": "table", "title": "무엇을 바꿔도 되고, 무엇은 바꾸지 않을까", "head": ["대상", "바꿔도 됨", "바꾸지 않음 (권장)"], "rows": [["워크플로", "상태·전이 이름, 알림, 에스컬레이션, 위임, 상태·전이 추가", "상태·전이 삭제, 잠금 위치, 기본 로직, 레코드 자동 생성, 워크스페이스 간 연결"], ["양식 (필드·섹션)", "필드 순서, 섹션 이름·순서, 표시 이름, 선택 목록 값", "필드 삭제, 데이터 유형 변경"], ["작업", "기능별로 분류한 작업 템플릿, 템플릿 기반 자동 생성", "레코드나 스크립트 안에 작업을 하드코딩"], ["데이터", "보관(archive) 처리, [UNUSED] 숨김", "삭제 (이력과 참조가 끊어짐)"]], "note": "상태 이름 변경은 '바꿔도 됨'이지만, 스크립트가 ID가 아니라 이름을 참조하면 견적 시간이 늘어납니다."}, {"t": "list", "title": "이름 규칙은 1일차에 정합니다 (관측 → 권장)", "items": ["**[DEV]**: UAT를 통과하지 않은 엔티티. 운영 전환 직전에 제거", "**[UNUSED]**: 쓰지 않는 표준·폐기 엔티티. 관리자 외에는 숨김", "역할은 계층으로 이름 붙임: [R] 읽기, [C] 생성, [E] 편집, [D] 삭제, [Import], [Business Admin], [Integration]", "워크스페이스·선택 목록·보고서·스크립트·승인 목록에 같은 규칙 적용. 관측 사례에서는 승인 목록 이름이 제각각이라 고객 유지보수가 어려웠습니다", "탭 이름은 워크스페이스 이름과 맞춤"]}, {"t": "p", "text": "목표(To-Be) 설계서 서두에는 **'표준 구성 + 차이만 기술'** 원칙을 적고, 기능은 역할 이름이 아니라 '무엇을 할 수 있다'는 능력 단위로 씁니다. 설계서 구조는 [[method|08 딜리버리 방법론]], 범위 문구는 [[sow|05 SOW 작성]]을 보십시오."}, {"t": "checklist", "id": "product-15min", "title": "15분 설명 준비 체크리스트", "items": ["Fusion Manage 한 문장 정의와 SaaS 책임 모델을 말할 수 있다", "공개 포지셔닝 문구에 '(Autodesk 공개 자료 인용)'을 표기했다", "워크스페이스 3유형과 워크플로·라이프사이클의 차이를 예시로 설명할 수 있다", "데모 테넌트에서 문제 보고 → CR → CO → 개정 폐루프와 간이 변경 경로를 시연할 수 있다", "PDM = 버전, PLM = 개정, ERP = 품번을 설명하고 ERP 연동 질문을 준비했다", "테넌트 리전·이름·컨디셔닝·브랜딩 결정 항목을 착수 체크리스트에 넣었다", "주요 플랫폼 한계 5가지와 대응을 설명할 수 있다", "고객 요구를 구성 / 스크립트 / 확장 개발로 분류하는 기준을 팀과 공유했다"]}, {"t": "quiz", "items": [{"q": "Items & BOMs 같은 개정 관리 워크스페이스의 릴리스와 개정은 무엇이 구동합니까?", "options": ["품목 자체의 워크플로", "변경 지시(CO)의 워크플로", "ERP의 야간 배치 작업"], "answer": 1, "why": "관측 설계에서 개정 관리 워크스페이스에는 자체 워크플로가 없고, 변경 지시의 릴리스가 개정과 라이프사이클 변경을 일으켰습니다. 그래서 변경 관리를 Items & BOMs보다 먼저 또는 함께 구축해야 합니다."}, {"q": "시스템 역할 분담으로 옳은 것은?", "options": ["PDM = 개정, PLM = 버전, ERP = 품번", "PDM = 버전, PLM = 개정, ERP = 품번", "PDM = 품번, PLM = 개정, ERP = 버전"], "answer": 1, "why": "PDM은 설계 반복의 버전을, PLM은 승인된 개정과 프로세스를, ERP는 품목 간 키인 품번을 소유합니다. 그래서 ERP 연동을 초기에 다뤄야 합니다."}, {"q": "고객이 그리드의 필수 작업 행을 사용자가 지우지 못하게 해 달라고 합니다. 가장 적절한 대응은?", "options": ["그리드 행 삭제 권한만 따로 끈다", "취소 상태·복원 기능·교육으로 설계하고 작업은 템플릿으로 관리한다", "그리드 대신 모든 작업을 스크립트에 하드코딩한다"], "answer": 1, "why": "그리드의 추가·편집·삭제 권한은 한 묶음이라 행 삭제만 막을 수 없습니다. 취소 상태, 코디네이터 복원, 템플릿 복원 기능, 교육으로 대응합니다."}, {"q": "테넌트 스탠드업에서 나중에 바꿀 수 없으므로 착수 전에 확정해야 하는 것은?", "options": ["브랜딩 로고", "테넌트 이름", "보고서 목록"], "answer": 1, "why": "테넌트 이름은 설정 후 변경할 수 없습니다. 데이터 센터 리전도 데이터 보관 법규를 고려해 처음에 정합니다."}]}]}, {"id": "sell", "num": "02", "group": "sell", "title": "Fusion Manage를 *가치로* 파는 법", "short": "영업·디스커버리", "goal": "타깃 고객을 자격 검증하고, 디스커버리 워크숍을 운영하고, 고객 사업 과제에 시간 단위 가치를 연결해 제안·데모·인계·갱신까지 이어 갈 수 있습니다.", "facts": [["학습 시간", "40분"], ["대상", "영업·프리세일즈·PM"], ["산출물", "워크숍 안건·인계 메모"]], "blocks": [{"t": "lead", "text": "Fusion Manage 영업은 기능 시연이 아니라 **고객 사업 과제에 측정 가능한 가치를 연결하는 일**입니다. 이 모듈은 관측된 엔터프라이즈 영업·계정 계획 자료에서 타깃 선정, 질문, 워크숍, 가치 산정, 포지셔닝, 데모, 인계, 갱신 주기를 추려 바로 쓸 수 있게 정리했습니다."}, {"t": "sec", "id": "target", "text": "누구에게 팔 것인가"}, {"t": "p", "text": "프리세일즈 공수는 자격 검증을 통과한 고객에만 쓰십시오. 관측 사례에서 컨설팅이 거절되거나 확산이 멈춘 원인은 대부분 **첫 미팅 전에 이미 보이던 신호**였습니다."}, {"t": "table", "title": "자격 검증 관문", "head": ["기준", "통과 신호", "왜 중요한가"], "rows": [["엔지니어링 데이터 니즈", "데이터가 여러 곳에 흩어져 있고 ERP에 다시 입력함", "문제가 없으면 가치를 산정할 수 없습니다"], ["클라우드 수용", "IT·보안 팀이 SaaS 검토 경험이 있음", "늦게 반대가 나오면 수개월 지연됩니다"], ["3D CAD 5석 이상", "Vault 또는 다른 PDM을 사용 중", "PDM이 PLM의 데이터 기반입니다"], ["생산 방식", "계획 생산(MTS)·수주 생산(MTO) 중심", "개별 수주 설계(ETO) 위주면 표준 프로세스 적용이 어렵습니다"], ["경영진 스폰서", "엔지니어링 VP·디렉터가 직접 참석", "관측: 스폰서 이탈이 확산 지연의 근본 원인이었습니다"], ["성공 지표", "고객이 \"무엇으로 성공을 재는가\"에 답하거나 함께 정의할 의지가 있음", "기준값이 없으면 종료 시 가치를 증명할 수 없습니다"], ["고객 투입", "키유저가 설계·UAT 기간에 주 ~20% 시간을 낼 수 있음", "관측: 다사이트 UAT는 계획의 ~2배가 걸렸습니다"], ["ERP 현황", "ERP 담당자가 디스커버리에 참석하고 향후 로드맵을 공유함", "관측: ERP 업그레이드가 늦게 드러나 이관 프로젝트가 ~7.5개월 차에 보류되었습니다"]], "note": "앞의 네 기준은 Autodesk 공개 영업 가이드의 자격 기준이고, 나머지는 관측 프로젝트에서 보완한 기준입니다."}, {"t": "tiles", "title": "타깃 페르소나", "items": [{"tag": "주 타깃", "title": "엔지니어링 리더", "items": ["엔지니어링 VP·디렉터", "엔지니어링 매니저", "제품 개발 VP"]}, {"tag": "주 타깃", "title": "제품·프로세스 책임자", "items": ["제품 라인 매니저", "NPI·APQP 프로세스 책임자", "설계 변경 코디네이터의 상사"]}, {"tag": "영향력자", "title": "운영·품질", "items": ["운영·공급망: 스크랩·재작업·제조 원가", "품질: 결함·반품·컴플라이언스", "ERP·IT: 연동과 보안 승인"]}, {"tag": "주의", "title": "첫 미팅 대상이 아님", "text": "이들은 중요한 사용자지만 PLM 예산을 결정하지 않습니다.", "items": ["CAD 전문가·드래프터", "출력실·CNC 운영자", "해석(시뮬레이션) 전문가"]}]}, {"t": "table", "title": "산업별 적합도", "head": ["산업", "가치 주제", "이상적 프로필·주의"], "rows": [["산업기계", "폐루프 품질, RMA → ECO, ECO 자동화", "MTS/MTO 중견기업 또는 대기업 자회사. 서비스 매출 비중 70% 초과는 위험 신호"], ["하이테크·전자", "공급업체 협업, BOM·문서 정확도, 확장 가능한 NPI", "외주 생산 비중이 높을수록 공급업체 접근 가치가 큽니다"], ["자동차 2·3차 협력사", "APQP/PPAP 실행, 감사 준비", "고객사 승인이 필요한 PPAP 제품은 패스트트랙 변경에서 제외"], ["의료기기", "DMR/DHF, 교육 기록, 인증·감사 대응", "전자서명·감사 추적 요구를 먼저 확인"]], "note": "질문은 3대 페르소나(설계·엔지니어링 / 운영·공급망 / 품질)와 3대 고통(출시 지연·생산성 / 스크랩·재작업·원가 / 결함·반품·컴플라이언스)으로 나눕니다. Autodesk 공개 영업 자료의 구조입니다."}, {"t": "callout", "kind": "warn", "title": "위험 신호가 두 개 이상이면 디스커버리 계약부터", "items": ["단일 창구가 모든 정보를 통제하는 게이트키퍼 구조", "고객 전략에 성공 지표가 없음 (관측 워크숍에서 실제로 발견)", "ERP 연동을 \"나중 문제\"로 축소함. 관측 사례에서는 ERP가 품목·BOM 모델을 결정했으므로 앞당겨야 했습니다", "\"업그레이드·운영은 일상 업무라 외부 도움이 필요 없다\" — 이전 단계의 약한 지식 이전이 반론이 된 사례", "유력 스폰서 없이 \"현업이 알아서 끌어오는\" 확산 방식", "경영진이 PLM을 \"너무 먼 미래\"로 봄"]}, {"t": "checklist", "id": "sell-qualify", "title": "첫 제안 전 자격 검증", "items": ["엔지니어링 데이터 고통을 고객의 표현으로 3개 이상 기록했다", "클라우드·보안 검토 절차와 담당자를 확인했다", "CAD 사용 규모와 현재 PDM(Vault 등) 현황을 확인했다", "생산 방식(MTS/MTO/ETO)과 서비스 매출 비중을 확인했다", "엔지니어링 VP·디렉터급 스폰서와 직접 미팅했다", "고객이 말한 성공 지표 또는 함께 정의할 일정을 확보했다", "ERP 담당자를 만나 ERP 로드맵(최소 24개월)을 들었다", "키유저 투입 가능 여부(주 ~20%)를 고객 PM에게 확인했다"]}, {"t": "sec", "id": "discovery", "text": "디스커버리 질문 은행"}, {"t": "p", "text": "질문은 **데이터·프로세스·사람** 세 갈래로 묻습니다. 답의 내용보다 **어떤 도구와 습관이 언급되는지**를 기록하십시오. 그 신호가 곧 데모 시나리오와 가치 동인이 됩니다."}, {"t": "table", "head": ["영역", "질문", "귀 기울일 신호"], "rows": [["데이터", "데이터가 여러 곳에 있습니까?", "개인 클라우드 드라이브, 사이트별 시스템"], ["데이터", "팀마다 다른 버전으로 일합니까?", "별도 PDM, 이메일로 보낸 사본"], ["데이터", "BOM을 ERP에 다시 입력합니까?", "스프레드시트로 BOM·공급업체 정보를 복사"], ["데이터", "잘못되거나 오래된 데이터로 생산한 적이 있습니까? 원인과 손실 시간은?", "\"가끔\" — 구체 사례를 하나 받아 두십시오"], ["데이터", "과거 설계 결정을 어떻게 찾습니까? 설계를 원하는 만큼 재사용합니까?", "담당자 기억, 폴더 검색"], ["데이터", "전기·제조·서비스 데이터가 따로 있습니까?", "중립 포맷·변환기 의존"], ["프로세스", "설계 일정은 어떻게 추적합니까?", "일정표 메일, 스프레드시트, 화이트보드"], ["프로세스", "변경 요청은 어떻게 추적합니까?", "이메일 + 스프레드시트, \"ERP에서 대충\", 구두 전달"], ["프로세스", "품질·컴플라이언스가 변경과 연결되어 있습니까?", "\"사후에 수동 검토\""], ["프로세스", "구매·제조가 출시 일정에 영향을 줍니까?", "늦은 단계의 부품 변경, 긴급 발주"], ["프로세스", "CAD 이전(아이디어·시제품)과 이후에는 무슨 일이 일어납니까?", "\"설계가 끝나면 제조로 넘김\""], ["사람", "모든 사이트가 같은 데이터에 같은 속도로 접근합니까?", "\"본사에 파일 요청 메일\""], ["사람", "설계 검토와 변경이 지연 없이 진행됩니까?", "승인자 부재, 상태 확인 전화"], ["사람", "공급업체·고객과 어떻게 공유합니까?", "이메일 첨부, 파일 공유 링크"], ["사람", "관리자가 프로젝트·변경 상태를 바로 볼 수 있습니까?", "주간 수동 보고서"]]}, {"t": "callout", "kind": "tip", "title": "보고·대시보드를 일찍 보여 주십시오", "text": "관측 고객의 APQP 설문에서 가장 큰 약점은 \"현재 상태와 승인 현황을 보고할 수 없음\"이었고, 설계 변경 현행 분석에서는 \"수동 대시보드(관리 시간 소모, 오래된 데이터)\"였습니다. 데모 첫 5분에 대시보드를 넣으면 공감대가 빨리 생깁니다."}, {"t": "details", "items": [{"title": "설계 변경 현행(As-Is)에서 자주 나오는 고통", "blocks": [{"t": "list", "items": ["수동 대시보드: 관리 시간이 들고 데이터가 오래됨", "체크리스트 조치에 의존 관계·상태가 없고 의도가 모호함", "이해관계자 연락을 사람이 직접 함", "병목이 어디인지 보이지 않음", "보고가 여러 스프레드시트에 흩어짐", "사이트 간 가시성 없음 (설계 권한은 A 공장, 제조는 B 공장)", "변경 데이터를 모아 분석할 수 없음"]}]}, {"title": "APQP·NPI 디스커버리 질문", "blocks": [{"t": "list", "items": ["서명(승인)은 어떻게 남깁니까?", "패스트트랙과 정규 트랙 비율은?", "계획일과 최신 예상일 차이를 어떻게 추적합니까?", "공급업체 성과는 어떻게 평가합니까?", "게이트 입력물은 수동 복사입니까, 자동 생성입니까?", "리스크 목록이 프로젝트 차터에 포함됩니까?", "DFMEA가 근본 원인 분석과 연결됩니까?", "조직 간 공통 변경 표준이 있습니까?"]}, {"t": "p", "text": "질문지는 질문·응답 시트, 게이트·요소 개요, 문서(산출물·현재 도구·버전 관리 여부), 프로세스 네 시트로 구성하면 정리가 쉽습니다."}]}, {"title": "PDM 전략 질문 (PLM 전에 확인)", "blocks": [{"t": "list", "items": ["설계 권한(design authority)은 어떻게 정합니까?", "사이트 간 협업 지도는?", "도면·문서 표준과 리비전 규칙은?", "저장소는 사이트별, 사업부별 묶음, 단일 저장소 중 무엇입니까?", "PLM으로 게시할 PDM 저장소는 하나입니까, 여러 개입니까?"]}]}]}, {"t": "sec", "id": "workshop", "text": "사전 과제와 정렬 워크숍"}, {"t": "p", "text": "관측된 1일 정렬 워크숍에는 고객 측 6명(글로벌 엔지니어링·NPD 디렉터, 엔지니어링 애플리케이션 매니저, 지역 엔지니어링 디렉터, 엔지니어링 서비스 매니저, 품질 책임자, NPD 프로세스 매니저)이 참석했습니다. 성패는 워크숍 당일보다 **사전 과제**에서 갈렸습니다."}, {"t": "steps", "title": "사전 과제 운영", "items": [{"title": "사전 과제 배포", "text": "이해관계자마다 사업 동인별로 \"왜 필요한가?\"와 \"성공은 무엇으로 재는가?\"를 적게 합니다.", "meta": "워크숍 1–2주 전(권장) · 담당: 파트너 영업"}, {"title": "격자로 정리", "text": "행 = 이해관계자, 열 = 사업 동인. 각 답을 목표 / 방법 / 과업 / 과제 / 솔루션으로 분류합니다. 대부분의 답은 목표가 아니라 방법이나 솔루션입니다.", "meta": "담당: 프리세일즈"}, {"title": "공통 주제로 합성", "text": "제품·프로젝트 데이터 통제, 프로세스 간소화, 협업, 실시간 가시성, 책임·추적성, 정보 접근 등 PDM/PLM 역량 주제에 매핑합니다."}, {"title": "빈 성공 지표 표시", "text": "관측 고객의 전략에는 성공 지표가 없었습니다. 빈칸을 워크숍 안건으로 올려 함께 채웁니다."}]}, {"t": "table", "title": "1일 정렬 워크숍 안건 (관측)", "head": ["세션", "시간", "방식"], "rows": [["소개와 기대 사항", "20분", "양측 목표 공유"], ["현황과 교훈", "40분", "1인당 과제 3개 → 묶기 → 우선순위"], ["향후 3년 전략과 사전 과제 피드백", "75분", "격자 결과 발표"], ["현장 투어·점심", "–", ""], ["파트너 협업 모델", "30분", "역할 분담, 지원 체계"], ["단계별 심층 논의(입력물과 순서)", "90분", "협업형"], ["정리와 다음 단계", "30분", "합의 사항, 담당, 일정"], ["Σ 합계(투어·점심 제외)", "285분", ""]], "num": [1]}, {"t": "table", "title": "워크숍 결과 예: 고통 → 역량 매핑", "head": ["고객 고통", "매핑한 역량"], "rows": [["사이트 공통 제품 데이터베이스가 없고 편차·변경에 오류가 많음", "전사 설계 변경, 폐루프 품질"], ["품목 부품표와 문서 BOM이 연결되지 않고 버전 관리가 약함", "Items & BOMs, 리비전 관리, PDM 연동"], ["APQP 진행 상태가 보이지 않음", "NPI/APQP 프로젝트와 대시보드"], ["사이트 간 설계 권한 이전", "중앙 접근 관리, 소유권 변경"], ["\"파일 요청 메일은 이제 그만\"", "중앙 정보 접근"]]}, {"t": "callout", "kind": "example", "title": "관측된 워크숍 코칭 노트", "items": ["전술·운영 수준의 회의로 만들지 마십시오. \"갱신까지 이어질 여러 회의 중 첫 번째\"라고 기대치를 정합니다.", "ERP 연동이 축소되어 있으면 앞으로 당기십시오.", "\"단일 진실 공급원(single source of truth)은 결코 하나의 애플리케이션이 아니다.\"", "\"혁신적인 사람들에게 구조화 작업을 요구하고 있다\" — 엔지니어의 부담을 인정하십시오.", "수십 개 ERP 인스턴스의 데이터 정제는 숨은 대형 공수입니다. [[data|10 데이터 이관과 연동]]"]}, {"t": "h", "text": "3시간 PLM 킥오프 워크숍"}, {"t": "p", "text": "PLM 기반 구축은 핵심 지식 보유자 ~20명이 참석하는 3시간 워크숍으로 시작했습니다. 아래 순서는 관측 안건이며, 시간 배분은 권장입니다."}, {"t": "table", "head": ["#", "주제", "내용", "시간(권장)"], "rows": [["1", "왜 PLM인가", "데이터·사람·프로세스 관점", "15분"], ["2", "현재 위치", "PDM·CAD, ERP 현황, 사이트·시스템 수, 멀티 인스턴스 한계, eBOM/mBOM 예시", "25분"], ["3", "가고 싶은 곳", "목표 아키텍처(North Star)", "20분"], ["4", "사용 사례: 변경 요청", "현행 시스템 vs Fusion Manage", "25분"], ["5", "기반: Items & BOMs", "품목·BOM·리비전 개념", "20분"], ["6", "구현 개요", "단계, 역할, 일정", "15분"], ["7", "추가 사용 사례", "기능별 프로세스 예(초도품 승인, 품질 클레임 등)", "20분"], ["8", "브레인스토밍", "기능·사이트·프로세스·우선순위·프로세스별 인원·개선 효과 출처", "40분"], ["Σ 합계", "", "", "180분"]], "num": [3]}, {"t": "flow", "title": "킥오프에서 파일럿 구축까지 (관측 ~4개월)", "items": [{"title": "3h 킥오프", "text": "~20명, M0"}, {"title": "상위 개념·아키텍처", "text": "파트너가 초안 작성"}, {"title": "개념 검증 세션", "text": "기능·사이트 전반 100명 이상, M2–3", "hi": true}, {"title": "개정 개념·상세 제안", "text": "범위·공수 확정"}, {"title": "파일럿 기반 구축", "text": "~M4, 반복형 요구사항"}]}, {"t": "table", "title": "이해관계자 4계층 (관측 템플릿)", "head": ["계층", "참여 규칙"], "rows": [["핵심 의사결정자", "결정에 직접 참여시킵니다"], ["사업 스폰서", "결정 전에 지침과 권한을 확인합니다"], ["현업 전문가(SME)", "도입 조직을 대표하므로 통찰을 구합니다"], ["정보 공유 대상", "결정 후 전달합니다"]]}, {"t": "sec", "id": "value", "text": "고객 사업 과제와 가치 계층"}, {"t": "p", "text": "관측 계정 계획은 모든 활동을 **고객 사업 과제**(customer business initiative) 아래에 묶었습니다. 고객 사업 과제는 \"계약 체결\" 같은 파트너 목표가 아니라 **고객의 관점과 언어로 쓴 사업 우선순위**입니다. 예: \"사이트 간 협업\", \"설계–제조 연결 스레드 표준화\"."}, {"t": "list", "title": "고객 사업 과제 작성 규칙", "items": ["과제마다 **고객 가치 한 줄**과 **합의 / 미합의** 상태를 적습니다.", "워크숍, 데모, PoC, 구현 SOW, 교육 등 모든 활동을 하나의 과제 아래에 둡니다.", "계정 계획에는 사업 연계 목표 2개 이상 + \"도입·확산\" 목표 1개를 둡니다 (관측 규칙).", "목표마다 고객 가치와 파트너 가치(활성 사용자 증가, 후속 단계 기반)를 함께 적습니다.", "해결책은 제품명이 아니라 **\"장애를 해결하는 데 필요한 역량\"**으로 씁니다.", "과제 목록 열: 사업부 | 사업 과제 | 오너 페르소나 | 목표를 가진 임원 | 파트너 기여 | 목표 시점 | 단계"]}, {"t": "flow", "title": "가치 계층 (관측 구조)", "items": [{"title": "운영 KPI", "text": "EC 오류 −75%, 납기 준수 83% → 95%, 무접촉 주문 20% → 50%, 종이 품질 프로세스 제거", "hi": true}, {"title": "하위 과제", "text": "지역·사업부 PLM 롤아웃"}, {"title": "전사 과제", "text": "글로벌 PLM"}, {"title": "연간 ROI 목표", "text": "고객 재무 조직이 산정"}]}, {"t": "p", "text": "관측 사례에서는 이 계층에 **활성 사용자 ~800명 추가**라는 도입 목표가 함께 붙었습니다. 아직 수치화하지 못한 과제는 \"자문(디스커버리)으로 추가 정의\"로 표시했습니다. 파트너는 운영 KPI까지만 책임지고, ROI 금액은 고객이 계산하게 하십시오."}, {"t": "table", "title": "KPI 계산기 패턴 (시간 기준)", "head": ["KPI", "입력값", "계산식", "예시 결과"], "rows": [["BOM 처리 공수(h/월)", "관리 BOM 수, 평균 BOM 길이, 전송 빈도", "BOM당 처리 시간 × BOM 수", "고객 데이터로 산출"], ["FTE 용량(%)", "작업 시간, 가용 FTE", "작업 시간 ÷ 가용 FTE 시간", "고객 데이터로 산출"], ["조정 시간 절감(h/년)", "활성 사용자 수", "사용자 × 0.25h/주 × 46주", "200명 → ~2,300h"], ["보고 공수 절감(h/년)", "연간 ECR + ECO + 편차 건수", "건수 × 1h × 20% 감소", "1,800건 → 360h"]], "note": "0.25h/주는 \"활동 3–5개 × 3–5분\"으로 근거를 댔습니다. 금액 환산이 필요하면 고객이 자신의 시간당 원가를 곱합니다. 파트너 문서에는 시간만 남기십시오. 가장 큰 난관은 고객에게서 입력 데이터를 받는 일이었습니다."}, {"t": "callout", "kind": "warn", "title": "가정 우선 가치 모델은 검증에서 ~75% 깎였습니다", "text": "관측 사례에서 파트너 가정으로 만든 가치 모델은 고객 검증 후 사용자 수 ÷4, 공수 ÷4, 동인 1개 삭제로 크게 줄었습니다. 헤드라인에는 **검증 가능한 동인만 넣은 보수적 하한**을 쓰고, 리스크 예방·속도 개선은 \"금액화하지 않은 추가 효과\"로 따로 적으십시오. 스폰서는 \"절약한 15분으로 무엇을 하는가\"를 묻습니다."}, {"t": "list", "title": "설계 변경 가치 기준선 질문", "ordered": true, "items": ["단순 변경과 복잡한 변경은 각각 얼마나 걸립니까?", "파일럿 사이트는 월·연간 변경을 몇 건 올립니까? 다른 사이트를 대표합니까?", "이 프로세스가 필요한 사이트는 몇 개입니까?", "영향받는 역할은 무엇이고, 가장 영향이 큰 역할은 누구이며, 그들에게 무엇이 좋아집니까?", "구현, 파일럿, 검토, 확산 일정은 어떻게 됩니까?"]}, {"t": "callout", "kind": "source", "title": "공개 통계 쓰는 법", "text": "아래 수치는 고객 자료가 아니라 공개 자료입니다. 슬라이드에 출처 표기를 반드시 남기십시오.", "items": ["기술 인력 시간의 20.3%(주 ~1일)가 비생산적 데이터 관리에 쓰임 (Autodesk 공개 자료 인용)", "응답 기업의 57%가 변경·릴리스 관리를 과제로 꼽음 (Autodesk 공개 자료 인용)", "약 3곳 중 1곳이 잘못되거나 오래된 데이터로 작업한 경험이 있음 (Autodesk 공개 자료 인용)", "고객 사례: BOM 정확도 99.6%, 워크스페이스 하나를 2일 만에 구축, 제조 사이트 10곳의 변경 관리 통합 (Autodesk 공개 자료 인용)"]}, {"t": "sec", "id": "position", "text": "포지셔닝: 대체가 아니라 결합"}, {"t": "table", "head": ["메시지", "고객에게 하는 말", "파트너가 할 일"], "rows": [["PDM + PLM 결합", "\"Vault를 바꾸는 것이 아니라 결합하고 통합합니다.\" PDM은 CAD와 붙은 엔지니어 전문 도구, PLM은 전사의 비정기 사용자를 위한 도구입니다.", "기존 PDM 투자를 지키는 메시지로 시작합니다"], ["PLM의 범위", "\"PLM은 PDM 앞뒤에서 일어나는 일입니다.\" 아이디어·요구사항에서 변경·품질·공급업체·제조까지.", "CAD 이전·이후 질문의 답과 연결합니다"], ["시스템 오브 레코드", "**PDM = 버전, PLM = 리비전, ERP = 부품 번호**(품목 간 키).", "데이터 필드 매트릭스로 소유권을 확정합니다 ([[estimate|03 견적]])"], ["하이브리드 아키텍처", "설계 파일은 사내(IP 보호, 파일 성능, CAD 버전 일치), 메타데이터·프로세스는 클라우드(전 세계 즉시 배포, 설치 불필요, 공급업체 접근).", "고객 IT와 데이터 위치를 초기에 합의합니다"], ["SaaS", "처음부터 SaaS로 설계되어 자동 업데이트로 모든 사용자가 최신 버전을 씁니다. CAD 플러그인 없이 Vault를 통해 CAD 데이터를 받습니다. IT·관리 부담이 낮습니다.", "릴리스 회귀 점검을 운영 서비스로 제안합니다 ([[support|12 지원]])"], ["보안", "ISO 27001, SOC 2 등 보안 인증, 역할 기반 접근.", "고객 보안 설문 대응 자료를 미리 준비합니다"], ["가치 실현 시간", "전통 PLM은 투자가 앞에, 효과가 뒤에 옵니다. Fusion Manage는 프로세스 하나를 정의·구축·테스트·배포하고 다음으로 넘어갑니다.", "첫 범위를 작게 잡습니다. ECR/ECO 단독은 빅뱅 없는 저위험 진입입니다"], ["단계 메시지", "\"1단계는 전면 혁신이 아니라 기반입니다.\" \"사이트 몇 곳에서는 효율이지만, 50곳에서는 통제의 전제 조건입니다.\"", "확산 로드맵을 제안서에 함께 넣습니다 ([[roadmap|13 로드맵]])"]]}, {"t": "list", "title": "Vault–Fusion Manage 연동은 단계적으로 제안 (관측 권장 순서)", "ordered": true, "items": ["PLM 이해 세션: 사용자·그룹·역할, 워크스페이스, 워크플로, BOM, 리비전, 변경 지시. \"이것 없이는 PDM–PLM 논의가 성립하지 않습니다.\"", "Vault → Fusion Manage 단방향: 뷰어블, BOM, 읽기 전용 보기. 변경 통제와 영향 분석은 Fusion Manage에서.", "변경 프로세스는 Fusion Manage, 실제 설계 작업은 Vault에서 하고 결과를 읽기 전용으로 게시.", "Fusion Manage가 Vault 상태를 제어하는 연동은 마지막에 결정. 기술적으로는 쉽지만 정당화되지 않는 작업 제약을 만들 수 있습니다."]}, {"t": "callout", "kind": "example", "title": "CAD 사용자의 PDM+PLM 도약은 생각보다 어렵습니다", "text": "관측 자료는 PDM만 쓰던 CAD 사용자를 PDM+PLM으로 옮기는 일을 \"엄청난 충격\"으로 표현했습니다. 일부 조직의 CAD 사용자는 끝내 적응하지 못했습니다. 첫 단계에서 엔지니어의 클릭 수를 늘리지 않는 범위를 고르고, 교육 계획을 견적에 넣으십시오([[training|11 교육 설계]])."}, {"t": "table", "title": "기존 PLM 반론과 답변", "head": ["고객 반론", "답변 방향", "근거"], "rows": [["\"PLM은 IT 인프라·하드웨어 부담이 크다\"", "설치·서버 없이 시작하고, 업그레이드는 서비스 측에서 수행됩니다", "SaaS 구조"], ["\"PLM은 컨설팅과 교육이 끝없이 든다\"", "표준 워크스페이스에서 출발해 프로세스 단위로 단계 납품합니다", "관측: 단계별 납품, 표준 템플릿"], ["\"CAD 데이터를 다 정리해야 시작할 수 있다\"", "CAD/PDM 데이터 정제·적재 전에 프로세스부터 사용할 수 있습니다", "관측 제안 메시지"], ["\"Vault를 버리고 이관해야 하나?\"", "아니요. PDM은 유지하고 PLM이 그 위에서 통합합니다", "PDM + PLM 결합"], ["\"PLM 연동 때문에 CAD 업그레이드가 묶인다\"", "CAD 플러그인 없이 Vault를 통해 CAD 데이터를 받습니다", "아키텍처"], ["\"중견기업에는 과하다\"", "작은 범위·짧은 기간으로 시작합니다. 워크스페이스 하나를 2일 만에 구축한 사례가 있습니다 (Autodesk 공개 자료 인용)", "공개 사례"], ["\"우리 요구를 충족할 수 있나?\"", "표준 앱 데모 + 범위를 한정한 PoC. 격차는 제품 피드백 채널로 올립니다", "관측: 갱신 리스크로 기록된 질문"], ["\"업그레이드·운영은 우리가 직접 한다\"", "역량이 아니라 **용량과 리스크**로 포지셔닝합니다. 고객 일정과 준비 상태를 근거로 다시 제안합니다", "관측: 업그레이드 컨설팅 거절 사례"], ["\"개인 업무를 감시하는 도구 아닌가?\"", "대시보드는 프로세스·팀·사이트 수준 집계로 설계하고 목적 제한 원칙을 문서화합니다", "[[support|12 지원·도입 확산]]"]]}, {"t": "sec", "id": "demo", "text": "폐루프 데모 스토리라인"}, {"t": "p", "text": "표준 테넌트로 **문제 → 개선 조치 → 변경 → 리비전 업**이 끊김 없이 이어지는 흐름을 15분 안에 보여 줍니다. \"모든 워크플로는 하나의 리비전 업으로 귀결됩니다.\""}, {"t": "steps", "items": [{"title": "대시보드로 시작", "text": "평균 처리 시간, 기한 내·지연 ECO, 제품 라인별 현황. 디스커버리에서 들은 \"수동 보고\" 고통을 바로 연결합니다.", "meta": "1분"}, {"title": "문제 보고 또는 부적합(NC) 등록", "text": "현장·품질 사용자가 사진과 영향 품목을 첨부합니다.", "meta": "2분"}, {"title": "CAPA 자동 생성", "text": "NC에서 CAPA가 생성되고 근본 원인과 조치를 기록합니다. 문제 보고는 바로 변경 요청으로 갈 수도 있습니다.", "meta": "2분"}, {"title": "설계 변경 요청(ECR)", "text": "CAPA에서 연결 생성합니다. BOM 비교로 과거(특정 일자)·현재·미래(대기 중인 변경)를 보여 줍니다.", "meta": "2분"}, {"title": "CCB 검토와 패스트트랙", "text": "정규 경로(제출 → CCB 검토 → 승인)와 패스트트랙(오탈자·물리적 변경 없음·원가 영향 없는 ERP 갱신)을 비교합니다. 고객 승인이 필요한 제품은 패스트트랙에서 제외합니다. 알림, 체류 시간 알림, 위임, 필수 코멘트, 전자서명을 보여 줍니다.", "meta": "3분"}, {"title": "설계 변경 지시(ECO) → 리비전 업", "text": "Items & BOMs의 리비전이 올라가고 라이프사이클이 바뀝니다. Vault 연동 시 변경 진행 중인 부품이 CAD에서 표시됩니다.", "meta": "3분"}, {"title": "확장 예고", "text": "같은 흐름이 RMA → CAPA → ECR → ECO로도 이어진다는 것과 다음 단계 후보(공급업체, APQP)를 한 장으로 보여 줍니다.", "meta": "2분"}]}, {"t": "callout", "kind": "tip", "title": "데모를 고객 SOP에 맞추는 법", "items": ["고객의 변경 SOP에서 \"단순 변경\" 기준과 역할(코디네이터, 생산·품질·생산기술 매니저, CCB)을 받아 패스트트랙과 승인자에 반영합니다.", "워크플로(시작과 끝이 있음)와 라이프사이클(순환하며 품목·BOM·문서의 진화를 추적)의 차이를 한 문장으로 설명합니다.", "함께 보여 줄 것: 부서별 BOM 보기, 공급업체 초대와 워크스페이스·레코드·탭·섹션·필드 단위 권한, 공급업체의 RoHS·REACH 플래그 갱신, APQP 프로젝트 대시보드와 간트.", "데모 데이터에는 실제 고객명·제품명을 넣지 마십시오. 일반 라벨(A 공장, 펌프 조립품 등)을 씁니다."]}, {"t": "sec", "id": "handover", "text": "딜리버리 인계와 갱신·확장 주기"}, {"t": "p", "text": "관측된 인계는 서식이 아니라 **서술형 메모**였습니다. 고객이 무엇을 사지 않았고 왜 거절했는지, 어떤 증거가 있으면 다시 제안할 수 있는지까지 적어야 딜리버리 팀이 같은 실수를 반복하지 않습니다. 영업에서 정한 가치 지표는 성공 계획으로 넘어가 종료 시 검증됩니다([[support|12 지원·도입 확산]])."}, {"t": "checklist", "id": "sell-handover", "title": "프리세일즈 → 딜리버리 인계 체크리스트", "items": ["고객 사업 과제, 고객 가치 문장, 합의 상태를 인계 메모에 적었다", "스폰서와 이해관계자 4계층, 최근 조직 변화를 정리했다", "SOW 라인 아이템, \"최대 N\" 상한, 가정, 고객 책임, 제외 범위를 딜리버리 PM과 함께 읽었다", "고객이 거절한 범위와 이유를 고객 표현 그대로 기록했다", "운영 KPI와 기준값 상태(측정 완료 / 측정 계획 / 미정), 측정 책임자를 넘겼다", "PDM·ERP 현황, ERP 로드맵, 연동 소유(고객 / 파트너)를 확인했다", "데모·제안에서 보여 준 기능과 구두 약속 목록을 넘기고, SOW에 없는 약속은 표시했다", "고객과의 첫 공동 미팅(킥오프 전 사전 미팅) 일정을 잡았다"]}, {"t": "template", "title": "인계 메모 (프리세일즈 → 딜리버리)", "intro": "1–2쪽 서술형으로 씁니다. 착수 1주 전까지 딜리버리 PM에게 전달합니다(권장).", "sections": [{"h": "고객 맥락", "items": ["고객 사업 과제와 고객 가치 문장", "스폰서, 이해관계자 4계층, 최근 조직 변화", "의사결정·구매 절차와 내부 승인 일정"]}, {"h": "판매한 범위", "items": ["SOW 라인 아이템과 견적 공수(S/M/L 선택 근거)", "상한, 가정, 고객 책임, 제외 범위", "상업 모델: 고정가 / T&M / 선불 시간 풀"]}, {"h": "고객이 거절한 것과 이유", "items": ["거절된 범위", "고객의 반론(고객 표현 그대로)"]}, {"h": "권장안과 내부 근거", "items": ["왜 그 범위를 권했는가 (역량이 아니라 용량·리스크)", "재제안 조건: 어떤 증거가 나오면 범위를 다시 여는가 (고객 일정, 준비 상태)"]}, {"h": "가치 지표", "items": ["운영 KPI, 기준값, 목표, 측정 책임자", "기준값 측정 계획(운영 전환 후 1–2개월 등)"]}, {"h": "기술 현황", "items": ["PDM·CAD 현황, ERP 종류·로드맵, 연동 소유", "데이터 상태와 정제 책임"]}, {"h": "리스크와 미결 사항", "items": ["위험 신호 체크 결과", "미결 결정과 결정 기한"]}, {"h": "첫 공동 미팅", "items": ["일시, 참석자, 목적, 고객이 준비할 입력물"]}]}, {"t": "list", "title": "킥오프에서 하는 공식 인계 (관측 안건)", "items": ["핵심 팀 소개", "서비스 개요와 진행 절차", "거버넌스 ([[team|09 팀과 거버넌스]])", "딜리버리 프레임워크 ([[method|08 딜리버리 방법론]])", "고객 사업 과제 개요", "가치 측정 접근"]}, {"t": "h", "text": "갱신·확장 시계"}, {"t": "p", "text": "관측 고객의 갱신 프로세스는 계약 종료 **약 10개월 전**에 시작했고, 계정 계획(성공 계획)은 **약 6개월 전**에 시작하는 것이 내부 규칙이었습니다. 파트너가 6개월 전에 처음 움직이면 고객 예산 과정은 이미 절반이 지나 있습니다."}, {"t": "table", "title": "고객 측 갱신 단계 (관측)", "head": ["단계", "기간"], "rows": [["잠정 목표·목적·과제 식별", "~87일"], ["갱신 예산 추정", "~23일"], ["성공 계획 작성", "~86일"], ["성공 계획 확정", "~20일"], ["갱신 수량 산정", "~9일"], ["갱신 제안 확정", "~16일"], ["계약 검토", "~11일"], ["계약 서명", "~12일"], ["Σ 합계", "~264일"]], "num": [1], "note": "주문은 종료 약 4주 전에 들어갔습니다. 사업부·지역별 승인이 필요했고, 앞선 갱신이 촉박했던 주기 다음 주기는 일찍 시작해 \"훨씬 순조로웠다\"고 기록되었습니다."}, {"t": "gantt", "title": "갱신 10개월 전부터의 파트너 행동", "subtitle": "고객 예산 과정보다 먼저 가치 증거를 들고 들어갑니다", "cols": ["M-10", "M-9", "M-8", "M-7", "M-6", "M-5", "M-4", "M-3", "M-2", "M-1"], "rows": [{"label": "고객: 목표·과제 식별", "start": 0, "len": 3, "kind": "std", "text": "~87일"}, {"label": "가치 증거 정리", "start": 1, "len": 2, "kind": "opt", "text": "검증 레지스터·QBR (권장)"}, {"label": "갱신 브리핑", "start": 2, "len": 1, "kind": "std", "text": "~M-8"}, {"label": "공동 워크숍", "start": 3, "len": 1, "kind": "std", "text": "~M-7"}, {"label": "성공 계획·우선순위 합의", "start": 4, "len": 3, "kind": "run", "text": "~M-6부터"}, {"label": "공식 제안", "start": 5, "len": 1, "kind": "gate", "text": "~M-5"}, {"label": "고객 예산·법무·계약 검토", "start": 6, "len": 3, "kind": "std", "text": "사업부별 승인"}, {"label": "주문", "start": 9, "len": 1, "kind": "gate", "text": "~4주 전"}], "legend": [{"kind": "std", "text": "관측 일정"}, {"kind": "run", "text": "필수 파트너 활동"}, {"kind": "gate", "text": "관문"}, {"kind": "opt", "text": "권장"}]}, {"t": "list", "title": "확장 동선 (관측)", "items": ["순서: 단일 PDM → PLM 파일럿 → 전사 PLM 롤아웃 → 다른 사업부 합류.", "여백 지도: 사업부 × 역량을 \"사용 중 / 확장 여지 / 미개척\"으로 표시합니다.", "다음 단계 후보: APQP 디지털화, 공급업체 관리 0단계 이후, 제품 계층·분류, 폐루프 품질, 자산 관리, 서비스 부품.", "종료 보고마다 \"어디에 기회가 있는가\"를 한 장으로 남깁니다 (예: 사용자 관리 도구 패턴을 다른 워크스페이스에 재사용).", "현장 방문에서 고객이 이미 구독에 포함된 역량을 모르고 있던 사례가 있었습니다. 고통을 수치(하루 종이 작업 지시 건수 등)로 확인하고 제안합니다.", "확장 상세: [[roadmap|13 로드맵]], 상업 구조: [[commercial|06 계약과 상업 모델]]"]}, {"t": "quiz", "items": [{"q": "Fusion Manage 첫 미팅의 주 타깃으로 가장 알맞은 사람은?", "options": ["CAD 전문가와 드래프터", "엔지니어링 VP·디렉터와 제품 라인 매니저", "출력실·CNC 운영자"], "answer": 1, "why": "PLM 예산과 프로세스 변화를 결정하는 엔지니어링 리더와 제품 책임자가 주 타깃입니다. CAD 전문가는 중요한 사용자지만 의사결정자가 아닙니다."}, {"q": "시스템 오브 레코드 분담으로 맞는 것은?", "options": ["PDM = 리비전, PLM = 버전, ERP = BOM", "PDM = 버전, PLM = 리비전, ERP = 부품 번호", "모든 데이터를 PLM 하나가 소유"], "answer": 1, "why": "PDM은 작업 버전, PLM은 공식 리비전, ERP는 품목 간 키인 부품 번호를 소유합니다. \"단일 진실 공급원은 결코 하나의 애플리케이션이 아닙니다.\""}, {"q": "가치 사례의 헤드라인 수치로 써야 하는 것은?", "options": ["모든 동인을 합한 최대값", "고객 데이터로 검증한 동인만 합한 보수적 하한", "공개 통계를 고객 규모에 비례 적용한 값"], "answer": 1, "why": "가정 우선 모델은 검증에서 ~75% 깎였습니다. 검증 가능한 동인만 헤드라인에 넣고 나머지는 금액화하지 않은 추가 효과로 적습니다."}, {"q": "고객이 \"업그레이드·운영은 우리가 직접 한다\"며 서비스를 거절할 때 바람직한 대응은?", "options": ["고객 역량이 부족하다고 설득한다", "용량과 리스크 관점으로 다시 포지셔닝하고, 고객 일정·준비 상태를 근거로 재제안 조건을 인계 메모에 남긴다", "가격을 낮춰 다시 제안한다"], "answer": 1, "why": "관측 사례에서 역량을 문제 삼는 제안은 거절당했습니다. 용량·리스크로 말하고, 어떤 증거가 나오면 다시 제안할지 기록해 두십시오."}]}]}, {"id": "estimate", "num": "03", "group": "sell", "title": "공수는 *라인 아이템*으로 견적합니다", "short": "스코핑·견적", "goal": "역량 → 단계 → 라인 아이템으로 범위를 쪼개고, 관측 공수(S/M/L)·PM·예비 공수·달력 기간을 더해 고객이 검산할 수 있는 견적을 만들 수 있습니다.", "facts": [["학습 시간", "45분"], ["대상", "영업·프리세일즈·PM"], ["산출물", "라인 아이템 견적표"]], "blocks": [{"t": "lead", "text": "Fusion Manage 견적은 총 시간을 감으로 부르는 일이 아닙니다. **역량을 단계별 라인 아이템으로 쪼개고, 항목마다 관측 공수(S/M/L)를 붙인 뒤, PM·예비 공수·달력 기간을 따로 더하는 작업**입니다. 이 모듈의 공수 표는 아카데미 전체가 쓰는 기준값입니다."}, {"t": "sec", "id": "method", "text": "견적 방법 9단계"}, {"t": "p", "text": "관측 프로젝트는 선불 컨설팅 시간 풀을 둔 엔터프라이즈 계약 아래에서 진행되었습니다. 워크스트림마다 시간 견적이 적힌 요청서를 따로 승인받는 방식이었습니다. 파트너는 이를 **SOW + 범위 변경서(Change Request) + 선불 시간 풀(retainer)·고정가·T&M** 중 하나로 옮기면 됩니다. 계약 형태가 달라도 견적 단위는 같습니다. 라인 아이템별 시간(h)입니다. 계약 형태는 [[commercial|06 계약과 상업 모델]]에서 다룹니다."}, {"t": "steps", "items": [{"title": "역량 단위로 범위 자르기", "text": "설계 변경, Items & BOMs, Vault 연동처럼 고객이 이해하는 역량 단위로 나눕니다. 역량마다 견적과 변경 이력을 따로 둡니다. 관측 사례: 역량당 요청서 1건을 착수부터 종료까지 유지하고 n.1, n.2 개정으로 증감을 남겨 1–2년 동안 추적이 가능했습니다.", "meta": "산출물: 역량 목록·제외 범위 · 담당: 영업·PM"}, {"title": "단계별 라인 아이템으로 분해", "text": "착수 → 현행(As-Is) → 목표(To-Be) → 상세 계획 → 플랫폼 → 구축 → 연동·데이터 → UAT → 운영 전환(Go-live) → 교육 → 종료 순서로 항목을 나눕니다. 항목마다 \"최대 N\" 상한(워크숍 횟수, UAT 라운드, 결함 수정 일수, 하이퍼케어 일수)을 붙입니다.", "meta": "기준: 아래 28개 라인 아이템 벤치마크"}, {"title": "복잡도 동인으로 S/M/L 선택", "text": "워크스페이스 수, 워크플로 상태·승인 단계, 스크립트 수, 사이트 수, 연동 수, 데이터량을 보고 등급을 고릅니다. 정보가 부족하면 M으로 두고 디스커버리 후 다시 맞춥니다(권장).", "meta": "기준: 아래 복잡도 동인 표"}, {"title": "사이트당 가산", "text": "파일럿 이후 사이트가 늘면 현장 의존 항목(현행 분석, 권한 매핑, 데이터 로드, UAT, 하이퍼케어)에 가산합니다. 관측: 파일럿 이후 확장은 사이트당 약 1인일(현장 요구 파악 0.5 + 평가 0.5)에 상한을 둔 개선 건수(건당 7.5–10인일)를 더해 견적했습니다.", "meta": "계산기 가산율(권장): 추가 사이트당 현행 25% · 권한 20% · 데이터 로드 30% · UAT 30% · 하이퍼케어 50%"}, {"title": "PM 15% 더하기", "text": "관측 범위는 순수 지원 업무 약 8%부터 다중 프로젝트 SOW 16–19%까지였고, 견적 워크북의 최솟값이 15%였습니다. 기본값은 **15%**입니다. PM 시간은 별도 줄로 보이게 합니다. 관측 사례: 지원 11일과 96h 표기가 맞지 않아 고객이 반려했고, PM 1일을 따로 적은 뒤 승인되었습니다.", "meta": "착수 0.5인일 + 종료 0.5인일은 PM과 별도 라인 아이템"}, {"title": "예비 공수 20% (디스커버리·설계는 30% 이상)", "text": "관측: 서명된 변경 범위에 5–10% 예비나 10–20% 버퍼를 넣고도 21–72% 초과했습니다. 디스커버리·설계는 +10%~+213% 초과했습니다. 기본 **20%**, 디스커버리·설계만 따로 판매할 때는 **30% 이상**(권장).", "meta": "계산기는 (기본 공수 + PM)에 예비율을 곱합니다"}, {"title": "달력 기간을 따로 계산", "text": "기간 = 인일 ÷ (투입 FTE × 5일) × **1.5**. 1.5는 고객 승인 대기와 테스터 가용성 보정입니다. 관측: 설계 승인 대기가 수주–수개월, UAT가 명목 기간의 약 2배였습니다.", "meta": "전제 명시: 고객 키유저 주당 약 20% 투입"}, {"title": "벤치마크와 대조", "text": "총합을 관측 규모와 비교합니다. 소규모 추가 작업 약 80h, 단일 역량 130–330h, 복잡한 역량 530–710h. 범위를 벗어나면 이유를 견적서에 한 줄로 적습니다.", "meta": "담당: 견적 작성자가 아닌 동료 검토자"}, {"title": "사전 공유 후 정식 제출", "text": "정식 SOW·범위 변경서 전에 라인 아이템별 공수 분해와 일정 초안을 메일로 먼저 보내 고객 코멘트를 받습니다. 관측: 이 방식에서 승인은 대개 당일–2일, 문구 이견이 있으면 최대 약 10일이 걸렸고, 승인 즉시 인력을 확정 예약할 수 있었습니다.", "meta": "템플릿: 아래 '견적 사전 공유 메일'"}]}, {"t": "sec", "id": "drivers", "text": "복잡도 동인과 S/M/L 선택"}, {"t": "p", "text": "같은 라인 아이템도 고객마다 공수가 3배 넘게 달라집니다. 아래 표의 신호를 디스커버리 질문으로 확인하고 등급을 고르십시오. 질문 목록은 [[sell|02 영업과 디스커버리]]에 있습니다."}, {"t": "table", "title": "라인 아이템 유형별 복잡도 동인", "head": ["유형", "공수를 키우는 동인", "S에 가까운 신호", "L로 가는 신호"], "rows": [["현행(As-Is) 분석", "워크숍 횟수, 사이트 수, 고객 팀의 현행 도구 숙련도", "단일 사이트·단일 프로세스, 고객이 SOP를 직접 발표", "복잡한 파일럿(워크숍 최대 7회), 고객 팀 교육까지 필요(관측: 48h → 66h)"], ["목표(To-Be) 설계", "워크스페이스 수, 승인 관계자 수, 전사 표준 여부", "표준 구성 + 차이점만 문서화", "설계서가 전사 표준이 됨(관측: 40h → 125h), 승인 라운드 다수(V1→V4, v1→v7)"], ["설계 변경(ECR/ECO) 구축", "워크스페이스 수(워크스페이스당 약 45h), 워크플로 상태, 승인자 구성, 스크립트", "CR·CO·작업(Task) 표준 워크스페이스 위주", "사이트별 다중 승인 위원회, 순차 작업, ECR당 다중 ECO, 외부 승인"], ["편차 승인·추가 프로세스", "갱신 루프, 만료 알림, CR 자동 생성", "단순 승인 워크플로", "갱신·만료·ERP 차단 단계 포함(관측 228h)"], ["Items & BOMs", "마스터/브랜치 모델, eBOM → mBOM, 웹 앱, 검증 라운드", "단일 품목 워크스페이스 + 표준 BOM", "마스터/브랜치 + 사이트별 mBOM + 웹 앱 2종 + 검증 2라운드(관측 552h)"], ["자산·품질·공급업체", "자동화 스크립트 수, 표준(OOTB) 이탈 정도, 연결 워크스페이스 수", "OOTB 워크플로 그대로, 파일럿 사이트 1곳", "자동화 스크립트 11개 범위 포함(관측: 368h → 610h), 품질 워크플로 커스터마이징"], ["제품 계층·PPM", "계층 레벨 수, 코드 수, 임포트 반복, 미확정 속성", "확정된 분류 체계 1개 임포트", "설계 중 체계 변경(9단계 → 5단계 코드), 속성 미확정 상태에서 범위 승인"], ["ERP 연동", "인터페이스 수, 고객 미들웨어 팀 유무, 프록시 개발, 필드 매핑", "고객 미들웨어 팀이 구축하고 파트너는 지원(인터페이스당 176–184h)", "프록시 개발 + \"범위 변화 없는 예상외 복잡도\" 추가(관측: 104h → 264h)"], ["Vault 연동", "표준 커넥터 적합성, Vault 버전, 연동 방향", "표준 커넥터로 운영 전환까지 5–15일", "고객 미들웨어 기반 자체 구축 지원, 커넥터 공백을 메우는 프록시"], ["데이터 로드", "소스 수, 사이트 수, 데이터 품질, 반복 동기화", "동기화 도구 배포·교육(관측 48h)", "다중 소스·다중 사이트, 정제 반복(분류 코드 임포트 테스트 7회 이상)"], ["UAT·운영 전환", "사이트 수, 테스터 가용성, 진행 중 레거시 기록 이관", "단일 사이트 1라운드", "다사이트(UAT가 명목의 약 2배), 진행 중 종이 변경 기록 이관"], ["교육", "트랙 수, 인원, 관리자 자립 수준", "신규 기능 브리핑(관측 16h)", "관리자 도구 포함 자립 프로그램(관측 360h)"]], "note": "괄호 안 수치는 관측 프로젝트 기록입니다. 동인 판단은 디스커버리 결과로 갱신하십시오."}, {"t": "callout", "kind": "tip", "title": "등급 선택 실무 규칙 (권장)", "items": ["디스커버리 전 견적은 M으로 두고 \"목표 설계 승인 후 재견적\" 조건을 붙입니다.", "L 신호가 하나라도 보이면 그 항목은 L로 잡거나 별도 범위 변경서로 분리합니다.", "단일 사이트 중견 고객은 대부분 S에 가깝습니다. 그래도 현행 분석·목표 설계는 S로 낮추지 않습니다. 설계 초과는 규모와 무관하게 반복되었습니다."]}, {"t": "sec", "id": "bench", "text": "라인 아이템 벤치마크 28개"}, {"t": "p", "text": "아래 표는 아카데미 전체의 기준값이며, 이 모듈 아래 견적 계산기의 S/M/L 값과 같습니다. 모든 값은 **엔터프라이즈 다사이트 고객** 기록에서 나왔습니다. 단일 사이트 고객이면 S 쪽에서 시작하되, 근거 열을 읽고 고객 상황과 비교하십시오."}, {"t": "table", "title": "라인 아이템별 공수 (h)", "head": ["#", "라인 아이템", "S", "M", "L", "근거", "구분"], "num": [0, 2, 3, 4], "rows": [["1", "착수(모빌라이제이션)·킥오프", "8", "16", "24", "착수 회의 최대 1h + 준비, SOW당 PM 착수 0.5인일", "추정"], ["2", "현행(As-Is) 분석, 워크스트림당", "48", "80", "244", "48–80h, 워크숍 최대 7회의 복잡한 파일럿 244h", "관측"], ["3", "목표(To-Be) 설계, 워크스트림당", "60", "120", "200", "40–125h(Items & BOMs 40 → 125h 실적), 설계 변경 120h, 단종 40 → 200h", "관측"], ["4", "상세 구현 계획", "28", "48", "88", "28–88h", "관측"], ["5", "데이터 필드 매트릭스(ERP·PDM·PLM 소유권)", "32", "68", "100", "견적 32h → 실적 68h", "관측(L 추정)"], ["6", "샌드박스 테넌트 구성", "24", "40", "60", "40h(데이터 센터·테넌트명·접근·불필요 앱 정리·브랜딩)", "관측(S/L 추정)"], ["7", "사용자·그룹·권한 매핑", "16", "40", "80", "접근 매핑 워크북, 사용자 접근 자동화 6인일", "추정"], ["8", "설계 변경(ECR/ECO) 구축", "180", "360", "540", "변경 워크스페이스 6개 + 참조 2개에 360h(워크스페이스당 약 45h)", "관측(S/L 추정)"], ["9", "편차 승인(Deviation) 워크스페이스", "112", "228", "240", "갱신 루프 포함 구축 228h, 변경 워크스페이스 1개 전 과정 240h", "관측"], ["10", "Items & BOMs 파일럿 구축", "280", "552", "760", "552h(69인일), 검증 2라운드·UAT 단계 포함", "관측(S/L 추정)"], ["11", "제품 계층(Product hierarchy)", "60", "134", "200", "견적 62h → 최종 133.5h", "관측"], ["12", "제품 포트폴리오·단종 관리(PPM·Obsolescence)", "160", "360", "709", "최종 709h(단종 109h·제품군 50h·제품 80h·PPM 160h 등)", "관측(M 추정)"], ["13", "공급업체 관리(Phase 0)", "200", "328", "450", "견적 200h → 최종 327.5h", "관측"], ["14", "품질 관리(Audit·NCR·CAPA·RMA)", "240", "336", "480", "견적 336h(42인일), \"목표 설계 승인 후 변경 가능\" 조건", "관측(견적치)"], ["15", "자산 관리(설비·교정·예방보전) PoC", "368", "610", "800", "견적 368h → 최종 610h, 자동화 스크립트 11개", "관측"], ["16", "보고서·대시보드", "40", "80", "160", "현행 분석 80h만 기록, 구축 공수 기록 없음", "추정"], ["17", "ERP 연동(고객 미들웨어 팀 지원형)", "120", "184", "264", "인터페이스당 지원 176–184h, 프록시 포함 104 → 264h", "관측"], ["18", "Vault–Fusion Manage 연동", "40", "120", "176", "커넥터 방식 운영 전환까지 5–15일, 지원형 176h, 프록시 80h", "관측"], ["19", "초기 데이터 로드(마스터·BOM)", "48", "140", "200", "현행 80h + 계획 60h, 동기화 도구 배포·교육 48h", "관측"], ["20", "레거시 PLM 이관 디스커버리·샌드박스", "200", "416", "721", "견적 416h, 재견적 721h(+73%), 디스커버리가 약 60% 소진", "관측"], ["21", "UAT 지원(1라운드 + 결함 수정)", "80", "120", "200", "패키지 112–128h, 다사이트는 명목 기간의 약 2배", "관측"], ["22", "운영 테넌트 전환(복제·스모크 테스트·퍼지·이행 데이터)", "46", "80", "156", "파일럿 46h, 진행 중 기록 이행 포함 156h(19.5인일)", "관측"], ["23", "운영 전환 지원·하이퍼케어", "16", "24", "40", "8–16h, 3일, 최대 5일", "관측"], ["24", "관리자 교육", "16", "80", "360", "신규 기능 16h, 10일 관리자 과정, 관리자 도구 포함 360h", "관측"], ["25", "키유저·UAT 테스터 교육", "16", "32", "64", "트랙당 2h × 2회(+자료 준비 약 2주)", "추정"], ["26", "교육 자료 작성 지원", "8", "40", "144", "지원 최대 4h, 콘텐츠 제작 96–144h", "관측"], ["27", "웹 앱·확장 PoC(예: mBOM 편집기)", "42", "120", "240", "목업 42h, 정식 앱은 개발자 3–4명(시간 기록 없음)", "관측(L 추정)"], ["28", "종료(클로즈아웃) 보고", "4", "8", "16", "종료 회의 최대 2h + 보고 자료, PM 0.5인일", "관측"]], "note": "구분: 관측 = 실제 기록 수치, 추정 = 관측치 기반 추정. 단위 h, 1인일 = 8h. 상세 프로젝트 맥락은 [[catalog|04 프로젝트 유형]] 참조."}, {"t": "callout", "kind": "source", "title": "독립 검증", "text": "별도의 초기 제안서에서도 현행 분석 약 10인일, 변경 관리 구축 약 48인일, 미들웨어 연동 인터페이스당 약 22인일, 샌드박스 약 5–7인일이 나왔습니다. 위 표의 2·8·17·6행과 일치합니다."}, {"t": "bars", "title": "관측된 단일 역량 프로젝트 총 공수", "subtitle": "단일 역량도 130–710h입니다. 가장 큰 PPM은 80h 견적에서 출발했습니다", "unit": "h", "items": [{"label": "제품 계층", "value": 134}, {"label": "공급업체 관리 Phase 0", "value": 328}, {"label": "품질 관리 (견적)", "value": 336}, {"label": "설계 변경 구축", "value": 360}, {"label": "Items & BOMs 구축", "value": 552}, {"label": "자산 관리 PoC", "value": 610}, {"label": "제품 포트폴리오·단종 관리", "value": 709, "hi": true}], "note": "개정 후 최종 공수 기준. 제품 계층 133.5h·공급업체 327.5h는 반올림, 품질 관리는 견적치, 설계 변경·Items & BOMs는 구축 단계만 표시."}, {"t": "sec", "id": "overrun", "text": "초과의 현실과 대응"}, {"t": "stats", "items": [{"value": "+10~+213%", "label": "현행 분석·목표 설계·데이터 정의의 견적 초과 폭"}, {"value": "384 → 385h", "label": "설계 변경 구축의 견적 대비 실적. 구축은 견적을 지켰습니다"}, {"value": "1.6–13×", "label": "단일 역량이 생애 동안 커진 배수"}, {"value": "21–72%", "label": "예비 5–10%를 넣고도 서명 범위가 초과한 폭"}]}, {"t": "table", "title": "관측된 초과와 반환", "head": ["항목", "견적(h)", "최종·실적(h)", "변화"], "num": [1, 2, 3], "rows": [["Items & BOMs 목표 설계", "40", "125.25", "+213%"], ["데이터 필드 매트릭스", "32", "68", "+113%"], ["샌드박스 테넌트 구성", "40", "58", "+45%"], ["현행 분석 (Vault 이관 사이트)", "48", "66", "+38%"], ["목표 설계 (Vault 이관 사이트)", "78", "104", "+33%"], ["상세 계획 (Vault 이관 다사이트 계획)", "80", "88", "+10%"], ["설계 변경 구축", "384", "385", "0%"], ["설계 변경 UAT 지원", "128", "128", "0%"], ["편차 승인 구축", "228", "220", "−4%"], ["구축·이관 (Vault 이관 사이트)", "472", "385.75", "−18%"], ["상세 계획 갱신 (Vault 이관 사이트)", "40", "28", "−30%"]], "note": "상향 개정은 모두 평가·설계·계획 단계였습니다. 구축 단계는 견적 내였거나 남은 시간을 반환했습니다."}, {"t": "p", "text": "역량 단위로 보면 성장은 더 큽니다. 공급업체 관리 1.6×(초안 대비 4×), 자산 관리 1.66×, 제품 계층 2.15×, ERP 연동 2.5×, PPM 8.9×, 설계 변경 확장 13×. 2차 계약 주기의 요청서 합계는 약 2,391h에서 약 4,797h로 약 2배가 되었습니다."}, {"t": "callout", "kind": "warn", "title": "\"일단 작게 시작\"은 견적이 아닙니다", "text": "관측: 설계 변경 확장은 \"시작할 수 있게 40h만\"이라는 요청으로 출발해 536h(13×)가 되었습니다. 레거시 PLM 이관은 416h 중 약 60%를 디스커버리에서 썼고, 재견적은 +73%(721h)였습니다. 작게 시작하려면 **디스커버리를 고정 범위 상품으로 따로 판매**하고, 구축은 목표 설계 승인 후 다시 견적하십시오."}, {"t": "list", "title": "그래서 파트너는 무엇을 하나", "items": ["디스커버리·설계를 별도 SOW 또는 별도 단계로 분리하고 예비 공수를 30% 이상 둡니다.", "구축 공수는 목표 설계 승인 후 확정합니다. 그 전에는 S–L 범위로 제시합니다.", "초과 허용 한도를 계약에 적습니다. 관측 기준은 견적 대비 +10%까지 재승인 없이, 그 이상은 범위 변경서였습니다([[sow|05 SOW 작성]]).", "개정은 n.1, n.2 번호와 부호 있는 증감 이력표로 남기고, 개정 요청마다 그 시점의 소진 시간을 적습니다.", "4–20h짜리 소규모 추가 요청은 별도 로그(분류·효과·예산 내 여부·개정 필요 여부)로 관리해 10% 버퍼 밖으로 새지 않게 합니다.", "운영 전환에 꼭 필요한 범위를 \"Phase 0\"으로 묶고, 후속 단계는 따로 견적합니다.", "개정 요청에는 비즈니스 효과(감사 대응, 운영 전환 차단 요소)를 적습니다. 관측: 효과가 분명한 요청은 당일 승인되었습니다."]}, {"t": "sec", "id": "example", "text": "예시 견적: 설계 변경 + Items & BOMs + Vault 연동"}, {"t": "p", "text": "**예시(가상)** 단일 사이트 중견 제조 고객입니다. 범위는 설계 변경, Items & BOMs, Vault 연동이며 ERP 연동은 없습니다. 모든 항목을 M 값으로 계산하고 PM 15%, 예비 20%, 투입 1.5 FTE를 적용합니다. 실제 고객 견적이 아니라 계산 방법을 보여 주는 예시입니다."}, {"t": "list", "title": "예시 전제", "items": ["현행 분석·목표 설계는 두 프로세스를 함께 다루는 통합 워크숍 1회분(M)으로 가정합니다. 워크스트림별로 나누면 각각 1회분을 더합니다.", "ERP 연동이 없으므로 데이터 필드 매트릭스와 ERP 연동은 제외합니다. 나중에 필요해지면 범위 변경서로 추가합니다.", "보고서는 표준 대시보드만 쓰는 것으로 보고 별도 항목에서 제외합니다.", "사이트 1곳(사이트 가산 없음), 교육 대상 50명 이하(키유저 교육 가산 없음)입니다."]}, {"t": "table", "title": "예시 견적표", "head": ["단계", "라인 아이템", "등급", "공수(h)"], "num": [3], "rows": [["디스커버리·설계", "착수(모빌라이제이션)·킥오프", "M", "16"], ["디스커버리·설계", "현행(As-Is) 분석", "M", "80"], ["디스커버리·설계", "목표(To-Be) 설계", "M", "120"], ["디스커버리·설계", "상세 구현 계획", "M", "48"], ["플랫폼 준비", "샌드박스 테넌트 구성", "M", "40"], ["플랫폼 준비", "사용자·그룹·권한 매핑", "M", "40"], ["구축", "설계 변경(ECR/ECO) 구축", "M", "360"], ["구축", "Items & BOMs 구축", "M", "552"], ["연동·데이터", "Vault–Fusion Manage 연동", "M", "120"], ["연동·데이터", "초기 데이터 로드(마스터·BOM)", "M", "140"], ["테스트·운영 전환", "UAT 지원(1라운드 + 결함 수정)", "M", "120"], ["테스트·운영 전환", "운영 테넌트 전환", "M", "80"], ["테스트·운영 전환", "운영 전환 지원·하이퍼케어", "M", "24"], ["교육", "관리자 교육", "M", "80"], ["교육", "키유저·UAT 테스터 교육", "M", "32"], ["종료", "종료(클로즈아웃) 보고", "M", "8"], ["Σ 기본 공수 소계", "16개 라인 아이템 합계", "", "1,860"], ["Σ PM 15%", "1,860 × 0.15", "", "279"], ["Σ 예비 공수 20%", "(1,860 + 279) × 0.20 = 427.8", "", "428"], ["Σ 총 견적 공수", "1,860 + 279 + 428", "", "2,567"]], "note": "계산기에서 보고서·대시보드를 끄고 Vault 연동을 켠 뒤 모두 M으로 두면 같은 결과가 나옵니다."}, {"t": "p", "text": "**기간 계산:** 2,567h ÷ 8 = 320.9인일 → 320.9 ÷ (1.5 FTE × 5일) = 42.8주(순수 작업) → × 1.5(고객 대기 보정) = 64.2 → **약 65주(약 15개월)**. 검산: 관측된 설계 변경 파일럿은 단독으로 약 1,070h + 현행 분석이었고, 운영 전환까지 13–14개월이 걸렸습니다."}, {"t": "callout", "kind": "example", "title": "등급을 바꾸면 얼마나 달라지나", "items": ["모든 항목 S: 910h → PM 137h → 예비 209h → **총 1,256h(157인일), 약 32주**.", "디스커버리·설계 4개 항목만 M, 나머지 S: 1,030h → PM 155h → 예비 237h → **총 1,422h(177.8인일), 약 36주**. 단일 사이트 중견 고객에게 권장하는 출발점입니다(권장).", "어느 경우든 고객에게는 **공수와 기간을 따로**, 기간의 전제(승인 기한, 키유저 투입률)와 함께 제시합니다."]}, {"t": "sec", "id": "calc", "text": "견적 계산기"}, {"t": "p", "text": "계산기는 위 28개 라인 아이템 중 공통으로 쓰는 항목을 담고 있습니다. 입력값은 이 브라우저에 자동 저장됩니다."}, {"t": "list", "title": "사용 순서", "ordered": true, "items": ["대상 사이트 수와 교육 대상 사용자 수를 입력합니다.", "범위에 들어가는 라인 아이템을 체크하고, 복잡도 동인 표를 보며 S/M/L을 고릅니다.", "PM·예비율은 기본 15%·20%로 둡니다. 디스커버리만 견적할 때는 예비율을 30% 이상으로 올립니다.", "투입 컨설턴트(FTE)를 실제 투입 계획대로 넣습니다. 기간에는 ×1.5 대기 보정이 자동 적용됩니다.", "단가는 선택 항목입니다. 귀사 1인일 단가를 넣으면 참고 금액만 계산합니다. 이 가이드는 어떤 단가도 제시하지 않습니다.", "\"견적표 복사\"로 엑셀에 붙여 넣고, 벤치마크 표의 근거를 함께 적어 내부 검토를 받습니다."]}, {"t": "estimator"}, {"t": "callout", "kind": "rule", "title": "기간은 시간보다 길다", "text": "관측: 80–330h 규모의 단일 역량 프로젝트가 10–17개월 걸렸습니다. 고객 테스터, ERP 팀, 데이터 담당자가 모두 겸직이었기 때문입니다. 공수와 기간은 반드시 따로 견적하고, 기간에는 고객 가용성 전제를 붙이십시오.", "items": ["제품 계층: 약 134h, 착수에서 종료까지 약 15개월.", "공급업체 관리 Phase 0: 327.5h, 계획 약 6개월 → 약 17개월째 UAT.", "Items & BOMs: 승인된 설계까지 약 12개월(계획 대비 약 3개월 지연), 첫 사이트 운영 전환은 10개월 넘게 밀림.", "설계 변경 확장: 키유저 UAT 계획 2–3주, 실제 약 7주.", "견적서에 적을 전제(권장): 설계 승인 기한, 키유저 주당 약 20% 투입, 테스터 명단 확정 시점, 고객 지연 시 일정 재조정 원칙."]}, {"t": "sec", "id": "review", "text": "견적 검토와 사전 공유"}, {"t": "template", "title": "견적 사전 공유 메일 (Estimate of Effort)", "intro": "정식 SOW·범위 변경서 전에 보내는 1쪽 메일입니다. 관측 사례: 고객이 줄 단위로 코멘트한 뒤 \"준비되면 정식 제출\"이라고 답했고, 승인 후 바로 인력을 확정 예약했습니다.", "sections": [{"h": "목적과 범위", "items": ["역량명과 비즈니스 목표 1줄", "포함 범위 / 제외 범위", "선행 조건(예: 목표 설계 승인, 고객 데이터 준비)"]}, {"h": "라인 아이템 공수", "items": ["단계 | 라인 아이템 | 상한(최대 N) | 공수(h) | 인일", "PM 시간과 예비 공수를 별도 줄로 표기", "합계를 시간과 인일로 모두 표기(1인일 = 8h)"]}, {"h": "일정과 전제", "items": ["달력 기간(주)과 투입 FTE", "고객 승인 기한, 키유저 투입률, 테스터 확정 시점", "일정 초안 링크"]}, {"h": "고객 책임", "items": ["UAT 수행과 결함 우선순위 결정", "데이터 준비·정제", "최종 사용자 교육", "고객 자체 연동의 테스트"]}, {"h": "변경 규칙", "items": ["견적 대비 +10% 초과 시 범위 변경서", "소규모 추가 요청 처리 방식(로그·승인 메일)", "디스커버리 후 재견적 시점"]}, {"h": "다음 단계", "items": ["코멘트 기한", "정식 제출 예정일", "인력 확정 예약 조건"]}]}, {"t": "checklist", "id": "estimate-review", "title": "견적 검토 체크리스트", "items": ["범위가 역량 단위로 나뉘어 있고, 역량마다 포함·제외 범위가 적혀 있다", "모든 라인 아이템에 S/M/L 등급과 그 근거(복잡도 동인)가 있다", "워크숍·UAT 라운드·결함 수정 일수·하이퍼케어에 \"최대 N\" 상한이 있다", "PM 시간(기본 15%)이 별도 줄로 보이고, 시간 합계와 인일 합계가 서로 맞는다", "예비 공수가 20% 이상이고, 디스커버리·설계 단독 견적은 30% 이상이다", "추가 사이트가 있으면 현장 의존 항목에 사이트당 가산을 했다", "달력 기간을 공수와 따로 제시하고, 고객 측 전제(승인 기한, 키유저 약 20% 투입)를 적었다", "총합을 관측 규모(소규모 약 80h, 단일 역량 130–330h, 복잡한 역량 530–710h)와 비교했다", "연동은 고객 미들웨어 팀 유무를 확인하고, 구축형과 지원형 중 하나로 명시했다", "커스텀 코드(웹 앱·프록시·도구)는 PoC로 한정하고, 운영 배포·유지보수는 별도 계약으로 뺐다", "처음 해 보는 유형, 데이터 이관, 외부 의존(ERP 일정 등)이 있으면 위험 메모와 추가 예비를 달았다", "작성자가 아닌 동료가 검토했고, 정식 제출 전에 고객에게 사전 공유했다"]}, {"t": "p", "text": "검토를 마친 견적은 [[sow|05 SOW 작성]]으로 넘깁니다. 상한·고객 책임·제외 범위 문구는 [[risk|07 리스크와 안전장치]]를 참고하십시오."}, {"t": "callout", "kind": "tip", "title": "범위 템플릿으로 바로 초안 만들기", "text": "[[builder|17 SOW·견적 빌더]]에서 템플릿을 고르면 이 모듈의 원칙이 반영된 라인 아이템·견적 요약·SOW 초안을 바로 볼 수 있습니다 (참고용)."}, {"t": "quiz", "items": [{"q": "관측 프로젝트에서 견적 초과가 반복된 단계와 권장 예비율은?", "options": ["구축 단계, 10%", "디스커버리·설계 단계, 30% 이상", "교육 단계, 5%"], "answer": 1, "why": "현행 분석·목표 설계·데이터 정의는 +10%~+213% 초과했고, 구축은 견적을 지켰습니다. 디스커버리·설계 단독 견적에는 30% 이상을 둡니다."}, {"q": "기본 공수 1,000h에 PM 15%, 예비 20%를 계산기 방식으로 적용하면 총 견적 공수는?", "options": ["1,350h", "1,380h", "1,200h"], "answer": 1, "why": "PM 150h를 먼저 더한 뒤 예비율을 곱합니다. (1,000 + 150) × 1.2 = 1,380h."}, {"q": "총 견적이 240인일이고 2 FTE를 투입할 때 고객에게 제시할 예상 기간은?", "options": ["24주", "36주", "48주"], "answer": 1, "why": "240 ÷ (2 × 5) = 24주의 순수 작업에 고객 대기 보정 ×1.5를 곱해 36주입니다."}, {"q": "고객에게 자체 미들웨어 팀이 있을 때 ERP·Vault 연동 견적의 권장 형태는?", "options": ["파트너가 전체를 직접 구축(관측 960h 초안 규모)", "요구사항·유스케이스·API 교육·매핑 검토·SIT/UAT 지원 중심의 지원형(인터페이스당 약 180h)", "연동은 견적에서 빼고 구두로만 약속"], "answer": 1, "why": "관측: 960h 구축안이 고객 미들웨어 팀을 지원하는 인터페이스당 약 180h 지원형으로 바뀌었습니다."}]}]}, {"id": "catalog", "num": "04", "group": "sell", "title": "자주 수주하는 *17가지* 프로젝트 유형", "short": "프로젝트 유형", "goal": "Fusion Manage 프로젝트 17가지 유형의 목적·라인 아이템·관측 공수·기간·함정을 알고, 신규 파트너가 처음 팔 수 있는 고정 범위 패키지를 구성할 수 있습니다.", "facts": [["학습 시간", "40분"], ["대상", "영업·PM·컨설턴트"], ["산출물", "첫 패키지 2–3개"]], "blocks": [{"t": "lead", "text": "관측 프로그램은 수십 개 프로젝트로 이루어졌지만, 유형으로 묶으면 17가지입니다. 각 유형은 **반복되는 라인 아이템, 반복되는 지연 원인, 반복되는 함정**을 가지고 있습니다. 유형을 알면 견적과 SOW의 절반은 이미 끝난 셈입니다."}, {"t": "sec", "id": "overview", "text": "한눈에 보기"}, {"t": "table", "title": "프로젝트 유형 요약", "head": ["유형", "대표 공수 범위", "관측 기간", "난이도"], "rows": [["테넌트 구축·운영 전환", "샌드박스 24–60h + 운영 전환 46–156h", "운영 전환 약 5주", "낮음"], ["설계 변경(ECR/ECO) 파일럿", "구축 180–540h, 편차 승인 포함 체인 약 1,070h", "2개 사이트 운영 전환까지 13–14개월", "중간"], ["Items & BOMs", "구축 280–760h, 평가·설계·목업 포함 약 960h", "승인된 설계까지 약 12개월", "높음"], ["편차 승인(Deviation)", "112–240h + UAT 지원 112h", "편차 UAT 계획 약 2주 → 실제 약 4주", "중간"], ["설계 변경 확장(순차 작업·다중 ECO)", "40h로 시작 → 536h", "15–20개월 이상", "높음"], ["제품 계층·분류", "60–200h", "계획 약 7주 → 약 15개월", "낮음–중간"], ["제품 포트폴리오·단종(PPM)", "160–709h", "18개월 이상", "높음"], ["공급업체 관리", "200–450h", "계획 약 6개월 → 약 17개월째 UAT", "중간"], ["품질 관리(Audit·NCR·CAPA·RMA)", "240–480h", "계획 약 5개월", "중간"], ["자산 관리(교정·예방보전) PoC", "368–800h", "계획 약 7개월 → UAT 약 11개월차", "중간–높음"], ["초기 데이터 로드", "48–200h", "mBOM 로드 약 3주", "중간"], ["Vault–Fusion Manage 연동", "40–176h", "커넥터 방식 1–5개월", "중간"], ["ERP 연동", "인터페이스당 120–264h(지원형)", "마일스톤 약 3개월, 범용 iPaaS 약 1년", "높음"], ["보고서·대시보드", "40–160h(추정)", "기록 없음", "낮음"], ["레거시 PLM 이관", "디스커버리 200–721h", "약 7.5개월에 보류", "매우 높음"], ["관리
