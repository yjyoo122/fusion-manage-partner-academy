자 교육·자립", "16–360h", "3–5개월", "낮음–중간"], ["사이트 확장(롤아웃)", "사이트당 약 1인일 + 개선 건당 7.5–10인일", "분기별 웨이브, 9개 분기 계획", "중간"]], "note": "공수는 [[estimate|03 스코핑·견적]]의 S–L 기준값, 기간은 엔터프라이즈 다사이트 관측치입니다. 난이도는 관측된 초과·지연 폭을 기준으로 한 권장 분류입니다."}, {"t": "tiles", "title": "무엇을 먼저 하나", "items": [{"tag": "1 · 기초", "title": "먼저 세우는 세 가지", "text": "모든 후속 역량이 이 위에 올라갑니다.", "items": ["테넌트 구축·운영 전환", "설계 변경(ECR/ECO) 파일럿", "Items & BOMs"]}, {"tag": "2 · 확장", "title": "프로세스 추가", "text": "기초가 운영된 뒤 하나씩 붙입니다.", "items": ["편차 승인", "설계 변경 확장", "제품 계층·PPM", "공급업체·품질·자산"]}, {"tag": "3 · 연결", "title": "연동과 데이터", "text": "파일럿 사이트에서 먼저 검증한 뒤 연결합니다.", "items": ["초기 데이터 로드", "Vault 연동", "ERP 연동", "보고서·대시보드", "레거시 PLM 이관"]}, {"tag": "4 · 자립", "title": "고객 자립과 확장", "text": "처음부터 계약에 넣어 두어야 다음 단계가 열립니다.", "items": ["관리자 교육·자립", "사이트 확장(롤아웃)"]}]}, {"t": "p", "text": "관측된 순서는 이렇습니다. 데이터 필드 소유권을 먼저 정의하고, 샌드박스에서 개발 워크스페이스를 만들고, 파일럿 사이트에서 **비연동 설계 변경**을 먼저 운영했습니다. 연동은 그 뒤에 붙였고, 운영 테넌트는 마지막에 세웠습니다. 품목 릴리스가 변경 지시(CO)로만 가능하므로 **설계 변경은 Items & BOMs보다 먼저 또는 함께** 진행합니다. 고객 우선순위도 \"Items & BOMs가 중심 → 포트폴리오 → 자산·공급업체\" 순서였습니다."}, {"t": "sec", "id": "foundation", "text": "기초 유형"}, {"t": "details", "items": [{"title": "테넌트 구축·운영 전환", "blocks": [{"t": "p", "text": "**목적** 샌드박스(개발) 테넌트를 세우고, UAT를 마친 구성을 운영 테넌트로 옮겨 운영을 시작합니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["데이터 센터(리전) 선택. 고객의 데이터 보호 요건과 맞춥니다", "테넌트명 확정(이후 변경 불가), 파트너 접근, 불필요 앱 정리·브랜딩", "UAT 후 정리: 스크립트 라이브러리 정리, 승인자 목록 통합, 번호 체계 시작값", "Autodesk 운영팀의 개발 → 운영 복제, 스모크 테스트(고객 전체 승인 시나리오 약 30분 포함)", "그룹·역할 확정, 테스트 기록 퍼지", "진행 중 변경 기록 이행, 코디네이터의 작업 템플릿·사이트 승인자 설정", "운영 테넌트에서 컨설턴트 계정 비활성화"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "테넌트 설정 기록, 스모크 테스트 결과, 운영 전환 체크리스트, 구성(as-built) 문서"], ["관측 공수", "샌드박스 견적 40h(실적 58h), 샌드박스 내 개발 워크스페이스 88h, 파일럿 운영 전환 46h. 진행 중 기록 이행까지 넣은 작업표 78h → 명시 합계 156h(19.5인일). UAT 후 정리 16h, 운영 전환 지원 16h"], ["관측 기간", "운영 전환 약 5주(1주차 정리, 2주차 복제·스모크, 3주차 그룹·교육, 4–5주차 이행·코디네이터 설정). 이후 개발 → 운영 반영은 업무 외 시간 약 2일 + 운영 확인 테스트 약 2주"], ["필요한 역할", "PM, 구현 컨설턴트, 고객 측 관리자, 코디네이터, Autodesk 운영팀(복제)"], ["선행 조건·의존성", "UAT 완료, 운영 사이트·사용자·코디네이터·승인자 목록 서면 확정, 개발 테넌트와 같은 데이터 센터"]]}, {"t": "list", "title": "흔한 함정", "items": ["파일럿 범위 모호: 제3 사이트 포함 여부가 운영 전환 며칠 전에 뒤집혔고 사용자도 미등록이었습니다. 운영 전에 서면으로 확정합니다.", "개발에서 통과한 기능이 운영에서만 실패했습니다. 운영 재테스트는 필수이며, 핵심 템플릿·승인 목록·핵심 시나리오 1–2개의 1일 집중 점검으로 줄일 수 있습니다.", "추가 샌드박스는 비표준·유상입니다. 테넌트 수와 종류를 계약 단계에서 확인합니다.", "실데이터 테스트를 위해 호스팅 리전을 옮겨야 했던 사례가 있습니다. 리전은 첫날 결정합니다."]}]}, {"title": "설계 변경(ECR/ECO) 파일럿", "blocks": [{"t": "p", "text": "**목적** 서식·엑셀 기반 ECR/ECO를 Fusion Manage 워크플로로 대체합니다. 1단계는 ERP·PDM 연동 없이(비연동) 운영하고 임시 품목 워크스페이스를 씁니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["현행 분석: 변경 SOP, 신규 품번 흐름, 상태 변경 서식 수집, 녹화 워크숍", "목표 설계(120h): 팀·그룹·승인 템플릿, CR·CO 필드와 워크플로, 체크리스트 → 작업 매핑", "상세 계획(40h): 프로젝트 종료까지의 회의 체계 포함", "구축(360h): 변경 워크스페이스 6개 + 참조 워크스페이스 2개, 워크플로, 작업, 스크립트", "UAT 지원(128h): 스크립트 지원, 3단계 교육 자료, 테스터 교육 2h × 2회 × 2트랙, 1라운드(최대 2일), 결함 수정 최대 5일", "UAT 후 정리(16h) → 운영 테넌트 전환(46h) → 운영 전환 지원(16h)"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "현행·목표 설계서, 구성 문서, UAT 스크립트 18개, 3단계 교육 자료(일반·고급·관리자), 진행 중 기록 가져오기 템플릿"], ["관측 공수", "편차 승인 포함 체인 합계 약 1,070h + 현행 분석. 구축 견적 384h → 실적 385h, 목표 설계 120h → 129h"], ["관측 기간", "현행 분석부터 2개 사이트 파일럿 운영 전환까지 약 13–14개월. UAT 18/18 통과 약 10개월차"], ["필요한 역할", "PM, 비즈니스 컨설턴트(변경 관리 리드·스크립트), 구현 컨설턴트. 고객: 변경 코디네이터, 사이트 키유저, CCB, 관리자 팀"], ["선행 조건·의존성", "사이트별 승인자 목록, 번호 체계 결정, 운영 테넌트. Items & BOMs와는 릴리스로 연결되므로 함께 계획"]]}, {"t": "list", "title": "흔한 함정", "items": ["UAT 중 워크스페이스·스크립트를 바꿔 기존 테스트 기록의 링크가 끊겼습니다. UAT 동안 구성을 동결합니다.", "그룹에 속하지 않은 사용자는 알림과 작업 목록을 받지 못했습니다. 그룹 배정을 UAT 전 점검 항목에 넣습니다.", "표준 변경 템플릿이 남기는 공백 3가지를 디스커버리에서 먼저 묻습니다: 단일 변경 대장, 사이트당 다중 승인 위원회, 승인 전 작업 목록 검토.", "운영 전환 후 약 11개월 동안 변경 요청이 약 130건 들어왔고 약 10건 중 1건이 CCB에서 반려되었습니다. 운영 지원 계약을 함께 제안합니다([[support|12 지원·유지보수]])."]}]}, {"title": "Items & BOMs(마스터/브랜치, eBOM → mBOM, 웹 앱)", "blocks": [{"t": "p", "text": "**목적** 중앙 품목·BOM 레지스터를 만듭니다. 마스터 품목에 eBOM, 사이트별 브랜치 품목에 mBOM을 두고, 변경 지시를 통해서만 릴리스하며, ERP에는 브랜치 데이터만 보냅니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["착수 → 평가 워크숍(2h × 7회, 또는 현장 2일 + 원격 2h 세션)", "데이터 정규화와 품목 속성 매트릭스 → 현행 문서 승인", "설계 리뷰: 제조 품목, 구매 품목, 최상위 제품 정보, eBOM에서 mBOM 생성, 신규 품목 워크플로", "비즈니스용 Future State + 구성 수준 To-Be 사양(테넌트 HTML 구성 내보내기 첨부) 승인", "목업(마스터 → 브랜치 복사, 42h)으로 어려운 개념을 먼저 시연", "구축: 주요 워크스페이스 2개 + 참조 2–6개, 웹 앱 2종(마스터 → 브랜치 복사, mBOM 편집기)", "검증 2라운드 → UAT 전 점검 → 테스터 교육(트랙당 2h × 2회)", "UAT 단계: 품목 데이터 로드 → 설계 변경 → ERP 연동 → Vault 연동. 단계별 결함 수정 최대 5일", "사이트(브랜치)별 운영 전환: 읽기 전용 로드 먼저, 연동 전환 후 편집 권한"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "현행 문서, Future State, To-Be 구성 사양, 구성(as-built) 문서, 웹 앱과 설치 가이드, ERP 필드 매핑 워크북, UAT 이슈 로그"], ["관측 공수", "평가 244h(실적 277.75h), 목표 설계 40h → 125.25h, 목업 42h, 구축 552h(69인일). 확장 사이트 UAT·운영 반영 256h. 파일럿 잔여 UAT 145h → 확장 포함 664h"], ["관측 기간", "승인된 설계까지 약 12개월(계획 대비 약 3개월 지연), UAT 준비 약 21개월, 1단계 종료 약 25개월. 확장 단계의 첫 사이트 운영 전환은 10개월 넘게 지연"], ["필요한 역할", "구현 컨설턴트(아키텍트), 비즈니스 컨설턴트(웹 앱 설계·스크립트), 웹 개발자. 고객: 마스터 데이터 팀, ERP 팀, 연동 팀, 키유저(주당 약 20%)"], ["선행 조건·의존성", "설계 변경(릴리스 경로), 품번 체계 결정, 데이터 로드 도구, ERP·Vault 연동 일정"]]}, {"t": "list", "title": "흔한 함정", "items": ["웹 앱이 UAT의 임계 경로가 되었습니다. 소스 코드 라이선스, 보안 검토(권고 조치 13개, 개발·테스트 약 31h), 개발자 가용성이 UAT를 멈췄습니다. 착수 전에 라이선스·호스팅·보안·지원 주체를 합의합니다.", "품번 체계가 정해지지 않아 자동 채번을 못 했습니다. 디스커버리 산출물로 확정합니다.", "파일럿 사이트가 폐쇄되어 약 16개월차에 파일럿을 바꿨습니다. 파일럿 사이트 선정 기준을 문서로 남깁니다.", "ERP 측이 별도 인터페이스 버전을 만들면서 연동 재작업이 2–4주 생겼습니다. 미성숙 구성 요소는 UAT 1라운드에서 제외합니다."]}]}]}, {"t": "sec", "id": "process", "text": "프로세스 확장 유형"}, {"t": "details", "items": [{"title": "편차 승인(Deviation)", "blocks": [{"t": "p", "text": "**목적** 기간을 정한 임시 변경(편차)을 승인하고, 만료 전 알림·자동 만료·갱신을 관리합니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["기본 워크스페이스 구성", "작업 자동화: 설계 권한·영향 사이트 코디네이터별 조정 작업 자동 생성", "워크플로 자동화: 만료 1주 전 경고, 자동 만료", "갱신 워크플로: 재승인과 갱신 횟수 기록", "편차에서 CR 생성(사유 필수, 양방향 연결)", "UAT 지원: 교육 자료(약 2주), 테스터 교육 1 × 2h, 1라운드 최대 3일, 결함 수정 최대 2일"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "구성, 편차 UAT 교육 자료(발표자 노트 포함), UAT 스크립트"], ["관측 공수", "구축 228h(실적 220h, 당일 승인), UAT 지원 112h. UAT 지원 블록만 따로 보면 약 14인일"], ["관측 기간", "설계 변경 파일럿 약 12개월차에 편차 UAT. 새 사이트 편차 UAT는 계획 약 2주 → 실제 약 4주"], ["필요한 역할", "비즈니스 컨설턴트. 고객: 코디네이터, 설계 권한 담당, 승인자"], ["선행 조건·의존성", "CR 워크스페이스(편차 → CR), 승인자 목록. ERP 연동이 없으면 수동 \"ERP 품목 차단\" 단계로 대체"]]}, {"t": "list", "title": "흔한 함정", "items": ["승인자 목록이 없어 편차 UAT가 늦어졌습니다. 승인자 목록을 선행 조건으로 적습니다.", "다른 컨설턴트의 요구사항으로 구축하면 UAT 전에 테스터와 불일치를 먼저 확인합니다.", "생산 라인용 출력물을 종이 서식처럼 맞추려면 인쇄 뷰 재작업이 필요했습니다. 출력 양식 요구를 범위에 명시합니다.", "운영 중인 ECR/ECO 코드와 편차 코드는 편차 UAT 전에 병합해야 재테스트를 피합니다."]}]}, {"title": "설계 변경 확장(순차 작업·ECR당 다중 ECO)", "blocks": [{"t": "p", "text": "**목적** 운영 중인 ECR/ECO·편차 솔루션을 확장해, 작업을 순서대로 내보내던 새 공장도 채택할 수 있게 합니다. 순차 작업, ECR당 다중 ECO, 단계별 승인이 핵심입니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["현행 문제 정리: 작업 일괄 생성으로 알림 폭주, 작업 순서 없음, ECO 기한 오류, 필수 템플릿 작업 삭제", "현장 방문 워크숍(48h)", "목표 설계 갱신(v1 → v7, 공식 승인까지 약 12개월)", "구성: 순차 작업 라이브러리 스크립트, 다중 ECO, 단계별 승인", "교육 자료 지원 최대 4h, UAT 결함 수정 최대 16h, 운영 전환 지원 최대 8h, 종료", "기능별 스프린트: 목표 프로세스 → 구현 → 교육 → 개발 UAT → 운영 준비 → 운영 전환 → 하이퍼케어(약 3개월)"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "목표 설계 v1–v7, 구현 트래커, 기능 맵, 빠른 시작 매뉴얼(최대 10장), 종료 자료"], ["관측 공수", "\"시작할 수 있게\" 40h로 출발 → 536h(13×). 순차 작업·다중 ECO만 +288h"], ["관측 기간", "기존 사이트 운영까지 약 15개월, 새 사이트 20개월 이상. 키유저 UAT 계획 2–3주 → 약 7주, 운영 UAT 1주 계획 → 운영 전용 결함으로 약 3주"], ["필요한 역할", "비즈니스 컨설턴트, 구현 컨설턴트. 고객: 사이트 변경 리드, 키유저, 공장 경영진(운영 전환 승인), 고객 관리자"], ["선행 조건·의존성", "운영 중인 설계 변경 솔루션, 새 사이트의 작업 템플릿·승인 목록 준비(고객 몫)"]]}, {"t": "list", "title": "흔한 함정", "items": ["목표 설계 v6에서 다중 ECO가 범위에 추가되었습니다. 승인된 목표 설계를 동결하고, 이후 차이는 구성 문서에 기록합니다.", "그리드 행 삭제는 권한으로 막을 수 없습니다. 순서 중간 작업이 삭제되어 기록이 멈췄습니다. 취소 상태·템플릿 복원 기능·교육으로 대비합니다.", "공장 경영진의 운영 전환 승인이 4번 미뤄졌습니다. \"기한 내 무응답 시 승인 간주\" 같은 규칙을 미리 합의합니다.", "작게 시작한 견적이 13배가 되었습니다. 디스커버리를 고정 범위로 먼저 팔고 구축은 재견적합니다([[estimate|03 스코핑·견적]])."]}]}, {"title": "제품 계층·분류", "blocks": [{"t": "p", "text": "**목적** 흩어진 엑셀 분류 대장(약 30만 개 이상의 코드)을 승인·소유권이 있는 Fusion Manage 워크스페이스로 대체합니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["착수: 이해관계자, 역할, 선행 조건, 일정, 커뮤니케이션", "정렬 워크숍: 목표 설계 정렬, 워크플로 정의, 목표 설계 갱신", "구현: 입력 데이터 검토, 구성, 계층 임포트, 검증·테스트, 관리자 지식 이전, 테스트 스크립트 작성 지원", "UAT: 고객 수행, 결함 수정 최대 1일", "운영 전환 → 하이퍼케어 2주 → 종료(성과, 성공 기준, 다음 단계)"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "목표 설계, 임포트 파일, 역할별 교육(작성자 약 32명, 조회자 약 95명), 종료 자료"], ["관측 공수", "62h → 133.5h(2.15×). 고객의 테스트 연장으로 +57h"], ["관측 기간", "계획 약 7주 → 착수에서 종료까지 약 15개월"], ["필요한 역할", "구현 컨설턴트. 고객: 제품 관리자(작성자), 관리자, 데이터 소유자"], ["선행 조건·의존성", "분류 체계 확정, 고객의 데이터 로드. 제품·품목에 코드를 붙이는 작업은 범위 밖"]]}, {"t": "list", "title": "흔한 함정", "items": ["9단계 계층에서 기존 5자리 코드 체계로 설계가 바뀌었습니다. 체계 결정을 착수 조건으로 둡니다.", "단일 워크스페이스의 중복 통제 한계 때문에 워크스페이스 2개 구조로 바꿔야 했습니다.", "임포트 파일은 7회 이상 정제를 거쳤고 크기 때문에 7개로 나눴습니다. 정제 반복 횟수를 상한으로 적습니다.", "운영 후 고객의 일괄 소유자 변경이 카테고리를 손상시켜 퍼지·재로드가 필요했습니다. 일괄 작업 전에는 내보내기·사본 테스트를 합니다. 한 주의 마지막 날에는 운영 전환하지 않습니다."]}]}, {"title": "제품 포트폴리오·단종 관리(PPM·Obsolescence)", "blocks": [{"t": "p", "text": "**목적** 포트폴리오·섹터·라인·제품 구조를 품목과 연결하고 라이프사이클·마일스톤·KPI를 관리합니다. 단종은 요청 → 단종 건 → ECR/ECO의 표준 흐름으로 처리합니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["목표 설계·계획(80h)", "제품군(50h) → 제품(80h) 워크스페이스", "단종(109h): 순차 작업, 단계별 승인, 단종에서 ECR 생성", "PPM(160h): 유스케이스 13개(생성, 분류, 변형, 마일스톤, 라이프사이클, ECR/ECO로 은퇴, KPI 모니터링, 포트폴리오 균형)", "분류 속성 보강·데이터 이관·제품 구조(+40h)", "스프린트 7개: 구조 기반 → 레인지 속성 → SKU 연결 → KPI → 포트폴리오 리뷰 → 투자 히트맵 → 분류·변형 분석"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "목표 설계, 유스케이스, 스프린트 백로그(약 55개 작업), 구성"], ["관측 공수", "80h → 709h(8.9×). 개정 중 PM의 사용 시간 누락 정정 +150h 포함"], ["관측 기간", "약 20개월에 걸쳐 증가. PPM은 18개월 이상 진행 중에도 1·2단계 범위 미확정, 단종의 실제 작업은 약 10개월"], ["필요한 역할", "수석 구현 컨설턴트, 비즈니스 컨설턴트. 고객: 제품 관리자, S&OP·수요 계획 담당, IT 리드"], ["선행 조건·의존성", "제품 계층·분류, Items & BOMs(SKU 연결), 설계 변경(단종 → ECR)"]]}, {"t": "list", "title": "흔한 함정", "items": ["속성과 유스케이스가 확정되지 않은 상태에서 +160h가 승인되었습니다. 미확정 항목이 있으면 그 부분은 범위(밴드)로만 제시합니다.", "설계 회의에서 \"매출·마진 KPI는 PLM에 두지 않는다\"고 결론 났지만 KPI 스프린트가 남아 있었습니다. KPI 위치를 착수 때 결정합니다.", "넓은 대상 교육을 UAT 전에 해서 혼란이 생겼습니다. 핵심 제품 관리자 UAT를 먼저 하고 지역별로 넓힙니다.", "작은 건에는 단종 프로세스가 너무 복잡하다는 사용자 반발이 나왔습니다. 간이 경로를 설계에 넣습니다(권장)."]}]}, {"title": "공급업체 관리", "blocks": [{"t": "p", "text": "**목적** Phase 0에서 공급업체 온보딩, 승인 공급업체 목록·성과, 공급업체 품번을 다룹니다. 관측 고객에서는 Items & BOMs 운영 전환의 선행 조건이었습니다. 소싱·선정, 감사·컴플라이언스, 포털은 후속 단계입니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["착수 → 현장 정렬 워크숍", "현행·목표 설계(Phase 0: 글로벌 공급업체, 로컬 공급업체, 구매 품번 워크스페이스 + 품목 관계)", "구현·테스트", "UAT: 결함 수정 최대 1일", "종료. 1단계 견적은 별도"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "목표 설계 V1·V2, 공급업체 워크스페이스와 품목 관계, UAT 스크립트 검토 의견"], ["관측 공수", "초안 80h → 200h → 최종 327.5h. 새 핵심 팀으로 재착수 +80h. Phase 0 재범위 전 280h 중 231.5h 소진. Phase 0 분해: 요구사항 16h, 목표 설계 갱신 16h(실적 31.5h), 구현 26h, 교육 지원 4h, UAT 지원 6h, 운영 후 지원 4h, 종료 4h"], ["관측 기간", "계획 약 6개월 → 약 17개월째 UAT"], ["필요한 역할", "구현 컨설턴트. 고객: 구매·공급업체 개발, 관리자(직접 구성, 파트너는 자문), 교육 자료 작성 협력사"], ["선행 조건·의존성", "Items & BOMs 브랜치 품목. 공급업체 마스터 데이터 이관과 ERP 동기화는 고객 몫으로 범위 밖"]]}, {"t": "list", "title": "흔한 함정", "items": ["현장 워크숍 뒤 고객이 소싱·선정·감사까지 범위를 넓혔고, 결국 Phase 0 MVP로 줄였습니다. 운영 전환 필수 범위를 서면으로 먼저 정합니다.", "목표 설계에 비즈니스 검토자가 없어 컨설턴트 혼자 설계했습니다. 이름이 있는 비즈니스 검토자를 착수 조건으로 둡니다.", "남은 시간에 맞추려고 운영 후 지원 4h를 뺐습니다. 지원 시간은 처음부터 별도 라인 아이템으로 보호합니다.", "UAT 스크립트 3–4개를 하나의 종단 흐름(브랜치 품목 → 공급업체 생성 → 공급업체 요청 → 구매 품번)으로 합치도록 권고했습니다."]}]}, {"title": "품질 관리(Audit·NCR·CAPA·RMA)", "blocks": [{"t": "p", "text": "**목적** Audit, NCR, CAPA, RMA(필요 시 8D 보고서·클레임) 워크스페이스를 구성하고 품목·자산·공급업체·설계 변경과 연결합니다. 교육자 교육(train-the-trainer) 방식으로 진행합니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["착수 전 솔루션 워크스루(60분): 표준(OOTB) 시연, 범위 경계, 바꿀 수 있는 것/없는 것", "착수 → 워크숍 → 목표 설계", "구성: 품질 워크스페이스, 품질 템플릿, 품질 보고, 권한 개념", "교육·UAT: 관리자·키유저 교육, UAT 지원", "종료"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "목표 설계, 구성, 품질 보고서, 관리자·키유저 교육 자료"], ["관측 공수", "336h(42인일) 견적, \"목표 설계 승인 후 변경 가능\" 조건. 가치 목표는 운영 효율 약 20% 개선"], ["관측 기간", "계획 약 5개월(착수 → 워크숍 → 목표 설계 → 구성 → 교육·UAT → 종료)"], ["필요한 역할", "구현 컨설턴트. 고객: 품질 관리자·엔지니어, QMS에 익숙한 사이트 챔피언"], ["선행 조건·의존성", "파일럿 사이트 2곳 확정, 사이트 리더 지원, 품질 모듈을 1–3단계로 우선순위화(\"한 번에 다 만들 수 없음\")"]]}, {"t": "list", "title": "흔한 함정", "items": ["다른 고객 사례: 품질 워크플로를 커스터마이징하다 정체되어 OOTB로 되돌아갔습니다. 기존 상태·전환·필드·자동화를 그대로 쓰고 OOTB로 교육합니다.", "스크립트가 ID가 아닌 상태 이름을 쓰면 상태명 변경 비용이 커집니다.", "레거시 기록 이관, 비 Autodesk 시스템 연동, 이력 데이터 정리, 품목·BOM 재설계, 최종 사용자 교육은 범위 밖으로 명시합니다.", "품질 SOP 갱신과 규제 준수 검증은 고객 책임으로 적습니다."]}]}, {"title": "자산 관리(설비·교정·예방보전) PoC", "blocks": [{"t": "p", "text": "**목적** 제조에 필요한 자산(건물부터 공구·게이지까지)을 관리합니다. 자산을 생산 품목과 연결하고, 감사용 점검·교정 기록을 남기고, 정비·교정 일정을 강제합니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["착수 준비 → 착수 → 워크숍 준비", "현장 2일 워크숍: 1일차 현행·문제점, OOTB 워크스페이스 시연과 갭 / 2일차 목표 초안, 합의", "현행 분석·문서 → 목표 정의·문서 → 고객 승인", "PoC 구현(개발 테넌트) → 테스트·조정 → 고객 승인", "UAT: 결함 수정 최대 2일", "종료. 운영 롤아웃과 ERP 연동은 범위 밖"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "현행·목표 문서, 테스트 스크립트, 관리자 구성 가이드"], ["관측 공수", "368h → 610h(1.66×). 목표 설계 후 자동화 스크립트 11개 포함 +182h(7개는 제외), UAT·스크립트 +36h, 10% 버퍼로 알림 변경·UAT 2주 연장 +24h"], ["관측 기간", "계획 약 7개월 → 고객 시스템 테스트·UAT가 약 11개월차에 시작(추정)"], ["필요한 역할", "17주 동안 구현 컨설턴트 주 2–16h, 솔루션 아키텍트 주 약 8h, 비즈니스 컨설턴트 주 2–7h. 고객: 설비·품질 담당, 관리자"], ["선행 조건·의존성", "자산 구조 RFI(영역, 건물, 설비, 공구, 작업장, 라인, 서비스 요청). 품목·변경과의 연결은 2단계"]]}, {"t": "list", "title": "흔한 함정", "items": ["자동화 스크립트 범위가 공수를 결정합니다. 포함 스크립트와 제외 스크립트를 이름으로 나열합니다(관측: 일정 계산, 정기 교정·예방보전 생성, 합부 판정, 알림 라우팅 등 11개 포함).", "공장마다 프로세스·데이터가 달랐습니다. 소규모 글로벌 표준화 그룹을 둡니다.", "기존 자산 데이터가 부족했습니다. 인터뷰와 표준 수집 템플릿으로 보완합니다.", "고객이 교육 가이드·테스트 스크립트를 쓰려고 워크스페이스 인수 시점을 물었습니다. 인수 일정을 계획에 명시합니다."]}]}]}, {"t": "sec", "id": "connect", "text": "연동·데이터 유형"}, {"t": "details", "items": [{"title": "초기 데이터 로드(마스터·BOM)", "blocks": [{"t": "p", "text": "**목적** 품목 마스터와 BOM을 초기·갱신 로드합니다. 사이트 필터로 연동이 관리하는 데이터를 덮어쓰지 않게 하고, 소스로 역반영하지 않습니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["현행 분석(80h): 정렬·착수, 역량 소개, 요구 검증, 갭 분석, 결과·옵션", "상세 계획(60h)", "데이터 필드 매트릭스: ERP·Vault·PLM 간 필드 소유권", "동기화 도구(48h): 사전 구성 도구, 구성 워크숍, 교육(운영·문제 해결·감사), 필드 추가 시나리오, 지원 최대 1일", "시험 로드 → 검증 → 사이트별 읽기 전용 로드"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "데이터 구조·소스 문서, 필드 소유권 매트릭스, 가져오기 템플릿, 동기화 도구 운영 가이드"], ["관측 공수", "현행 80h(실적 89.5h), 계획 60h, 필드 매트릭스 32h → 68h, 동기화 도구 48h. 하청 개발 고정 풀 200h 중 163h 사용"], ["관측 기간", "mBOM 로드 약 3주. 도구 인수인계는 Items & BOMs 구축 약 7개월차"], ["필요한 역할", "데이터 컨설턴트, 도구 개발자. 고객: 글로벌 데이터 관리 팀, ERP 추출 담당, 관리자"], ["선행 조건·의존성", "로드 기간 동안 소스 안정, 추출 형식 통일, 대상 정의 동결, 속성 매핑 승인·테스트 완료, 업로드 일정 확정"]]}, {"t": "list", "title": "흔한 함정", "items": ["임포트 때도 스크립트가 실행됩니다. 일괄 작업 전에는 내보내기·스냅샷을 만들고 사본에서 먼저 테스트합니다.", "매치 키의 공백이 거의 같은 중복 레코드를 만들었고, 코드의 앞자리 0이 사라졌습니다. 소스 추출 단계에서 정리합니다.", "ERP 추출값이 100배로 저장된 사례가 있었습니다. 스크립트가 아니라 추출 쿼리에서 고칩니다.", "한 번에 만들고 고치는 건수를 보수적으로 제한합니다(예: 1,000건). 동기화에 기본값을 넣으면 사용자 편집을 덮어씁니다.", "운영 시험 로드(마스터 약 3.6천 건, 브랜치 약 3.6천 건)에서 약 300건에 소유권·권한 키가 없었습니다. 필수 필드 검증을 로드 전에 합니다."]}]}, {"title": "Vault–Fusion Manage 연동", "blocks": [{"t": "p", "text": "**목적** Vault(파일)와 Fusion Manage(기록)를 연결합니다. 푸시·풀 방향, 클라우드용 중립 뷰어 형식, 품번 소유권을 아키텍처 결정으로 다룹니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["연동 방향과 품번 소유권 결정(\"PLM에서 먼저 생성\" 규칙 등)", "Vault 서버·커넥터 버전 확인과 필요 시 업그레이드 전략", "Vault 속성 처리 분류: 필드 매핑 / 조사용 참고 / 권한용 / 불필요", "표준 커넥터 구성(Vault → Fusion Manage)", "필요 시 Fusion Manage → Vault 생성 버튼·웹훅(별도 범위)", "기능 테스트 → UAT → 문서-품목 수동 연결 교육"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "속성 처리 목록, 연동 구성, UAT 스크립트, 사용자 교육 자료"], ["관측 공수", "커넥터 방식 운영 전환까지 5–15일. 고객 미들웨어 구축 지원 176h, Vault 프록시 80h, 옵션별 견적 최대 20인일. 파트너 구축형 960h 초안은 폐기"], ["관측 기간", "커넥터 방식 프로젝트 1–5개월. 범용 iPaaS는 운영 전환까지 35–82일, 프로젝트 약 1년. Vault 버전 문제로 운영 목표가 수개월 밀린 사례"], ["필요한 역할", "솔루션 아키텍트, Vault 전문가. 고객: Vault 관리자, 인프라 담당"], ["선행 조건·의존성", "Vault 버전, 품번 규칙(25자 이하, 양쪽 동일 형식), Items & BOMs 품목 워크스페이스"]]}, {"t": "list", "title": "흔한 함정", "items": ["Vault 버전이 낮아 커넥터를 쓸 수 없었고 서버 업그레이드가 먼저 필요했습니다. 스코핑 때 버전을 확인합니다.", "커넥터 다음 릴리스가 라이프사이클 상태 동기화를 지원하지 않아 프록시 개선을 요청했다가 취소했습니다. 제품 공백은 견적 전에 확인합니다.", "문서를 품목에 수동으로 연결하는 방식은 엔지니어 부담으로 리스크에 올랐습니다. 사용자 교육과 작업 시간을 함께 견적합니다."]}]}, {"title": "ERP 연동", "blocks": [{"t": "p", "text": "**목적** Fusion Manage(품목 마스터)와 ERP 간 품목·BOM·변경 데이터를 연동합니다. 권장 모델은 **고객 미들웨어 팀이 구축하고 파트너는 정의·교육·지원**을 맡는 지원형입니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["연동 현행 분석(80h) → 연동 목표 설계(80h)", "옵션별 공수 비교와 권고안 1개", "요구사항 검토·문서화, 유스케이스(양방향 트리거·필드)", "마스터 속성 목록(속성 매핑) 검토. 복잡한 매핑은 \"맵당 2일 안팎 + 재작업\"", "Fusion Manage REST API 교육과 지원, 격주 연동 회의", "SIT·UAT 지원, 필요 시 프록시 개발"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "현재·미래 상태 연동 문서, 마스터 속성 목록, 유스케이스 문서, SIT·UAT 보고서(고객 승인), 프록시(PoC)"], ["관측 공수", "지원형 인터페이스당 176–184h, 프록시 포함 104h → 264h(2.5×), 연동 풀 400h. 시스템당 정의 자문 9–14인일. 전체 구축 145인일 견적을 약 50인일 지원형으로 재범위"], ["관측 기간", "\"연동 준비 완료\"부터 종료까지 약 3개월 마일스톤. 연동 계정용 ERP 변경 요청 승인 약 1주, 결함 지원 창 약 3주"], ["필요한 역할", "연동 SME, API 전문가, 솔루션 아키텍트. 고객: 미들웨어 팀, ERP 기술 팀, 데이터 플랫폼 팀"], ["선행 조건·의존성", "품목 마스터 시스템 결정, 필드 소유권 매트릭스, 서면 ERP 로드맵, ERP 팀 시간 확보"]]}, {"t": "list", "title": "흔한 함정", "items": ["프록시와 미들웨어가 서로 오류를 처리하며 덮어썼습니다. 프록시는 페이로드로 오류를 돌려주고 미들웨어가 처리하도록 정합니다.", "mBOM 재전송이 ERP에 중복 행을 만들었고, BOM 없이 보낸 ECO가 혼합 BOM을 만들었습니다. 변경 위원회 전에 미릴리스 하위 품목을 검증합니다.", "작업 번호 형식이 서로 달랐습니다(5자리 선언 vs ERP 3자리). 매핑 단계에서 형식까지 맞춥니다.", "고객 예산 승인과 ERP 팀 가용성이 가장 잦은 지연 원인이었습니다. 고객 테스트 주간을 계약 전제로 적습니다."]}]}, {"title": "보고서·대시보드", "blocks": [{"t": "p", "text": "**목적** 경영진이 가치를 볼 수 있는 샘플 보고서·대시보드를 만들고, 고객 팀이 추가 보고서를 직접 만들 수 있게 합니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["현행 분석(80h): 고객의 기존 월간 변경 보고서 등 현행 보고서 수집", "0단계: 프로세스 영역별(변경, 품질, 설계, 제품) 기본 대시보드·보고서", "1단계: 파생 필드·관계·스크립트로 채우는 보고 워크스페이스(\"워크스페이스 1개, 보고서 N개\")", "2단계: 보고서 정의 → 추출·변환 → 고객 데이터 웨어하우스 적재 → 추출 일정 → BI 도구 연결", "보고서 빌더 기본 교육"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "보고 요구 목록, 샘플 대시보드·보고서, 보고 데이터 모델"], ["관측 공수", "현행 분석 80h(실적 76.5h). 구축 공수 기록 없음. 다른 견적에서는 \"최대 5개 대시보드\"가 견적 중 45 → 2 → 10인일로 크게 흔들림"], ["관측 기간", "기록 없음. 전담 보고 컨설턴트는 약 8개월차에 투입"], ["필요한 역할", "보고 컨설턴트. 고객: BI·데이터 팀, 경영 보고 담당"], ["선행 조건·의존성", "보고 요구를 첫날부터 데이터 모델에 반영, 자유 텍스트 대신 피크리스트"]]}, {"t": "list", "title": "흔한 함정", "items": ["기본 보고서는 단일 워크스페이스 기준이고 상태별 체류 시간을 추적하지 못합니다. 타임스탬프 필드를 스크립트로 남깁니다.", "기본 보고서 교육용 추가 시간 승인을 기다리느라 보고 워크스트림이 멈췄습니다. 교육을 처음부터 범위에 넣습니다.", "개인별 처리 시간 순위 같은 지표는 노사 협의 대상이 될 수 있습니다. 공정·팀·사이트 수준 집계로 설계합니다."]}]}, {"title": "레거시 PLM 이관", "blocks": [{"t": "p", "text": "**목적** 레거시 PLM을 퇴역하고, 그룹 표준 Items & BOMs + 설계 변경 솔루션으로 사이트를 옮깁니다. 관측 사례에서는 단계적 전환이 불가능한 전면 전환이었습니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["현장 현행 워크숍(두 공장)", "7개 범주 갭 분석(현재 상태 → 갭 → 해결 방안)", "8개 영역 목표 설계와 우선순위 1–5(연동이 1순위)", "필드 정의 세션: 녹화 약 1h × 4회, 2주. 세션마다 요약과 고객 숙제", "이관 옵션·상세 계획 → 목표 설계 후 샌드박스 구성", "재견적: 연동, UAT, 운영 전환, 하이퍼케어"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "갭 분석(문서·자료), 목표 설계 v1–v3, 마스터 속성 목록, 공수·RACI 워크북, 세션 요약"], ["관측 공수", "견적 416h 중 약 60%를 디스커버리·현행·목표 설계에서 사용. 재견적 721h(+73%), 추가 645h는 별도 요청으로 분리. 297h 사용 후 보류, 미사용 시간 반환"], ["관측 기간", "계획 약 6개월 → 약 7.5개월째 보류(1년 이상). 3개 사이트 리더의 목표 설계 승인 약 5개월"], ["필요한 역할", "솔루션 아키텍트, 비즈니스 컨설턴트. 고객: 사이트 리더, ERP 리드, 키유저, 관리자"], ["선행 조건·의존성", "서면 24개월 ERP·미들웨어·레거시 지원 로드맵, 이름이 있는 고객 연동 리드, 해당 ERP 버전용 커넥터 유무"]]}, {"t": "list", "title": "흔한 함정", "items": ["ERP 업그레이드 로드맵(약 9개월 + 12–15개월)이 5개월차에야 드러나 보류되었습니다. 로드맵을 견적 전에 받습니다.", "\"모든 레거시 프로세스를 찾아라\"는 요구가 범위를 계속 넓혔습니다. 새로 나온 필수 항목은 별도 범위 변경서로 뺍니다.", "Fusion Manage 자동 개정은 Z 다음 AA로 가지만 기존 ERP는 A1형만 받았습니다. 개정 체계 제약을 디스커버리에서 확인합니다.", "레거시 관리 콘솔은 VM 1대에서 동시 1–2명만 접속할 수 있었습니다. 접근 제약을 일정에 반영합니다."]}]}]}, {"t": "sec", "id": "scale", "text": "자립·확장 유형"}, {"t": "details", "items": [{"title": "관리자 교육·자립", "blocks": [{"t": "p", "text": "**목적** 고객 관리자가 **운영 자립(1단계) → 개발 자립(2단계)** 순서로 파트너 없이 운영하게 합니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["사전 자기주도 과정(약 1.5h, 관리자 기본)을 고객이 먼저 이수", "관리자 교육(최대 1일) + 워크스페이스 비교 도구 인수(1.5–2h)", "신규 기능 브리핑(정기)", "커스텀 도구 인수: 사용자 접근 자동화, 데이터 동기화 도구", "1단계: 실제 퍼지·재로드 중 실습, 실행·모니터링·문제 해결, 감사 출력 해석", "2단계: 빌드·테스트 주기, 통제된 저위험 변경. 1단계 후 공동 평가"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "관리자 가이드, 런북, 녹화 세션, 소유권·거버넌스 모델(\"저위험 변경\" 정의 포함)"], ["관측 공수", "신규 기능 브리핑 16h. 사용자 접근 도구 80h(+개선 24h). 동기화 도구 자립 80h(자립 8일 + 개선 2일). 관리자 도구 포함 360h. 슈퍼 관리자 6–8명 약 45일 계획"], ["관측 기간", "동기화 도구 자립 약 3–4개월. 사용자 접근 도구는 계획 약 6주 → 실제 약 5개월"], ["필요한 역할", "구현 컨설턴트, 도구 원작성자. 고객: 관리자 팀"], ["선행 조건·의존성", "커스텀 도구의 소스 코드 라이선스, 도구 문서, 관리자 지정"]]}, {"t": "list", "title": "흔한 함정", "items": ["스크립트는 하루 안에 가르칠 수 없다는 이유로 관리자 교육에서 빠졌습니다. 스크립트 교육은 별도 트랙으로 둡니다.", "제3자 도구 작성자가 단일 실패 지점이 되었습니다. 교육·라이선스·단순화로 대비합니다.", "커스텀 도구는 Autodesk 지원 대상이 아닙니다. 인수 후 지원 주체를 계약에 적습니다([[training|11 교육 설계]])."]}]}, {"title": "사이트 확장(롤아웃)", "blocks": [{"t": "p", "text": "**목적** 파일럿에서 검증한 솔루션을 추가 사이트로 넓힙니다. 파일럿 사이트가 다음 사이트를 교육합니다."}, {"t": "list", "title": "대표 라인 아이템", "ordered": true, "items": ["사이트별 현장 요구 파악(0.5일) + 평가(0.5일)", "상한을 둔 개선(롤아웃 범위당 최대 2건 또는 4건)", "키유저 설정, 작업 템플릿·승인 목록 준비(고객)", "교육자 교육 → 사이트 UAT(예: 편차 승인) → 운영 전환 → 하이퍼케어", "웨이브 단계: 시작 → 구현 → (ERP 연동 → PDM 연동) → 운영 전환"]}, {"t": "table", "head": ["항목", "내용"], "rows": [["산출물", "사이트 확장 템플릿(여정 지도), 웨이브 계획, 사이트별 준비 체크리스트"], ["관측 공수", "사이트당 약 1인일 + 개선 건당 7.5–10인일. 예: 33개 사이트 × 1일 + 개선 2건 × 7.5일 = 48인일(PM 20% 가산 시 57.6인일)"], ["관측 기간", "분기별 웨이브(2/4/8/3/10/8/7/2/4개 사이트), 9개 분기에 약 48개 사이트 계획. 실제 다수 사이트가 5–14개월 지연"], ["필요한 역할", "PM, 구현 컨설턴트. 고객: 사이트 변경 리드, 파일럿 사이트 키유저, 변경 관리 팀"], ["선행 조건·의존성", "파일럿 종료, 사이트 데이터가 Fusion Manage에 존재, 사이트별 PDM·ERP 상태 파악"]]}, {"t": "list", "title": "흔한 함정", "items": ["변경 관리 없이 확장한 결과, 2년 뒤 목표 3,000–5,000명 중 147명만 활성 사용자였습니다. 변경 관리·챔피언·활성 사용자 측정을 함께 팝니다([[support|12 지원·도입 확산]]).", "새 사이트의 요청이 운영 중인 사이트의 워크플로를 바꾸려 했습니다. 변경 요청 절차와 CCB를 먼저 둡니다.", "노사 협의 승인 대기, ERP 업그레이드로 웨이브가 밀렸습니다. 사이트별 전제 조건을 웨이브 계획에 적습니다.", "교육·지식 이전은 항목으로 넣지 않으면 포함되지 않는다고 명시되었습니다. 포함 여부를 줄 단위로 적습니다."]}]}]}, {"t": "sec", "id": "packages", "text": "추천 첫 프로젝트 패키지 (권장)"}, {"t": "p", "text": "신규 파트너는 관측 순서(설계 변경 → Items & BOMs → 연동)를 따라 **고정 범위 + 상한**이 있는 패키지 2–3개로 시작하는 것을 권장합니다. 공수는 [[estimate|03 스코핑·견적]]의 기준값으로 계산했고, 현행 분석·목표 설계는 S로 낮추지 않는 규칙을 따랐습니다. 단일 사이트 중견 고객을 전제로 합니다."}, {"t": "tiles", "items": [{"tag": "패키지 A", "title": "설계 변경 스타터", "text": "단일 사이트, 비연동 ECR/ECO", "items": ["범위: 표준 CR·CO·작업(Task) + 참조 워크스페이스(사이트·승인 목록) 약 4개. 워크스페이스당 약 45h 기준으로 S 180h", "상한: 착수 회의 최대 1h, UAT 1라운드 최대 2일 + 결함 수정 최대 5일, 테스터 교육 2h × 2회 × 2트랙, 운영 전환 지원 최대 16h", "제외: ERP·Vault 연동, 편차 승인(옵션 S 112h), 레거시 ECR 일괄 이관(진행 중 건은 기존 방식으로 종료), 최종 사용자 교육"]}, {"tag": "패키지 B", "title": "Items & BOMs 파운데이션", "text": "단일 사이트 마스터/브랜치, eBOM → mBOM", "items": ["범위: 마스터·브랜치 워크스페이스, 표준 BOM 뷰, 필드 소유권 매트릭스, 동기화 도구로 초기 로드 1회", "상한: 검증 1라운드(관측: 2라운드째가 불필요하면 2–3일 반환), UAT 단계별 결함 수정 최대 5일, 하이퍼케어 최대 16h", "제외: 웹 앱(옵션: 목업 42h부터 PoC), ERP 연동, PPM·공급업체·품질(데이터 로드용 속성만), 데이터 정제(고객)", "선행: 패키지 A 운영(품목 릴리스 경로)"]}, {"tag": "패키지 C", "title": "Vault 연동 퀵스타트", "text": "표준 커넥터, Vault → Fusion Manage", "items": ["범위: Vault 1개, 커넥터 구성, 속성 처리 분류·매핑, 기능 테스트·UAT 지원(관측 5–15일의 상단)", "상한: 매핑 대상 속성 목록 고정, 하이퍼케어 최대 16h", "제외: Vault 업그레이드, Fusion Manage → Vault 생성(버튼·웹훅·프록시), 커스텀 미들웨어", "선행: Vault 버전 적합, 품번 규칙(25자 이하·동일 형식), 패키지 B의 품목 워크스페이스"]}]}, {"t": "table", "title": "패키지별 공수 계산", "head": ["패키지", "포함 라인 아이템(등급 · h)", "기본(h)", "PM 15%", "예비 20%", "총 공수", "기간"], "num": [2, 3, 4], "rows": [["A 설계 변경 스타터", "착수 S 8 · 현행 M 80 · 목표 M 120 · 계획 S 28 · 샌드박스 S 24 · 권한 S 16 · 설계 변경 구축 S 180 · UAT S 80 · 운영 전환 S 46 · 하이퍼케어 S 16 · 관리자 교육 S 16 · 키유저 교육 S 16 · 종료 S 4", "634", "95", "146", "875h(109.4인일)", "약 22주(1.5 FTE)"], ["B Items & BOMs 파운데이션", "착수 S 8 · 현행 M 80 · 목표 M 120 · 계획 S 28 · 필드 매트릭스 S 32 · 권한 S 16 · Items & BOMs 구축 S 280 · 데이터 로드 S 48 · UAT S 80 · 운영 전환 S 46 · 하이퍼케어 S 16 · 키유저 교육 S 16 · 종료 S 4", "774", "116", "178", "1,068h(133.5인일)", "약 27주(1.5 FTE)"], ["C Vault 연동 퀵스타트", "착수 S 8 · Vault 연동 M 120 · 키유저 교육 S 16 · 하이퍼케어 S 16 · 종료 S 4", "164", "25", "38", "227h(28.4인일)", "약 9주(1.0 FTE)"]], "note": "계산: PM = 기본 × 15%, 예비 = (기본 + PM) × 20%, 기간 = 인일 ÷ (FTE × 5일) × 1.5. 계산기에서 같은 항목·등급을 고르면 같은 값이 나옵니다. 패키지를 이어서 팔면 착수·운영 전환 중복분을 빼고 다시 계산합니다."}, {"t": "callout", "kind": "tip", "title": "패키지 운영 규칙 (권장)", "items": ["고정가로 팔 때는 범위·제한 사항 페이지를 반드시 넣습니다. 관측 템플릿에서도 고정가는 필수, T&M은 선택이었습니다([[commercial|06 계약과 상업 모델]]).", "디스커버리에서 L 신호(다중 승인 위원회, 웹 앱, 다중 소스 데이터 등)가 나오면 그 항목은 패키지 밖 범위 변경서로 뺍니다.", "기간은 고객 전제(설계 승인 기한, 키유저 주당 약 20% 투입)와 함께 제시합니다. 관측된 단일 역량 프로젝트는 공수보다 기간이 먼저 무너졌습니다.", "상한·제외·고객 책임 문구는 [[sow|05 SOW 작성]]의 구조를 따르고, 계약 조항은 반드시 귀사 법무 검토를 거칩니다."]}, {"t": "quiz", "items": [{"q": "품목 릴리스가 변경 지시(CO)로만 가능할 때 권장되는 진행 순서는?", "options": ["Items & BOMs를 먼저 끝내고 설계 변경은 나중에", "설계 변경을 Items & BOMs보다 먼저 또는 함께", "순서는 상관없음"], "answer": 1, "why": "관측: 릴리스 경로가 변경 지시에 묶여 있어, 설계 변경이 연결되기 전까지 관련 웹 앱 요구사항이 보류되었습니다."}, {"q": "공급업체 관리가 범위 확대로 멈췄을 때 관측된 해법은?", "options": ["늘어난 범위를 모두 받아들이고 일정을 연장", "운영 전환에 꼭 필요한 최소 범위(Phase 0)로 다시 묶고 후속 단계는 따로 견적", "프로젝트를 중단하고 시간을 반환"], "answer": 1, "why": "현장 워크숍 뒤 소싱·감사까지 범위가 커졌고, Items & BOMs 운영 전환을 막지 않도록 Phase 0 MVP로 다시 묶었습니다."}, {"q": "품질 관리 프로젝트에서 관측된 교훈은?", "options": ["고객의 기존 양식에 맞춰 워크플로를 처음부터 커스터마이징", "표준(OOTB) 워크플로를 우선 쓰고 바꿀 수 있는 범위를 먼저 합의", "품질은 PLM 범위가 아니므로 제외"], "answer": 1, "why": "다른 고객이 품질 워크플로를 커스터마이징하다 정체되어 OOTB로 되돌아갔습니다."}, {"q": "레거시 PLM 이관을 견적하기 전에 반드시 확보할 것은?", "options": ["레거시 데이터 전체 덤프", "서면 24개월 ERP·미들웨어·레거시 지원 로드맵과 이름이 있는 고객 연동 리드", "최종 사용자 교육 일정"], "answer": 1, "why": "관측 이관은 ERP 업그레이드 로드맵이 늦게 드러나 약 7.5개월째 보류되었습니다."}]}]}, {"id": "sow", "num": "05", "group": "contract", "title": "짧은 SOW에 *상한을 분명하게* 넣는 법", "short": "SOW 작성", "goal": "관측된 2쪽 요청서 방식을 귀사 SOW로 옮겨, 상한·고객 책임·제외 범위·개정 이력·승인 절차를 갖춘 SOW와 범위 변경서(Change Request)를 직접 작성할 수 있습니다.", "facts": [["학습 시간", "45분"], ["대상", "PM·영업·프리세일즈"], ["산출물", "SOW 초안·범위 변경서·요청 로그"]], "blocks": [{"t": "lead", "text": "관측 프로젝트의 SOW는 2쪽짜리 요청서였지만, 1–2년 동안 수천 시간을 큰 분쟁 없이 관리했습니다. 비결은 분량이 아니라 **모든 활동에 붙은 \"최대 N\" 상한, 고객 책임, 제외 범위, 개정 이력**이었습니다. 이 모듈은 그 구조를 귀사 SOW로 옮기는 방법을 다룹니다."}, {"t": "sec", "id": "why", "text": "짧은 SOW가 통한 이유"}, {"t": "p", "text": "**관측된 방식.** 고객은 엔터프라이즈 계약으로 선불 컨설팅 시간 풀을 확보했습니다. 워크스트림(또는 단계)마다 2쪽 분량의 작업 요청서를 승인해 시간을 차감했습니다. 요청서는 n.1, n.2로 개정되었고, 고객 승인권자 1명이 이메일로 승인했습니다. 견적 대비 10%까지는 재승인 없이 초과할 수 있었습니다. 8h = 1인일, 최선 노력(best effort) 기준, 인수(검수) 없음, 소프트웨어 개발은 PoC로 한정했습니다."}, {"t": "table", "title": "관측된 방식을 귀사 방식으로 옮기기", "head": ["관측된 방식", "귀사 방식", "어디서 다루나"], "rows": [["엔터프라이즈 계약 + 선불 시간 풀", "기본 계약(MSA) + 상업 모델 선택(고정가·T&M·리테이너·단계별 혼합)", "[[commercial|06 계약·상업 모델]]"], ["워크스트림별 2쪽 요청서", "단계·기능별 SOW. 본문은 짧게, 견적표는 첨부 (권장)", "SOW 구성"], ["개정 n.1, n.2 + 부호 있는 증감 표", "SOW 개정 번호 + 범위 변경서 + 개정 이력 표", "개정·버전 관리"], ["승인권자 이메일 승인", "지정 승인권자의 서명 또는 이메일 승인(효력은 MSA에 명시)", "승인 워크플로"], ["10% 초과 허용", "허용 오차 조항 + 소규모 요청 로그", "범위 변경서"], ["최선 노력·인수 없음", "결과물(Output)과 인수 대상 산출물(Deliverable) 구분", "SOW 구성"], ["소프트웨어 개발 = PoC", "PoC 조항 + 운영용은 별도 계약", "표준 문구 블록"]]}, {"t": "list", "title": "짧은 SOW가 안전했던 네 가지 이유", "items": ["**상한이 위험을 묶었습니다.** 회의·워크숍·UAT 라운드·결함 수정 일수·운영 전환 지원이 모두 \"최대 N\"이었습니다. 그래서 시간 기준 최선 노력 모델에서도 끝이 정해졌습니다.", "**표준 블록을 재사용했습니다.** 고객 책임·제외 범위·가정 문구가 매번 같아 승인자는 바뀐 부분만 읽었습니다. 승인은 보통 당일–2일 안에 났습니다.", "**한 문서가 이력을 담았습니다.** 기능 하나를 SOW 하나로 두고 개정 이력 표로 키웠습니다. 1–2년 뒤에도 누가 왜 몇 시간을 승인했는지 추적할 수 있었습니다.", "**고객 책임이 수행 조건이었습니다.** 고객 책임이나 가정이 지켜지지 않으면 범위·일정·비용을 조정하거나 작업을 멈출 수 있다고 적었습니다."]}, {"t": "callout", "kind": "tip", "title": "짧다는 것은 빈약하다는 뜻이 아닙니다", "text": "관측 프로그램의 후기 검토는 \"모든 프로젝트의 SOW가 더 구체적이어야 한다\"고 결론 내렸습니다. 성과(outcome)만 약속하고 마일스톤을 정하지 않은 과제가 일정 관리에 실패했기 때문입니다. 본문은 짧게 두되 **마일스톤, 고객 승인 기한, 상한, 성공 기준**은 반드시 적으십시오."}, {"t": "sec", "id": "anatomy", "text": "SOW 구성 16개 섹션"}, {"t": "table", "head": ["#", "섹션", "무엇을 쓰나", "왜 필요한가 (관측)"], "num": [0], "rows": [["1", "머리글", "SOW 번호·개정 번호, 고객 승인권자, 귀사 PM, 작성일, 서비스 유형, 총 견적 공수(h·인일)", "파일명·번호가 워크스트림과 맞지 않으면 고객이 반려했습니다"], ["2", "배경·비즈니스 이니셔티브", "과제·필요·기대 결과, 성공 기준, 선행 문서 참조", "승인자가 \"왜 이 시간인가\"를 판단합니다. 사업 효과를 적은 개정은 당일 승인되었습니다"], ["3", "단계별 범위·라인 아이템", "작업·상한·견적 h 표, PM 별도 라인", "일수와 시간이 맞지 않는 SOW는 반려되었습니다"], ["4", "산출물과 결과물", "인수 대상 산출물(Deliverable)과 인수 대상이 아닌 결과물(Output) 구분", "최선 노력 모델의 핵심입니다"], ["5", "가정", "표준 테넌트 기준, To-Be 우선, \"최대\" 기간은 단축 가능, 준비 시간 포함", "가정이 틀리면 조정의 근거가 됩니다"], ["6", "고객 책임", "요구사항, 참여, 승인, UAT 수행, 데이터, 교육", "지연 대부분이 고객 쪽 일정에서 생겼습니다"], ["7", "제외 범위", "표준 제외 목록 + 이 SOW 고유 제외", "\"명시되지 않으면 범위 외\"를 뒷받침합니다"], ["8", "수행 장소", "원격 기본, 온사이트 조건(최소 8h/일, 2주 전 요청)", "온사이트 시간·경비 분쟁을 막습니다"], ["9", "일정·마일스톤", "시작·종료일, 마일스톤 3–5개, 고객 검토·승인 기한", "설계 승인 대기(수주–수개월)가 최대 지연 원인이었습니다"], ["10", "수행 팀", "귀사 역할·고객 역할, 협력사·하도급 참여 명시", "고객은 협력사 참여와 그 시간 안의 산출물을 적으라고 요구했습니다"], ["11", "거버넌스", "주간 회의, 월간 소진·현황 보고, 운영위원회, RAID", "모든 개정 요청의 근거가 소진 현황이었습니다"], ["12", "변경 관리", "10% 허용, 범위 변경서 절차, 소규모 요청 로그, 개정 이력 표", "작은 요청이 버퍼를 넘어 새는 것을 막습니다"], ["13", "인수·완료 확인", "인수 대상 산출물의 검토 기간·기준, 종료 시 잔여 시간 정산", "인수 없음 모델에서도 완료 증빙이 필요합니다"], ["14", "상업 조건 참조", "상업 모델, 청구 방식, 경비 원칙, MSA 참조", "금액은 본문이 아니라 상업 조건서에 모읍니다 (권장)"], ["15", "확인 사항", "수출 통제·데이터 위치·PoC 조항 확인", "모든 관측 요청서에 고정 문구로 들어 있었습니다"], ["16", "서명·개정 이력", "양측 서명(전자서명 허용), 개정 이력 표", "승인 증빙과 감사 추적입니다"]]}, {"t": "template", "title": "SOW 템플릿 (복사해 귀사 양식으로 사용)", "intro": "꺾쇠괄호 안은 작성 지침입니다. 수치는 관측 상한을 기본값으로 넣었으므로 고객 규모에 맞게 조정하십시오. 계약 효력이 있는 문구는 귀사 법무 검토를 거치십시오.", "sections": [{"h": "머리글", "items": ["SOW 번호: <고객 약칭>-SOW-<2자리 번호>, 개정: v<n>.<m> (예: 05.2)", "기본 계약(MSA) 참조: <계약명·체결일>", "고객 승인권자: <이름·직책> (대리 승인권자 1명 지정 권장)", "귀사 PM: <이름>, 작성일: <YYYY-MM-DD>", "서비스 유형(체크): □ 상세 구현 계획 □ 프로세스 정의 □ 테넌트 준비 □ 구성 □ 교육 □ 구현 지원 □ 소프트웨어 개발(PoC)", "총 견적 공수: <N>h = <N÷8>인일 (PM 포함, 예비 공수 포함 여부 표기)"]}, {"h": "배경과 비즈니스 이니셔티브", "items": ["과제: <현재 문제와 영향. 예: 변경 상태 추적이 여러 엑셀 파일에 분산>", "기대 결과와 성공 기준: <항목·설명 표, 측정 가능하게>", "연결 이니셔티브: <고객 사업 과제명>", "선행 문서: <현행 분석서는 SOW 제n호>, <목표 설계서는 SOW 제n호 v.m>"]}, {"h": "단계별 범위와 라인 아이템", "items": ["표 형식: 단계 | 작업 | 상한 | 견적(h)", "착수(모빌라이제이션): 이해관계자 소집, 기대치 정렬. 회의 최대 1h", "정렬·검토 워크숍: 준비, 진행(최대 3h, 온사이트 또는 온라인), 결과 요약", "현행(As-Is)·목표(To-Be) 문서화: 요구사항과 제안 솔루션", "상세 구현 계획", "구현: 승인된 To-Be 기준 구성", "내부 테스트: 기본 테스트", "사전 UAT: UAT 자료 지원, UAT 사용자 소개", "UAT 지원: 1라운드(최대 <N>일), 라운드당 결함 수정 최대 <N>일", "운영 전환 지원: 최대 <N>h", "종료(클로즈아웃): 문서 완료, 프로젝트 회고. 회의 최대 2h", "프로젝트 관리: 별도 라인. 착수 0.5인일 + 종료 0.5인일 + 정기 회의"]}, {"h": "산출물과 결과물", "items": ["인수 대상 산출물(Deliverable): <목록, 없으면 \"없음\">. 항목마다 인수 기준과 검토 기간 명시", "결과물(Output, 인수 대상 아님): 회의록, 워크숍 결과 요약, 현행·목표 설계서, 구성된 워크스페이스, 교육 자료 초안", "형식·언어: PDF 또는 Office 파일, <한국어 또는 영어>", "문서 검토: 5영업일, 통합 의견 1부, 최대 2회 개정 발행. 3회차부터는 범위 변경서"]}, {"h": "가정", "items": ["구성은 표준 테넌트를 기준으로 하며, To-Be에는 표준과 다른 점만 적습니다. 명시되지 않은 사항은 범위 외입니다", "구축은 승인된 To-Be를 따르며, 견적은 To-Be 승인 후 조정될 수 있습니다", "\"최대\"로 표시된 기간·횟수는 더 짧게 완료될 수 있습니다", "조사·준비·문서 작성 시간도 공수에 포함됩니다", "원격 수행이 기본이며, 공휴일과 귀사 휴무 기간은 일정에서 제외합니다", "고객 책임 미이행 또는 가정 오류 시 범위·일정·비용을 조정하거나 합의 시까지 작업을 중지할 수 있습니다"]}, {"h": "고객 책임", "items": ["표준 고객 책임 블록 삽입 (블록 A)", "연동이 있으면 연동 고객 책임 블록 추가 (블록 B)", "키유저는 설계·UAT 기간에 주당 약 20% 시간을 확약"]}, {"h": "제외 범위", "items": ["표준 제외 목록 삽입 (블록 C)", "이 SOW 고유 제외: <예: 공급업체 포털, 전사 확산, 이관 데이터 정제>"]}, {"h": "수행 장소", "items": ["원격 또는 온사이트 구분", "온사이트는 2주 전에 요청하며, 방문일당 최소 8h를 차감", "출장 경비: 실비, 사전 서면 승인, 상한 (상업 조건서 참조)"]}, {"h": "일정과 마일스톤", "items": ["시작일·종료일, 미사용 시간 처리 규칙", "마일스톤: 착수, To-Be 승인, 구축 완료, UAT 완료, 운영 전환, 종료", "고객 검토·승인 기한: 설계서 <N>영업일. 기한을 넘기면 일정을 재조정", "고객의 일정·시간 변경은 2주 전에 통보"]}, {"h": "수행 팀", "items": ["귀사: PM, 컨설턴트, 스크립트 개발자, 연동 담당과 역할별 예상 시간", "고객: 승인권자, 고객 PM, 고객 측 관리자, 키유저, 현업 챔피언, 연동·IT 담당", "협력사·하도급 참여: <회사 유형, 담당 범위, 시간, 그 시간 안의 산출물>"]}, {"h": "거버넌스", "items": ["주간 회의 최대 1h, 연동 회의 격주", "월간 소진·현황 보고: 사용 h, 잔여 h, 완료 예상, 리스크, 마일스톤 진척", "운영위원회: <주기와 참석자>", "RAID 로그 공동 관리"]}, {"h": "변경 관리", "items": ["견적 대비 10%까지 초과는 재승인 없이 진행하고 소진 보고에 기록", "10% 초과 또는 범위 변경 시 범위 변경서를 발행하고 SOW 개정 번호 부여", "건당 4–20h의 소규모 요청은 소규모 요청 로그로 기록·승인", "개정 이력 표: 개정 | 증감(h) | 누계(h) | 사유 | 승인일"]}, {"h": "인수와 완료 확인", "items": ["인수 절차는 인수 대상 산출물에만 적용. 인수와 지급의 관계는 MSA를 따름", "월간 서비스 확인서: 활동·시간 확인 (인수와 별개)", "종료 시 정산 개정: 미사용 시간 반환 또는 정산", "종료 보고: 사용 시간, 결과물, 다음 단계"]}, {"h": "상업 조건 참조", "items": ["상업 모델: □ 고정가 □ T&M(상한 <N>h) □ 리테이너 차감 □ 단계별 혼합", "청구: 마일스톤 또는 월 후불 (상업 조건서 참조)", "경비: 실비, 사전 승인, 상한", "금액·단가는 상업 조건서 또는 견적서에 기재"]}, {"h": "확인 사항", "items": ["수출 통제: 군사·항공우주·무인기·잠수정 전용 과제가 아니며, 비군사 예제와 데이터만 사용", "자료 통제: 고객 자료가 저장 위치·수행 위치·인력 국적을 제한하는 통제 대상이 아님", "데이터 위치: 테넌트 데이터 센터 지역 <지역> 확인", "소프트웨어 개발: PoC 조항 적용"]}, {"h": "서명과 개정 이력", "items": ["고객 승인권자 서명·일자, 귀사 서명·일자 (전자서명 또는 MSA가 허용한 이메일 승인)", "개정 이력 표 (최신 개정을 위에)"]}]}, {"t": "sec", "id": "caps", "text": "\"최대 N\" 상한 라이브러리"}, {"t": "p", "text": "상한은 최선 노력 모델을 안전하게 만드는 장치입니다. 아래 값은 관측 SOW에 실제로 쓰인 상한입니다. 귀사 기본값으로 쓰되, 고객 규모가 크면 횟수를 늘리고 **상한 자체는 없애지 마십시오**. 상한에 맞는 견적 공수는 [[estimate|03 스코핑과 견적]]을 참조하십시오."}, {"t": "table", "head": ["활동", "관측 상한", "권장 기본 문구"], "rows": [["착수 회의", "최대 1h (+ 준비)", "착수 회의는 최대 1시간으로 합니다."], ["정렬·검토 워크숍", "최대 3h, 1일 워크숍은 참석 최대 10명", "정렬·검토 워크숍은 1회, 최대 3시간입니다."], ["현행(As-Is) 워크숍", "복잡한 파일럿 최대 7회", "현행 분석 워크숍은 최대 N회입니다."], ["정기 회의", "주간 진행 회의, 연동 회의 격주", "주간 회의는 최대 1시간, 연동 회의는 격주로 합니다."], ["내부 검증 라운드", "2회. 1회로 끝나면 2–3일 반환", "UAT 전 내부 검증은 최대 2라운드이며, 쓰지 않은 시간은 반환합니다."], ["UAT 라운드", "1라운드 최대 2–3일, 일부 최대 2라운드", "UAT는 1라운드(최대 3일)로 합니다."], ["라운드당 결함 수정", "표준 구성 최대 1일, PoC 2일, 대형 구축 5일", "라운드당 결함 수정은 최대 N일이며, 우선순위는 고객이 정합니다."], ["UAT 테스터 교육", "트랙당 2h × 2회 (원격)", "UAT 테스터 교육은 트랙당 2시간씩 2회입니다."], ["관리자 교육", "최대 2h + 후속 Q&A 최대 2h", "관리자 교육은 최대 2시간, 후속 Q&A는 최대 2시간입니다."], ["교육 자료 작성 지원", "최대 4h (최종 교육은 고객 수행)", "교육 자료 작성 지원은 최대 4시간이며, 최종 사용자 교육은 고객이 수행합니다."], ["진행 중 기록 이행", "최대 12h (종이 변경 지시서 등)", "진행 중 기록의 이행 지원은 최대 12시간입니다."], ["운영 전환 지원", "8h, 16h, 3일, 최대 5일", "운영 전환 지원은 최대 N시간(또는 N일)입니다."], ["사이트 확산 고도화", "확산마다 최대 2–4건", "사이트 확산마다 고도화는 최대 N건입니다."], ["문서 검토", "5영업일(대형 10일), 통합 의견 1부, 최대 2회 발행", "검토 기간은 5영업일이며, 기간 안에 의견이 없으면 승인된 것으로 봅니다."], ["온사이트", "2주 전 요청, 방문일당 최소 8h", "온사이트는 2주 전에 요청하며, 방문일당 최소 8시간을 차감합니다."], ["교육 정원", "사용자 과정 최대 8명, 관리자 4–6명", "과정당 정원은 최대 8명입니다."]], "note": "관측 상한은 엔터프라이즈 다사이트 프로젝트 기준입니다. 수치를 바꾸더라도 \"최대\"라는 단어와 고객의 우선순위 결정권은 유지하십시오."}, {"t": "callout", "kind": "example", "title": "문구 예시: UAT 지원 패키지", "text": "\"고객은 UAT를 수행하고 결함 우선순위를 정합니다. 귀사는 UAT 스크립트 작성을 지원하고, 테스터 교육(트랙당 2시간씩 2회)을 원격으로 진행합니다. UAT는 1라운드(최대 3일)이며, 결함 수정은 최대 2일입니다. 남은 결함은 잔여 공수 안에서 고객이 정한 순서로 처리합니다.\" 관측된 UAT 지원 패키지는 이 구조로 112–128h였습니다."}, {"t": "sec", "id": "blocks", "text": "표준 문구 블록"}, {"t": "p", "text": "아래 블록은 매 SOW에 그대로 붙입니다. 문구가 같으면 승인자는 바뀐 부분만 확인하므로 승인이 빨라집니다. 연동 방식은 [[data|10 데이터 이관과 연동]]을 참조하십시오."}, {"t": "tiles", "items": [{"tag": "블록 A", "title": "표준 고객 책임", "items": ["목표·필요·과제·제약 등 비즈니스 요구사항 제공", "적합한 이해관계자 참여 보장, 회의 적극 참여", "다음 단계 전 To-Be와 구현 계획 승인", "성공 지표와 KPI 정의", "준법·규제·보안 요구사항 문서화", "UAT 수행과 결함 우선순위 결정", "데이터 준비·정제, 샘플 데이터와 테스트 케이스 제공", "변경 관리·교육 필요 파악과 계획 공동 수립, 최종 사용자 교육 수행", "운영 롤아웃·전사 확산 주도, 장기 거버넌스"]}, {"tag": "블록 B", "title": "연동 고객 책임", "items": ["SIT·UAT가 품질에 집중할 수 있을 만큼 명확한 요구사항", "데이터 준비와 정제", "시스템 접근 권한 제공", "전담 인력(PM, IT, 업무 전문가) 배정", "연동 테스트·검증 소유. 귀사는 고객이 구축한 연동을 테스트하지 않음", "다음 단계 전 SIT·UAT 최종 보고서 승인", "최종 사용자 교육과 변경 관리", "연동 프로세스·구성·맞춤 사항 문서화", "ERP·Vault에서 채워지는 필드 검토"]}, {"tag": "블록 C", "title": "표준 제외 범위", "items": ["지속적인 지원·유지보수 (별도 계약)", "ERP·PDM·PLM 핵심 기능 교육", "명시되지 않은 다른 시스템 연동", "데이터 정제·이관·변환", "인프라 변경", "연동과 무관한 고도화", "제3자 벤더 조율", "전사 확산과 다수 거점 최종 사용자 교육", "구축 결과 문서화 (고객 작성, 귀사 검토는 별도 항목)", "SOW 총 공수를 넘는 모든 작업"]}]}, {"t": "callout", "kind": "rule", "title": "소프트웨어 개발은 PoC 조항으로", "items": ["스크립트를 넘는 코드(프록시, 동기화 도구, 관리 도구, 웹 앱)는 **개념 증명(PoC) 또는 프로토타입**으로 납품합니다. 품질·성능·확장성·안정성 면에서 운영 수준이 아닙니다.", "테스트는 제한적입니다. 전체 데이터셋과 예외 케이스는 포함하지 않습니다.", "운영 배포와 유지보수는 별도 계약이 필요합니다.", "소스 코드는 별도 소스 코드 라이선스(SCLA 등)를 체결한 뒤 제공합니다. 관측 사례에서는 라이선스 서명이 늦어 UAT가 멈추고 코드 인수인계가 약 1개월 밀렸습니다.", "맞춤 도구는 Autodesk 지원 대상이 아닙니다. 운영 지원 주체(고객 또는 귀사 유지보수 계약)를 SOW에 적습니다."]}, {"t": "h", "text": "수출 통제·데이터 위치 확인 (개념)"}, {"t": "table", "head": ["확인 항목", "관측된 문구 (요지)", "귀사 SOW 적용"], "rows": [["최종 용도", "군사·항공우주(무인기 포함)·잠수정 전용 과제가 아님. 후기 문구는 비군사 예제·데이터만 쓰고 최종 용도 데이터가 필요 없다고 확인", "고객 확인 문구로 넣고, 해당되면 수주 전에 귀사 준법 검토"], ["자료 통제", "고객 자료가 저장 위치·수행 위치·인력 국적을 제한하는 통제 대상이 아님", "해외 또는 원격 인력을 투입할 때 특히 확인"], ["데이터 센터 지역", "고객이 운영 테넌트 승인을 개발 테넌트와 같은 지역 데이터 센터라는 조건으로 냄(데이터 보호법)", "테넌트 지역과 이름을 착수 때 확정. 테넌트 이름은 나중에 바꿀 수 없음"], ["접근 관리", "비밀번호를 요청하지 않음, 필요한 범위만 접근, 종료 시 모든 접근 회수", "착수 자료와 SOW에 표준 문구로 포함"], ["개인정보·국외 이전", "관측 자료에 별도 조항 없음", "고객 규정과 국내 법령 요건을 고객과 확인 (권장)"]]}, {"t": "callout", "kind": "rule", "title": "계약 조항은 반드시 귀사 법무 검토", "text": "이 모듈의 문구는 관측된 구조를 정리한 개념 예시이며 법률 자문이 아닙니다. 특히 인수, 책임, 작업 중지, 수출 통제, 데이터 보호 문구는 귀사 법무 검토 후 사용하십시오."}, {"t": "sec", "id": "revision", "text": "개정·버전 관리"}, {"t": "p", "text": "기능 하나에 SOW 하나를 두고, 바뀔 때마다 **개정 번호(n.1, n.2)**를 붙입니다. 본문 맨 위에는 최신순 변경 기록을, 맨 아래에는 부호 있는 증감 이력 표를 둡니다. 관측 프로그램은 이 방식으로 기능 하나를 20개월 가까이 추적했습니다."}, {"t": "list", "title": "개정 규칙", "ordered": true, "items": ["개정마다 증감을 부호로 적습니다(+182h, −62h). 반환과 범위 분리도 개정입니다.", "개정 요청에는 기준일 소진 현황을 적습니다(예: \"기준일 현재 230h 사용\"). 그다음 사용 시간 + 남은 작업 + 예비를 요청합니다.", "사유를 분류합니다: 범위 추가, 범위 변경 없음·예상 밖 복잡도, 고객 테스트 연장, 팀 교체 후 재착수, 오류 정정, 미사용 반환, 보류.", "사업 효과를 한 줄로 적습니다(감사 추적, 준법, 운영 전환 필수 요건 등). 효과가 분명한 개정은 당일 승인되었습니다.", "개정마다 다시 승인받고, 승인 증빙을 SOW 폴더에 보관합니다.", "종료 때 정산 개정으로 미사용 시간을 반환하거나 정산하고, 종료 보고에서 사용 내역을 보여 줍니다."]}, {"t": "table", "title": "작업 예시: 자산 관리 PoC SOW의 개정 이력 (관측)", "head": ["개정", "증감(h)", "누계(h)", "사유", "승인"], "num": [1, 2], "rows": [["v1 (최초)", "368", "368", "착수, 정렬·검토, 현행·목표 설계, 구현·테스트, UAT(결함 수정 최대 2일), 종료", "서명"], ["v1.1", "+182", "550", "To-Be 확정 결과 자동화 스크립트 11건을 범위에 포함(7건은 명시적 제외)", "이메일"], ["v1.2", "+36", "586", "UAT와 스크립트 보완", "이메일"], ["v1.3", "+24", "610", "알림 변경에 10% 버퍼 사용, UAT 2주 연장 반영", "이메일"], ["Σ 최종", "+242", "610", "최초 대비 1.66×", ""]], "note": "가장 큰 개정은 설계 확정 직후에 나왔습니다. 그래서 구축 견적은 To-Be 승인 뒤에 확정하는 편이 안전합니다([[method|08 딜리버리 방법론]])."}, {"t": "list", "title": "본문 맨 위 변경 기록 예시 (최신순)", "items": ["**변경 v1.3 (<일자>)**: +24h. 알림 규칙 변경 8h는 10% 버퍼에서 썼고, 고객 요청으로 UAT를 2주 연장했습니다. 기준일 현재 사용 <N>h, 잔여 <N>h.", "**변경 v1.2 (<일자>)**: +36h. UAT 중 확인된 스크립트 보완.", "**변경 v1.1 (<일자>)**: +182h. 승인된 To-Be 기준 자동화 스크립트 11건 포함, 7건 제외(목록 첨부)."]}, {"t": "callout", "kind": "tip", "title": "줄어드는 개정도 똑같이 기록합니다", "text": "관측 사례에는 반환 개정이 많았습니다. 472h 구축 SOW는 −86.25h를 반환해 385.75h로 닫혔고, 보류된 레거시 PLM 이관은 −119.25h를 반환했습니다. 반환 기록은 고객 신뢰를 쌓고 다음 SOW 승인을 빠르게 합니다."}, {"t": "sec", "id": "approval", "text": "승인 워크플로와 고객 반발 대응"}, {"t": "steps", "title": "승인까지 5단계 (관측 흐름)", "items": [{"title": "견적 사전 공유", "text": "SOW를 보내기 전에 견적 메일을 먼저 보냅니다. 단계별 인일 분해와 계획 일정(작업 번호) 링크를 붙입니다.", "meta": "담당: 귀사 PM · 수신: 승인권자와 1차 검토자"}, {"title": "인라인 코멘트 반영", "text": "고객이 메일에 직접 의견을 답니다. 반영한 뒤 \"준비되면 제출하라\"는 답을 받습니다. 용어·산출물·협력사 참여 지적은 대부분 이 단계에서 나옵니다.", "meta": "산출물: 합의된 견적표"}, {"title": "SOW 제출", "text": "파일명과 메일 제목에 SOW 번호와 제목을 넣습니다. 예: <고객 약칭>_SOW_05.1_<제목>_승인 요청. 파일명이 워크스트림 번호·설명과 달라 반려된 사례가 있습니다.", "meta": "담당: 귀사 PM"}, {"title": "승인 문장 회신", "text": "승인권자가 정해진 문장으로 회신합니다. 예: \"SOW 제05.1호 <제목>의 견적 공수 120h를 승인합니다.\" 회신에 조건(데이터 센터 지역, 브랜딩 등)이 붙으면 SOW에 반영해 기록합니다.", "meta": "관측 소요: 당일–2일, 문구 분쟁 시 최대 약 10일"}, {"title": "하드 부킹과 착수", "text": "승인 즉시 인력을 확정 배정하고 착수 회의를 엽니다. 승인 메일은 PDF로 저장해 SOW 폴더에 \"_승인_<일자>\" 이름으로 보관합니다.", "meta": "감사 추적: 승인 메일 보관"}]}, {"t": "callout", "kind": "warn", "title": "승인 전에 한 일과 보이지 않는 준비 시간은 받기 어렵습니다", "text": "관측 사례에서 고객이 약 8시간의 오프라인 준비 시간에 이의를 제기했고, 공급사는 결국 그 시간을 무상 처리했습니다. 착수 회의에서 **조사·준비·문서 작성 시간도 공수에 포함된다**고 밝히고, 주간 소진을 공유하십시오. 승인 전에는 작업을 시작하지 않는 것이 원칙입니다."}, {"t": "table", "title": "고객 반발 패턴과 사전 차단", "head": ["반발 패턴", "관측 사례", "사전 차단 방법"], "rows": [["일수·시간 산술 불일치", "11인일 지원인데 96h로 적혀 반려", "PM 착수 0.5인일·종료 0.5인일을 별도 라인으로 두고, 모든 줄에 h와 인일을 병기"], ["PM 시간이 보이지 않음", "PM 일수를 명시하라는 요구", "PM을 독립 라인으로 두고 비율(기본 15%)을 표기"], ["시간 안의 산출물 불명확", "협력사 참여 24h에서 무엇이 나오는지 목록 요구", "라인 아이템마다 결과물을 나열"], ["협력사 참여 미기재", "협력사 참여를 SOW에 명시하라는 요구", "수행 팀 섹션에 협력사, 담당 범위, 시간을 기재"], ["용어 거부감", "\"목업\"을 \"개발 워크스페이스\"로 바꾸라는 요구", "고객 용어집을 따름"], ["중복 작업 의심", "목업 SOW에 \"중복 작업 없음\" 문구 추가 요구", "목업·PoC 결과를 구축에 이어 쓴다고 명시"], ["다음 단계 불투명", "추가 승인 전에 남은 단계 분해 요구", "남은 단계와 예상 공수 범위를 첨부"], ["필요성 의문", "\"운영 전환에 정말 필요한가\"라는 질문", "운영 전환 필수 요건을 서면으로 정리해 SOW에 연결"], ["효과 수치 의심", "일반 템플릿의 \"승인 30% 단축\" 같은 수치에 반발", "효과 수치는 고객 검증값으로 쓰거나 \"예시\"로 표시"]]}, {"t": "sec", "id": "change", "text": "범위 변경서와 소규모 요청 로그"}, {"t": "p", "text": "변경은 크기에 따라 네 갈래로 처리합니다. 판단 기준을 SOW에 적어 두면 매번 협상할 필요가 없습니다."}, {"t": "table", "head": ["변경 크기", "처리 방식", "기록"], "rows": [["견적의 10% 이내, 범위 동일", "재승인 없이 진행 (잔여 공수가 있을 때)", "소진 보고, 소규모 요청 로그"], ["건당 4–20h 소규모 요청", "이메일 승인 후 진행. 누적이 10%를 넘으면 범위 변경서", "소규모 요청 로그 (승인 메일 링크)"], ["10% 초과 또는 범위·일정 변경", "범위 변경서 발행 후 SOW 개정 번호 부여", "범위 변경서, 개정 이력 표"], ["새 기능·새 사이트", "새 SOW", "새 SOW 번호"]]}, {"t": "template", "title": "범위 변경서(Change Request) 템플릿", "intro": "상위 SOW의 나머지 조건은 그대로 두고, 바뀌는 부분만 새 작업 블록으로 씁니다.", "sections": [{"h": "식별 정보", "items": ["범위 변경서 번호: CR-<SOW 번호>-<순번>", "상위 SOW와 개정 후 번호: 예: SOW 05 → v05.2", "요청자, 작성자, 작성일"]}, {"h": "변경 내용", "items": ["새 작업 블록: 설명, 결과물(인수 대상 여부), 작업별 가정, 작업별 고객 책임", "빠지는 작업이 있으면 함께 표기", "바뀌는 상한: <예: UAT 1라운드 → 2라운드>"]}, {"h": "변경 사유", "items": ["□ 범위 추가 □ 범위 변경 없음·예상 밖 복잡도 □ 고객 테스트 연장 □ 팀 교체 후 재착수 □ 일정 변경 □ 보류 □ 미사용 반환 □ 오류 정정", "사업 효과 한 줄: <예: 감사 대응, 운영 전환 필수 요건>"]}, {"h": "영향", "items": ["공수 증감: ±<N>h (PM·예비 포함)", "일정 영향: 마일스톤 <변경 전 → 후>", "리스크·의존성 변화", "상업 영향: 상업 모델에 따른 대금 변경 또는 풀 차감 (상업 조건서 참조)"]}, {"h": "소진 현황", "items": ["기준일: <YYYY-MM-DD>", "승인 누계 <N>h, 사용 <N>h, 잔여 <N>h, 완료 예상 <N>h"]}, {"h": "불변 조항", "items": ["\"이 범위 변경서에 명시되지 않은 상위 SOW의 모든 조건은 변경 없이 유지됩니다.\""]}, {"h": "승인", "items": ["고객 승인권자 서명 또는 승인 문장 회신, 일자", "귀사 서명, 일자", "승인 증빙 보관 위치"]}]}, {"t": "table", "title": "소규모 요청 로그 (열 구성)", "head": ["열", "내용"], "rows": [["ID·프로젝트", "요청 번호, 관련 SOW 번호, 프로젝트명"], ["상태", "요청, 검토 중, 승인, 반려, 완료"], ["설명", "무엇을 왜 바꾸는가"], ["분류", "추가 시간, 결함, 고도화, 기술 고도화"], ["효과·영향", "사업 효과, 다른 기능·일정에 대한 영향"], ["공수", "h와 인일 (PM 포함)"], ["일정 영향", "예 또는 아니요"], ["요청일·승인일·승인자", "승인 메일 링크"], ["예산 내 여부", "현재 SOW 잔여 공수 안인가"], ["SOW 개정 필요", "예 또는 아니요, 개정 승인 여부와 링크"], ["비고", "결함인지 고도화인지에 대한 판단 근거"]], "note": "복사 가능한 로그 양식은 [[templates|14 템플릿]]에 있습니다."}, {"t": "p", "text": "**결함인지 고도화인지가 비용 주체를 정합니다.** 관측 사례에서 고객 IT 리드는 ERP 검증 누락을 고도화가 아닌 결함이자 사업 리스크로 판정해 운영 전환 전 필수로 처리했습니다. \"요구사항이나 To-Be에 있었는가\"를 판정 기준으로 SOW에 적어 두십시오. 리스크별 안전장치 조항은 [[risk|07 리스크·안전장치]]에 모았습니다."}, {"t": "callout", "kind": "tip", "title": "범위 템플릿으로 바로 초안 만들기", "text": "[[builder|17 SOW·견적 빌더]]에서 템플릿을 고르면 이 모듈의 원칙이 반영된 라인 아이템·견적 요약·SOW 초안을 바로 볼 수 있습니다 (참고용)."}, {"t": "quiz", "items": [{"q": "관측된 2쪽 요청서가 최선 노력(best effort) 모델에서도 안전했던 가장 큰 이유는?", "options": ["기능 명세가 매우 상세했다", "모든 회의·UAT·결함 수정·운영 전환 지원에 \"최대 N\" 상한과 고객 책임이 붙어 있었다", "고객이 공급사를 전적으로 신뢰했다"], "answer": 1, "why": "상한과 고객 책임이 시간 기준 모델의 끝을 정했습니다. 문구가 표준화되어 승인도 빨랐습니다."}, {"q": "실제 공수가 견적보다 7% 초과할 것으로 보입니다. 관측 규칙을 넣은 SOW라면?", "options": ["즉시 새 SOW를 쓴다", "무상으로 처리한다", "10% 이내이므로 재승인 없이 진행하고 소진 보고에 기록한다"], "answer": 2, "why": "10%까지는 재승인 없이 초과할 수 있습니다. 다만 잔여 공수가 있어야 하고, 소진 보고와 요청 로그에 남겨야 합니다."}, {"q": "고객이 \"11인일인데 왜 96h입니까?\"라며 반려했습니다. 예방책은?", "options": ["PM 착수·종료 0.5인일씩을 별도 라인으로 두고 모든 줄에 h와 인일을 병기한다", "시간은 빼고 일수만 적는다", "견적을 11인일로 낮춘다"], "answer": 0, "why": "96h는 지원 11인일 + PM 1인일입니다. PM을 숨기면 산술이 맞지 않아 보여 반려됩니다."}, {"q": "SOW에 웹 앱 개발이 들어갑니다. 관측된 조항에 맞는 처리는?", "options": ["운영 수준 품질을 보증하고 Autodesk 지원으로 유지보수한다", "PoC로 납품하고 운영 배포·유지보수는 별도 계약, 소스 코드는 별도 라이선스 체결 후 제공한다", "코드 관련 내용은 SOW에 적지 않는다"], "answer": 1, "why": "코드는 PoC로 한정하고, 운영 사용·유지보수·소스 코드 제공 조건을 미리 적어야 UAT 중단과 지원 분쟁을 막을 수 있습니다."}]}]}, {"id": "commercial", "num": "06", "group": "contract", "title": "상업 모델은 *단계마다 다르게* 고른다", "short": "계약·상업 모델", "goal": "고정가·T&M·선불 시간 풀(리테이너)·단계별 혼합 중 단계에 맞는 모델을 고르고, 견적·청구 구조와 기본 계약(MSA) 검토 항목을 정리할 수 있습니다.", "facts": [["학습 시간", "40분"], ["대상", "영업·PM·경영진"], ["산출물", "상업 모델 선택표·리테이너 조건"]], "blocks": [{"t": "lead", "text": "같은 범위라도 어떤 상업 모델로 파느냐에 따라 위험을 누가 지는지가 달라집니다. 관측 프로그램은 선불 시간 풀 하나로 운영했지만, 신규 파트너는 **단계마다 다른 모델**을 쓰는 편이 안전합니다."}, {"t": "sec", "id": "observed", "text": "관측된 방식과 상업 교훈"}, {"t": "p", "text": "**관측된 방식.** 고객은 3년 단위 엔터프라이즈 계약 안에 선불 컨설팅 일수 풀을 두었습니다. 풀은 연차별로 나뉘어 각기 다른 종료일에 만료되었고, 작업마다 2쪽 요청서로 시간을 차감했습니다. 일수는 취소할 수 없었고, 시작 15일 이내의 일정 변경은 사용한 것으로 보았습니다. 이 구조는 Autodesk와 고객 사이의 계약이며 귀사가 그대로 팔 상품이 아닙니다. 아래에서는 그 규칙을 귀사 서비스 계약으로 옮깁니다."}, {"t": "stats", "items": [{"value": "15%", "label": "PM 오버헤드 기본값 (관측 8–20%)"}, {"value": "20%", "label": "예비 공수 기본값. 디스커버리·설계만 계약하면 30% 이상"}, {"value": "+21–72%", "label": "예비 5–10%를 넣고 서명한 변경 주문의 실제 초과율 (관측)"}, {"value": "15일", "label": "이 기간 안에 일정을 바꾸면 사용한 것으로 보는 규칙 (관측)"}]}, {"t": "list", "title": "관측에서 얻은 상업 교훈", "items": ["**만료는 가장 큰 레버이자 리스크였습니다.** 만료일이 모든 착수 자료의 리스크 항목에 올라갔습니다. 만료 전에 일정을 잡지 못한 교육·이관은 다음 계약으로 밀렸습니다.", "**만료를 피하려 서두른 착수는 대가를 치렀습니다.** 시간을 잃지 않으려고 일찍 시작한 과제는 적임자와 문서가 부족했습니다.", "**소진율은 진척률이 아니었습니다.** 시간 소진은 계획보다 앞섰지만 운영 전환은 뒤처진 프로그램이 있었습니다.", "**풀 밖의 일은 따로 계약했습니다.** 풀에 맞지 않거나 예산이 없는 과제는 별도 T&M 계약(예: 91인일 이관)이나 6–15인일 고정가 주문으로 처리했습니다.", "**작게 시작하면 반드시 다시 견적합니다.** \"시작할 수 있게 40h만\" 요청한 기능은 최종적으로 13배가 되었습니다."]}, {"t": "sec", "id": "models", "text": "네 가지 상업 모델 비교"}, {"t": "table", "head": ["모델", "언제 쓰나", "위험 부담", "필수 안전장치", "관측 근거"], "rows": [["고정가", "승인된 To-Be가 있는 기능 구축, 샌드박스 구성·교육 같은 표준 패키지", "귀사 (초과분은 귀사 손실)", "라인 아이템별 상한, \"To-Be가 구축을 지배\" 조항, 범위·제한 슬라이드 필수, 범위 변경서, 명확한 인수 기준", "구축 요청서는 견적을 지키거나 시간을 반환했습니다. 착수 자료의 범위·제한 슬라이드는 고정가에서 필수였습니다"], ["T&M (투입 시간 정산, 상한형)", "디스커버리, 자문, 고객 팀이 주도하는 연동·업그레이드 지원처럼 범위가 불확실한 일", "고객 (상한까지)", "최대 N인일 상한, 상한 도달 시 작업 중지, 월간 타임시트, 주간 소진 공유, 80% 도달 경보 (권장)", "T&M 주문은 \"최대 N일\"로 묶였고, 변경 주문이 없으면 상한에서 멈췄습니다"], ["선불 시간 풀 (리테이너)", "여러 워크스트림을 이어 가는 프로그램, 운영 전환 후 AMS(운영 유지보수 서비스)·소규모 고도화", "공유: 고객은 만료 위험, 귀사는 인력 대기 의무", "8h = 1인일, +10% 허용, 종료일 소멸, 15일 규칙, 온사이트 최소 8h, 작업별 SOW, 월간 소진 보고", "관측 프로그램 전체가 이 방식이었습니다. 만료 위험은 매 착수 자료에 등장했습니다"], ["단계별 혼합", "신규 고객의 첫 도입 (권장 기본값)", "단계마다 이동", "단계 관문(To-Be 승인) 뒤 다음 단계 확정 견적, 단계별 SOW", "\"Phase 0\"으로 범위를 줄인 뒤 다음 단계를 따로 견적했고, 파일럿 단계 뒤에 확산 단계를 산정했습니다"]], "note": "위험 부담은 일반적인 구조입니다. 실제 배분은 계약 조항에 따라 달라지므로 귀사 법무 검토가 필요합니다."}, {"t": "p", "text": "**선택 기준 세 가지.** 범위가 승인된 설계서로 고정되었다면 고정가입니다. 범위가 아직 발견 단계라면 T&M 상한형입니다. 같은 고객과 여러 과제를 이어 간다면 리테이너입니다. 첫 프로젝트는 이 조건이 단계마다 바뀌므로 대부분 **단계별 혼합**이 맞습니다."}, {"t": "sec", "id": "phase", "text": "단계별 권장 모델"}, {"t": "flow", "items": [{"title": "디스커버리", "text": "T&M 상한형 또는 소규모 고정가. 예비 30% 이상"}, {"title": "구축", "text": "기능별 고정가 + 상한. To-Be 승인 후 확정", "hi": true}, {"title": "연동", "text": "T&M 자문. 고객 팀이 구축, 시스템당 정의 9–14인일"}, {"title": "확산", "text": "사이트별 패키지. 사이트당 약 1인일 + 고도화 상한"}, {"title": "운영(AMS)", "text": "리테이너. 월간 소진 보고"}]}, {"t": "table", "head": ["단계", "권장 모델", "산정 방식", "핵심 조건"], "rows": [["디스커버리 (현행·목표 설계)", "T&M 상한형 또는 소규모 고정가", "워크스트림당 현행 48–80h + 목표 60–120h + 계획 28–88h, PM 15%, 예비 30% 이상", "결과물은 설계서. 고객 검토·승인 기한을 SOW에 명시"], ["구축 (기능별)", "기능별 고정가 + 상한", "라인 아이템 견적 + PM 15% + 예비 20%", "승인된 To-Be가 구축을 지배. UAT 라운드·결함 수정 일수 상한"], ["연동", "T&M 상한형 자문 (고객 미들웨어 팀이 구축)", "시스템당 정의 자문 9–14인일, 인에이블먼트는 인터페이스당 약 180h", "귀사는 고객이 구축한 연동을 테스트하지 않음. 미들웨어는 고객 소유"], ["확산 (사이트 추가)", "사이트별 패키지 고정가", "사이트당 컨설턴트 약 1인일 + 고도화 최대 N건 (관측 건당 7.5–10인일)", "메타데이터 고도화만 단순 처리. 프로세스·연동 변경은 별도 견적. 교육·노하우 이전은 별도 항목"], ["운영(AMS)·지속 개선", "리테이너 (월 또는 분기 시간 풀)", "월 N시간, 소규모 요청 로그로 차감", "지원 등급과 분리([[support|12 지원·유지보수]]). 만료·이월 규칙 명시"]], "note": "공수 범위는 CANON 관측치입니다. 상세 계산은 [[estimate|03 스코핑과 견적]]의 견적 계산기를 쓰십시오."}, {"t": "callout", "kind": "example", "title": "관측 사례: 구축 대신 인에이블먼트", "text": "공급사가 직접 구축하는 PDM–PLM 연동 초안은 960h였습니다. 고객이 자체 미들웨어 팀을 쓰기로 하자 인터페이스당 약 180h의 인에이블먼트(요구사항·유스케이스·API 교육·매핑 검토·SIT/UAT 지원)로 바뀌었습니다. 다른 ERP 연동 견적도 145인일 전체 구축에서 약 50인일 자문으로 줄었습니다."}, {"t": "sec", "id": "retainer", "text": "선불 시간 풀(리테이너) 운영 규칙"}, {"t": "p", "text": "리테이너에는 관측된 풀 규칙을 거의 그대로 옮길 수 있습니다. 리테이너는 귀사가 인력을 대기시키는 대가이므로 **만료와 일정 변경 규칙**을 반드시 넣으십시오. (권장)"}, {"t": "table", "head": ["규칙", "계약·SOW 문구 예시", "왜 필요한가 (관측)"], "rows": [["1인일 = 8h", "1인일은 8시간이며, 원격 업무는 1시간 단위로 차감합니다.", "일수·시간 불일치로 반려된 사례가 있었습니다. 원격 1시간 단위 차감이 관측되었습니다"], ["+10% 허용", "실제 공수는 견적을 10%까지 초과할 수 있으며, 풀 잔량이 있는 경우에 한합니다. 그 이상은 범위 변경서로 처리합니다.", "관측 규칙입니다. 후기에 \"풀 잔량 범위 내\" 단서가 붙었습니다"], ["만료", "미사용 시간은 서비스 종료일에 소멸하며, 연장·환불·전환하지 않습니다.", "관측 규칙입니다. 반환된 시간도 종료일에 만료되었습니다"], ["15일 규칙", "시작일 15일 이내의 일정 변경·취소는 예약 시간을 사용한 것으로 봅니다.", "관측 규칙입니다. 다른 계약은 2주 이내 변경을 수행 완료로 보았습니다"], ["예약 통지", "작업 예약은 2주 전에 요청합니다.", "관측 규칙입니다"], ["온사이트 최소 8h", "온사이트는 방문일당 최소 8시간을 차감합니다.", "관측 규칙입니다"], ["준비 시간 차감", "착수 회의와 SOW 준비 시간도 풀에서 차감합니다.", "관측 규칙입니다. 준비 시간 분쟁을 막습니다"], ["취소 불가", "확정된 풀은 취소할 수 없습니다.", "관측 규칙입니다"], ["월간 소진 보고", "매월 활동·시간 내역을 보고하고 고객 확인을 받습니다.", "관측: 분기 보고(요청 시 월간)와 월간 서비스 확인서"], ["갱신 협의", "종료 90일 전에 갱신을 협의합니다.", "관측: 종료 90일 전 갱신 요청"]]}, {"t": "list", "title": "월간 소진 보고서 열 구성", "items": ["SOW·워크스트림 번호와 이름", "승인 공수(h), 당월 사용, 누계 사용, 잔여", "완료 예상 공수(EAC)와 승인 대비 차이(h·인일), 10% 허용선 도달 여부", "계획에는 배정했지만 아직 승인되지 않은 잔량", "만료 예정 시간과 만료일", "마일스톤 진척 (소진과 따로 표시)", "다음 달 예약 계획과 필요한 고객 결정"]}, {"t": "callout", "kind": "tip", "title": "소진율은 진척률이 아닙니다", "text": "관측 프로그램 하나는 계약 대비 시간 소진은 앞섰지만 운영 전환은 뒤처졌습니다. 보고서에는 **시간 소진과 마일스톤 진척을 나란히** 두십시오. 만료가 다가온다는 이유로 준비되지 않은 과제를 착수하지 마십시오."}, {"t": "sec", "id": "pricing", "text": "가격 산정과 청구 구조"}, {"t": "steps", "title": "견적에서 가격까지 6단계", "items": [{"title": "단계별 라인 아이템 공수", "text": "라인 아이템별 S/M/L 공수를 고릅니다([[estimate|견적 계산기]]).", "meta": "근거: CANON 관측치"}, {"title": "PM 15% 가산", "text": "작업 공수의 15%를 프로젝트 관리로 별도 라인에 둡니다. 관측 범위는 순수 지원 약 8%부터 다중 과제 SOW 16–19%, 프리세일즈 견적 약 20%까지였습니다. 관측 견적 워크북의 최소값은 15%였습니다.", "meta": "15% 미만이면 사유를 남깁니다"}, {"title": "예비 공수 20%", "text": "작업 + PM 합계의 20%를 예비로 둡니다. 디스커버리·설계만 따로 계약하면 30% 이상을 둡니다. 관측 변경 주문은 예비 5–10%로 서명했지만 21–72% 초과했습니다.", "meta": "관측 내부 견적 선택지: 10·20·30%"}, {"title": "인일 환산과 단가 적용", "text": "총 공수를 8로 나눠 인일로 바꾸고 귀사 역할별 단가를 곱합니다. 이 가이드는 단가를 제시하지 않습니다.", "meta": "금액은 귀사 단가 기준"}, {"title": "기간 산정", "text": "기간 = 인일 ÷ (투입 FTE × 5일) × 1.5. 1.5는 고객 승인·테스터 대기 보정값입니다.", "meta": "근거: 설계 승인 대기 수주–수개월, UAT 약 2배"}, {"title": "상업 모델로 포장", "text": "고정가는 예비를 포함한 총액, T&M은 상한, 리테이너는 풀 규모로 제시합니다. 상세 견적표는 내부용으로 두고 고객에게는 SOW 수준의 분해를 보여 줍니다.", "meta": "관측: 상세 견적은 내부용, 고객은 요청서를 봄"}]}, {"t": "table", "title": "계산 예시: 설계 변경(ECR/ECO) 단일 기능, M 기준", "head": ["구분", "공수(h)", "인일"], "num": [1, 2], "rows": [["디스커버리: 착수 16 + 현행 80 + 목표 120 + 상세 계획 48", "264", "33"], ["플랫폼·구축: 샌드박스 40 + 설계 변경 구축 360", "400", "50"], ["테스트·전환: UAT 120 + 운영 테넌트 전환 80 + 하이퍼케어 24", "224", "28"], ["교육·종료: 키유저 교육 32 + 종료 8", "40", "5"], ["작업 공수 소계", "928", "116"], ["PM 15%", "139", "17.4"], ["예비 공수 20% (작업 + PM 기준)", "213", "26.6"], ["Σ 합계", "1,280", "160"]], "note": "기간: 160인일 ÷ (1.5 FTE × 5일) × 1.5 ≈ 32주. 단일 사이트·연동 없음을 가정한 계산 예시입니다. 관측된 엔터프라이즈 다사이트 파일럿은 13–14개월이 걸렸습니다."}, {"t": "table", "title": "같은 범위를 단계별 혼합으로 나누면", "head": ["SOW", "상업 모델", "작업(h)", "PM 15%", "예비", "합계(h)"], "num": [2, 3, 4, 5], "rows": [["SOW 1 디스커버리", "T&M 상한형", "264", "40", "91 (30%)", "395"], ["SOW 2 구축·전환·교육", "기능별 고정가", "664", "100", "153 (20%)", "917"], ["Σ 합계", "", "928", "140", "244", "1,312"]], "note": "디스커버리에 예비를 더 두는 대신, 구축 고정가는 승인된 To-Be를 기준으로 확정합니다. 디스커버리 결과 구축 범위가 바뀌면 SOW 2를 다시 견적합니다."}, {"t": "list", "title": "예비 공수를 올려야 하는 신호 (관측 견적 리스크 질문 중)", "items": ["비슷한 프로젝트 경험이 없거나 처음 하는 유형이다", "데이터 변환·이관이 포함되어 있다", "요구사항을 어떻게 만들었는지 불분명하다", "고객 IT의 협조와 UAT 경험이 부족하다", "외부 의존성(ERP 팀, 제3자 벤더, 향후 제품 릴리스)이 있다", "SOW·조건 협상이 길어지거나 특이한 계약 조건이 있다"]}, {"t": "table", "title": "청구·지급 구조", "head": ["모델", "청구 구조", "증빙", "주의"], "rows": [["고정가", "마일스톤 청구(예: 계약, To-Be 승인, 운영 전환, 종료) 또는 완료 시 일괄", "마일스톤 완료 확인서", "인수와 지급을 묶을지는 MSA에서 정합니다. 관측 계약은 인수를 지급 조건으로 두지 않았습니다"], ["T&M", "월 후불", "월간 타임시트(작업·주·시간)", "상한의 80%에 도달하면 고객에게 미리 알림 (권장)"], ["리테이너", "기간 선불(연 또는 분기)", "월간 서비스 확인서(고객·월·활동)", "확인서는 인수가 아닙니다. 소진·만료를 함께 보고"], ["경비", "실비, 마크업 없음, 월 후불, 별도 발주", "영수증, 출장 내역", "사전 서면 승인과 상한. 견적은 출장 횟수로 산정 (관측: 해외 워크숍 1회 + 국내 회의 약 20회)"]], "note": "지급 기일과 지연 이자 같은 조건은 귀사 표준 조건을 따릅니다. 관측 계약은 청구 후 30일 지급이었습니다."}, {"t": "sec", "id": "msa", "text": "기본 계약(MSA) 개념 체크리스트"}, {"t": "callout", "kind": "rule", "title": "계약 조항은 반드시 귀사 법무 검토", "text": "아래는 관측 계약에서 추린 **개념 목록**이며 법률 자문이 아닙니다. 조항이 있는지와 방향만 확인하고, 실제 문구는 귀사 법무가 작성·검토해야 합니다."}, {"t": "checklist", "id": "commercial-msa", "title": "MSA 검토 개념", "items": ["**문서 우선순위**: MSA, SOW, 범위 변경서, 제안서가 충돌할 때 무엇이 우선하는지 정했다 (관측: 핵심 첨부가 나머지 첨부보다 우선)", "**지식재산과 결과물 소유**: 귀사 방법론·도구·노하우는 귀사 소유로 재사용하고, 고객 자료는 고객 소유이며, 결과물은 내부 사용 목적의 영구·비독점·양도 불가 라이선스로 정했다", "**소스 코드**: 맞춤 코드의 소스 제공은 별도 소스 코드 라이선스로 처리한다고 정했다", "**비밀유지**: 합리적 보호 의무, 종료 시 반환·파기, 표준 예외, 존속 기간을 정했다 (관측: 3년)", "**보증과 결과 면책**: 숙련 인력과 합리적 주의를 보증하고, 유일한 구제를 재수행 또는 인력 교체로 두며, 결과와 효과 예측은 보장하지 않는다고 정했다", "**책임 제한**: 해당 SOW 대금 또는 직전 일정 기간 지급액을 한도로 하고, 간접·결과 손해를 상호 제외했다 (관측: SOW 총액, 직전 24개월)", "**인수 방식**: 인수 없음(결과물)과 인수 대상 산출물을 구분하고, 검토 기간 5–10영업일, 무응답 시 간주 인수, 최대 2회 개정 발행을 정했다", "**수행 조건**: 고객 책임·가정이 충족되지 않으면 범위·일정·비용을 조정하거나 작업을 중지할 권리를 넣었다", "**해지**: 귀책 해지의 서면 통지와 30일 치유 기간, 장기 불가항력(관측: 60일 이상) 시 해지, 선불 잔액 처리 방식을 정했다", "**데이터 보호·데이터 위치**: 데이터 처리 약정(DPA), 테넌트 데이터 센터 지역, 최소 접근과 종료 시 접근 회수를 정했다", "**하도급**: 고객 사전 동의 여부와 하도급사 기존 IP 목록 제출을 정했다 (관측: 후기 계약에서 사전 동의로 바뀜)", "**직원 유인 금지(non-solicitation)**: 관측 자료에는 없지만 인력 이탈 방지를 위해 넣었다 (권장)", "**수출 통제·최종 용도**: 금지 국가·당사자·용도와 통제 자료 노출 시 온사이트 중지를 정했다", "**기타**: 독립 계약자, 상계 금지, 제품 로드맵 발언은 납품 약속이 아니라는 점을 넣었다"]}, {"t": "sec", "id": "autodesk", "text": "Autodesk 라이선스 맥락과 공동 영업"}, {"t": "p", "text": "고객은 Fusion Manage 라이선스를 Autodesk나 리셀러에서 구독형 또는 사용량 기반 계약으로 삽니다. 귀사는 그와 별개로 **서비스**를 팝니다. 라이선스 가격이나 조건을 고객에게 약속하지 말고, 아래 맥락만 이해하십시오. 아래 내용은 배경 정보이며, 최신 기준은 Autodesk 담당자에게 확인하십시오."}, {"t": "list", "title": "라이선스 맥락이 서비스 설계에 미치는 영향", "items": ["**역할 설계가 라이선스 사용량을 바꿉니다.** 관측 계약에서는 전체 권한 사용자가 로그인한 날만 사용량으로 계산되었고, 기본 권한의 조회는 계산되지 않았습니다. 권한 매핑 때 전체 권한은 꼭 필요한 역할에만 주십시오.", "**연동·시스템 계정에도 라이선스가 필요합니다.** 연동 계정에는 상위 등급 라이선스가 필요했고, 샌드박스 테넌트에서도 마찬가지였습니다. 자동화는 선언된 서비스 계정 하나로 운영하는 편이 안전했습니다.", "**비운영 테넌트도 셉니다.** 개발·테스트 테넌트 로그인도 사용량에 포함되어 따로 차감해야 했습니다.", "**테넌트 수는 계약상 권리입니다.** 두 번째 샌드박스는 비표준이라 별도 연간 구독 대상이었습니다. 고객에게 추가 테넌트를 약속하기 전에 확인하십시오.", "**운영 전환 지연은 고객의 라이선스 가치를 깎습니다.** 사용량이 늦게 오르면 스폰서 압박이 커집니다. 귀사의 일정 약속은 고객의 라이선스 투자와 연결됩니다.", "**고객의 갱신 준비는 약 10개월 전부터 시작됩니다.** 다음 단계 SOW 제안을 그 일정에 맞추십시오([[roadmap|13 로드맵]])."]}, {"t": "tiles", "title": "Autodesk와의 공동 영업·협업 패턴", "items": [{"tag": "관측", "title": "Autodesk 프로그램 안의 파트너 수행", "text": "Autodesk가 이끄는 프로그램에 파트너 참여만 다루는 작업 요청이 따로 있었습니다(예: 24h 이관 지원). 고객은 그 시간 안의 산출물을 나열하라고 요구했습니다."}, {"tag": "관측", "title": "파트너 직접 견적 + Autodesk 감독", "text": "두 워크스트림은 엔지니어링 서비스 파트너가 고객에게 직접 견적했고, Autodesk는 감독용 자문 시간만 남겼습니다."}, {"tag": "관측", "title": "Autodesk의 하도급", "text": "교육 콘텐츠 작성 같은 일을 하도급 작업 범위서로 맡겼습니다. 작업, 납기가 있는 산출물, 원청의 인수, 고정 수수료(완료 시 또는 마일스톤), 사전 승인 경비와 상한이 들어갔습니다."}, {"tag": "관측", "title": "고객 성공 계획 속 파트너 과제", "text": "고객 성공 계획의 실행 과제 표에 파트너 수행 과제를 따로 표시했습니다."}, {"tag": "권장", "title": "귀사 단독 서비스 + Autodesk 라이선스", "text": "신규 파트너에게 가장 흔한 모델입니다. 디스커버리 결과와 사용자·역할 계획을 Autodesk 담당자와 공유해 라이선스 구성과 서비스 범위를 맞추십시오."}]}, {"t": "list", "title": "공동 영업 실행 수칙 (권장)", "items": ["원청과 하도급, 담당 범위, 고객 접점을 Autodesk 계정 팀과 서면으로 합의합니다.", "같은 고객에게 Autodesk 서비스와 귀사 서비스가 겹치지 않도록 범위 경계를 RACI로 정리합니다([[team|09 팀과 거버넌스]]).", "레거시 PDM이나 특수 도구 전문 협력사가 필요하면 첫날부터 참여시킵니다. 관측 사례에서는 전문가가 늦게 합류해 속성 매핑에 시간이 지나치게 들었습니다.", "영업 기회 등록과 공동 영업 절차는 Autodesk 파트너 프로그램 규정을 따릅니다."]}, {"t": "quiz", "items": [{"q": "신규 고객의 현행·목표 설계 단계에 권장되는 상업 모델은?", "options": ["T&M 상한형 또는 소규모 고정가, 예비 30% 이상", "전체 구축을 포함한 일괄 고정가", "무상 디스커버리"], "answer": 0, "why": "관측된 평가·설계 단계는 +10%~+213% 초과했습니다. 불확실성이 큰 단계는 상한형 T&M이나 작은 고정가로 분리하고, 구축은 To-Be 승인 뒤에 확정합니다."}, {"q": "리테이너 고객이 시작 10일 전에 예약 작업을 미뤘습니다. 관측 규칙을 넣었다면?", "options": ["시간이 그대로 남는다", "절반만 차감한다", "15일 규칙에 따라 예약 시간을 사용한 것으로 본다"], "answer": 2, "why": "시작 15일 이내의 일정 변경은 사용으로 간주했습니다. 귀사가 대기시킨 인력에 대한 보호 장치입니다."}, {"q": "PM 15%, 예비 20%를 기본값으로 쓰는 근거는?", "options": ["업계 평균이기 때문", "관측 PM이 8–20%였고, 예비 5–10%로 서명한 변경 주문도 21–72% 초과했기 때문", "고객이 요구하기 때문"], "answer": 1, "why": "관측된 PM 비율과 실제 초과율에서 나온 기본값입니다. 15% 미만으로 낮추려면 사유를 남기십시오."}, {"q": "월간 보고에서 시간 소진이 계획보다 앞서 있습니다. 올바른 해석은?", "options": ["프로젝트가 앞서 있다", "소진율은 진척률이 아니므로 마일스톤·운영 전환 진척을 따로 확인한다", "리테이너 규모를 줄인다"], "answer": 1, "why": "관측 프로그램은 시간 소진이 앞섰지만 운영 전환은 뒤처졌습니다. 소진과 마일스톤을 나란히 보고해야 합니다."}]}]}, {"id": "risk", "num": "07", "group": "contract", "title": "리스크는 *착수 30일 안에* 막는다", "short": "리스크·안전장치", "goal": "관측 프로젝트에서 반복된 리스크의 원인·영향·안전장치를 이해하고, 착수 30일 안에 안전장치 조항·RAID 로그·에스컬레이션 경로를 갖출 수 있습니다.", "facts": [["학습 시간", "40분"], ["대상", "PM·딜리버리 리드·영업"], ["산출물", "RAID 로그·안전장치 조항"]], "blocks": [{"t": "lead", "text": "관측 프로젝트의 지연과 초과는 대부분 기술이 아니라 **고객 쪽 일정, 의존성, 범위 확대**에서 나왔습니다. 그리고 그 대부분은 착수 때 문서와 회의 체계로 미리 막을 수 있었습니다."}, {"t": "sec", "id": "growth", "text": "범위는 커진다: 관측된 성장"}, {"t": "bars", "title": "기능별 SOW 공수 성장 배수 (최초 → 최종)", "subtitle": "작게 시작한 기능이 가장 크게 자랐습니다", "unit": "×", "items": [{"label": "설계 변경 확산 (\"시작할 수 있게\" 40h로 출발)", "value": 13, "hi": true}, {"label": "제품 포트폴리오·단종 관리", "value": 8.9}, {"label": "Items & BOMs 확산 (프로그램 예산 맞춤 포함)", "value": 4.6}, {"label": "관리자 도구·교육 (프로그램 예산 맞춤 포함)", "value": 4.5}, {"label": "ERP 연동 (\"범위 변경 없음, 예상 밖 복잡도\")", "value": 2.5}, {"label": "제품 계층", "value": 2.15}, {"label": "자산 관리 PoC", "value": 1.66}, {"label": "공급업체 관리", "value": 1.6}, {"label": "레거시 PLM 이관 (보류, 미사용 반환)", "value": 0.71}], "note": "두 번째 계약 주기의 요청서 13건은 약 2,391h에서 약 4,797h로 약 2배가 되었습니다. 일부는 프로그램 예산에 맞춘 조정이고, 나머지는 범위·복잡도 증가입니다."}, {"t": "table", "title": "어느 단계가 늘었나: 개정 방향 (관측, 첫 계약 주기)", "head": ["요청서 유형", "최초(h)", "최종(h)", "변화"], "num": [1, 2, 3], "rows": [["목표(To-Be) 설계, Items & BOMs", "40", "125.25", "+213%"], ["데이터 필드 매트릭스", "32", "68", "+113%"], ["현행(As-Is) 분석, PDM 사이트", "48", "66", "+38%"], ["목표(To-Be) 설계, PDM 사이트", "78", "104", "+33%"], ["프로세스 정의·구성 지원", "24", "30", "+25%"], ["상세 계획", "80", "88", "+10%"], ["구축 (PDM 이관)", "320", "304.25", "−5%"], ["업그레이드 지원", "96", "93", "−3%"], ["구축·구현 (PDM 이관)", "472", "385.75", "−18%"], ["상세 계획 갱신", "40", "28", "−30%"]], "note": "늘어난 개정은 모두 평가·설계·계획 단계였습니다. 구축 요청서는 견적을 지키거나 시간을 반환했습니다."}, {"t": "p", "text": "**그래서 파트너는?** 디스커버리·설계에는 예비 30% 이상을 두고 별도 SOW로 분리합니다. 구축 견적은 To-Be 승인 뒤에 확정합니다. \"일단 작게 시작\"할 때는 SOW에 **재견적 시점**(예: To-Be 승인 직후)을 적어 고객 예산 담당자가 놀라지 않게 합니다([[commercial|06 계약·상업 모델]])."}, {"t": "sec", "id": "top", "text": "주요 리스크: 원인 → 영향 → 안전장치"}, {"t": "table", "head": ["리스크", "원인 (관측)", "영향 (관측)", "안전장치"], "rows": [["설계 승인 지연", "검토자의 제품 이해 부족, \"써 봐야 판단할 수 있다\"는 반응, 버전 간 변경 표시 누락", "To-Be 승인 약 3개월, Items & BOMs 설계 승인 약 3개월 지연", "SOW에 검토 기한(N영업일)과 초과 시 일정 재조정 명시, 검토자 사전 교육, 목업 시연, 버전마다 변경 표시"], ["디스커버리 초과", "현행 워크숍이 목표 설계로 번짐, 고객 인력의 기존 도구 경험 부족, 반복된 보완 요청", "평가·설계 요청서 +10%~+213% 초과", "현행과 목표를 별도 라인으로 분리, 워크숍 횟수 상한, 예비 30% 이상, 주간 소진 공유"], ["연동 의존 (고객 팀·ERP 로드맵)", "ERP 팀 가용성, ERP 측 전용 인터페이스 버전 신설, 12개월을 넘는 연동 로드맵 부재", "연동 재작업 2–4주, 고객 구축 연동에 묶인 Items & BOMs 파일럿 14개월 지연", "고객이 구축·테스트하고 귀사는 정의·자문(시스템당 9–14인일), 고객 구축 연동 미테스트 조항, ERP가 PLM 소유 필드를 덮어쓸 때의 RACI·롤백 합의"], ["레거시 이관 보류", "ERP 업그레이드 계획이 5개월째에 드러남, \"모든 레거시 프로세스 찾기\" 요구로 범위 확대", "디스커버리가 견적의 약 60% 소진, 재견적 +73%, 약 7.5개월에 보류", "디스커버리를 별도 SOW로, 착수 때 전사 IT 로드맵 질문, 보류 시 미사용 시간 반환과 재착수 조건"], ["파일럿 사이트 변경", "사이트 폐쇄, 파일럿 범위 오해(운영 전환 며칠 전 \"그 사이트는 파일럿이 아니다\")", "Items & BOMs 1단계 종료까지 약 25개월", "파일럿 사이트·사용자·코디네이터를 서면으로 확인, 사이트 변경은 범위 변경서"], ["팀 교체 후 재착수", "고객 핵심 팀을 새로 구성", "재착수 +80h, 280h 중 231.5h를 쓴 뒤 1단계 범위로 축소", "핵심 인원 변경 2주 전 통보, 재착수 공수는 범위 변경서로 별도 산정"], ["UAT 2배 지연", "테스터 겸직, 휴가, 아무도 참석하지 않은 세션", "UAT 약 7주(계획 2–3주), 몇 주 뒤에도 진행률 약 30%", "라운드·일수 상한, 테스트일 블록 예약, 연장은 범위 변경서, 기간 산정에 ×1.5"], ["테스터 피로", "연동 인계 후 한참 뒤에 테스트 시작, 늦은 결함 발견, 길어진 UAT", "현업 이탈, 사이트 리드의 관심 저하", "짧은 라운드, 코디네이터가 실제 시나리오로 화면을 진행하는 세션, UAT 전 키유저 교육, 주 20% 시간 확약"], ["소규모 요청을 통한 범위 확대", "\"작은 것 하나만\"의 누적, 지원 문의가 새 요구사항으로 바뀜", "한 분석 주문에서 사용 시간의 41%가 범위 외, 운영 후 약 11개월간 변경 요청 약 130건", "소규모 요청 로그, 10% 버퍼의 명시적 사용, CCB(변경 심의 위원회) 분류, UAT 중 고도화 접수 금지, 결함·고도화 판정 기준"], ["스폰서십 상실", "초기 스폰서 이탈, PMO가 주도하지 않음, 사이트 리드 이탈", "확산 단계 평균 약 269일 지연", "운영위원회, 과제별 고객 PM 지정, 인사 변경 후 리더십 재확인, QBR에서 지연 비용을 개월 단위로 제시"], ["노사협의회·직원 우려", "개인 성과 감시 우려(승인 시간 비교·순위), 클라우드 호스팅과 해외 관리자 접근 우려", "한 국가의 사이트들이 노사협의회 승인을 약 12개월 대기", "목적 제한·개인 평가 미사용 원칙 지원, 팀·사이트 단위 집계 대시보드, 초기 시연, 승인 기간을 일정에 반영"], ["맞춤 도구 지원 경계", "웹 앱·동기화 도구의 소스 코드 라이선스(SCLA) 미체결, 단일 개발자 의존", "UAT 중단, 코드 인수인계 약 1개월 지연, 인수인계 전까지 API 변경 영향은 공급사 책임이라는 고객 인식", "PoC 조항, 소스 코드 라이선스 조건을 SOW에 미리 명시, 코드 문서와 구조 설명, 대체 개발자, 운영 지원 주체 명시"], ["선불 시간 만료", "일정 지연, 만료 전 예약 실패", "교육·이관이 다음 계약으로 밀림, 서둘러 착수한 과제의 인력·문서 부족", "월간 소진 보고, 만료 90일 전 경보, 15일 규칙, 착수 전제조건 확인"], ["데이터 준비 미흡", "부정확하거나 비어 있는 ERP 추출, 반복 동기화", "기능 효과 미실현, 별도 데이터 정제 프로젝트 필요", "데이터 준비는 고객 책임, 추출 형식 통일·매핑 승인·대상 정의 동결 뒤 로드, 정제는 별도 범위([[data|10 데이터 이관과 연동]])"]]}, {"t": "callout", "kind": "warn", "title": "가장 비싼 리스크는 고객 쪽 일정입니다", "text": "관측 기록에서 추정한 지연 원인을 빈도순으로 보면 고객 예산 승인, ERP 팀 가용성, 개발자 가용성, 설계서 승인 대기, 고객 긴급 상황, 조직 개편·휴가 순이었습니다. 귀사가 통제할 수 없는 일정이므로 **SOW에 기한과 처리 규칙을 적고, 기간 견적에 ×1.5를 곱하십시오.**"}, {"t": "sec", "id": "first30", "text": "착수 30일 안에 갖출 안전장치"}, {"t": "p", "text": "아래 항목은 착수 회의부터 첫 월간 보고까지 30일 안에 끝냅니다. 빠진 항목은 운영위원회 첫 안건으로 올립니다. (권장) 전체 착수 체크리스트는 [[checklists|15 체크리스트]]에 있습니다."}, {"t": "checklist", "id": "risk-first30", "title": "착수 30일 안전장치 체크리스트", "items": ["서명된 SOW와 고객 승인권자(대리 포함)를 확정하고, 승인 증빙 보관 폴더를 만들었다", "고객 PM, 스폰서, 키유저 명단을 받고 키유저의 설계·UAT 기간 주 20% 시간 확약을 받았다", "파일럿 사이트·사용자·코디네이터를 서면으로 확인했다", "To-Be 검토·승인 기한(N영업일)과 기한 초과 시 처리 규칙을 합의했다", "고객 ERP·미들웨어·IT 담당자와 향후 12개월 IT 로드맵(ERP 업그레이드 등)을 확인했다", "데이터 준비 책임자, 추출 형식, 샘플 데이터 일정을 정했다", "테넌트 데이터 센터 지역과 테넌트 이름을 확정했다 (이름은 나중에 바꿀 수 없음)", "RAID 로그를 열고 상위 리스크 5개에 담당자와 기한을 붙였다", "소규모 요청 로그와 10% 버퍼 사용 규칙을 고객과 공유했다", "조사·준비·문서 작성 시간도 공수에 포함된다는 점을 착수 회의에서 알렸다", "고객 휴가·연말·생산 성수기 일정을 계획에 반영했다", "노사협의회·개인정보·보안 검토가 필요한지 고객에게 확인했다", "맞춤 코드가 있다면 PoC 조항, 소스 코드 라이선스 조건, 운영 지원 주체를 합의했다", "운영위원회 일정과 에스컬레이션 경로를 합의했다", "첫 월간 소진·현황 보고를 발행했다 (소진과 마일스톤 진척을 함께 표시)"]}, {"t": "sec", "id": "clauses", "text": "서면 안전장치 조항 라이브러리"}, {"t": "template", "title": "안전장치 조항 라이브러리 (SOW·MSA 초안용)", "intro": "관측 계약과 요청서에서 효과가 확인된 안전장치를 문구 예시로 정리했습니다. 문구는 개념 예시이며, 사용 전 귀사 법무 검토가 필요합니다. SOW 전체 구조는 [[sow|05 SOW 작성]]을 참조하십시오.", "sections": [{"h": "범위와 상한", "items": ["모든 회의, 워크숍, UAT 라운드, 결함 수정, 운영 전환 지원은 \"최대\" 기준이며, 더 짧게 완료될 수 있습니다.", "구축은 승인된 목표(To-Be) 설계서를 따르며, 견적은 승인된 To-Be에 따라 조정될 수 있습니다.", "구성은 표준 테넌트를 기준으로 하며, 설계서에 명시되지 않은 사항은 범위에 포함되지 않습니다.", "SOW 총 공수를 넘는 작업은 범위 외이며, 범위 변경서로만 추가합니다."]}, {"h": "고객 책임과 수행 조건", "items": ["고객은 UAT를 수행하고, 잔여 공수 안에서 결함 우선순위를 정합니다.", "고객은 다음 단계 전에 To-Be와 구현 계획을 승인합니다. 검토 기간은 <N>영업일이며, 통합 의견 1부로 회신합니다.", "고객 책임이 이행되지 않거나 가정이 사실과 다르면, 귀사는 범위·일정·비용 조정을 요청하거나 합의 시까지 작업을 중지할 수 있습니다.", "서비스는 고객의 전문적 판단과 테스트를 대체하지 않습니다."]}, {"h": "일정과 인력", "items": ["고객은 일정·시간 변경을 2주 전에 통보합니다.", "시작일 15일 이내의 변경·취소는 예약 시간을 사용한 것으로 봅니다.", "고객 핵심 인원 교체로 필요한 재착수 공수는 범위 변경서로 산정합니다.", "온사이트는 2주 전에 요청하며, 방문일당 최소 8시간을 차감합니다."]}, {"h": "연동과 데이터", "items": ["고객 연동은 고객 팀이 구축·테스트·운영합니다. 귀사는 고객이 구축한 연동을 테스트하지 않습니다.", "ERP·Vault에서 채워지는 필드는 고객이 검토합니다.", "데이터 정제·변환·이관은 범위 외입니다. 고객은 백업, 환경, 접근 권한, 저장 공간을 제공합니다.", "귀사는 제3자 벤더 조율에 책임지지 않습니다."]}, {"h": "소프트웨어와 도구", "items": ["스크립트를 넘는 소프트웨어 개발 결과는 PoC 또는 프로토타입이며, 운영 배포와 유지보수는 별도 계약입니다.", "소스 코드는 별도 소스 코드 라이선스를 체결한 뒤 제공합니다.", "맞춤 도구는 Autodesk 지원 대상이 아니며, 운영 지원은 <고객 또는 귀사 유지보수 계약>이 담당합니다.", "Autodesk 제품 결함은 Autodesk 지원 경로로 처리하며, 제3자 제품 결함은 범위 외입니다."]}, {"h": "공수와 상업", "items": ["실제 공수는 견적을 10%까지 초과할 수 있으며, 그 이상은 범위 변경서로 처리합니다.", "미사용 시간은 상업 모델에 따라 종료일에 소멸하거나 정산 개정으로 반환합니다.", "과제가 보류되면 미사용 시간을 반환하고, 재개할 때 재착수 공수를 별도로 산정합니다.", "조사·준비·문서 작성 시간도 공수에 포함됩니다."]}, {"h": "결과, 데이터, 접근", "items": ["효과 예측은 논의용이며 결과를 보장하지 않습니다.", "귀사는 비밀번호를 요청하지 않으며, 계약된 서비스에 필요한 범위만 접근합니다. 종료 시 고객이 모든 접근을 회수합니다.", "대시보드와 보고서는 기본적으로 팀·사이트 단위 집계로 설계합니다. 개인 단위 보기는 고객의 내부 합의 후에 추가합니다."]}]}, {"t": "callout", "kind": "rule", "title": "계약 조항은 반드시 귀사 법무 검토", "text": "조항 라이브러리는 관측된 안전장치를 정리한 개념 예시이며 법률 자문이 아닙니다. 특히 작업 중지 권리, 사용 간주, 소스 코드 라이선스, 책임 관련 문구는 법무 검토 후 쓰십시오."}, {"t": "sec", "id": "raid", "text": "RAID 로그와 노출도 점수"}, {"t": "p", "text": "RAID 로그는 리스크(Risk), 조치(Action), 이슈(Issue), 결정(Decision)을 한곳에 모은 로그입니다. A·D를 가정(Assumption)·의존성(Dependency)으로 쓰는 변형도 있습니다. 관측 프로그램은 리스크·조치·이슈·결정·교훈을 함께 관리했습니다. 약 21개월 시점에는 리스크 21건, 조치 약 150건, 이슈 12건, 결정 8건이었고, 27개월에는 리스크 약 30건, 조치 약 225건으로 늘었습니다. 로그가 커질수록 **노출도 점수로 우선순위**를 정해야 합니다."}, {"t": "table", "title": "RAID 로그 열 구성", "head": ["열", "내용"], "rows": [["ID·유형", "R-001, A-001, I-001, D-001 형식. 유형은 리스크, 조치, 이슈, 결정, 교훈"], ["제목·설명", "무엇이 일어날 수 있는가(리스크), 무엇이 일어났는가(이슈)"], ["원인·의존성", "고객 팀, ERP 로드맵, 제3자 등 출처"], ["영향 대상", "일정, 공수, 범위, 품질, 가치 중 해당 항목"], ["발생 가능성 (1–5)", "1 희박, 3 가능, 5 거의 확실"], ["영향도 (1–5)", "1 경미, 3 마일스톤 지연, 5 운영 전환·예산 위협"], ["노출도", "발생 가능성 × 영향도 (최대 25)"], ["대응 전략·조치", "완화, 회피, 수용, 이전 중 선택과 구체적 조치"], ["담당자·기한", "귀사 또는 고객 담당자 1명, 기한 날짜"], ["상태·상향 여부", "진행, 종결, 이슈로 전환. 운영위원회 상향 여부"], ["갱신일·비고", "마지막 검토일, 관련 SOW·범위 변경서 번호"]]}, {"t": "table", "title": "노출도 등급과 처리 (권장)", "head": ["노출도", "등급", "처리"], "num": [0], "rows": [["15–25", "빨강", "운영위원회 보고, 담당자·기한 1주 이내, 필요하면 범위 변경서"], ["8–14", "주황", "주간 회의에서 검토, 완화 조치 진행 확인"], ["1–7", "초록", "월간 검토, 상황이 바뀌면 재평가"]], "note": "관측 로그에는 \"기능 범위 미정·사이트 특화 설계\" 리스크가 노출도 20/25로 기록되었습니다. 핵심 팀 검토, 경영진 시연, 전사 공통 설계로 완화했습니다."}, {"t": "sec", "id": "escalation", "text": "에스컬레이션 경로"}, {"t": "steps", "title": "4단계 에스컬레이션 (기한은 권장값)", "items": [{"title": "실무 해결", "text": "귀사 PM과 고객 PM이 해결합니다. RAID에 기록하고 담당자와 기한을 붙입니다.", "meta": "기한: 2영업일 · 담당: 양측 PM"}, {"title": "주간 코어 팀 회의", "text": "해결되지 않으면 주간 회의 안건으로 올립니다. UAT 연장 같은 결정은 이 회의에서 합의하고 결정 로그에 남깁니다.", "meta": "기한: 다음 주간 회의 · 관측: 새 요구는 주간 회의에서 먼저 합의"}, {"title": "운영위원회", "text": "범위·일정·예산에 영향이 있으면 운영위원회에 선택지 2–3개와 권장안 1개를 올립니다.", "meta": "기한: 월간 또는 수시 소집 · 관측: 후보안 3개 + 권장안 1개 형식"}, {"title": "경영진 스폰서·QBR", "text": "스폰서십 상실이나 장기 지연은 경영진에게 지연 비용을 개월 단위로 보여 줍니다.", "meta": "관측: QBR 가치 슬라이드에 지연 개월 수 제시"}]}, {"t": "list", "title": "에스컬레이션 메모 구성", "items": ["문제 한 줄과 발생일", "영향: 일정(주), 공수(h), 가치(지연 개월)", "원인과 지금까지의 조치", "선택지 2–3개와 선택지별 공수·일정 영향", "권장안 1개와 근거", "필요한 결정과 결정 기한"]}, {"t": "p", "text": "회의 체계와 역할 분담은 [[team|09 팀과 거버넌스]], 운영 전환 이후의 변경 심의는 [[support|12 지원·유지보수·도입 확산]]에서 다룹니다."}, {"t": "quiz", "items": [{"q": "관측 프로젝트에서 SOW 개정으로 공수가 늘어난 단계는?", "options": ["구축(구성) 단계", "평가·설계·계획 단계", "종료 단계"], "answer": 1, "why": "늘어난 개정은 모두 현행 분석, 목표 설계, 데이터 정의, 계획 단계였습니다. 구축 요청서는 견적을 지키거나 시간을 반환했습니다."}, {"q": "고객이 자체 미들웨어 팀으로 ERP 연동을 구축합니다. 가장 적절한 안전장치는?", "options": ["고객 팀이 구축·테스트하고 귀사는 정의·자문을 맡으며, 고객이 구축한 연동은 테스트하지 않는다고 적는다", "귀사가 연동 테스트까지 책임진다고 적는다", "연동 일정은 SOW에서 언급하지 않는다"], "answer": 0, "why": "관측된 연동 지연은 고객 ERP 팀의 가용성과 로드맵에서 나왔습니다. 책임 경계를 문서로 나눠야 귀사 일정이 고객 일정에 묶이지 않습니다."}, {"q": "RAID 리스크의 발생 가능성이 4, 영향도가 5입니다. 권장 처리는?", "options": ["월간 검토", "주간 회의 검토", "운영위원회에 보고하고 1주 이내로 담당자·기한 지정"], "answer": 2, "why": "노출도 20은 빨강 등급입니다. 관측 로그에서도 노출도 20/25 리스크는 경영진 시연과 전사 공통 설계로 대응했습니다."}, {"q": "착수 30일 안에 파일럿 사이트를 서면으로 확인해야 하는 이유는?", "options": ["관측 사례에서 운영 전환 며칠 전에 한 사이트가 파일럿이 아니라는 사실이 드러났기 때문", "라이선스 계산에 필요하기 때문", "법적 의무이기 때문"], "answer": 0, "why": "파일럿 범위 오해로 사용자 등록이 누락되었습니다. 파일럿 사이트·사용자·코디네이터를 서면으로 확인하고, 변경은 범위 변경서로 처리하십시오."}]}]}, {"id": "method", "num": "08", "group": "deliver", "title": "단계마다 *관문*을 두는 딜리버리", "short": "딜리버리 방법론", "goal": "이 모듈을 마치면 착수부터 종료까지 9개 단계에 진입 조건과 종료 관문을 붙이고, To-Be 승인·UAT·운영 전환을 기한과 상한이 있는 절차로 운영할 수 있습니다.", "facts": [["학습 시간", "45분"], ["대상", "PM·리드 컨설턴트·컨설턴트"], ["산출물", "단계 관문표·컷오버 계획·개발 가이드라인"]], "blocks": [{"t": "lead", "text": "관측 프로젝트에서 일정이 무너진 곳은 구성 작업이 아니라 **승인 대기와 고객 테스트**였습니다. 구축 공수는 대체로 견적 안에 들어왔지만, To-Be 승인은 수주에서 수개월, UAT는 계획의 약 2배가 걸렸습니다. 그래서 단계마다 “무엇이 끝나야 다음으로 넘어가는가”를 관문으로 정하고, 그 관문을 SOW에 적습니다."}, {"t": "sec", "id": "phases", "text": "9단계 모델과 관문"}, {"t": "stats", "items": [{"value": "~3개월", "label": "목표(To-Be) 설계 승인 대기 (관측, 여러 프로젝트)"}, {"value": "10–25주", "label": "주요 프로젝트마다 발생한 UAT 일정 지연 (관측)"}, {"value": "~2×", "label": "다사이트 키유저 UAT의 실제 기간 ÷ 계획 기간 (관측)"}, {"value": "+10–213%", "label": "디스커버리·설계 단계 초과 폭. 구축은 대체로 견적 내 (관측)"}]}, {"t": "p", "text": "관측된 상태 보고서는 착수 → 디스커버리(현행·목표) → 구축 → UAT → 운영 전환 → 종료의 6단계 막대를 썼습니다. 파트너는 이를 **9단계**로 나눠 관리하는 것을 권장합니다. 상세 계획·운영 전환·하이퍼케어를 독립 단계로 두어야 각 단계의 공수와 종료 관문이 SOW와 일정표에 그대로 보이기 때문입니다."}, {"t": "flow", "title": "정의 구간(1–4단계)", "items": [{"title": "착수", "text": "목표·역할·일정·소통 방식과 RAID를 합의합니다"}, {"title": "현행(As-Is)", "text": "워크숍으로 현재 프로세스를 기록하고 서면 승인을 받습니다"}, {"title": "목표(To-Be) 설계", "text": "하드 관문. 버전이 명시된 서면 승인 전에는 구축하지 않습니다", "hi": true}, {"title": "상세 계획", "text": "작업·담당·의존성·고객 투입 시간을 확정합니다"}]}, {"t": "flow", "title": "구축·전환 구간(5–9단계)", "start": 4, "items": [{"title": "구축·검증", "text": "dev 구성, 내부 테스트, 검증 라운드, 품질 관문"}, {"title": "UAT", "text": "고객이 수행하고 파트너는 상한 안에서 결함을 고칩니다", "hi": true}, {"title": "운영 전환", "text": "복제·스모크 테스트·퍼지·진행 중 데이터 이행"}, {"title": "하이퍼케어", "text": "약 2주 집중 지원 후 운영 지원 체계로 넘깁니다"}, {"title": "종료", "text": "인계·성과 확인·잔여 공수 정산·종료 보고"}]}, {"t": "table", "title": "단계별 진입 조건·활동·산출물·종료 관문", "head": ["단계", "진입 조건", "주요 활동", "산출물", "종료 관문", "공수 S / M / L"], "rows": [["착수(모빌라이제이션)", "SOW 서명, 고객 인가 요청자·키유저 명단 확보", "착수 회의(최대 1h), 리스크 로그 사전 공동 작성, 소통 방식 합의", "착수 자료, RACI, RAID 초기본, 일정표", "고객 투입 인원·테스터 후보·휴가 일정 확인", "8 / 16 / 24h"], ["현행(As-Is) 분석", "참석자 확정, 사전 질의서(RFI)·SOP 수령", "2h 원격 워크숍 최대 7회(현장 1일로 통합 가능), 고객 과제", "현행 문서, 이해관계자 맵, 데이터 요청 목록", "현행 문서 서면(메일) 승인", "48 / 80 / 244h (워크스트림당)"], ["목표(To-Be) 설계", "현행 승인, 데이터 필드 매트릭스 착수", "정렬 워크숍(최대 3h), 설계 결정 정리, 워크스루 회의", "비즈니스용 Future State + 구성 사양(테넌트 구성 내보내기 첨부)", "**하드 관문**: 버전이 명시된 서면 승인", "60 / 120 / 200h"], ["상세 계획", "To-Be 승인", "작업 분해, 선후행, 변경 동결·휴가 반영, 고객 투입 시간 산정", "상세 일정(작업·담당·선후행), 테스트 전략, 컷오버 초안", "고객이 일정과 투입 인원을 승인", "28 / 48 / 88h"], ["구축·검증", "상세 계획 승인, 샌드박스 준비", "dev 구성·스크립트, 내부 기능 테스트, 검증 라운드 2회, 4-eyes 검토", "dev 테넌트, 구현 트래커, 고객이 작성한 UAT 스크립트", "Pre-UAT 품질 관문 통과(중대 결함 0, 검토 기록)", "샌드박스 24 / 40 / 60h + 기능별 구축"], ["UAT", "테스터 교육 완료, 스크립트·테스트 데이터 준비", "고객 실행, 결함 분류, 상한 안 수정, 재테스트", "UAT 결과표, 이슈 로그, 테스터 서면 승인", "라운드 종료 go/no-go, 운영 이관 승인", "80 / 120 / 200h"], ["운영 전환", "UAT 승인, 컷오버 계획 승인", "복제, 스모크 테스트, 그룹·역할, 퍼지, 이행 데이터, PROD 확인", "컷오버 체크리스트, 운영 테넌트, 관리자 인계 기록", "PROD 1일 집중 점검 통과, 전환 공지 발송", "46 / 80 / 156h"], ["하이퍼케어", "운영 전환 완료", "약 2주 집중 지원(컨설턴트당 주 2h + 주 30분 점검 콜), 변경 요청 분류", "하이퍼케어 이슈 목록, 개선 옵션별 공수", "미결 중대 이슈 0, 운영 지원 체계로 이관", "16 / 24 / 40h"], ["종료(클로즈아웃)", "하이퍼케어 종료(관측: 운영 전환 약 2개월 후)", "종료 회의(최대 1–2h), 성과·교훈 정리, 잔여 공수 정산, 접근 권한 회수", "종료 보고서·자료, As-built 최종본, 다음 단계 제안", "고객 확인(인수가 아닌 확인), 저장소 정리", "4 / 8 / 16h"]], "note": "공수는 관측 기반 S/M/L 벤치마크(1인일 = 8h)이며 [[estimate|03 견적 계산기]]의 같은 이름 항목과 일치합니다. 기능별 구축 공수(설계 변경 180 / 360 / 540h, Items & BOMs 280 / 552 / 760h 등)는 [[catalog|04 프로젝트 유형 카탈로그]]를 보십시오."}, {"t": "callout", "kind": "tip", "title": "디스커버리와 구축을 서로 다른 SOW로 나누십시오 (권장)", "text": "관측된 첫 계약 주기(선불 시간 풀 + 워크스트림별 작업 요청서)에서는 단계마다 요청서를 따로 썼고, To-Be가 승인되어야 다음 단계가 열렸습니다. 다음 주기에서는 역량 하나를 요청서 하나로 묶고 개정으로 키웠습니다. 신규 파트너에게는 **디스커버리 SOW(착수·현행·목표·상세 계획)** 와 **구축 SOW(구축~종료)** 의 2단 구조를 권장합니다. 디스커버리는 초과하기 쉽고, 구축 견적은 To-Be가 확정된 뒤에야 정확해지기 때문입니다(관측: 레거시 이관은 To-Be 시점 재견적이 +73%). 상세: [[sow|05 SOW 작성]], [[commercial|06 계약과 상업 모델]]."}, {"t": "sec", "id": "tobe", "text": "To-Be 승인은 하드 관문"}, {"t": "p", "text": "To-Be 승인 대기는 가장 흔한 일정 차단 요인이었습니다. 한 프로젝트는 승인에 약 3개월, 레거시 이관은 약 5개월이 걸렸고, Items & BOMs는 승인된 설계까지 약 12개월(계획 대비 약 3개월 지연)이 걸렸습니다. To-Be가 v4–v7까지 반복 개정된 경우도 있었습니다. 승인을 “고객이 알아서 해 주는 일”로 두지 말고, **기한과 절차가 있는 작업**으로 관리하십시오."}, {"t": "steps", "title": "To-Be 승인 절차 (시간 제한형)", "items": [{"title": "두 문서로 나눠 씁니다", "text": "현업이 읽는 **비즈니스 Future State**와 구성 수준의 **To-Be 사양**을 분리하고, 테넌트 구성 내보내기를 부록으로 붙입니다. 현업은 앞 문서를, 고객 관리자는 두 문서를 모두 검토합니다.", "meta": "관측 · 담당: 리드 컨설턴트"}, {"title": "검토 기간을 미리 정합니다", "text": "SOW에 검토 규칙을 적습니다. 관측된 서비스 주문서 조항: 검토 5영업일(대형은 10영업일), 고객은 의견을 하나로 모은 주석본 1부 반환, 보완 통화 3영업일 안, 수정본 수락 2영업일, 문서당 개정 2회까지(3회째는 범위 변경).", "meta": "관측 · 담당: PM"}, {"title": "워크스루 회의로 승인을 받습니다", "text": "문서만 보내지 말고 검토 회의를 엽니다. 회의 목표를 “변경 목록 확정” 또는 “회의 중 승인” 가운데 하나로 명시합니다. 사이트별 주석본은 컨설턴트가 회의 전에 조정합니다.", "meta": "관측 · 소요: 1–2h"}, {"title": "간주 승인 기한을 둡니다", "text": "“X일까지 회신이 없으면 승인된 것으로 봅니다”를 회의록과 메일에 남깁니다. 관측 프로젝트는 UAT에 이 규칙을 썼고, 문서 검토에는 “무응답은 간주 수락” 조항을 썼습니다.", "meta": "관측 + 권장 · 계약 문구는 법무 검토"}, {"title": "버전을 고정하고 서면으로 닫습니다", "text": "승인 메일에 버전(예: v1.4)을 적어 저장합니다. 일정표의 마일스톤은 서면 승인으로만 닫습니다. 승인 후 To-Be는 동결하고, UAT에서 나온 차이는 As-built에 기록합니다.", "meta": "관측"}, {"title": "승인 후 변경은 범위 변경서로 받습니다", "text": "새 요구는 범위 변경서(Change Request)로 공수와 일정 영향을 제시하고 승인받습니다. 승인 전에는 구축하지 않습니다.", "meta": "관측 · 담당: PM · 상세: [[commercial|06 계약과 상업 모델]]"}]}, {"t": "callout", "kind": "warn", "title": "To-Be 승인 전에는 구축하지 않습니다", "text": "예외는 하나입니다. 어려운 개념을 보여 주는 **목업**(관측: 마스터→브랜치 복사 목업 42h)은 승인 전에 만들 수 있지만, SOW에 목업 범위와 “중복 작업 없음”을 적어야 했습니다. 승인 없이 병행 구축한 프로젝트는 To-Be가 v1→v4로 바뀌는 동안 재작업과 “오늘까지 승인 부탁드립니다” 독촉 메일을 반복했습니다."}, {"t": "list", "title": "승인이 빨라지는 To-Be 작성 요령", "items": ["역할 이름이 아니라 **역량**으로 씁니다(“…를 할 수 있다”). 조직이 바뀌어도 문서가 살아남습니다.", "서문에 “표준 구성 + 차이점만” 원칙을 적고, 목업 화면에는 예시 표시를 붙입니다.", "개정본마다 변경 표시를 켭니다. 표시가 빠진 개정본은 검토 피로를 키워 승인을 늦췄습니다.", "현업 검토자에게는 선택지가 있는 흐름도와 입문 가이드로 먼저 설명합니다. 제품을 모르는 검토자는 검토 전에 짧게 교육합니다([[training|11 교육 설계]]).", "현행 문서는 실제 실무자와 검증합니다. 사이트 주석이 리더가 쓴 내용과 정면으로 어긋난 사례가 있었습니다.", "설계 결정은 번호를 붙인 목록으로 승인받습니다(관측: 설계 결정 13건을 목록으로 서명)."]}, {"t": "callout", "kind": "rule", "title": "계약 조항은 반드시 귀사 법무 검토", "text": "간주 승인, 검토 기간, 결함 수정 상한, “인수가 아닌 확인” 같은 문구는 계약 효력에 영향을 줍니다. 이 모듈의 문구는 관측된 개념 예시입니다. SOW에 넣기 전에 귀사 법무 검토를 받으십시오."}, {"t": "sec", "id": "build", "text": "반(半)애자일 구축과 검증 라운드"}, {"t": "p", "text": "구축은 폭포수와 애자일의 중간입니다. 승인된 To-Be가 **큰 틀의 지침**이고, 세부는 구축 중에 정합니다. 기능이 여러 개면 기능 단위 스프린트로 끊습니다. 관측된 기능 스프린트는 To-Be 갱신 → 구현 → 교육 → dev UAT → 운영 전환 준비 → 운영 전환 → 하이퍼케어 순서였고, 기능 1건에 약 3개월이 걸렸습니다."}, {"t": "gantt", "title": "기능 1건 스프린트 예시 (약 12주)", "subtitle": "관측된 순서에 관측 기간을 얹은 계획 틀입니다 (권장)", "cols": ["1주", "2주", "3주", "4주", "5주", "6주", "7주", "8주", "9주", "10주", "11주", "12주"], "rows": [{"label": "목표(To-Be) 갱신", "start": 0, "len": 2, "kind": "std", "text": "기능 To-Be"}, {"label": "구현(dev)", "start": 1, "len": 4, "kind": "std", "text": "구성·스크립트"}, {"label": "내부 테스트·검증 라운드", "start": 4, "len": 2, "kind": "std", "text": "스모크·검증 2회"}, {"label": "Pre-UAT 품질 관문", "start": 5, "len": 1, "kind": "gate", "text": "4-eyes"}, {"label": "테스터 교육", "start": 6, "len": 1, "kind": "run", "text": "2h × 2"}, {"label": "UAT(dev)", "start": 6, "len": 3, "kind": "std", "text": "고객 수행"}, {"label": "운영 전환 준비·PROD 확인", "start": 9, "len": 1, "kind": "run", "text": "1일 점검"}, {"label": "운영 전환", "start": 10, "len": 1, "kind": "gate", "text": "Go-live"}, {"label": "하이퍼케어", "start": 10, "len": 2, "kind": "opt", "text": "2주"}], "legend": [{"kind": "std", "text": "작업"}, {"kind": "run", "text": "교육·점검"}, {"kind": "gate", "text": "관문"}, {"kind": "opt", "text": "지원"}], "note": "관측: 계획 2–3주였던 UAT가 약 7주로 늘었고, 결함 수정은 UAT 종료 후 2주 더 이어졌습니다. 일정표에는 UAT를 2배로 잡거나 고정 2주 테스트 버퍼를 하나 두십시오."}, {"t": "table", "title": "UAT 전에 거치는 검증 단계", "head": ["단계", "수행", "기간", "종료 기준"], "rows": [["내부 기능 테스트(스모크)", "파트너 컨설턴트", "~1주 (관측)", "핵심 시나리오 실행 가능, 중대 결함 0. “UAT 사용자가 베타 테스터가 되지 않게” 합니다"], ["검증 라운드 1·2", "파트너가 시연, 키유저가 확인", "라운드당 2–3일 (관측)", "피드백 목록 종결. 1회로 끝나면 남은 2–3일은 반환합니다"], ["기능·파워유저 테스트", "고객 핵심 사용자", "2–3주 (관측)", "엔드투엔드 흐름 통과, UAT 스크립트 보완"], ["Pre-UAT 품질 관문", "작성자가 아닌 두 번째 컨설턴트(4-eyes)", "0.5–1일 (권장)", "검토 기록(체크리스트·서명)을 저장소에 남김"], ["SIT(연동이 있을 때)", "고객 IT·미들웨어 팀 + 연동 SME", "연동 범위별", "양방향 사용 사례 통과, 오류 처리 주체 확정. 상세: [[data|10 데이터 이관과 연동]]"]], "note": "관측 교훈: 여섯 개 워크스트림에서 UAT가 길어지자 테스터 피로와 고객 신뢰 하락이 겹쳤습니다. 그 뒤 내부 시스템 테스트와 4-eyes 검토를 UAT 앞에 두는 개선안이 나왔습니다."}, {"t": "callout", "kind": "rule", "title": "UAT 기간에는 구성을 동결합니다", "text": "관측 사례: UAT 도중 워크스페이스와 스크립트를 바꾸자 앞서 만든 테스트 레코드의 링크가 끊겨 레코드를 다시 만들어야 했습니다. 동결 기간에는 결함 수정만 반영합니다. 미성숙한 구성 요소(예: 웹 앱)는 1라운드에서 빼고 준비되면 별도 라운드로 넣습니다. 테스트 스크립트에는 구성 릴리스 버전을 기록합니다."}, {"t": "sec", "id": "uat", "text": "UAT 운영 방법"}, {"t": "p", "text": "UAT의 원칙은 **고객이 수행하고, 파트너는 지원한다**입니다. 고객이 스크립트를 쓰고 실행하며 결함 우선순위를 정합니다. 파트너는 스크립트 작성을 돕고 테스터를 교육하며, 정해진 일수 안에서 결함을 고칩니다. 이 분담을 SOW에 적어야 최선 노력(best effort) 모델이 안전합니다([[risk|07 리스크와 안전장치]])."}, {"t": "table", "title": "UAT 규칙과 근거", "head": ["규칙", "내용", "관측 근거"], "rows": [["고객 수행·고객 우선순위", "테스터가 실행하고 결과를 상태표로 회신합니다. 결함 우선순위는 남은 공수 안에서 고객이 정합니다", "구축 SOW마다 명시"], ["테스터 교육", "2h 원격 세션을 트랙당 2회 진행하고, 녹화해 결석자에게 제공합니다", "트랙당 2×2h. UAT 지원 패키지 112–128h"], ["결함 수정 상한", "라운드당 최대 N일. 소규모 기능 1일, PoC 2일, 단계형 파일럿은 단계당 최대 5일", "상한이 best effort 모델을 지탱"], ["델타 전용 스크립트", "재테스트는 바뀐 부분만 합니다. 이전에 통과한 단계는 이월합니다", "다중 ECO 기능은 약 15단계 스크립트"], ["지역별 세션", "시간대별로 나눠 진행합니다(예: 오전 아시아·유럽, 오후 미주). 90분 킥오프가 교육을 겸합니다", "다국가 키유저 UAT"], ["대표 사이트 승인", "작은 사이트가 테스트하지 않으면 주요 2개 사이트의 승인이 지역을 대표합니다", "합의 규칙으로 운영"], ["간주 승인", "“X일까지 무응답이면 승인” 기한을 둡니다. 핵심 참석자가 수락하지 않으면 세션 시리즈를 취소합니다", "UAT 지연 방지"], ["UAT 중 개선 요청 불가", "결함·개선·관찰로 분류하고 “운영 전환 필수” 여부를 표시합니다. 개선은 백로그 또는 운영 후 범위 변경서로 보냅니다", "고객이 분류, 파트너는 차단 결함만 수정"], ["PROD 재테스트", "운영 테넌트에서 1일 집중 점검: 핵심 템플릿, 승인 목록, 핵심 시나리오 1–2개", "dev 통과 기능이 PROD에서 실패"], ["기간 2배 계획", "다사이트 키유저 UAT는 명목 기간의 약 2배로 일정을 잡습니다", "계획 2–3주 → 실제 약 7주"]]}, {"t": "steps", "title": "UAT 1라운드 진행 순서", "items": [{"title": "테스터를 이름으로 확정합니다", "text": "테스터 명단, 주당 보호 시간(키유저 약 20%), 휴가·축일 일정을 받습니다. 테스트 일을 블록으로 예약합니다.", "meta": "착수~상세 계획 · 담당: 고객 프로그램 오너"}, {"title": "스크립트를 준비합니다", "text": "고객이 To-Be를 기준으로 스크립트를 쓰고 파트너가 검토합니다. 번호 블록(예: 100 로그인, 200 생성, 300 평가, 400 실행, 500 승인)으로 구성합니다.", "meta": "구축 중 · 담당: 고객 관리자·키유저"}, {"title": "테스터를 교육합니다", "text": "2h × 2회. UAT 스크립트를 상세 교육 가이드로 겸용합니다.", "meta": "UAT 직전 · 담당: 구성 컨설턴트"}, {"title": "실행하고 기록합니다", "text": "테스터가 스크립트를 실행하고 이슈 로그에 유형·심각도·영향 사용자를 기록합니다. 주 2회 1h 공동 세션에서 고객 코디네이터가 실제 시나리오로 화면을 직접 조작하자 진도가 빨라졌습니다.", "meta": "계획 2–3주, 실제는 약 2배"}, {"title": "분류하고 상한 안에서 고칩니다", "text": "주간 회의에서 결함·개선·관찰을 분류하고 상한 안에서 수정합니다. 개선 요청은 백로그로 보냅니다.", "meta": "담당: 고객 오너(우선순위), 파트너(수정)"}, {"title": "재테스트하고 승인받습니다", "text": "바뀐 부분만 재테스트하고 테스터 서면 승인 또는 간주 승인을 받습니다.", "meta": "관문: 라운드 종료 go/no-go"}]}, {"t": "callout", "kind": "example", "title": "관측 사례: 설계 변경 UAT 18개 스크립트", "text": "1라운드 13개 통과·결함 2건·보류 3건 → 재테스트 15개 통과·3개 실패 → 최종 18/18 통과. 늦은 실패의 원인은 ① 어느 그룹에도 속하지 않은 사용자가 알림과 할 일 목록을 받지 못한 것, ② UAT 중 구성 변경으로 이전 레코드 링크가 끊긴 것이었습니다. 둘 다 사전 점검과 구성 동결로 막을 수 있습니다."}, {"t": "details", "items": [{"title": "UAT 스크립트와 이슈 로그 구성 (복사용 목차)", "blocks": [{"t": "template", "title": "UAT 테스트 스크립트", "sections": [{"h": "머리글", "items": ["작성자, 제목, 실행자, ID, 일자, 버전, 구성 릴리스 버전"]}, {"h": "목적과 전제 조건", "items": ["테스트 사용자·그룹(승인 테스트용 두 번째 사용자 포함)", "테스트 데이터: 검색 가능한 표식 문자열을 붙인 가짜 값(나중에 고객이 임포트로 교체)"]}, {"h": "단계 표", "items": ["ID / 동작 / 기대 결과 / 통과·실패 / 실제 결과 / 심각도 / 화면 캡처"]}, {"h": "심각도", "items": ["1 중단", "2 오류, 실행 불가", "3 경고, 실행됨", "4 실행됨, 개선 여지 있음"]}, {"h": "상태 요약", "items": ["미실행 / 진행 중 / 재실행 / 실패 / 통과 / 범위 외 / 합계 / 완료율"]}, {"h": "고객 서명", "items": ["입회자, 승인 Y/N, 일자"]}]}, {"t": "template", "title": "UAT 이슈 로그", "sections": [{"h": "머리글", "items": ["PM, 프로젝트 팀·키유저, 마지막 검토일"]}, {"h": "열", "items": ["번호 / 이슈 / 범주 / 유형(이슈·요구사항·개선·관찰) / 제기일 / 제기자 / 영향 사용자 / 심각도(상·중·하) / 상태(미결·진행·완료·보류·취소·이관) / 제기자 의견 / 고객 관리자 의견 / 조치 / 담당 / 해결일·확인"]}, {"h": "추가 시트", "items": ["요구사항, 개요, 목록 값, 화면 캡처, 개선 요청"]}]}, {"t": "p", "text": "관측 규모: Items & BOMs UAT 이슈 72건(완료 49, 미결 13), 설계 변경 UAT 이슈 65건(완료 46). 이슈 로그는 주간 회의마다 검토했습니다."}]}]}, {"t": "sec", "id": "cutover", "text": "운영 테넌트 전환(컷오버)"}, {"t": "p", "text": "운영 전환은 별도 패키지로 견적합니다(견적 항목 “운영 테넌트 전환” 46 / 80 / 156h). 관측된 방식은 dev 테넌트를 운영 테넌트로 **복제**하는 것이었습니다. 복제와 퍼지는 Autodesk에 지원 요청으로 진행하며, 관측 계획은 요청 리드타임을 최대 20일로 잡았습니다. 고객 IT가 할 일은 거의 없지만 데이터 센터 리전과 로고 등은 미리 확정해야 합니다."}, {"t": "steps", "title": "5주 컷오버 계획 (관측 절차 기반)", "items": [{"title": "1주차: UAT 후 정리와 전환 결정", "text": "UAT 후 정리(관측 16h)를 하고 번호 범위(새 ECO 번호는 높은 범위에서 시작, 작업 번호 자릿수 확대)와 그룹 설계를 확정합니다. 경영진 go/no-go 결정 후 복제를 요청합니다.", "meta": "담당: PM·리드 컨설턴트 · 관문: 운영 전환 go/no-go"}, {"title": "2주차: 복제와 스모크 테스트", "text": "dev와 같은 데이터 센터 리전인지 확인하고 복제합니다. 별도 테스트 계정으로 고객의 전체 승인 흐름(약 30분)을 포함한 스모크 테스트를 합니다.", "meta": "담당: Autodesk 운영(복제), 컨설턴트(테스트)"}, {"title": "3주차: 그룹·역할 확정과 퍼지", "text": "그룹과 역할을 확정하고 테스트 레코드를 퍼지합니다. `[DEV]` 접두어를 제거하고 참조 데이터와 사용자(전원 조회 권한)를 일괄 로드합니다.", "meta": "담당: 고객 관리자 + 컨설턴트"}, {"title": "4주차: 진행 중 레코드와 PROD 확인", "text": "진행 중인 변경·편차를 임포트하거나 수동 입력하고, 코디네이터가 작업 템플릿과 사이트 승인자를 설정합니다. PROD 1일 집중 점검을 합니다.", "meta": "담당: 고객 코디네이터·키유저"}, {"title": "5주차: 운영 전환과 인계", "text": "주 초에 전환합니다(주말 직전 전환 금지). 새 URL을 공지하고 기존 스프레드시트 대장을 잠급니다. 관리자 인계를 마치고 컨설턴트의 운영 테넌트 계정을 비활성화합니다.", "meta": "관문: 운영 전환 · 이후 하이퍼케어"}]}, {"t": "list", "title": "진행 중(in-flight) 레코드 처리 원칙", "items": ["기본값은 **레거시에서 마무리**입니다. 진행 중인 변경은 기존 방식으로 끝내고, 몇 달 뒤에도 열려 있는 건만 수동 입력합니다. 레거시 양식 데이터가 일관되지 않아 일괄 임포트는 공수 대비 효과가 낮았습니다(관측).", "레거시 프로세스의 마감일(cut-off)을 정하고, 그 이후 새 건은 Fusion Manage에서만 시작합니다.", "임포트가 필요하면 워크스페이스 섹션 순서대로 열을 맞춘 템플릿을 씁니다(필수 = 녹색, 스크립트에 영향 = 주황, 참조 전용 = 회색).", "파일럿 사이트·사용자·코디네이터·승인자 목록을 전환 전에 서면으로 확인합니다. 파일럿 범위를 양측이 다르게 알고 있다가 전환 며칠 전에 드러난 사례가 있었습니다."]}, {"t": "callout", "kind": "rule", "title": "운영 테넌트는 컨설턴트가 직접 바꾸지 않습니다", "text": "전환 후 변경은 dev에서 구축·테스트 → 구
