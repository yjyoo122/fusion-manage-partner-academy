 1, "why": "관측 테넌트 유지 절차는 분기~반기마다 DEV를 PROD로 재동기화하고 문서화되지 않은 변경을 감사했습니다. 그렇지 않으면 차이가 쌓여 모든 개선이 위험해집니다."}, {"q": "파트너 SLA에서 약속하기에 적절한 범위는?", "options": ["Autodesk 제품 결함의 수정 완료 시간", "응답, 분류, 우회책, Autodesk 에스컬레이션", "모든 문의의 24시간 내 해결"], "answer": 1, "why": "제품 결함 수정은 Autodesk 일정을 따릅니다. 파트너는 통제할 수 있는 응답·분류·우회책·에스컬레이션만 약속해야 합니다."}]}]}, {"id": "roadmap", "num": "13", "group": "run", "title": "구현에서 유지보수까지 *한 장의* 로드맵", "short": "로드맵", "goal": "영업부터 갱신까지 Fusion Manage 프로그램의 순서를 한 장으로 그리고, 단계마다 종료 기준·가치 점검·고객 자원 요청을 붙여 고객에게 설명할 수 있습니다.", "facts": [["학습 시간", "35분"], ["대상", "PM·영업·프리세일즈"], ["산출물", "고객용 1페이지 로드맵"]], "blocks": [{"t": "lead", "text": "로드맵은 날짜표가 아니라 **순서에 대한 약속**입니다. 관측 프로젝트에서 첫 운영 전환을 지킨 것은 데이터 모델을 먼저 고정하고, 연동 없이 갈 수 있는 설계 변경 파일럿을 첫 성과로 삼은 경우였습니다. 이 모듈은 그 순서를 **중견 고객 권장안**과 **엔터프라이즈 관측 사례**로 나누어 보여 줍니다."}, {"t": "sec", "id": "master", "text": "마스터 로드맵: 중견 고객 권장안"}, {"t": "p", "text": "아래 로드맵은 단일 또는 소수 사이트의 중견 고객을 가정한 **권장안(관측치 기반 추정)**입니다. 첫 운영 전환 목표는 **SOW 서명 후 약 6–9개월**입니다. 엔터프라이즈 관측 사례(13–14개월)보다 짧은 이유는 사이트 수, 승인 단계, 연동 의존성이 적기 때문입니다. 이 차이를 고객에게 설명할 때는 반드시 아래 두 번째 간트(관측)와 함께 보여 주십시오."}, {"t": "gantt", "title": "중견 고객 24개월 로드맵 (권장)", "subtitle": "1열 = 1분기(3개월). Q1은 디스커버리 시작 분기입니다. 연동은 첫 운영 전환의 임계 경로 밖에 둡니다", "cols": ["Q1", "Q2", "Q3", "Q4", "Q5", "Q6", "Q7", "Q8"], "rows": [{"label": "영업·디스커버리", "start": 0, "len": 1, "kind": "std", "text": "자격 검증·워크숍·SOW"}, {"label": "기반: 착수·현행·목표 설계", "start": 0, "len": 2, "kind": "std", "text": "데이터 모델·샌드박스 테넌트"}, {"label": "관문: To-Be 승인", "start": 1, "len": 1, "kind": "gate", "text": "M3–4, 승인 기한 합의"}, {"label": "기반: Items & BOMs + 설계 변경 파일럿(비연동)", "start": 1, "len": 2, "kind": "std", "text": "구성·내부 테스트·UAT"}, {"label": "관문: UAT 완료", "start": 2, "len": 1, "kind": "gate", "text": "M6–8, 고객 서명"}, {"label": "관문: 첫 운영 전환", "start": 2, "len": 1, "kind": "gate", "text": "M7–9 Go-live"}, {"label": "하이퍼케어·안정화", "start": 3, "len": 1, "kind": "run", "text": "고객 측 관리자로 이관"}, {"label": "연동: ERP·Vault", "start": 2, "len": 3, "kind": "std", 개 분기에 걸쳐 계획된 확장 웨이브"}]}, {"t": "gantt", "title": "엔터프라이즈 관측 타임라인", "subtitle": "0개월 = 현행 분석 워크숍 시작. 월 단위 기록을 분기로 환산했습니다", "cols": ["Q1", "Q2", "Q3", "Q4", "Q5", "Q6", "Q7", "Q8", "Q9", "Q10", "Q11", "Q12", "Q13", "Q14"], "rows": [{"label": "디스커버리·평가", "start": 0, "len": 1, "kind": "std", "text": "대형 워크숍, 약 6주 내 워크스트림 합의"}, {"label": "설계 변경: 현행 → 목표 → 구축", "start": 0, "len": 3, "kind": "std", "text": "비연동 파일럿 범위"}, {"label": "관문: UAT 완료(18/18 스크립트)", "start": 3, "len": 1, "kind": "gate", "text": "~M10"}, {"label": "운영 테넌트 전환", "start": 3, "len": 1, "kind": "run", "text": "~M11, 약 5주"}, {"label": "관문: 파일럿 운영 전환(2개 사이트)", "start": 4, "len": 1, "kind": "gate", "text": "~M13–14"}, {"label": "관문: Items & BOMs To-Be 승인", "start": 3, "len": 1, "kind": "gate", "text": "~M12, 약 3개월 지연"}, {"label": "ERP·Vault 연동(고객 미들웨어 팀)", "start": 1, "len": 7, "kind": "opt", "text": "계획 약 10주 → 8–12개월 지연"}, {"label": "Items & BOMs 구축·연동 대기", "start": 4, "len": 5, "kind": "std", "text": "운영 전환 10개월 이상 지연"}, {"label": "관문: Items & BOMs 1단계 종료", "start": 8, "len": 1, "kind": "gate", "text": "~M25"}, {"label": "사이트 확장 웨이브", "start": 5, "len": 9, "kind": "run", "text": "분기별 2/4/8/3/10/8/7/2/4개 사이트(계획)"}], "legend": [{"kind": "std", "text": "단계 활동"}, {"kind": "run", "text": "운영·확장"}, {"kind": "gate", "text": "관문"}, {"kind": "opt", "text": "외부 의존(고객 IT)"}], "note": "관측 사례. Items & BOMs 막대는 해당 워크스트림 착수 기준 개월 수를 같은 축에 놓은 근사치입니다. 사이트 웨이브는 계획 기준이며, 한 지역은 경쟁 ERP 프로젝트 때문에 약 2분기 연기되었습니다. 추가 기능(공급업체 Phase 0, 자산, PPM)은 병행 착수했고, 스폰서가 없던 일부 앱은 구성 후 중단되었습니다."}, {"t": "table", "title": "두 로드맵 비교", "head": ["항목", "중견 고객 권장안", "엔터프라이즈 관측"], "rows": [["첫 운영 전환 시점", "SOW 서명 후 6–9개월(권장)", "현행 분석 착수 후 13–14개월"], ["첫 운영 전환 범위", "Items & BOMs 기본 + 설계 변경(비연동)", "설계 변경·편차 승인(비연동), Items & BOMs는 임시 워크스페이스"], ["연동", "첫 운영 전환 이후 별도 릴리스", "고객 미들웨어 팀이 구축, 8–12개월 지연"], ["UAT", "1–2라운드, 라운드·결함 수정 일수 상한", "모든 주요 프로젝트에서 10–25주 지연, 확장 단계 UAT는 계획 2–3주 대비 약 7주"], ["Items & BOMs", "첫 운영 전환에 기본 범위 포함", "설계 승인 약 12개월, 1단계 종료 약 25개월"], ["사이트 확장", "분기 웨이브당 1–3개 사이트(권장)", "약 48개 사이트, 9개 분기 계획"]], "note": "단일 기능 프로젝트(약 80–330h)도 고객 테스터·ERP 팀·데이터 오너가 파트타임이면 10–17개월이 걸렸습니다(관측). 공수가 작아도 캘린더는 고객 가용성이 결정합니다."}, {"t": "sec", "id": "sequence", "text": "순서의 논리: 무엇을 먼저 하는가"}, {"t": "steps", "items": [{"title": "데이터 모델을 가장 먼저 고정", "text": "마스터 속성 목록과 필드 소유권(ERP·PDM·PLM) 매트릭스가 아이템 레이아웃, 데이터 로드, 연동 매핑, 접근 권한을 모두 결정합니다. 관측: 데이터 필드 매트릭스는 32h 견적에 68h가 들었습니다. 그래도 이것이 늦으면 뒤의 모든 단계가 다시 열립니다.", "meta": "공수: 32–100h · 상세: [[data|10 데이터 이관과 연동]]"}, {"title": "아키텍처 결정을 문서로 남기기", "text": "‘Vault에서 아이템을 쓸 것인가’, 아이템 번호를 누가 만드는가, 연동 경로를 무엇으로 할 것인가를 서면으로 권고하고 고객의 선택을 기록합니다. 원칙: PDM은 버전, PLM은 개정, ERP는 부품 번호를 소유합니다.", "meta": "시점: To-Be 승인 전 · 담당: 리드 컨설턴트"}, {"title": "연동 없는 설계 변경 파일럿을 첫 성과로", "text": "관측: 연동 없이 운영 전환할 수 있었던 유일한 기능이 설계 변경(ECR/ECO)과 편차 승인이었고, 2개 사이트에서 먼저 운영 전환했습니다. 개정 관리 아이템 워크스페이스는 자체 워크플로 없이 변경 지시로 릴리스되므로, 설계 변경은 Items & BOMs와 함께 또는 먼저 구축합니다.", "meta": "상세: [[catalog|04 프로젝트 유형 카탈로그]]"}, {"title": "연동은 첫 운영 전환의 임계 경로에서 제외", "text": "관측: 착수 4개월 차에 세운 계획은 Vault·ERP 연동을 약 10주로 가정했지만, 고객 미들웨어 팀은 아직 API를 학습하는 중이었고 연동 의존 업무는 8–12개월 늦어졌습니다. 첫 운영 전환은 수동 또는 읽기 전용 데이터 로드로 하고, 연동은 후속 릴리스로 계획합니다.", "meta": "상세: [[risk|07 리스크와 안전장치]]"}, {"title": "읽기 전용 운영 전환과 브랜치별 전환", "text": "마스터/브랜치 모델에서는 사이트별로 먼저 읽기 전용 데이터를 로드하고, 연동이 준비되면 해당 사이트를 연동 공급 레코드와 편집 권한으로 전환합니다. 연동이 늦어도 사이트가 멈추지 않습니다.", "meta": "관측 패턴 · 권장"}, {"title": "의존성 맵으로 선행 조각부터", "text": "관측: 공급업체 Phase 0와 자산 작업 셀이 Items & BOMs 운영 전환을 막았습니다. 워크스트림 간 의존성을 한 장으로 그리고, 의존 항목마다 ‘대기/정렬’ 줄을 둡니다.", "meta": "도구: RAID 로그·의존성 맵 ([[templates|14 템플릿]])"}, {"title": "스폰서 없는 기능은 시작하지 않기", "text": "관측: 공급업체·자산·PPM·NPI 앱이 구성된 뒤 스폰서와 대상 사용자가 없어 중단되었습니다. 워크스트림 1페이지에 스폰서를 전제 조건으로 적고, 현업 참여가 약하면 MVP(Phase 0)로 축소합니다.", "meta": "관문: 스폰서 서명"}]}, {"t": "callout", "kind": "warn", "title": "연동을 첫 운영 전환의 조건으로 걸지 마십시오", "text": "연동 일정은 고객 IT 일정(API 학습, 티켓 처리, 변경 동결, ERP 연말 마감)을 따릅니다. 관측된 연동 의존 업무는 모두 8–12개월 늦어졌습니다. 첫 운영 전환은 연동 없이 가치를 내는 범위로 잡고, 연동은 별도 릴리스와 별도 SOW 또는 범위 변경서로 관리하십시오."}, {"t": "table", "title": "연동 방식별 관측 기간", "head": ["방식", "운영 전환까지", "프로젝트 기간", "로드맵 배치(권장)"], "rows": [["Vault–Fusion Manage 전용 커넥터", "5–15일", "1–5개월", "첫 운영 전환 직후 릴리스"], ["범용 iPaaS·미들웨어로 직접 구축", "35–82일", "약 1년", "별도 트랙, 임계 경로 밖"], ["고객 미들웨어 팀 구축 + 파트너 지원", "고객 IT 일정에 좌우", "관측 8–12개월 지연", "파트너는 정의·자문(시스템당 9–14일)"]], "note": "관측치. 파트너 지원형 연동 공수는 [[estimate|03 스코핑과 견적]]의 ERP 연동 항목(120–264h)을 쓰십시오."}, {"t": "sec", "id": "dca", "text": "Define → Construct → Adopt: 단계별 종료 기준"}, {"t": "p", "text": "고객에게는 세부 단계보다 세 개의 큰 단계와 **종료 기준**을 먼저 보여 줍니다. 날짜는 바뀌어도 종료 기준은 바뀌지 않아야 합니다."}, {"t": "flow", "items": [{"title": "Define", "text": "사업 가치 합의, 로드맵·상위 계획 수립, 성공 지표 확정"}, {"title": "Construct", "text": "설계·구축·테스트 완료, 데이터 이관 완료, 기준선 지표 확보, 도입 계획 수립", "hi": true}, {"title": "Adopt", "text": "전 사용자 교육, 운영 중 지속 멘토링, 지표로 가치 입증"}]}, {"t": "table", "title": "단계별 관문 산출물과 가치 점검", "head": ["단계", "종료 기준", "관문 산출물", "가치 점검"], "rows": [["Define", "사업 가치 합의, 성공 지표 정의, 상위 계획 승인", "디스커버리 보고서, SOW, 현행(As-Is), 목표(To-Be) 서면 승인", "목표·성과 확인 → 지표 기준선 정의"], ["Construct", "설계·구축·테스트 완료, 데이터 이관 완료, 기준선 지표 확보, 도입 계획 수립", "구성 설계서, UAT 서명, 운영 전환 계획, Go/No-go 기록", "파일럿 가치 지표 합의"], ["Adopt", "전 사용자 교육, 운영 + 멘토링, 지표로 가치 입증", "하이퍼케어 종료, 종료 보고, 성공 계획", "실적 검증 → 다음 단계 비즈니스 케이스"]], "note": "관측된 가치 관리 흐름: 영업 단계에서 계획 → 착수에서 목표 확인 → 가치 정렬에서 기준선 정의 → 딜리버리·종료에서 실적 검증 → 성장 단계에서 전달 가치 보고."}, {"t": "sec", "id": "present", "text": "고객에게 로드맵을 보여 주는 법"}, {"t": "list", "title": "1페이지 로드맵 작성 규칙 (권장)", "items": ["**한 장으로 제한합니다.** 행은 단계, 열은 분기, 관문은 눈에 띄는 표시로 둡니다. 상세 WBS는 별첨으로 뺍니다.", "**단계마다 종료 기준 2–3개를 적습니다.** 날짜보다 기준이 먼저입니다. 기준이 없으면 단계가 끝나지 않습니다.", "**가치 점검 시점을 표시합니다.** 착수(목표 확인), To-Be(기준선), 종료(실적), 분기 QBR(누적 가치).", "**단계별 고객 자원 요청을 적습니다.** 고객의 공수 추정이 빠진 계획은 운영위원회가 가장 먼저 되묻는 항목이었습니다(관측).", "**공수와 캘린더 기간을 분리합니다.** 캘린더는 고객 가용성 가정과 함께 제시하고 기본 ×1.5 계수를 씁니다.", "**목표 일자 이력을 남깁니다.** 상태 보고마다 ‘A → B → C’로 날짜 변경 이력을 보여 주고 예비 일자는 하나만 둡니다. 조용히 밀리는 일정은 신뢰를 잃게 합니다(관측).", "**구현과 도입을 따로 그립니다.** 관측된 제안서 패턴은 ‘예비 포함 6개월 구현 계획 + 3년 도입 계획’이었습니다."]}, {"t": "table", "title": "단계별 고객 자원 요청 (권장)", "head": ["단계", "고객에게 요청할 사람", "참여 수준", "빠졌을 때(관측)"], "rows": [["디스커버리", "경영진 스폰서, 엔지니어링·제조·품질·구매 대표", "3시간 워크숍, 대형 고객은 40–50명 워크숍 1회", "워크스트림 합의와 경영진 지지 지연"], ["현행·목표 설계", "키유저, 프로세스 오너, 명명된 To-Be 검토자", "주당 약 20%", "컨설턴트 단독 설계, 승인 대기 수주–수개월"], ["데이터 모델", "데이터 오너, ERP 기능 담당", "1시간 세션 × 4회(2주)", "마스터 속성 확정 지연, 로드·매핑 재작업"], ["구축·UAT", "명명된 테스터, 승인자 목록, 변경 코디네이터", "UAT 기간 보호된 시간", "UAT 10–25주 지연, 승인자 목록 누락으로 UAT 정지"], ["연동", "고객 연동 리드, 미들웨어 팀", "RACI·사용 사례 합의, 정기 회의", "연동 의존 업무 8–12개월 지연"], ["운영 전환·확장", "고객 측 관리자, 사이트 리드", "사이트 리드 약 10%, 키유저 약 20%", "사이트 웨이브 연기"], ["운영", "슈퍼 관리자 6–8명, CCB 위원", "관리자 교육 약 45일(자립까지)", "파트너 의존 지속, 갱신 범위 축소"]]}, {"t": "checklist", "id": "roadmap-present", "title": "고객 발표 전 로드맵 점검", "items": ["첫 운영 전환 범위에 연동이 조건으로 걸려 있지 않다", "모든 단계에 종료 기준 2–3개와 관문 승인자가 적혀 있다", "To-Be 승인 기한과 UAT 서명 기한이 날짜로 합의되어 있다", "단계별 고객 자원(이름 대신 역할, 참여율)이 표시되어 있다", "공수와 캘린더 기간이 분리되어 있고 고객 가용성 가정이 적혀 있다", "가치 점검 시점(기준선·실적·QBR)이 표시되어 있다", "추가 기능 행마다 스폰서가 확인되었거나 ‘스폰서 확인 후’로 표시되어 있다", "유지보수 주기(릴리스 회귀, DEV 재동기화, 헬스 체크, 갱신)가 포함되어 있다"]}, {"t": "sec", "id": "rollout", "text": "사이트 확장 웨이브"}, {"t": "p", "text": "파일럿이 끝나면 확장은 **반복 가능한 키트**로 운영합니다. 관측된 공수는 사이트당 약 1 컨설턴트 인일(사이트 요구 파악·평가) + 상한이 있는 개선 건수였습니다. 관측 권고는 ‘파트너가 처음 1–2개 사이트를 하고, 이후는 고객이 확장’하는 방식이며, 파일럿 사이트가 다음 사이트를 교육했습니다."}, {"t": "table", "title": "사이트 런치 표준 일정 (관측)", "head": ["주차", "단계", "참석자", "산출물"], "rows": [["1주", "사이트 경영진 참여 콜", "프로그램 리드, 사이트 경영진", "역할·공수 확인, 현지 팀 구성, 진행 약속"], ["3주", "사이트 PM 참여 콜", "사이트 PM, 구현 리드", "지식 전달, 전제 조건, 런치 일정"], ["5주", "런치 콜", "엔지니어링·제조·운영·구매·계획·품질 키유저", "워크숍 아젠다·초대"], ["6주", "디스커버리·시연 워크숍", "키유저", "구성된 솔루션 시연, 현행과의 갭 합의, 범위 초안"], ["7주", "범위 문서", "구현 팀", "서명된 범위 문서 제출"], ["이후", "키유저 교육 → 키유저 테스트 → 전체 사용자 교육 → 운영 전환", "키유저, 사이트 전체 사용자", "운영 전환 시점에 기존 프로세스 중단"]], "note": "Items & BOMs 웨이브는 ‘런치 → 구현 → ERP 연동 → PDM 연동 → 운영 전환’ 순서였고, PDM이 없거나 ERP가 연동되지 않은 사이트는 뒤 웨이브로 배치했습니다(관측)."}, {"t": "callout", "kind": "tip", "title": "막힌 웨이브를 다시 움직이는 방법 (관측)", "items": ["사이트별 변경 담당자를 지정해 현지 주인 의식을 강화합니다", "‘운영 전환 준비 펄스 체크’를 돌립니다: 준비됨? 막힘? 지원 필요?", "1–2개 사이트를 패스트트랙으로 먼저 전환해 모멘텀을 만듭니다", "재사용 키트를 배포합니다: ‘무엇을 기대할까’ 1페이지, 짧은 교육 영상, 준비 체크리스트", "ERP 연동이 없는 사이트용 효과 1페이지를 사이트장에게 제공합니다"]}, {"t": "sec", "id": "maintain", "text": "운영 이후: 유지보수 지평선"}, {"t": "p", "text": "로드맵은 운영 전환에서 끝나지 않습니다. Fusion Manage는 SaaS로 지속 업데이트되므로 업그레이드 프로젝트 대신 **반복 주기**를 로드맵 하단에 한 줄로 고정해 두십시오. 지원 체계와 CCB 운영의 상세는 [[support|12 지원·유지보수·도입 확산]]을 따릅니다."}, {"t": "table", "title": "유지보수 주기", "head": ["주기", "활동", "주 담당", "근거"], "rows": [["릴리스마다", "관리자 대상 신기능 브리핑, 샌드박스에서 핵심 워크플로·스크립트·연동 회귀 테스트, 교육 자료 갱신", "고객 측 관리자 + 파트너 AMS", "권장(관측: 관리자 신기능 교육 패키지 16h)"], ["매월", "CCB 변경 요청 심사, 지원 케이스·결함 리뷰, MAU 확인", "고객 CCB, 파트너 컨설턴트 참여", "관측: 다사이트 운영 11개월간 약 130건, 약 10건 중 1건 반려"], ["분기", "QBR, 사이트 × 기능 매트릭스 갱신, DEV를 PROD에서 재동기화(분기 또는 반기)", "파트너 PM, 고객 PM", "관측"], ["연 1회", "헬스 체크: 테넌트 분석, 모범 사례 권고, 보고서", "파트너", "관측: 견적 템플릿의 헬스 체크 평균 약 10인일"], ["만료 약 10개월 전", "갱신 착수: 성공 계획·범위 합의 → 상업 조건 → 예산 → 법무·상업 검토 → 내부 승인(2–3주)", "영업, PM", "관측: 시작일 약 5주 전 체결"], ["상시", "관리자 자립 계획: 운영 자립 → 개발 자립", "고객 측 관리자, 파트너 교육 담당", "관측: 슈퍼 관리자 6–8명에 약 45일"]]}, {"t": "callout", "kind": "rule", "title": "업데이트 시점 규칙 (관측 기반 권장)", "items": ["사이트 운영 전환 기간에는 업데이트·패치를 적용하지 않습니다", "패치 테스트용 슬롯을 분기 계획에 미리 확보합니다", "연말 ERP 변경 동결 기간은 운영 전환 리스크로 RAID 로그에 올립니다", "DEV를 재동기화하기 전에 미승인 변경과 실험 구성을 정리합니다"]}, {"t": "quiz", "items": [{"q": "중견 고객의 첫 운영 전환 범위로 가장 적절한 것은?", "options": ["ERP·Vault 연동을 포함한 Items & BOMs 전체", "기본 Items & BOMs와 연동 없는 설계 변경 파일럿", "품질·공급업체·PPM을 한 번에 구축"], "answer": 1, "why": "관측 사례에서 연동 의존 업무는 8–12개월 늦어졌고, 연동 없이 운영 전환할 수 있었던 것은 설계 변경이었습니다. 연동은 후속 릴리스로 둡니다."}, {"q": "엔터프라이즈 관측 사례에서 현행 분석 착수부터 설계 변경 파일럿 운영 전환까지 걸린 기간은?", "options": ["13–14개월", "6개월", "25개월"], "answer": 0, "why": "UAT 완료는 약 10개월 차, 운영 테넌트 전환은 약 11개월 차, 2개 사이트 파일럿 운영 전환은 약 13–14개월 차였습니다. 25개월은 Items & BOMs 1단계 종료 시점입니다."}, {"q": "고객용 1페이지 로드맵의 각 단계에 반드시 붙여야 하는 것은?", "options": ["담당 컨설턴트의 일별 작업 목록", "단계별 금액", "종료 기준과 고객 자원 요청"], "answer": 2, "why": "날짜는 바뀌어도 종료 기준은 유지되어야 하며, 고객 측 공수가 빠진 계획은 운영위원회가 가장 먼저 되묻는 항목이었습니다."}, {"q": "갱신 준비는 언제 시작하는 것이 관측 패턴에 맞습니까?", "options": ["만료 1개월 전", "만료 약 10개월 전", "만료 후 재계약 시점"], "answer": 1, "why": "관측된 갱신은 만료 약 10개월 전 성공 계획·범위 합의로 시작해, 상업 조건·예산·법무 검토·내부 승인을 거쳐 시작일 약 5주 전에 체결되었습니다."}]}]}, {"id": "templates", "num": "14", "group": "kit", "title": "바로 쓰는 *문서 템플릿* 모음", "short": "템플릿", "goal": "영업부터 운영까지 Fusion Manage 프로젝트에 필요한 20개 문서의 목차와 열 구성을 복사해 귀사 양식의 초안으로 바로 쓸 수 있습니다.", "facts": [["학습 시간", "30분(참조용)"], ["대상", "PM·컨설턴트·영업"], ["산출물", "귀사 표준 문서 세트 초안"]], "blocks": [{"t": "lead", "text": "관측 프로젝트에서 반복해서 쓰인 문서 구조를 일반화해 한국어로 옮겼습니다. 각 템플릿의 **복사** 버튼으로 목차를 가져가 귀사 양식에 붙이십시오. 고객명·인명 대신 **역할**을 적는 습관을 템플릿 단계부터 들이십시오."}, {"t": "table", "title": "템플릿 한눈에 보기", "head": ["단계", "템플릿", "작성 시점", "주 작성자"], "rows": [["영업", "1. 디스커버리 워크숍 아젠다", "계약 전·착수 직후", "프리세일즈·리드 컨설턴트"], ["영업", "2. 영업 → 딜리버리 핸드오버 메모", "수주 직후", "영업·프리세일즈"], ["계약", "3. SOW 요약본", "견적 확정 후", "PM·영업"], ["계약", "4. 범위 변경서(Change Request)", "범위·공수·일정 변경 시", "PM"], ["계약", "5. 추가 요청 로그", "착수부터 상시", "PM"], ["착수", "6. 착수(모빌라이제이션) 덱", "킥오프 1주 전", "PM"], ["착수", "7. RAID 로그", "착수 첫 주", "PM"], ["착수", "8. 주간 리캡·월간 현황 1페이지", "매주·매월", "PM"], ["착수", "9. 공수 소진 트래커", "매월", "PM"], ["설계", "10. 현행(As-Is) 문서", "현행 워크숍 후", "컨설턴트"], ["설계", "11. 목표(To-Be) 문서", "현행 승인 후", "컨설턴트"], ["설계", "12. 구성 설계서(워크스페이스별)", "To-Be 승인 후·운영 중 유지", "컨설턴트"], ["설계", "13. 데이터 구조·마스터 속성 목록", "착수 직후(가장 먼저)", "컨설턴트·고객 데이터 오너"], ["설계", "14. 요구사항 추적 매트릭스(RTM)", "설계부터 UAT까지", "컨설턴트"], ["테스트", "15. UAT 워크북(테스트 스크립트 + 결함 로그)", "구축 중 작성, UAT 중 사용", "컨설턴트·고객 PM"], ["운영 전환", "16. 운영 전환 계획", "UAT 시작 전", "PM"], ["운영 전환", "17. 종료(클로즈아웃) 덱", "하이퍼케어 종료 시", "PM"], ["운영 전환", "18. 교육 피드백 양식", "교육 직후·종료 시", "교육 담당"], ["운영", "19. 성공 계획(Success plan)", "운영 전환 전후, 분기 갱신", "PM·영업"], ["운영", "20. QBR 아젠다", "분기마다", "PM·영업"]], "note": "SOW 조항 해설은 [[sow|05 SOW 작성]], 공수 산정은 [[estimate|03 스코핑과 견적]], 역할 구성은 [[team|09 팀과 거버넌스]]를 함께 보십시오."}, {"t": "sec", "id": "sales", "text": "영업"}, {"t": "template", "title": "1. 디스  To-Be·구성 설계서 참조 | 워크스페이스·스크립트", "테스트 케이스 번호 | 반영 릴리스 | 비고"]}, {"h": "작성 규칙", "items": ["요구 문장은 기술 중립적으로 씁니다", "모든 요구에 테스트 케이스가 하나 이상 연결되어야 UAT 준비 완료"]}]}, {"t": "sec", "id": "test", "text": "테스트"}, {"t": "template", "title": "15. UAT 워크북 (테스트 스크립트 + 결함 로그)", "intro": "To-Be에서 시나리오를 뽑아 구축 중에 작성합니다. 프로세스별로 스크립트를 나누고, UAT 기간에는 구성을 동결합니다. 관측: UAT 중 스크립트·워크스페이스를 바꾸자 테스트 레코드의 링크가 깨졌습니다.", "sections": [{"h": "소개", "items": ["도구·버전, 대상 워크플로와 역할, 테스트 환경, 역할별 테스트 사용자"]}, {"h": "스크립트 머리글", "items": ["작성자, 제목, 수행자, ID, 날짜, 버전", "목적, 선행 조건(테스트 데이터, 승인자 목록)", "고객 서명: 입회자, 승인(Y/N), 날짜"]}, {"h": "단계 표", "items": ["단계 ID | 조치 | 기대 결과 | 실제 결과 | 합격/불합격 | 심각도 | 스크린숏 | 결함 번호"]}, {"h": "심각도 정의", "items": ["1: 시스템 중단(크래시)", "2: 오류, 실행 불가", "3: 경고, 실행은 됨", "4: 실행됨, 개선 가능"]}, {"h": "번호 체계 예시 (설계 변경)", "items": ["100번대 로그인, 200번대 요청 생성, 300번대 평가, 400번대 실행, 500번대 CCB 승인", "반려 루프(각 반려 전이를 부분 승인 전·후로), 관리자 되돌리기, 위임·알림·선택 승인자 확인"]}, {"h": "상태 요약", "items": ["미실행 / 진행 중 / 재실행 필요 / 실패 / 통과 / 범위 외 / 합계 / 완료율"]}, {"h": "결함 로그 열", "items": ["번호 | 이슈·발견 사항 | 범주 | 유형(이슈/요구/개선/일반 관찰)", "등록일 | 등록자 | 영향 사용자 | 심각도", "상태(열림/진행/완료/보류/취소/이관) | 등록자 의견 | 관리자 의견", "조치 | 담당 | 해결일 | 재확인 결과"]}, {"h": "분류 규칙", "items": ["결함: SOW 안에서 수정", "운영 전환 필수: 우선 수정 후 재테스트", "개선: 백로그로 이동, 별도 견적"]}]}, {"t": "sec", "id": "golive", "text": "운영 전환"}, {"t": "template", "title": "16. 운영 전환 계획", "intro": "운영 테넌트 전환은 별도 패키지로 계획합니다. 관측: 항목 합계 78h, 예비 포함 156h, 약 5주. 상세 공수 범위는 [[estimate|03 스코핑과 견적]]의 운영 테넌트 전환 항목을 쓰십시오.", "sections": [{"h": "주차별 일정 (관측 패턴)", "items": ["1주: UAT 후 정리(스크립트 라이브러리, 번호 체계, 승인자 목록 통합)", "2주: 운영 테넌트 복제, 스모크 테스트", "3주: 그룹·역할 확정, 파일럿 교육 지원", "4–5주: 진행 중 변경 가져오기, 코디네이터·작업 템플릿 설정"]}, {"h": "워크스페이스 전환 목록", "items": ["워크스페이스 | 데이터 출처 | 가져오기 방법 | 개발 | 운영 | 운영 개시 | 정렬 필요 | 운영 이관 | 비고"]}, {"h": "데이터", "items": ["이행 데이터 범위와 담당", "진행 중 레거시 변경 정책: 기존 시스템에서 종료하고 잔여분만 재입력", "일괄 가져오기 전 스냅숏·내보내기, 사본에서 먼저 테스트", "동기화 도구 안전장치: 검토 프롬프트, 최대 생성·수정 건수 제한"]}, {"h": "사용자·권한", "items": ["파일럿 사이트, 사용자, 코디네이터, 승인자 목록 서면 확정", "컨설턴트의 운영 테넌트  ["지표 | 기준선 | 목표 | 측정 방법 | 담당", "계층: 운영 KPI → 하위 이니셔티브 → 그룹 이니셔티브"]}, {"h": "마일스톤", "items": ["마일스톤 | 시점 | 담당", "첫 마일스톤: 착수 및 성공 기준 정의"]}, {"h": "도입 지표", "items": ["목표 사용자 수, MAU 목표, 사이트 × 기능 상태"]}, {"h": "실행 표", "items": ["조치 | 기대 성과 | 활동 | 가치 | 단계 | 필요 공수(인일)"]}, {"h": "리스크와 점검 주기", "items": ["주요 리스크와 대응", "월간·분기 점검 일정"]}, {"h": "가치 검증 레지스터", "items": ["이니셔티브 | 가치 유형(정량/정성) | 고객 검증자(역할) | 근거 | 실제 실현"]}]}, {"t": "template", "title": "20. QBR 아젠다 (90분)", "intro": "분기마다 90분, 시간을 고정해 진행합니다. 소진 공수보다 **가치와 도입**을 먼저 보여 줍니다. 갱신 전 마지막 1년의 QBR은 갱신 필요 사항을 도출하는 자리입니다.", "sections": [{"h": "인사·목적 (5분)", "items": ["참석자, 오늘의 결정 사항"]}, {"h": "고객 업데이트 (10분)", "items": ["우선순위 / 진척·가치 / 지원·정렬에 대한 고객 발표"]}, {"h": "성과·도입 (10분)", "items": ["MAU vs 목표, 사이트 × 기능 매트릭스, 지원 케이스·CCB 현황"]}, {"h": "지난 90일 진척과 가치 (15분)", "items": ["운영 전환·마일스톤, 검증된 가치"]}, {"h": "가치 실현 리스크 (15분)", "items": ["리스크 | 공동 대응 | 결정 요청"]}, {"h": "개선·신기능 (15분)", "items": ["릴리스 소식, 다음 기능 후보, 아이디어"]}, {"h": "다음 90일 (15분)", "items": ["마일스톤, 고객 자원 요청, 공수 계획"]}, {"h": "공동 우선순위 (5분)", "items": ["조치 | 담당 | 기한"]}]}, {"t": "quiz", "items": [{"q": "추가 요청 로그를 운영하는 주된 이유는?", "options": ["고객에게 무상 서비스를 보여 주기 위해", "작은 요청이 +10% 허용 범위를 조용히 넘지 않게 하기 위해", "주간 회의록을 대신하기 위해"], "answer": 1, "why": "4–20h 규모의 작은 요청이 쌓이면 허용 범위를 넘습니다. 관측된 한 작업에서는 소비 시간의 41%가 범위 밖이었습니다."}, {"q": "목표(To-Be)를 문서화하는 권장 방식은?", "options": ["업무 미래 상태 문서와 구성 설계서로 분리", "현행 문서에 부록으로 추가", "SOW 본문에 포함"], "answer": 0, "why": "업무 관점 문서로 승인을 받고, 구성 수준 상세는 구성 설계서로 분리해 as-built 문서로 계속 유지합니다."}, {"q": "UAT 결함 심각도 2의 정의는?", "options": ["시스템 중단(크래시)", "실행되지만 개선 가능", "오류로 실행 불가"], "answer": 2, "why": "1 크래시, 2 오류로 실행 불가, 3 경고가 있지만 실행됨, 4 실행되지만 개선 가능입니다."}]}]}, {"id": "checklists", "num": "15", "group": "kit", "title": "관문마다 쓰는 *체크리스트* 모음", "short": "체크리스트", "goal": "수주 전부터 갱신까지 9개 관문에서 확인할 항목을 점검하고, 관측 프로젝트에서 가장 비싼 대가를 치른 누락 항목을 미리 막을 수 있습니다.", "facts": [["학습 시간", "25분(참조용)"], ["대상", "PM·영업·컨설턴트"], ["산출물", "관문별 점검 기록"]], "blocks": [{"t": "lead", "text": "각 항목은 **확인 가능한 사실**로 썼습니다. ‘준비되었다’가 아니라 ‘서면으로 받았다’, ‘날짜가 합의되었다’처럼 증거가 남는 형태입니다. 체크 상태는 이 브라우저에 자동 저장되므로 프로젝트마다 관문 회의 직전에 열어 확인하십시오."}, {"t": "sec", "id": "missed", "text": "가장 많이 놓친 항목 Top 10"}, {"t": "table", "head": ["항목", "놓쳤을 때 관측된 결과"], "rows": [["명명된 UAT 테스터와 보호된 테스트 시간", "모든 주요 프로젝트에서 UAT가 10–25주 지연, 가장 큰 원인은 고객 테스터 가용성"], ["To-Be 승인 기한 합의", "승인 대기 수주–수개월, 일정 지연의 최대 원인. Items & BOMs 설계 승인은 약 3개월 늦어짐"], ["첫 운영 전환에서 연동 분리", "연동 의존 업무가 8–12개월 지연, Items & BOMs 운영 전환은 10개월 이상 지연"], ["디스커버리·설계 예비 공수", "현행 분석·목표 설계·데이터 정의가 +10%–+213% 초과, 구축은 대체로 견적 내"], ["맞춤 코드의 소스 코드 라이선스(SCLA)", "UAT 일시 중단, 코드 인계 지연, 프로그램 상위 리스크로 격상"], ["추가 요청 로그와 소규모 범위 변경서", "한 분석 작업에서 소비 시간의 41%가 범위 밖 작업"], ["기능별 스폰서 확인", "공급업체·자산·PPM·NPI 앱이 구성 후 스폰서와 대상 사용자 부재로 중단"], ["도입 변경 관리(챔피언, 커뮤니케이션)", "2년 뒤 목표 3,000–5,000명 중 활성 사용자 147명"], ["고객 ERP·미들웨어 로드맵 서면 확인", "레거시 PLM 이관이 약 7.5개월 차에 보류(ERP 업그레이드가 늦게 드러남)"], ["일괄 가져오기 전 스냅숏과 사본 테스트", "운영 전환 후 소유자 일괄 수정이 관리 워크스페이스 데이터를 손상"]], "note": "모두 관측 사례입니다. 각 항목은 아래 관문 체크리스트에 포함되어 있습니다. 대응 방법의 상세는 [[risk|07 리스크와 안전장치]]를 보십시오."}, {"t": "sec", "id": "presales", "text": "수주 전"}, {"t": "checklist", "id": "cl15-qualify", "title": "1. 영업 자격 검증", "items": ["고객 사업 과제(CBI)를 고객의 말로 1–2문장으로 적고 고객에게 확인받았다", "엔지니어링 VP·디렉터 또는 제품 라인 책임자를 만났다(CAD 파워유저만 만난 것이 아니다)", "이니셔티브별 경영진 스폰서가 역할과 함께 확인되었다", "현재 PDM·ERP 현황과 ERP 연동 요구를 첫 미팅에서 물었다", "고객 연동 주체(자체 미들웨어 팀 유무)를 확인했다", "클라우드 수용성과 보안 검토 절차를 확인했다", "변경 관리 기준선(단순/복잡 변경 소요 기간, 사이트별 월 변경 건수, 사이트 수, 영향 역할)을 확보할 수 있다", "고객이 키유저(주당 약 20%)와 PM을 낼 수 있다고 답했다", "노사 협의·개인정보 협의가 필요한 사업장인지 확인했다", "향후 24개월의 ERP 업그레이드·변경 동결·대형 IT 프로젝트 일정을 물었다", "표준 테넌트에서 문제 보고 → 변경 요청 → 변경 지시 → BOM 개정 폐루프를 시연했다", "시간 기반 가치 지표 후보(예: 월간 처리 시간, 변경 리드타임)를 2–3개 합의했다"]}, {"t": "checklist", "id": "cl15-estimate", "title": "2. 견적 확정 전", "items": ["라인 아이템별 S/M/L을 디스커버리 결과로 골랐고 근거를 메모했다", "현행 분석·목표 설계·데이터 정의 라인에 30% 이상, 나머지에 20% 예비 공수를 넣었다", "PM 공수를 15% 이상 별도 라인으로 두었다", "연동은 파트너가 정의·자문(시스템당 9–14일)하고 고객 미들웨어 팀이 구축하는 구조로 검토했다", "운영 테넌트 전환과 하이퍼케어를 별도 패키지로 견적했다", "UAT 지원 블록(라운드 수, 결함 수정 일수 상한)을 넣었다", "캘린더 기간을 공수와 별도로, 고객 가용성 가정과 ×1.5 계수로 제시했다", "고객 측 공수(키유저, 사이트 리드, 테스터, 데이터 오너) 추정을 함께 제시했다", "1차 범위를 디스커버리 조각으로 보고 후속 단계는 별도로 견적한다고 명시했다", "맞춤 코드(웹 앱·로더)는 PoC로 견적하고 운영 배포·유지보수를 제외했다", "견적 리스크 질문(유사 경험, 데이터 이관, 고객 IT 협조, UAT 경험, 외부 의존성)에 답했다", "공수 내역을 고객에게 먼저 공유해 의견을 받은 뒤 SOW로 옮겼다"]}, {"t": "sec", "id": "contract", "text": "계약 전"}, {"t": "callout", "kind": "rule", "title": "계약 조항은 반드시 귀사 법무 검토", "text": "아래 항목은 누락을 막기 위한 점검표이며 법률 자문이 아닙니다. 조항 문구는 [[sow|05 SOW 작성]]과 [[commercial|06 계약과 상업 모델]]을 참고해 귀사 법무와 확정하십시오."}, {"t": "checklist", "id": "cl15-sow", "title": "3. SOW 서명 전", "items": ["회의·워크숍·UAT 라운드·결함 수정 일수·운영 전환 지원 시간에 모두 ‘최대 N’ 상한이 있다", "고객 책임(UAT 수행, 결함 우선순위, 데이터 준비, 최종 사용자 교육, SOP, 자체 연동 테스트)이 작업별로 적혀 있다", "표준 제외 범위(지속 지원, 제품 기본 교육, 명시 외 연동, 데이터 정제, 인프라, 제3자 조정)가 있다", "+10% 이내 초과 허용과 초과 시 범위 변경서 절차가 있다", "가정과 고객 책임이 이행 조건이며, 미충족 시 일정 조정 권리가 적혀 있다", "인수 방식(월간 활동 확인서 또는 5–10일 검토 후 간주 인수, 문서 릴리스 최대 2회)이 정해졌다", "선불 시간 풀이면 만료일, 취소 불가, 15일 이내 일정 변경 시 사용 간주 조건이 있다", "맞춤 코드가 있으면 소스 코드 라이선스(SCLA)와 지원 경계를 계약 단계에서 합의했다", "명명된 테스터, 보호된 테스트 시간, 서명 기한이 고객 책임에 들어 있다", "To-Be 승인 기한이 일정 가정에 들어 있다", "개정 이력 표(n.1, n.2와 부호 있는 증감)가 첫 버전부터 있다", "각 작업의 사업 이익이 한 줄 이상 적혀 있다", "귀사 법무 검토를 마쳤고 고객 승인 이메일 보관 위치를 정했다"]}, {"t": "sec", "id": "delivery", "text": "딜리버리 중"}, {"t": "checklist", "id": "cl15-first30", "title": "4. 착수 첫 30일", "items": ["1시간 이내 킥오프를 착수 덱으로 진행하고 회의록을 1주 안에 배포했다", "고객 PM, 스폰서, 키유저, 테스터 후보, 데이터 오너를 역할과 참여율로 서면 확인했다", "주간 15분 회의를 고정 요일로 잡고 리캡을 1–3일 안에 보내고 있다", "RAID 로그와 추가 요청 로그를 개설했고 매 회의에서 리뷰한다", "워크스페이스·피클리스트·보고서·스크립트·역할 명명 규칙을 첫날부터 적용했다", "샌드박스 테넌트를 확보했고 컨설턴트의 운영 테넌트 접근 원칙을 합의했다", "마스터 속성 목록(데이터 모델) 작업을 시작했다", "워크스트림 간 의존성 맵을 만들었다", "고객 연동 리드를 지정받고 24개월 ERP·미들웨어 로드맵을 서면으로 받았다", "ERP 연말 마감, 변경 동결, 법적 합의 같은 캘린더 블로커를 일정에 표시했다", "기준선 KPI 수집을 시작했다", "공수 소진 트래커 첫 월간 보고를 보냈다", "상태 보고에 목표 일자 이력(A → B → C) 칸을 만들었다"]}, {"t": "checklist", "id": "cl15-tobe", "title": "5. To-Be 승인 전", "items": ["업무 미래 상태 문서와 구성 설계서를 분리했다", "표준(OOTB) 구성 + 편차만 기술하는 원칙을 지켰다", "명명된 현업 검토자가 검토했다(컨설턴트 단독 설계가 아니다)", "워크스루 회의를 열었고 승인 기한을 날짜로 합의했다", "사이트·라이프사이클별 마스터 데이터 권한(누가 어떤 필드를 소유하는가)을 정했다", "마스터/브랜치 아이템 모델과 사이트별 제조/구매 규칙을 결정했다", "연동 경로를 서면으로 권고했고 고객의 선택, 사용 사례, RACI를 기록했다", "연동 오류 처리 책임자(프록시 vs 미들웨어)와 BOM 완전성 검사를 정했다", "보고·대시보드 요구를 설계에 반영했다(필요하면 상태 변경 시각 기록 필드 포함)", "기능 그룹 × 기능 접근 권한 매핑을 작성했다", "변경 프로세스의 흔한 갭 3가지(단일 변경 대장, 사이트별 복수 승인 위원회, 승인 전 작업 목록 검토)를 물었다", "모든 요구가 RTM에서 사용 사례와 연결되어 있다", "승인 버전(예: v1.4)과 승인자, 날짜를 문서에 남겼다"]}, {"t": "checklist", "id": "cl15-uat", "title": "6. UAT 시작 전", "items": ["파트너 내부 기능 테스트(2–3주)와 동료 검토를 마쳤다", "To-Be 기준 테스트 스크립트를 프로세스별로 나누어 준비했다", "명명된 테스터, 일정, 역할별 테스트 사용자가 확정되었다", "결함 심각도 1–4 정의와 결함/필수/개선 분류 규칙을 고객과 합의했다", "UAT 중 개선 요청은 백로그로 보낸다고 합의했다", "UAT 기간 구성 동결을 선언했다", "UAT 라운드 수와 라운드당 결함 수정 일수 상한을 고객과 재확인했다", "승인자 목록과 변경 코디네이터가 시스템에 설정되어 있다", "고객이 테스트 데이터를 준비했다", "미성숙 구성 요소를 1라운드에서 제외했다", "테스터 교육(2시간 교육 + 질의)을 마쳤다", "간주 승인 기한과 다사이트라면 2배 기간을 일정에 반영했다"]}, {"t": "sec", "id": "golive", "text": "운영 전환"}, {"t": "checklist", "id": "cl15-golive", "title": "7. 운영 전환 Go/No-go", "items": ["UAT 서명을 받았고 미해결 심각도 1–2 결함이 없다", "운영 테넌트 전환 절차(복제, 스모크 테스트, 역할, 퍼지)를 한 번 이상 리허설했다", "파일럿 사이트, 사용자, 코디네이터, 승인자 목록을 서면으로 확정했다", "진행 중 레거시 변경의 처리 정책(기존 시스템에서 종료, 잔여분만 재입력)을 합의했다", "일괄 가져오기 전 스냅숏을 남기고 사본에서 먼저 테스트했다", "동기화 도구에 검토 프롬프트와 최대 생성·수정 건수 제한을 설정했다", "맞춤 코드의 소스 코드 라이선스(SCLA)가 서명되었다", "운영 이후 지원 모델(Tier 1–3 담당)을 고객이 서면으로 확인했다", "변경 요청 트래커와 CCB 주기가 준비되었다", "광범위 사용자 교육 일정이 UAT 이후로 잡혀 있다", "운영 환경 1일 집중 재확인 일정이 있다", "운영 전환 일정이 ERP 연말 마감·변경 동결·패치 일정과 겹치지 않는다", "기존 프로세스 중단 시점, 사용자 공지, 롤백·우회 계획이 있다", "Go/No-go 결정자(스폰서)와 결정 기록 위치가 정해졌다"]}, {"t": "checklist", "id": "cl15-hypercare", "title": "8. 하이퍼케어 종료", "items": ["하이퍼케어 시간 상한 안에서 종료했다(관측: 8–16h, 3–5일)", "미해결 결함과 요청을 CCB 트래커 또는 백로그로 이관했다", "Tier 1–2 지원을 고객 측 관리자와 키유저에게 이관했다", "관리자 교육(운영 자립 수준)을 마쳤다", "데이터 로드 도구와 사용 가이드를 인계했다", "구성 설계서를 as-built 상태로 갱신하고 구성 추출 스냅숏을 남겼다", "DEV/PROD 운영 규칙(변경 로그, 변경 승인, 유지보수 창)을 합의했다", "MAU 측정을 시작했고 목표 대비 첫 수치를 공유했다", "가치 지표의 기준선 대비 첫 실적을 측정했다", "종료 회의를 열고 교육 피드백과 만족도 설문을 받았다", "교훈 로그를 작성했다", "다음 단계(사이트 웨이브, 연동 릴리스, 추가 기능) 제안을 전달했다", "월간 활동 확인서 또는 인수 기록에 서명을 받았다"]}, {"t": "sec", "id": "renewal", "text": "운영·갱신"}, {"t": "checklist", "id": "cl15-renewal", "title": "9. 갱신 준비", "items": ["만료 약 10개월 전에 갱신 준비를 시작했다", "성공 계획과 갱신 범위를 고객과 먼저 합의했다(상업 조건은 그다음)", "최근 QBR마다 예상 가치와 검증된 가치를 구분해 보고했다", "MAU를 목표 대비로 보고했다(할당 사용자 수가 아니다)", "가치 검증 레지스터에 정량/정성 구분과 고객 검증자가 있다", "미사용 시간 풀의 만료 일정과 사용 계획을 고객과 공유했다", "고객 관리자 자립 계획의 진척(운영 자립 → 개발 자립)을 정리했다", "지원 실적(케이스, 대응 시간, CCB 처리 건수)을 요약했다", "연간 헬스 체크 결과와 권고를 갱신 범위에 반영했다", "다음 단계 비즈니스 케이스(사이트 확장, 추가 기능)를 준비했다", "고객의 예산 주기, 사업부별 승인 필요 여부, 내부 승인 소요(2–3주)를 확인했다", "협상 시작 입장과 철수 기준을 내부적으로 정했다", "‘Fusion Manage가 우리 요구를 충족하는가’ 같은 고객 우려를 목록화하고 근거를 준비했다"]}, {"t": "quiz", "items": [{"q": "관측 프로젝트에서 UAT 지연의 가장 큰 원인은?", "options": ["고객 테스터의 가용성", "제품 결함", "파트너 인력 부족"], "answer": 0, "why": "UAT는 모든 주요 프로젝트에서 10–25주 늦어졌고, 순위 1위 원인은 고객 테스터 가용성이었습니다. 명명된 테스터와 보호된 시간을 SOW에 넣으십시오."}, {"q": "운영 전환 Go/No-go에서 맞춤 코드(웹 앱·로더)에 대해 확인할 것은?", "options": ["코드 줄 수", "소스 코드 라이선스(SCLA) 서명과 지원 경계", "개발자 이력서"], "answer": 1, "why": "SCLA가 늦어져 UAT가 멈추고 인계가 지연된 사례가 반복되었습니다. 계약 단계에서 합의하고 운영 전환 전에 서명을 확인합니다."}, {"q": "갱신 준비 시 도입 현황을 보고하는 올바른 지표는?", "options": ["할당된 사용자 수", "구성한 워크스페이스 수", "목표 대비 MAU"], "answer": 2, "why": "할당 사용자는 수천 명이었지만 활성 사용자는 수백 명에 머문 사례가 있었습니다. 목표 대비 MAU로 보고해야 갱신 판단이 정확해집니다."}]}]}, {"id": "glossary", "num": "16", "group": "kit", "title": "Fusion Manage 프로젝트 *용어집*", "short": "용어집", "goal": "이 아카데미 전체에서 쓰는 제품·PLM 프로세스·딜리버리·연동 용어 70개의 뜻을 같은 기준으로 이해하고, 고객 문서에서 일관되게 쓸 수 있습니다.", "facts": [["학습 시간", "20분(참조용)"], ["대상", "전원"], ["산출물", "팀 공통 용어 기준"]], "blocks": [{"t": "lead", "text": "같은 단어를 다르게 쓰면 범위 논쟁이 생깁니다. 특히 **범위 변경서(Change Request)**와 **설계 변경 요청(ECR)·지시(ECO)**는 반드시 구분하십시오. 아래 표의 한국어 표기를 SOW, 설계서, 교육 자료에서 그대로 쓰는 것을 권장합니다."}, {"t": "callout", "kind": "rule", "title": "이 아카데미의 표기 원칙", "items": ["제품·업계 표준 용어는 원어 그대로 씁니다: Fusion Manage, Vault, BOM, eBOM, mBOM, ECR, ECO, CAPA, NCR, RMA, APQP, PPAP, UAT, SIT, REST API, RAID, RACI, KPI, QBR", "상업적 변경은 항상 ‘범위 변경서’입니다. ECR/ECO라고 부르지 않습니다", "공수는 시간(h)과 인일(1인일 = 8h)로만 씁니다. 금액은 귀사 견적서에서 다룹니다"]}, {"t": "sec", "id": "product", "text": "제품 용어"}, {"t": "table", "head": ["용어", "의미", "관련 모듈"], "rows": [["테넌트 (Tenant)", "고객별로 분리된 Fusion Manage 클라우드 환경. 구성·데이터·사용자를 테넌트 단위로 관리합니다", "[[product|01]]"], ["샌드박스 테넌트 (Sandbox)", "구성과 테스트를 위한 비운영 테넌트. 구축·UAT를 여기서 하고 운영 데이터와 분리합니다", "[[method|08]]"], ["운영 테넌트 (Production tenant)", "실제 업무가 돌아가는 테넌트. 승인된 변경만 반영하고, 샌드박스에서 옮기는 절차를 문서화해 둡니다", "[[method|08]], [[support|12]]"], ["워크스페이스 (Workspace)", "레코드 유형 하나를 담는 단위(예: 아이템, 변경 요청, 부적합). 탭·필드·워크플로·권한을 가집니다", "[[product|01]]"], ["항목 세부 정보 (Item Details)", "레코드의 기본 탭. 섹션과 필드로 구성되며 섹션별 편집 권한과 워크플로 잠금을 설정합니다", "[[product|01]]"], ["디스크립터 (Descriptor)", "목록·검색·링크에 표시되는 레코드 이름 규칙(예: 번호 + 제목)", "[[product|01]]"], ["워크플로 (Workflow)", "상태와 전이로 이루어진 업무 흐름. 전이마다 권한, 사전 조건, 검증·동작 스크립트, 알림을 붙입니다", "[[product|01]], [[catalog|04]]"], ["라이프사이클 (Lifecycle)", "개정 관리 워크스페이스의 릴리스 상태와 효력. 변경 지시를 통해 상태가 바뀝니다", "[[product|01]]"], ["개정 관리 워크스페이스", "아이템처럼 개정을 갖는 워크스페이스. 자체 워크플로 없이 변경 지시로 릴리스되므로 설계 변경과 함께 설계합니다", "[[catalog|04]], [[roadmap|13]]"], ["BOM 탭 (Bill of Materials)", "아이템의 하위 구성품 구조. BOM 뷰마다 표시 필드와 출처(시스템·항목 세부 정보·BOM 필드)를 정합니다", "[[product|01]], [[data|10]]"], ["관리 항목 탭 (Managed Items)", "변경 요청·지시가 영향을 주는 아이템 목록. 대상 개정과 라이프사이클 전이를 여기서 지정합니다", "[[catalog|04]]"], ["그리드 탭 (Grid)", "레코드 안의 표 형식 데이터(예: 작업 목록). 행 삭제를 권한으로 막을 수 없어 취소 상태와 템플릿 복원으로 보완합니다", "[[product|01]]"], ["피클리스트 (Picklist)", "선택 목록. 고정 값 목록과 다른 워크스페이스 기반 목록이 있으며, 보고를 위해 자유 텍스트보다 권장합니다", "[[product|01]]"], ["스크립트 (Script)", "서버 측 자동화. 조건(Condition), 검증(Validation), 동작(Action), 라이브러리(Library) 유형이 있고 실행 시간 제한이 있습니다(관측: 조건 4초, 검증·동작 9초)", "[[product|01]], [[method|08]]"], ["역할·그룹·권한", "역할은 워크스페이스별 권한 묶음, 그룹은 사용자 묶음입니다. 그룹에 역할을 주고, 그룹을 레코드의 추가 소유자로 붙여 접근을 제어합니다", "[[product|01]], [[method|08]]"], ["표준 구성 (OOTB)", "제품이 기본 제공하는 워크스페이스·워크플로. 표준에서 시작해 편차만 설계하면 유지보수와 업데이트가 쉬워집니다", "[[product|01]], [[catalog|04]]"], ["분류 (Classification)", "아이템 유형별 속성 세트를 정의하는 구조. 레거시 하위 클래스를 분류 기반 섹션으로 정리할 때 씁니다", "[[data|10]]"]]}, {"t": "sec", "id": "process", "text": "PLM 프로세스 용어"}, {"t": "table", "head": ["용어", "의미", "관련 모듈"], "rows": [["PLM", "제품 수명 주기 관리. 아이템·BOM·개정·변경·품질 프로세스의 기준 시스템입니다", "[[product|01]]"], ["PDM", "제품 데이터 관리. CAD 파일과 버전을 관리하며 Vault가 대표적입니다", "[[product|01]], [[data|10]]"], ["버전과 개정 (Version·Revision)", "버전은 PDM의 작업 저장 단위, 개정은 PLM에서 릴리스된 공식 상태입니다. 원칙: PDM은 버전, PLM은 개정, ERP는 부품 번호를 소유합니다", "[[data|10]]"], ["eBOM", "설계 관점의 BOM. 설계 의도대로의 구성품 구조입니다", "[[catalog|04]], [[data|10]]"], ["mBOM", "제조 관점의 BOM. 사이트별 제조/구매 구분과 공정 순서를 반영합니다", "[[catalog|04]], [[data|10]]"], ["마스터/브랜치 아이템", "전사 공통 마스터 레코드 + 사이트별 브랜치 레코드. eBOM은 마스터, mBOM은 브랜치에 두고 ERP에는 브랜치 데이터만 보냅니다", "[[data|10]]"], ["설계 변경 요청 (ECR)", "변경 필요를 제기하고 영향을 평가하는 요청. 승인되면 설계 변경 지시로 이어집니다", "[[catalog|04]]"], ["설계 변경 지시 (ECO)", "승인된 변경을 실행하는 지시. 영향 아이템의 개정과 릴리스를 수행하고, 사이트·기능별 변경 작업을 둡니다", "[[catalog|04]]"], ["편차 승인 (Deviation)", "정해진 사양에서 한시적으로 벗어나는 것을 승인하는 프로세스. 기간·수량 조건과 갱신 루프가 있을 수 있습니다", "[[catalog|04]]"], ["단종 관리 (Obsolescence)", "부품·제품의 단종 요청, 영향 분석, 대체품 처리를 관리하는 프로세스", "[[catalog|04]]"], ["제품 포트폴리오 관리 (PPM)", "제품군·제품 계층과 수명 주기 단계를 관리하는 기능", "[[catalog|04]]"], ["변경 통제 위원회 (CCB)", "변경 요청을 심사·승인하는 위원회. 운영 이후에는 Fusion Manage 구성 변경 요청도 매월 심사합니다(관측: 약 10건 중 1건 반려)", "[[catalog|04]], [[support|12]]"], ["문제 보고 (Problem Report)", "현장 문제를 등록해 품질·변경 프로세스로 연결하는 시작점. 폐루프 데모의 첫 단계입니다", "[[sell|02]], [[catalog|04]]"], ["NCR", "부적합 보고. 규격을 벗어난 자재·제품을 기록하고 처리합니다", "[[catalog|04]]"], ["CAPA", "시정·예방 조치. 문제의 근본 원인을 찾아 재발을 막는 조치를 관리합니다", "[[catalog|04]]"], ["RMA", "반품 승인. 고객 반품을 접수하고 조사·처리합니다", "[[catalog|04]]"], ["APQP", "사전 제품 품질 계획. 관문과 요소별 소유자로 신제품 품질 활동을 관리합니다", "[[catalog|04]]"], ["PPAP", "양산 부품 승인 절차. 양산 전 부품이 요구 사항을 충족함을 증빙합니다", "[[catalog|04]]"], ["AVL", "승인 공급업체 목록. 아이템별로 사용 가능한 공급업체와 공급업체 부품 번호를 관리합니다", "[[catalog|04]]"]]}, {"t": "sec", "id": "delivery", "text": "딜리버리·상업 용어"}, {"t": "table", "head": ["용어", "의미", "관련 모듈"], "rows": [["SOW (작업 범위 기술서)", "작업별 설명·산출물·가정·고객 책임·상한·공수를 적은 계약 문서. 관측된 SOW는 작업당 2쪽 안팎이었습니다", "[[sow|05]]"], ["범위 변경서 (Change Request)", "SOW의 범위·공수·일정을 바꾸는 상업 문서. 설계 변경(ECR/ECO)과 다릅니다", "[[sow|05]], [[commercial|06]]"], ["최선 노력 (best effort)", "결과 보증이 아니라 합의한 활동과 공수를 제공하는 방식. 상한과 고객 책임이 있어야 안전합니다", "[[commercial|06]], [[risk|07]]"], ["인수(검수) (Acceptance)", "산출물을 수용했다는 확인. 검토 기간 후 간주 인수나 월간 활동 확인서로 운영할 수 있습니다", "[[sow|05]], [[commercial|06]]"], ["T&M·고정가", "T&M은 실제 투입 시간으로 청구(상한 설정), 고정가는 범위를 고정하고 공수 위험을 파트너가 집니다", "[[commercial|06]]"], ["리테이너 (선불 시간 풀)", "미리 확보한 시간을 요청 단위로 소진하는 모델. 만료일, 취소 불가, 일정 변경 규칙을 함께 정합니다", "[[commercial|06]]"], ["인일 (Person-day)", "공수 단위. 1인일 = 8h이며 방문 1일은 최소 8h로 계산합니다", "[[estimate|03]]"], ["예비 공수 (Contingency)", "불확실성에 대비한 추가 공수. 기본 20%, 디스커버리·설계는 30% 이상(관측 초과 +10%–+213%)", "[[estimate|03]]"], ["착수 (모빌라이제이션)", "킥오프와 그 준비. 팀·범위·일정·커뮤니케이션·리스크를 합의합니다", "[[method|08]], [[templates|14]]"], ["현행 (As-Is)", "현재 프로세스·시스템·문제·기준선 KPI를 기록하는 단계와 문서", "[[method|08]]"], ["목표 (To-Be)", "미래 프로세스와 구성 방향을 정의하는 단계와 문서. 서면 승인이 구축 착수의 관문입니다", "[[method|08]]"], ["RTM (요구사항 추적 매트릭스)", "요구사항을 사용 사례·설계·테스트 케이스·릴리스까지 연결한 표", "[[method|08]], [[templates|14]]"], ["RAID", "리스크(Risk)·가정(Assumption)·이슈(Issue)·의존성(Dependency) 또는 결정(Decision) 로그", "[[team|09]], [[templates|14]]"], ["RACI", "활동별 실행(R)·책임(A)·협의(C)·통보(I) 역할 표", "[[team|09]]"], ["SIT (시스템 통합 테스트)", "연동을 포함한 시스템 간 테스트. 고객 연동 팀이 주도하고 파트너가 지원하는 경우가 많습니다", "[[data|10]]"], ["UAT (사용자 인수 테스트)", "고객 키유저가 To-Be 기준 시나리오로 수행하는 테스트. 관측 일정 리스크 1위입니다", "[[method|08]], [[risk|07]]"], ["운영 전환 (Go-live)", "운영 테넌트에서 실제 업무를 시작하는 시점. 기존 프로세스를 중단합니다", "[[method|08]], [[checklists|15]]"], ["하이퍼케어 (Hypercare)", "운영 전환 직후 집중 지원 기간(관측: 8–16h, 3–5일). 종료 기준을 두고 고객 측 관리자에게 이관합니다", "[[support|12]]"], ["종료 (클로즈아웃)", "작업을 공식 종료하고 인계·가치 확인·다음 단계를 다루는 회의와 문서", "[[method|08]], [[templates|14]]"], ["키유저·현업 챔피언", "키유저는 설계·UAT에 참여하는 현업 대표(주당 약 20%), 챔피언은 사이트에서 도입을 이끄는 사람입니다", "[[training|11]]"], ["MAU (월간 활성 사용자)", "한 달 동안 실제로 사용한 사용자 수. 할당 사용자 수 대신 도입 지표로 씁니다", "[[support|12]]"], ["QBR (분기 비즈니스 리뷰)", "분기마다 가치·도입·리스크·다음 90일을 고객 경영진과 검토하는 회의", "[[support|12]], [[templates|14]]"], ["성공 계획 (Success plan)", "이니셔티브별 목표·가치 지표·마일스톤·리스크를 고객과 함께 관리하는 문서", "[[support|12]], [[templates|14]]"], ["AMS (운영 지원 서비스)", "운영 전환 이후 지원·개선·릴리스 대응을 계약으로 제공하는 서비스", "[[support|12]], [[roadmap|13]]"], ["SCLA (소스 코드 라이선스 계약)", "맞춤 코드(웹 앱·로더·스크립트)의 소스 인계와 사용 조건을 정하는 계약. 늦으면 UAT와 인계가 멈춥니다", "[[risk|07]]"]]}, {"t": "sec", "id": "integration", "text": "연동 용어"}, {"t": "table", "head": ["용어", "의미", "관련 모듈"], "rows": [["REST API", "외부 시스템이 Fusion Manage 레코드를 읽고 쓰는 표준 인터페이스. 서비스 계정으로 인증하고 사용자를 대행해 호출합니다", "[[data|10]]"], ["웹훅 (Webhook)", "이벤트가 발생하면 외부 시스템에 알리는 방식. 알림을 받은 쪽이 REST API로 상세를 조회합니다. 대상 테넌트에서 지원 범위를 사전에 확인하십시오", "[[data|10]]"], ["미들웨어·iPaaS", "시스템 간 데이터를 변환·전달하는 통합 플랫폼. 고객이 지정한 미들웨어가 있으면 그것을 우선합니다", "[[data|10]]"], ["프록시 (Proxy)", "Fusion Manage와 고객 미들웨어 사이의 중간 계층. 파트너가 PoC로 제공하는 경우가 많습니다(관측: 80–264h)", "[[data|10]], [[estimate|03]]"], ["필드 매핑 (Field mapping)", "원천 시스템 필드와 Fusion Manage 필드의 대응 표. 마스터 속성 목록에서 관리합니다", "[[data|10]], [[templates|14]]"], ["델타 동기화 (Delta sync)", "변경분만 비교해 반영하는 방식. 대량 초기 로드 후 반복 실행을 분 단위로 줄입니다", "[[data|10]]"], ["통합 계정·통합 역할", "연동 전용 사용자와 [Integration] 역할. 연동 데이터는 숨김 필드에 두고, 읽기 전용 필드는 API로 쓸 수 없습니다", "[[data|10]]"], ["Vault 커넥터", "Vault와 Fusion Manage를 잇는 전용 커넥터(관측: 운영 전환까지 5–15일). Vault 버전과 아이템 번호 규칙을 먼저 확인합니다", "[[data|10]], [[roadmap|13]]"], ["큐 워크스페이스 (Job queue)", "연동 작업을 레코드로 쌓아 재시도·오류 로그·정리를 관리하는 패턴", "[[data|10]]"]]}, {"t": "quiz", "items": [{"q": "고객이 SOW에 없는 기능을 추가하자고 할 때 작성하는 문서는?", "options": ["설계 변경 지시(ECO)", "범위 변경서(Change Request)", "설계 변경 요청(ECR)"], "answer": 1, "why": "상업적 변경은 항상 범위 변경서입니다. ECR/ECO는 고객의 제품 설계 변경 프로세스를 가리키므로 혼용하면 범위 논쟁이 생깁니다."}, {"q": "마스터/브랜치 아이템 모델에서 ERP로 보내는 데이터는?", "options": ["마스터의 eBOM 전체", "마스터와 브랜치 모두", "브랜치 데이터만"], "answer": 2, "why": "eBOM은 마스터, mBOM은 브랜치에 두고 사이트별 브랜치 데이터만 ERP로 보냅니다."}, {"q": "도입 현황을 보고할 때 MAU가 뜻하는 것은?", "options": ["월간 활성 사용자 수", "할당된 사용자 수", "월간 신규 아이템 수"], "answer": 0, "why": "할당 사용자는 많아도 실제 사용자는 적을 수 있습니다. 목표 대비 MAU를 보고하십시오."}, {"q": "사용자가 입력한 값이 규칙에 맞는지 전이 시점에 확인하는 스크립트 유형은?", "options": ["동작(Action)", "검증(Validation)", "라이브러리(Library)"], "answer": 1, "why": "검증 스크립트는 입력 확인에, 조건·사전 조건은 전이 가능 여부에, 동작 스크립트는 후속 처리에, 라이브러리는 공통 함수에 씁니다."}]}]}, {"id": "builder", "num": "17", "group": "kit", "title": "범위 템플릿으로 *SOW·견적 초안* 만들기", "short": "SOW·견적 빌더", "goal": "범위 템플릿을 고르고 조건을 입력해, 라인 아이템·견적 요약·SOW 초안이 어떤 모습이 될지 몇 분 안에 가늠할 수 있습니다.", "facts": [["학습 시간", "20분"], ["대상", "영업·PM"], ["산출물", "SOW·견적 초안(참고용)"]], "blocks": [{"t": "lead", "text": "고객과 첫 미팅을 마친 뒤 \"이 정도 범위면 SOW와 견적이 어떤 모양일까?\"를 빠르게 확인하는 도구입니다. 결과는 **검토 전 초안**이며, 모든 문서에 참고용 워터마크가 붙습니다."}, {"t": "callout", "kind": "warn", "title": "이 빌더의 결과를 그대로 고객에게 보내지 마십시오", "items": ["공수는 과거 엔터프라이즈 프로젝트의 관측치(일부 추정)입니다. 귀사 경험과 고객 디스커버리로 반드시 조정하십시오.", "SOW 문구·상한·고객 책임·제외 범위는 구조 예시입니다. 실제 사용 전 귀사 법무 검토가 필요합니다.", "이 빌더와 결과물은 Autodesk 공식 자료가 아니며, 견적의 정확성이나 프로젝트 성공을 보장하지 않습니다."]}, {"t": "sec", "id": "how", "text": "사용 방법"}, {"t": "steps", "items": [{"title": "범위 템플릿 고르기", "text": "A–H 중 고객 상황에 가장 가까운 것을 고릅니다. 템플릿마다 라인 아이템, 산출물, 상한, 제외 범위, 청구 마일스톤이 미리 들어 있습니다.", "meta": "템플릿 근거: [[catalog|04 프로젝트 유형]]의 추천 패키지와 [[estimate|03 스코핑·견적]]의 기준 공수"}, {"title": "조건 입력", "text": "고객명·귀사명(문서 표시용), 사이트 수, 사용자 수, PM·예비 공수 비율, 투입 FTE, 귀사 1인일 단가(선택)를 넣습니다. 복잡도를 일괄로 S/M/L로 바꿀 수도 있습니다."}, {"title": "라인 아이템 조정", "text": "필요 없는 항목은 끄고, 옵션 항목은 켭니다. 항목별 S/M/L을 바꾸면 공수가 즉시 다시 계산됩니다."}, {"title": "결과 확인과 내보내기", "text": "**견적 요약**(단계별 공수·인일·참고 금액·청구 마일스톤), **라인 아이템**, **SOW 초안** 탭을 확인한 뒤 Word(.doc), CSV(엑셀), 인쇄/PDF로 내보냅니다."}, {"title": "검증 후 확정", "text": "초안을 귀사 SOW 템플릿에 옮기고, 디스커버리 결과·귀사 단가·법무 검토를 반영해 확정합니다.", "meta": "구조와 문구 원칙: [[sow|05 SOW 작성]], 상업 모델: [[commercial|06 계약·상업 모델]]"}]}, {"t": "sec", "id": "tool", "text": "SOW·견적 빌더"}, {"t": "builder"}, {"t": "p", "text": "입력값은 이 브라우저에 자동 저장됩니다. 템플릿을 바꾸면 고객명·귀사명·단가·사이트 수는 유지되고, 라인 아이템은 새 템플릿 기본값으로 바뀝니다. **초기화**는 현재 템플릿을 기본값으로 되돌립니다."}, {"t": "sec", "id": "templates", "text": "템플릿 한눈에
