현 트래커에 기록 → 고객 변경 심의위원회(CCB) 승인 → 고객 관리자가 운영 반영 → dev와 운영 비교 순서로 진행합니다. 관측된 dev→운영 반영은 약 2일, 업무 시간 외, 접근을 제한한 상태에서 했습니다. 운영 이후 체계는 [[support|12 지원·유지보수·도입 확산]]을 보십시오."}, {"t": "details", "items": [{"title": "복제가 아닌 앱 단위 이관(수동 재구성) 절차", "blocks": [{"t": "p", "text": "이미 운영 중인 테넌트에 새 앱을 올릴 때는 테넌트를 복제할 수 없습니다. 관측 당시에는 이관 도구가 없어 문서화된 수동 재구성으로 진행했습니다. 데이터가 많으면 별도 프로젝트로 분리합니다."}, {"t": "steps", "items": [{"title": "원본 테넌트의 모든 객체를 평가합니다"}, {"title": "데이터 이관 필요 여부를 정합니다", "text": "샌드박스 데이터는 대개 정리되어 있지 않습니다."}, {"title": "워크스페이스 의존성으로 구축 순서를 정합니다", "text": "구성 추출 도구로 의존성을 확인합니다."}, {"title": "테넌트와 계정을 확인합니다", "text": "원본·대상 테넌트, 관리자·연동(대리 실행) 계정, OAuth 클라이언트."}, {"title": "원본과 대상을 준비합니다", "text": "원본: 사용자·그룹·백업. 대상: 사용자·그룹·권한, 클라이언트 ID 허용 등록."}, {"title": "워크스페이스를 순서대로 만듭니다", "text": "사용자 피클리스트 → 스크립트 복사 → 같은 이름의 워크스페이스 → 역할에 먼저 추가 → 섹션 → 필드 → 디스크립터 → 그리드 → 탭 이름 → BOM·관리 항목 필드 → 관계 → 인쇄 뷰."}, {"title": "고객 테스트 스크립트로 테스트합니다", "text": "승인 흐름은 두 번째 사용자로 확인합니다."}, {"title": "운영 구성을 추출해 샌드박스 스냅샷과 비교합니다"}, {"title": "모니터링하고 관리자 교육·인계를 합니다"}]}]}]}, {"t": "sec", "id": "docs", "text": "As-built 문서와 프로젝트 폴더"}, {"t": "p", "text": "To-Be는 구축을 시작할 때 잠급니다. 그 뒤 설계를 바꾸는 이슈와 결함은 **As-built**(구축 결과 문서)에 기록합니다. As-built는 이슈 로그가 채워 넣는 **살아 있는 문서**입니다. 목업 화면을 실제 구축 화면으로 바꾸고, 모든 스크립트의 의도를 적습니다. 관측 사례에서 이런 기록이 없는 이전 솔루션을 물려받은 고객은 구조를 해독하는 데 오래 걸렸습니다."}, {"t": "list", "title": "As-built를 빠르게 만드는 방법 (관측)", "items": ["구성 추출 도구를 씁니다. 워크스페이스별 보안·스크립트·피클리스트를 스프레드시트로 뽑는 스냅샷 도구, HTML 구성 문서 도구, 스크립트와 JSON까지 내보내 버전 저장소에서 비교하는 구성 추출 유틸리티가 쓰였습니다.", "고객 관리자와 함께 약 4주에 걸쳐 작성하고, Autodesk 지원팀이 볼 수 있게 공유했습니다.", "작성 책임을 SOW에 적습니다. 한 계약에서는 구축 문서화를 범위에서 빼고, 고객이 작성하고 파트너가 검토하도록 정했습니다.", "목표 수준은 “새 테넌트에서 구성을 복원·재현할 수 있다”입니다. 대형 프로젝트의 As-built는 300쪽을 넘었습니다."]}, {"t": "template", "title": "As-built(구성) 문서 목차", "sections": [{"h": "목적과 범위", "items": ["새 테넌트에서 복원·재현 가능한 수준을 목표로 함", "사용한 구성 추출 도구와 추출 일자"]}, {"h": "공통 설정", "items": ["디스크립터, 메일, 보안(클라이언트 ID 포함), 표시, 리비전 관리, BOM, CORS", "그룹·역할, 사용자, 메인 메뉴"]}, {"h": "역량별", "items": ["설명, 단계별 사용 사례, 구성 개요와 워크스페이스 관계도"]}, {"h": "워크스페이스별", "items": ["권한, 상세 필드·섹션(워크플로 잠금), 디스크립터, 그리드, BOM 필드·뷰, 관계, 탭 이름·순서, 동작 설정", "워크플로: 상태(알림·에스컬레이션), 전이(사전 조건·검증·액션 스크립트)", "피클리스트, 라이프사이클(상태·유효성·전이)"]}, {"h": "스크립트 라이브러리", "items": ["스크립트별 트리거, 의도, 변경 이력"]}, {"h": "문서 관리", "items": ["변경 이력, 배포 목록, 승인 이력, 참고 문서, 약어"]}]}, {"t": "table", "title": "표준 프로젝트 폴더 구조 (01–08)", "head": ["폴더", "담는 것", "주 담당"], "rows": [["01 Project Planning", "일정표 내보내기, 공수 계획과 버전, 착수 자료, RACI, 스프린트 계획, 무상 지원 기록, 종료 회의", "PM"], ["02 Requirements", "현행(As-Is) 프로세스, 고객 SOP·양식·핸드북, 질의서(RFI)와 회신", "컨설턴트"], ["03 Design", "목표(To-Be) 설계와 승인 메일, As-built, 기능 사양, 필드 매핑, 설계 세션 기록", "리드 컨설턴트"], ["04 Development", "스크립트 소스, 확장·웹 앱 코드, 디스커버리 세션 자료. 관측 프로젝트에서는 대부분 비어 있었으므로 스크립트 소스와 변경 로그를 여기에 두기를 권장", "구성·스크립트 컨설턴트"], ["05 Testing", "UAT 스크립트, 임포트 테스트 파일, UAT 교육 자료, 이슈 로그", "컨설턴트·고객 관리자"], ["06 Documentation", "교육 자료(작성자·검토자 표시), 워크스페이스 목록, 고객 문서(대장·가이드라인)", "교육 담당"], ["07 Communication", "외부 회의, 주간 회의(날짜별 녹취 + 요약 메일), 내부 회의, 효과 검증 자료, 승인 메일", "PM"], ["08 Outputs", "웹 앱 코드 전달본과 인계 메일, 테넌트 상태 메일 등 최종 산출물", "리드 컨설턴트"], ["09 Misc", "소스 코드 라이선스 등 법무·준수 문서", "PM"]], "note": "관측된 흐트러짐: 루트에 놓인 파일, “Communications”와 “07 Communication”의 혼용, 하위 프로젝트가 상위 폴더 안에 자체 01·03·07을 만든 경우. 권장 규칙: 루트에는 파일을 두지 않고, 하위 프로젝트도 같은 번호 체계를 쓰며, 승인본 파일명 끝에 `_APPROVED_<날짜>`를 붙입니다."}, {"t": "p", "text": "분기마다 한 번은 감사용 중앙 저장소를 점검합니다(관측: 최소 분기 1회 필수). 서명된 SOW와 범위 변경서, 고객 승인 메일, 활동 보고서, 착수 자료와 계획, 결과물, 종료 자료가 모두 있어야 합니다. 템플릿 모음은 [[templates|14 템플릿]]에 있습니다."}, {"t": "sec", "id": "devguide", "text": "개발 가이드라인과 관문 체크리스트"}, {"t": "table", "title": "명명 규칙 (관측된 표준)", "head": ["대상", "규칙", "예"], "rows": [["워크스페이스", "운영 중이면 업무 이름 그대로. 개발 중이면 `[DEV]`(또는 `[Test]`·`[Chg]`) 접두어와 담당·목적 메모. 미사용이면 `[Unused]` 접두어 + 비활성화", "`[DEV] 공급업체 요청`"], ["피클리스트", "워크스페이스 기반 목록은 `[WS] 목록명`(설명에 워크스페이스명), 텍스트 목록은 일반 이름. 개발·미사용 접두어는 같게", "`[WS] Sites`"], ["보고서", "`<워크스페이스 약어> <내용>`", "`CR 월별 평균 처리 일수`"], ["스크립트", "`<워크스페이스> <onCreate·onEdit·WF> <Condition·Validation·Action·Library>`. 공용 라이브러리는 `GEN` 접두어", "`CO WF Validation`"], ["역할", "`[Admin]`, `[R]`, `[C]`, `[E]`, `[D]`, `[Import]`, `[Business Admin]`, `[Integration]`, `[Unused]`", "`[E] 변경 코디네이터`"]], "note": "관측 교훈: 승인 목록 이름이 제각각이라 고객이 유지보수에 애를 먹었습니다. 명명 규칙은 착수 1일차에 합의하고 As-built에 적습니다."}, {"t": "checklist", "id": "method-devguide", "title": "개발 가이드라인 체크리스트", "items": ["명명 규칙(워크스페이스·피클리스트·보고서·스크립트·역할)을 착수 1일차에 합의하고 문서화했다", "개발 중 엔티티에는 `[DEV]`, 미사용 엔티티에는 `[Unused]`를 붙이고, 운영 반영 직전에 `[DEV]`를 제거한다", "스크립트와 연동은 표시 이름이 아니라 **ID**로 참조한다. 워크플로 상태 이름을 바꾸자 순차 작업 기능이 깨진 사례가 있었다", "테넌트마다 달라질 수 있는 값(섹션 ID 등)은 하드코딩하지 않고 한곳의 상수로 관리한다", "스크립트 시간 제한(조건 4초, 검증·액션 9초, 체인 90초)을 고려해 무거운 검증은 연동 프록시나 배치로 뺐다", "생성 로직은 onCreate+onEdit 대신 초기 전이 스크립트에 두고, 되돌리기 전이 대신 숨김 리셋 전이를 쓴다", "역할을 계층(`[R]`·`[C]`·`[E]`·`[D]`·`[Import]`·`[Business Admin]`·`[Integration]`)으로 설계해 사이트가 늘어도 권한을 관리할 수 있다", "모든 개발은 샌드박스(dev)에서 하고, 운영에는 승인된 앱 단위로만 반영한다. 워크스페이스를 바꾸기 전에 복제본을 만든다", "모든 구성 변경을 구현 트래커(ID·작업·워크스페이스·설명·담당·구성 상태·스크립트 상태)에 기록한다", "운영 반영 전후로 dev와 운영을 비교 도구나 구성 스냅샷으로 비교한다", "일괄 임포트·일괄 수정 전에 대상 워크스페이스를 내보내 백업한다. 일괄 수정으로 스크립트가 다시 실행되어 운영 데이터가 손상된 사례가 있었다", "dev를 분기 또는 반기마다 운영에서 재동기화하는 일정을 운영 계획에 넣었다"]}, {"t": "checklist", "id": "method-gates", "title": "단계 관문 체크리스트", "items": ["착수: 고객 인가 요청자, 키유저·테스터 후보, 휴가·변경 동결 일정을 받았다", "착수: RACI와 RAID 초기본을 고객과 함께 작성했다", "현행: 현행 문서를 실제 실무자와 검증하고 서면 승인을 받았다", "목표: To-Be 검토 기간·워크스루 일정·간주 승인 기한을 합의했다", "목표: 버전이 명시된 To-Be 서면 승인을 저장소에 보관했다", "상세 계획: 고객 투입 시간과 테스터 명단이 들어간 일정을 고객이 승인했다", "구축: 내부 기능 테스트와 검증 라운드를 마치고 4-eyes 검토 기록을 남겼다", "UAT: 테스터 교육, 스크립트, 테스트 데이터, 결함 수정 상한, 간주 승인 기한을 준비했다", "UAT: 구성 동결을 공지하고 개선 요청을 백로그로 분리했다", "운영 전환: go/no-go 결정, 컷오버 계획, 진행 중 레코드 처리 원칙을 승인받았다", "운영 전환: PROD 1일 집중 점검을 통과하고 컨설턴트의 운영 계정을 비활성화했다", "하이퍼케어: 기간·상한·변경 요청 접수 경로를 고객에게 공지했다", "종료: As-built 최종본, 종료 자료, 잔여 공수 정산, 접근 권한 회수를 마쳤다"]}, {"t": "quiz", "items": [{"q": "To-Be 승인이 늦어질 때 가장 적절한 대응은?", "options": ["승인 없이 구축을 병행해 일정을 지킨다", "검토 기간·워크스루·간주 승인 기한을 정해 승인을 시간 제한형 작업으로 관리한다", "To-Be를 더 자세히 고쳐 다시 보낸다"], "answer": 1, "why": "관측 프로젝트에서 가장 흔한 차단 요인이 To-Be 승인 대기였습니다. 병행 구축은 재작업을 낳았고, 기한·워크스루·간주 승인이 효과적인 완화책이었습니다."}, {"q": "UAT 도중 키유저가 새 기능을 요청했습니다. 올바른 처리는?", "options": ["UAT 일정 안에서 바로 구현한다", "개선으로 분류해 백로그 또는 운영 후 범위 변경서로 보낸다", "기록 없이 거절한다"], "answer": 1, "why": "UAT 중에는 개선을 받지 않습니다. 결함과 개선을 분류하고 운영 전환 필수 여부를 표시한 뒤, 개선은 백로그로 보내 UAT를 기한 안에 끝냅니다."}, {"q": "dev에서 통과한 기능을 운영 테넌트로 옮긴 뒤 할 일은?", "options": ["dev에서 통과했으므로 생략한다", "운영 테넌트에서 핵심 템플릿·승인 목록·핵심 시나리오를 1일 집중 점검한다", "전체 UAT를 처음부터 다시 한다"], "answer": 1, "why": "관측 사례에서 dev 통과 기능이 운영에서 실패했습니다. 전체 재UAT 대신 1일 집중 점검이 현실적인 타협이었습니다."}, {"q": "다사이트 키유저 UAT를 일정에 넣을 때 관측 기준 권장 방법은?", "options": ["명목 기간 그대로 잡는다", "명목 기간의 약 2배로 잡거나 고정 테스트 버퍼를 둔다", "UAT를 생략하고 하이퍼케어로 대신한다"], "answer": 1, "why": "계획 2–3주였던 UAT가 약 7주 걸렸고, 주요 프로젝트마다 UAT가 10–25주 지연되었습니다."}]}]}, {"id": "team", "num": "09", "group": "deliver", "title": "누가, 얼마나, *언제* 참여하는가", "short": "팀·거버넌스", "goal": "이 모듈을 마치면 파트너와 고객의 역할·투입 비율을 정하고, RACI·회의 체계·보고 세트·에스컬레이션 경로를 착수 전에 고객과 합의할 수 있습니다.", "facts": [["학습 시간", "40분"], ["대상", "PM·영업·리드 컨설턴트"], ["산출물", "RACI·회의 체계·보고 세트"]], "blocks": [{"t": "lead", "text": "관측된 지연의 1순위는 파트너의 기술이 아니라 **고객 테스터와 IT 팀의 가용성**이었습니다. 팀 설계는 파트너 인력 배치로 끝나지 않습니다. 고객이 누구를 얼마나 내놓을지 SOW에 적고, 회의와 보고로 그 약속을 매주 확인하는 일까지가 팀 설계입니다."}, {"t": "sec", "id": "partner", "text": "파트너 측 역할"}, {"t": "stats", "items": [{"value": "1–3명", "label": "프로젝트당 컨설턴트 수 (관측)"}, {"value": "~1/3 FTE", "label": "약 15개 프로젝트 포트폴리오의 프로그램 관리 (관측)"}, {"value": "~20%", "label": "설계·UAT 기간 키유저의 주당 투입 (관측)"}, {"value": "10–25주", "label": "고객 테스터 가용성이 주원인이 된 UAT 지연 (관측)"}]}, {"t": "table", "title": "역할과 책임", "head": ["역할", "주요 책임", "관측 근거·주의"], "rows": [["영업·어카운트 담당", "관계와 상업 조건, SOW·범위 변경서 협상, 확장 기회 발굴. 착수 때 딜리버리에 서술형 인계(고객이 거절한 것과 이유 포함)", "인계가 부실하면 이전 단계의 지식 이전 부족이 다음 영업의 반론이 되었습니다"], ["프리세일즈 솔루션 컨설턴트", "디스커버리, 데모, 견적 초안, 가치 지표, 다음 단계 비즈니스 케이스", "기술 솔루션 리드가 성공 계획과 후속 단계 케이스를 썼습니다"], ["PM", "주간 회의와 요약 메일, 일정, RAID, 시간 소진 트래커, 범위 변경서 준비, 착수·종료 주관", "PM 한 명이 워크스트림 5개를 병행했습니다. 착수·종료는 각 0.5인일로 따로 표기했습니다"], ["리드 컨설턴트·솔루션 아키텍트", "To-Be 설계 책임, 설계 결정, 4-eyes 품질 관문, 연동 아키텍처", "리드 1인 의존이 컸고 솔루션 아키텍트 역할이 비어 있었습니다. “비즈니스 컨설턴트는 테넌트를 직접 구성하지 않는다”가 교훈이었습니다"], ["구성·스크립트 컨설턴트", "워크스페이스·워크플로·권한 구성, 스크립트, 결함 수정, 테스터 교육", "컨설턴트당 주 2–34h, 3–4개 프로젝트에 나눠 배정되었습니다"], ["연동 개발자·API SME", "프록시·미들웨어 지원, API 교육, 필드 매핑 검토, SIT 지원", "고객 연동팀 주간 회의에 주 약 1h 참여(두 번째 눈). 웹 앱은 개발자 3–4명이 만들었습니다"], ["데이터 이관 담당", "데이터 필드 매트릭스, 로드 도구 설정, 시험 로드·검증", "로드 도구를 만든 외부 협력사 한 명이 단일 장애점으로 RAID에 올랐습니다"], ["교육 담당", "교육 요구 분석, 자료 설계·검토, 테스터·관리자 교육, train-the-trainer", "상세: [[training|11 교육 설계]]"], ["지원·AMS 담당", "하이퍼케어, 운영 후 변경 요청 분류, 릴리스 브리핑, 고객 관리자 지원", "상세: [[support|12 지원·유지보수·도입 확산]]"]]}, {"t": "table", "title": "프로젝트 규모별 투입 (관측 + 권장)", "head": ["역할", "소형 (~80h, 추가 기능)", "중형 (130–330h, 단일 역량)", "대형 (530–710h+, 복합 역량·다사이트)"], "rows": [["PM", "총 공수의 10–15%, 겸임 (권장)", "총 공수의 15% (견적 기본값)", "15–20%, 전담에 가까움. 여러 프로젝트면 프로그램 관리 별도"], ["리드 컨설턴트·솔루션 아키텍트", "1명이 리드와 구성을 겸임", "1명 지정 (SOW당 리드 1명이 관측 표준)", "리드 1명 전담 + 솔루션 아키텍트 별도 (권장)"], ["구성·스크립트 컨설턴트", "리드가 겸임", "1명", "1–2명"], ["연동 개발자·API SME", "필요 시", "필요 시, 주 ~1h 검토", "1명 + 웹 앱이면 개발자 3–4명 (관측)"], ["데이터 이관 담당", "-", "구성 컨설턴트가 겸임", "1명"], ["교육 담당", "컨설턴트가 겸임", "컨설턴트가 겸임", "별도 지정 (권장)"], ["Σ 컨설턴트 수 (PM 제외)", "1명", "1–2명", "2–3명 + 개발자"]], "note": "관측: 프로젝트당 컨설턴트 1–3명, 활성 프로젝트당 2–4명 + PM, 컨설턴트 1명이 3–4개 프로젝트에 분할 배정(주 2–34h). 프로그램 관리는 약 15개 프로젝트 포트폴리오에 약 1/3 FTE. PM 비율은 관측 약 8%(순수 지원)~15–20%이며 견적 기본값은 15%입니다([[estimate|03 스코핑과 견적]]). 규모 구간은 관측된 프로젝트 크기(80h / 130–330h / 530–710h)이고, 칸별 배치는 권장입니다."}, {"t": "callout", "kind": "rule", "title": "핵심 인력 리스크는 계약 전에 다룹니다", "items": ["공유 컨설턴트는 다른 고객사로 차출됩니다. 관측된 타협안은 리드가 감독과 핵심 회의에 남고 스크립트 보조 인력을 붙이는 것이었습니다.", "PM 휴가 때 대리인을 지정합니다. PM이 빠진 회의는 상태 보고로만 끝났습니다(관측).", "역할 이름을 분명히 합니다: 비즈니스 컨설턴트, 구성 컨설턴트, 솔루션 아키텍트.", "휴가·공휴일은 메일 서명과 일정표에 미리 공지합니다(관측 관행).", "외부 협력사(로드 도구 저자 등)는 단일 장애점으로 RAID에 올리고 교육·소스 코드 계약으로 완화합니다."]}, {"t": "sec", "id": "customer", "text": "고객 측 역할"}, {"t": "p", "text": "관측 프로젝트는 선불 시간 풀 기반의 엔터프라이즈 계약으로 운영되었고, 고객 측 **단일 인가 요청자**가 모든 작업 요청과 공수 변경을 승인했습니다. 파트너 모델에서는 이 사람을 SOW와 범위 변경서(Change Request)의 승인자로 계약서에 명시합니다. 승인 창구가 하나여야 범위와 공수 이력이 꼬이지 않습니다."}, {"t": "table", "title": "고객 역할과 투입", "head": ["역할", "책임", "투입 (관측/권장)", "비어 있을 때 생긴 일 (관측)"], "rows": [["경영 스폰서", "방향·우선순위·예산, 스티어링 결정, 경영진 메시지", "5% 미만 (관측된 헌장 표)", "스폰서가 떠난 뒤 임시 거버넌스로 버텼고 도입이 정체되었습니다"], ["프로그램 오너·단일 인가 요청자", "SOW·범위 변경서·공수 승인의 단일 창구, 고객 측 우선순위 결정", "주 1–2h + 승인 회신 (권장)", "승인 회신은 보통 당일~2일, 문구 논쟁 시 ~10일 걸렸습니다"], ["고객 PM(프로젝트·사이트별)", "고객 측 일정·참여자 조율, 내부 에스컬레이션, 휴가·동결 정보", "중형 이상은 지정 필수 (권장)", "자주 비어 있어 파트너가 UAT와 확산의 PM을 떠맡았습니다"], ["사이트 리드", "사이트 계획·범위·마일스톤·운영 전환 승인", "사이트 리더 주 1h 미만, 사이트 프로젝트 리드 주 ~10% (관측)", "운영 전환을 약속하지 않는 사이트는 작업을 멈추라는 권고가 나왔습니다"], ["키유저", "요구사항, To-Be 검토, UAT 실행, 현지어 최종 사용자 교육", "주 ~20%, 설계·UAT 기간 (관측)", "테스터 부재로 UAT가 10–25주 밀렸고, 6개월 사이 키유저 3명이 떠났습니다"], ["고객 측 관리자", "구성 소유, DEV→운영 반영, 사용자·그룹, 1·2차 지원, UAT 스크립트·교육 가이드", "자립 목표: 슈퍼 관리자 6–8명 (관측)", "관리자가 사실상 고객 PM을 겸하며 병목이 되었습니다"], ["IT·ERP·미들웨어 팀", "API, 권한, 동결 일정, 연동 구축·테스트, 마스터 데이터", "연동 기간 격주 회의 + 연동 작업 (권장)", "API 작업 15영업일로 운영 전환이 2주 밀렸고, ERP 권한 변경은 수개월 미결이었습니다"], ["변경 관리·교육 담당", "커뮤니케이션 캠페인, 최종 사용자 교육 운영, 챔피언 네트워크", "확산 기간 동안 지정 (권장)", "변경 관리 없이 2년 뒤 목표 3,000–5,000명 중 147명만 활성 사용자였습니다"], ["근로자 협의회·HR (공동결정 국가)", "모니터링·추적성 우려 검토, 근로자 협약", "운영 전환 전에 조기 착수 (권장)", "한 국가의 사이트들이 승인 대기로 약 12개월 보류되었습니다"]]}, {"t": "callout", "kind": "tip", "title": "참여자용 SOW(고객 투입 견적)를 함께 내십시오", "text": "관측 프로그램의 스티어링 위원회가 가장 먼저 요구한 것은 **고객 팀의 투입 시간을 견적한 참여자용 SOW**였습니다. 함께 나온 요구는 시간이 보호된 책임자 지정, 기한이 있는 피드백·서명, 스폰서와 의사결정 권한 확인, 전담 고객 PM 필요성 재검토였습니다. 파트너 SOW의 고객 책임 조항과 같이 쓰십시오([[sow|05 SOW 작성]]). 계약 조항은 반드시 귀사 법무 검토를 거칩니다."}, {"t": "callout", "kind": "warn", "title": "고객 PM이 없으면 파트너가 PM을 떠맡게 됩니다", "text": "관측 고객은 프로젝트·사이트별 PM을 “지정 예정”으로 두는 일이 많았습니다. 결국 파트너가 UAT와 확산의 PM을 대신했고, 지식이 고객 관리자 한 사람에게 몰려 재작업이 생겼습니다. 중형 이상 프로젝트는 **고객 PM 지정을 착수 관문**으로 두십시오."}, {"t": "sec", "id": "raci", "text": "RACI 매트릭스"}, {"t": "p", "text": "관측된 RACI는 착수 자료에 칸만 있고 대부분 비어 있었습니다. 착수 회의에서 채우고 SOW 부록으로 붙이십시오. 활동마다 A(최종 책임)는 한 명입니다. 아래는 고객이 자체 미들웨어로 연동을 만드는 중형 프로젝트의 권장 예시입니다."}, {"t": "raci", "title": "핵심 활동 RACI (권장 예시)", "roles": ["고객 스폰서", "프로그램 오너", "고객 관리자", "키유저", "고객 IT·ERP", "파트너 PM", "리드 컨설턴트"], "rows": [["SOW·범위 변경서 작성·승인", "I", "A", "I", "-", "-", "R", "C"], ["착수 회의·RAID 초기화", "C", "C", "C", "I", "I", "R/A", "C"], ["현행(As-Is) 워크숍·문서", "I", "A", "C", "C", "C", "I", "R"], ["목표(To-Be) 설계 승인", "C", "A", "C", "C", "C", "I", "R"], ["데이터 필드 매트릭스·소유권", "-", "A", "R", "C", "R", "I", "C"], ["샌드박스 구성·스크립트", "-", "I", "C", "I", "-", "I", "R/A"], ["연동 구축·SIT(고객 미들웨어)", "-", "A", "C", "-", "R", "I", "C"], ["UAT 스크립트 작성·실행", "-", "A", "R", "R", "C", "I", "C"], ["결함 우선순위·수정(상한 안)", "-", "A", "C", "C", "-", "C", "R"], ["운영 전환 go/no-go", "A", "R", "C", "C", "C", "C", "C"], ["운영 테넌트 반영(컷오버)", "I", "A", "R", "I", "C", "C", "R"], ["최종 사용자 교육(train-the-trainer)", "I", "A", "C", "R", "-", "I", "C"], ["주간 보고·시간 소진 보고", "I", "I", "I", "-", "-", "R/A", "C"]]}, {"t": "list", "title": "RACI를 쓸 때 주의할 점", "items": ["결함 수정의 A가 고객 프로그램 오너인 이유는 **우선순위를 고객이 정하기** 때문입니다. 파트너는 상한 안에서 수행(R)합니다.", "고객이 연동을 만들면 파트너는 C입니다. “파트너는 고객이 만든 연동을 테스트하지 않는다”를 SOW에 적었습니다(관측).", "운영 반영은 고객 관리자가 R입니다. 파트너가 운영 테넌트를 직접 바꾸지 않는 원칙과 맞춥니다([[method|08 딜리버리 방법론]]).", "종료 회의 참석자 표에도 사람마다 RACI 글자를 붙였습니다(관측). 누가 결과를 확인하는지 분명해집니다."]}, {"t": "sec", "id": "meetings", "text": "거버넌스 회의 체계"}, {"t": "p", "text": "관측 프로그램은 회의를 층으로 쌓았습니다. 프로젝트 단위는 짧게 자주, 결정은 위로 올려 한 번에 처리합니다. 신규 파트너에게는 아래 다섯 층(기술 딥다이브 포함 여섯)을 기본값으로 권장합니다."}, {"t": "table", "title": "회의 체계 (관측된 구성)", "head": ["회의", "주기·길이", "참석자", "안건", "산출물"], "rows": [["주간 프로젝트 콜", "주 1회, 15–30분, 프로젝트별 고정 요일", "파트너 컨설턴트, 고객 키유저·구성 담당, 양측 PM", "지난주 진행·향후 2주 계획, 이슈, 계획·액션, 리스크 검토(매번), 에스컬레이션 합의, 기타", "요약 메일(1–3일 안), RAID 갱신"], ["주간 코어팀 회의", "주 1회, 45–60분", "고객 프로그램 오너·관리자, 파트너 PM·리드 컨설턴트", "계획(지난주·향후 2주·향후 8주 마일스톤), 액션, 이슈, 리스크, 결정, 교훈", "결정 로그, RAID, 새 요청 사전 합의"], ["격주 연동 회의", "격주, 30–60분", "고객 IT·ERP·미들웨어 팀, 연동 SME, 리드 컨설턴트", "사용 사례, 필드 매핑 변경(“live” 열), API 이슈, 동결 일정, 오류 처리", "필드 매핑 시트 갱신, 연동 액션"], ["기술 딥다이브", "수시, 30–60분", "테스터·고객 관리자, 컨설턴트", "시연·구축 작업, 설계 세부. 주간 콜 과부하 방지", "설계 메모, 이슈 로그"], ["월간 스티어링", "월 1회, 60분", "스폰서, 프로그램 오너, 파트너 임원·PM", "우선 리스크·이슈·결정 1장(우선순위 / 리스크·이슈 / 권장 대응 / 결정 요청 / 필요한 결과), 예산·인력, 다가오는 기한", "결정 기록, 에스컬레이션 결과"], ["QBR", "분기 1회, 90분 또는 대면 2–3h", "스폰서, 프로그램 오너, 파트너 어카운트·PM", "프로그램 1장: 핵심 지표(공수 소진 vs 계획), 지난 분기 성과, 다가오는 마일스톤, 리스크·완화, 다음 단계·전략 권고, 지난 QBR 항목 재점검", "QBR 자료, 액션(무엇·누가·언제)"]], "note": "관측된 변형: 고객 측이 주관하는 주간·격주 프로젝트 콜(30/60분), 분기 1회 약 5시간의 대면 기술 회의, 파트너 내부의 분기 딜리버리 리뷰. 소규모 프로젝트는 주간 콜과 월간 스티어링만으로 시작해도 됩니다(권장)."}, {"t": "details", "items": [{"title": "90분 QBR 안건 예시 (관측)", "blocks": [{"t": "table", "head": ["분", "안건"], "num": [0], "rows": [["5", "환영·목표"], ["10", "고객 업데이트: 우선순위 / 진행과 가치 / 지원과 정렬"], ["10", "성과·도입 지표"], ["15", "지난 90일 진행과 가치"], ["15", "가치 실현 리스크: 리스크 / 공동 대응 / 결정 요청"], ["15", "신기능·개선 아이디어"], ["15", "향후 90일"], ["5", "공동 우선순위 합의"]]}]}]}, {"t": "list", "title": "회의 운영 규칙 (관측)", "items": ["초대 제목에 고객 약칭·프로젝트 번호·짧은 이름·주제를 넣고, 본문에 목적·기대 산출물·안건을 적습니다.", "녹취를 켜고 요약은 1–3일 안에 보냅니다. 액션과 결정은 RAID로 옮깁니다. AI 요약에는 “정확성 확인 필요” 문구를 붙였습니다.", "프로젝트별 채팅 채널을 두고 1영업일 안 응답을 기대치로 합의합니다.", "PM이 빠지면 회의가 상태 보고로만 끝났습니다. 대리인을 지정합니다.", "컨설턴트가 앞 회의를 넘겨 회의가 늦게 시작된 사례가 있었습니다. 회의 사이에 버퍼를 둡니다.", "UAT 기간에는 컨설턴트가 필요할 때만 들어오고 주간 콜을 15분으로 줄였습니다.", "고객 프로그램 오너에게 보내는 자료는 발송 전에 동료 검토를 거칩니다."]}, {"t": "sec", "id": "reporting", "text": "보고 세트"}, {"t": "table", "title": "기본 보고물 다섯 가지", "head": ["보고물", "주기", "수신", "열·구성"], "rows": [["주간 요약 메일", "회의 후 1–3일", "프로젝트 팀", "후속 작업(주제: 액션 (@담당) 기한 [상태]), 마일스톤 표(단계 / 시작 / 종료 / 비고, 이전 날짜 유지), 주제별 노트, 휴가 공지"], ["시간 소진 트래커", "주간(내부), 월간(고객, 월말 후 3–8일)", "프로그램 오너", "# / 프로젝트 / 계획(h, 인일) / 사용(h, 인일) / 잔여(h, 인일) / % 소진 / 상태 / % 완료. 하단에 계획 변경 이력(“X로 변경, 이전 Y”)"], ["UAT·운영 전환 일자 트래커", "격주 또는 변경 시", "스폰서·프로그램 오너", "프로젝트 / 최신 UAT 완료일 / 최신 운영 전환일 / RAG / 상태 메모 / 변경 사유·일정 리스크. 근거 시트에 출처 기록"], ["RAID 로그", "매 회의 갱신", "프로젝트 팀", "리스크: 번호 / 설명 / 영향 / 확률(1–5) / 영향 점수(1–5) / 노출도(P×I, 최대 25) / 전략 / 완화 / 담당 / 일자. 이슈·액션·결정(누가 / 언제 / 왜)은 시트를 나눔"], ["월간 스폰서 1장", "월 1회(첫 주 안)", "스폰서", "상태와 한 줄 진단, 지난 90일 성과, 상위 3 리스크, 스폰서 결정·지원 요청, 향후 30일, 목표일 이력, 공수 소진 % vs 기준, 차원별 RAG"]], "note": "리스크 대응 전략은 위협에 회피 / 전가 / 완화 / 수용 / 비상 계획, 기회에 활용 / 공유 / 강화 / 수용을 씁니다(관측). 리스크 문장은 “[원인]으로 [사건]이 생겨 [결과]가 발생”의 형식으로 씁니다. 상세 양식은 [[templates|14 템플릿]]에 있습니다."}, {"t": "callout", "kind": "rule", "title": "목표일 이력을 숨기지 않습니다", "text": "날짜를 조용히 옮기면 신뢰가 무너집니다. 모든 상태 보고에 목표일 이력(A → B → C)을 남기고, 계속 미루는 대신 예비 날짜 하나와 고정 2주 테스트 버퍼를 둡니다. 또 **% 소진과 % 완료는 다른 숫자**입니다. 관측 프로그램은 공수의 70%를 기간의 51% 시점에 썼지만, 월간 활성 사용자는 목표의 약 7%였습니다. 소진과 함께 도입 지표를 보고하십시오."}, {"t": "template", "title": "월간 스폰서 1장 (프로젝트별)", "intro": "관측된 월간 상태 1장 구조입니다. 고객 요청으로 가정·의존성과 종료·도입 준비 기준이 추가되었습니다.", "sections": [{"h": "머리글", "items": ["프로젝트명·코드, 전체 상태(정상 / 지연 / 위험 / 중단)와 한 줄 진단", "고객 스폰서, 양측 프로젝트 리드, 최종 갱신일"]}, {"h": "배경과 범위", "items": ["비즈니스 목표: 문제, 전략적 가치", "범위·경계·소유: 포함 / 제외 / RACI", "가정과 의존성"]}, {"h": "진행과 리스크", "items": ["지난 90일 주요 성과", "상위 3 리스크·이슈: 리스크 / 담당·영향 / 완화", "스폰서 결정·지원 요청", "향후 30일: 진행 중 / 다음 예정"]}, {"h": "마일스톤과 운영 전환 준비", "items": ["핵심 마일스톤, 목표일 이력(A → B → C), 현재 목표일", "운영 전환 준비 기준, 종료·도입 준비 기준"]}, {"h": "일정과 공수", "items": ["단계 막대(착수 / 디스커버리 / 구축 / UAT / 운영 / 종료)와 날짜", "완료율, 기준 공수 대비 소진율과 전망"]}, {"h": "차원별 RAG와 효과", "items": ["범위 / 일정 / 공수 / 인력", "효과 지표와 운영 후 목표값"]}]}, {"t": "sec", "id": "escalation", "text": "에스컬레이션과 지연 대응"}, {"t": "p", "text": "관측된 에스컬레이션은 프로젝트 팀 → 고객 프로그램 오너 + 파트너 프로그램 책임자 → 스폰서 또는 스티어링의 3단이었고, 상향 기준은 “약 1주 무응답”이었습니다. 관측 고객의 거버넌스 규칙(앰버는 즉시 PM, 레드는 2–5영업일 안에 스티어링, 목표 변경은 1–2주 안에 사이트 리더)을 프로젝트 에스컬레이션에 그대로 쓰는 것을 권장합니다."}, {"t": "steps", "title": "에스컬레이션 경로 (권장, 관측 규칙 기반)", "items": [{"title": "앰버(주의): 즉시 PM에게", "text": "일정·범위·품질에 위험 신호가 보이면 당일 PM에게 알리고, 담당·기한과 함께 RAID에 올립니다.", "meta": "기한: 즉시"}, {"title": "레드(위험): 2–5영업일 안에 스티어링으로", "text": "프로젝트 팀에서 풀리지 않는 레드는 고객 프로그램 오너와 파트너 프로그램 책임자를 거쳐, 스티어링 1장 양식(권장 대응·결정 요청)으로 올립니다.", "meta": "기한: 2–5영업일"}, {"title": "목표가 크게 바뀌면 1–2주 안에 스폰서·사이트 리더로", "text": "범위·일정 목표가 실질적으로 바뀌면 스폰서 또는 사이트 리더의 결정을 받고 기록합니다.", "meta": "기한: 1–2주"}, {"title": "무응답 약 1주면 한 단계 올립니다", "text": "공식 에스컬레이션 메일에는 사실·영향·요청을 적고 상위 관리자를 참조로 넣습니다.", "meta": "관측 예: “연동팀에 확정된 계획이 없음, 연동이 크리티컬 패스, 참여 저조, 상위 관리자 인지 요청”"}, {"title": "파트너 내부 경로는 따로 둡니다", "text": "컨설턴트 → PM → 프로그램 책임자 → 어카운트 담당 순서입니다. 새 사업 기회는 영업·프리세일즈로 넘깁니다.", "meta": "관측"}]}, {"t": "table", "title": "지연 원인 순위와 대응", "head": ["순위", "지연 원인", "관측 사례", "대응 (SOW·운영)"], "num": [0], "rows": [["1", "고객 테스터·키유저 가용성", "UAT 10–25주 지연, 테스터 3명 중 2명으로 진행, 휴가·축제 기간, 아무도 들어오지 않은 세션", "SOW에 명명된 테스터와 보호 시간(~20%), 휴가 달력을 일정에 반영, 테스트 일 블록 예약, 간주 승인"], ["2", "고객 연동·ERP 팀 의존", "API 작업 15영업일로 운영 전환 2주 지연, ERP 권한 변경 수개월 미결, 전용 인터페이스 버전 때문에 2–4주 재작업", "연동 RACI, 격주 연동 회의, 공식 티켓 경로, 날짜가 남는 공식 에스컬레이션"], ["3", "변경 동결(연말 ERP·보안·IT)", "동결 기간이 예상보다 일찍 시작", "착수 때 동결 일정 수집, 크리티컬 패스에 표시, 예비 날짜"], ["4", "법무·상업 승인", "웹 앱 소스 코드 라이선스 대기로 출시·UAT 보류, 고객 추가 예산 승인 대기", "계약 트랙을 착수와 함께 시작, 귀사 법무 조기 검토"], ["5", "To-Be 승인 지연·개정 반복", "승인 약 3개월, v4–v7 개정", "검토 기한·워크스루·간주 승인, 승인 후 변경은 범위 변경서([[method|08 딜리버리 방법론]])"], ["6", "프로젝트 간 의존성", "공급업체 1단계와 자산 작업 셀이 Items & BOMs 운영 전환을 막음", "의존성 맵, 선행 범위를 먼저 일정화, 대기·정렬 항목 관리"], ["7", "데이터 준비", "추출 파일 속 탭·줄바꿈, 품번 정제, 레거시 데이터 미확인", "샘플 이관, 고객 정제 계획([[data|10 데이터 이관과 연동]])"], ["8", "늦게 드러난 사용성·복잡성", "새 단종 프로세스가 기존보다 느리다는 평가", "최종 사용자를 설계에 참여시키고 목업 시연, 작은 건용 빠른 경로"], ["9", "외부 조직(근로자 협의회)", "승인 대기로 한 국가의 사이트들 약 12개월 보류", "운영 전환 전 조기 협의, 목적 제한·집계 대시보드 약속"], ["10", "병행 대형 프로그램", "ERP 업그레이드로 레거시 이관 12–18개월 보류", "착수 전에 24개월 ERP·미들웨어 로드맵을 서면으로 확인"], ["11", "플랫폼 동작 변화", "비동기 변경 지시 설정이 기존 스크립트를 깨뜨림", "릴리스 노트 검토, 샌드박스 회귀 테스트"], ["12", "파트너 인력 재배치", "공유 컨설턴트가 다른 고객사로 차출", "대리인 지정, 보조 인력 추가, 예약 상태(가예약·확정) 관리"]], "note": "1–4위는 여러 프로젝트에서 관측된 빈도순이고, 5위 이하는 관측된 원인을 묶어 나열한 것입니다. 관측 프로그램에서는 9개 프로젝트의 계획 공수가 대부분 1.5–4.5배 상향되었습니다. 리스크 관리 전반은 [[risk|07 리스크와 안전장치]]를 보십시오."}, {"t": "callout", "kind": "tip", "title": "고객 원인 지연의 증빙을 남기십시오", "items": ["고객의 지연 통보(“추가 예산 승인 전까지 보류” 등)를 별도 폴더에 보관합니다(관측: 전용 “지연” 폴더).", "날짜·시간 변경은 2주 전에 알리도록 SOW에 적었습니다(관측).", "고객 승인 메일은 모두 저장합니다.", "운영 전환을 약속하지 않는 사이트는 작업을 멈추고, 곧 전환할 사이트로 공수를 돌립니다(관측 권고)."]}, {"t": "checklist", "id": "team-setup", "title": "착수 전 팀·거버넌스 체크리스트", "items": ["파트너 측 리드 컨설턴트와 PM, PM 대리인을 지정했다", "고객 측 단일 인가 요청자를 SOW에 명시했다", "고객 PM, 키유저·테스터 명단과 주당 보호 시간을 받았다", "참여자용 고객 투입 견적을 SOW와 함께 제시했다", "RACI를 착수 회의에서 채우고 SOW 부록으로 붙였다", "주간 프로젝트 콜 요일, 코어팀·연동 회의, 월간 스티어링, QBR 일정을 고정했다", "시간 소진 트래커, 일자 트래커, RAID, 월간 스폰서 1장 양식을 공유했다", "에스컬레이션 기한(앰버 즉시, 레드 2–5영업일, 무응답 1주)을 합의했다", "변경 동결·휴가·법무 트랙 일정을 일정표의 크리티컬 패스에 올렸다", "근로자 협의회가 있는 국가라면 협의 일정을 운영 전환 전에 잡았다"]}, {"t": "quiz", "items": [{"q": "SOW와 범위 변경서의 승인 창구로 가장 바람직한 것은?", "options": ["여러 사이트 리드가 각자 승인한다", "계약서에 명시된 고객 측 단일 인가 요청자가 승인한다", "파트너 PM이 고객을 대신해 승인한다"], "answer": 1, "why": "관측 프로젝트는 단일 인가 요청자가 모든 작업 요청과 공수 변경을 승인했습니다. 창구가 하나여야 범위와 공수 이력이 꼬이지 않습니다."}, {"q": "관측 프로젝트에서 일정 지연을 가장 자주 만든 원인은?", "options": ["파트너 컨설턴트의 구성 역량", "고객 테스터·키유저의 가용성", "Fusion Manage 성능"], "answer": 1, "why": "UAT는 주요 프로젝트마다 10–25주 밀렸고, 가장 큰 원인은 고객 테스터의 가용성이었습니다. 명명된 테스터와 보호 시간을 SOW에 적어야 합니다."}, {"q": "레드(위험) 이슈의 권장 에스컬레이션 기한은?", "options": ["다음 분기 QBR", "2–5영업일 안에 스티어링(프로그램 오너 + 파트너 프로그램 책임자 경유)", "종료 회의"], "answer": 1, "why": "앰버는 즉시 PM, 레드는 2–5영업일 안에 스티어링으로 올립니다. QBR까지 기다리면 일정 손실이 커집니다."}, {"q": "월간 스폰서 보고에서 목표일이 바뀌었을 때 바른 표기는?", "options": ["새 날짜만 적는다", "목표일 이력(A → B → C)과 변경 사유를 함께 적는다", "확정될 때까지 날짜를 비워 둔다"], "answer": 1, "why": "조용히 옮긴 날짜는 신뢰를 무너뜨립니다. 관측된 1장 양식은 목표일 이력과 변경 사유를 함께 보여 주었습니다."}]}]}, {"id": "data", "num": "10", "group": "deliver", "title": "데이터와 연동은 *첫 주부터* 설계합니다", "short": "데이터·연동", "goal": "ERP·Vault 연동 방식과 딜리버리 모델을 비교해 고르고, 필드 매핑·초기 데이터 로드·레거시 PLM 이관·연동 테스트를 공수와 안전장치까지 포함해 계획할 수 있습니다.", "facts": [["학습 시간", "45분"], ["대상", "컨설턴트·연동 담당·PM"], ["산출물", "데이터 준비 체크리스트, 연동 요구사항서"]], "blocks": [{"t": "lead", "text": "관측 프로젝트의 일정은 구성 작업이 아니라 **데이터와 연동**에서 무너졌습니다. ERP가 품번을 소유하는 한 품목·BOM 모델은 연동 설계와 함께 정해야 합니다. 이 모듈은 연동 방식 선택부터 데이터 로드, 이관, 테스트까지 첫 주에 시작할 일을 정리합니다."}, {"t": "sec", "id": "why", "text": "왜 첫 주부터인가"}, {"t": "stats", "items": [{"value": "8–12개월", "label": "연동에 의존한 작업의 계획 대비 지연 (관측)"}, {"value": "~180h", "label": "고객 미들웨어 팀 지원형의 인터페이스당 공수 (파트너 구축안 960h를 대체)"}, {"value": "5–15일", "label": "Vault–Fusion Manage 커넥터의 운영 전환까지 기간 (범용 iPaaS는 35–82일)"}, {"value": "+73%", "label": "레거시 PLM 이관 재견적 증가폭 (디스커버리가 예산의 ~60% 소진)"}]}, {"t": "list", "title": "연동이 품목·BOM 모델을 결정하는 이유", "items": ["**ERP가 품번을 소유합니다.** 품번 체계, 필드 길이, 단위, ERP 코드 테이블이 PLM 필드 정의를 제약합니다. 관측: 분류 이름 30자 제한(ERP 코드 길이), 공정 번호 형식 불일치(선언 5자리 vs ERP 3자리).", "**ERP는 사이트(브랜치)와 mBOM만 받습니다.** 다사이트 제조에서는 마스터(eBOM)와 사이트별 브랜치(mBOM)를 나누는 모델이 연동 범위에서 결정되었습니다.", "**데이터 필드 매트릭스 하나가 세 작업을 먹입니다.** 품목 화면 레이아웃, 초기 로드 필드, 연동 교환 필드가 모두 같은 매트릭스에서 나옵니다. \"속성을 알아야 매핑하고, 속성을 알아야 권한을 설계할 수 있다\"가 관측 프로그램의 순서 원칙이었습니다.", "**고객 ERP·연동 팀이 병목입니다.** 관측된 지연 원인 2위가 고객 연동·ERP 팀의 가용성이었고, 한 사례에서는 ERP 팀 투입이 1년 이상 늦어졌습니다.", "**착수 계획은 낙관적이었습니다.** 초기 계획은 Vault·ERP 연동을 약 10주로 잡았지만, 고객 미들웨어 팀은 아직 API를 배우는 중이었습니다."]}, {"t": "callout", "kind": "rule", "title": "첫 주에 할 일 (권장)", "items": ["ERP 종류·버전과 향후 24개월 업그레이드 계획을 서면으로 받습니다.", "이름 있는 고객 측 연동 책임자와 사내 미들웨어 표준을 확인합니다.", "데이터 필드 매트릭스(ERP·PDM·PLM·PIM 소유권) 작성 일정과 고객 측 소유자를 정합니다.", "샘플 데이터(품목, BOM, 라우팅, ERP 코드 테이블, 공급업체, 사이트)를 요청합니다.", "연동 없이 운영 전환할 수 있는 빠른 성과를 첫 릴리스로 검토합니다. 관측 사례에서는 비연동 설계 변경 파일럿만이 연동 지연과 무관하게 먼저 운영 전환했습니다."]}, {"t": "sec", "id": "arch", "text": "연동 아키텍처 옵션"}, {"t": "p", "text": "연동 방식은 도구부터 고르지 않습니다. 관측 프로젝트의 연동 제안은 **연결 수준 → 트리거 → 이벤트 시작 방식 → 기술** 순서로 선택지를 좁혔고, 마지막에 벤치마크와 하나의 권고안을 제시했습니다."}, {"t": "table", "title": "1단계: 연결 수준", "head": ["수준", "방식", "장점", "한계"], "rows": [["링크", "외부 시스템 URL만 저장", "실시간, 외부 시스템 권한을 그대로 사용", "비즈니스 로직에 쓸 수 없음"], ["온라인 뷰", "품목 상세에 iFrame으로 표시", "데이터 복제 없음", "외부 인증 필요, 화면이 느려짐"], ["데이터 복사", "데이터를 PLM에 복사", "복사한 데이터만 워크플로·검증·보고에 사용 가능", "동기화와 소유권 규칙이 필요"]]}, {"t": "table", "title": "2–3단계: 트리거와 이벤트 시작 방식", "head": ["방식", "동작", "주의점"], "rows": [["온디맨드(버튼)", "사용자가 버튼을 눌러 전송. 관측 사례는 버튼이 클라이언트 측에서 미들웨어 엔드포인트를 호출", "사용자가 매번 눌러야 하고, 맞춤 동작은 수용성을 낮춤"], ["타이머(플래그 폴링)", "플래그를 세우고 검색으로 대상 레코드를 찾음", "서버 부하, 업무 시간 내 처리 보장 없음. 플래그 변경이 변경 이력에 남음"], ["웹훅 이벤트", "이벤트를 구독해 레코드 ID를 받고 상세를 조회", "반복되거나 되돌려진 워크플로 이벤트에 대비"], ["작업 큐 워크스페이스", "숨김 워크스페이스에 이벤트와 오류를 기록하고 재시도", "정기 퍼지 필요. 로그와 재처리가 가장 명확"], ["상태 대기", "처리가 끝날 때까지 워크플로가 특정 상태에서 대기", "실패 시 정체된 레코드의 처리 규칙 필요"]], "note": "관측 구성: 변경 지시의 릴리스 시점에 웹훅 또는 큐 워크스페이스로 연동을 시작하고, ERP·Vault 동기화 상태를 계산 필드 배지로 표시했습니다. 즉시 API 호출은 타임아웃 위험이 있고 로그가 남지 않으므로 큐 방식이 안전합니다."}, {"t": "table", "title": "4단계: 기술별 관측 벤치마크", "head": ["방식", "운영 전환까지", "프로젝트 기간", "비고"], "rows": [["범용 iPaaS (Jitterbit 등 3종)", "35–82일", "약 1년", "BOM 순회와 파일 업로드는 여전히 개발 필요"], ["Vault–ERP 커넥터 (powerGate)", "25–45일", "약 1년", "PDM과 ERP를 직접 연결"], ["Vault–Fusion Manage 커넥터 (powerPLM)", "5–15일", "1–5개월", "Vault Job Processor 플러그인. 빠른 가치 검증에 적합"], ["iPaaS로 직접 만든 Vault–Fusion Manage 연동", "약 50일", "—", "Vault 앱 없이 모든 트랜잭션을 구현하느라 오래 걸림 → 이후 Vault 플러그인 사용 권고"]], "note": "출처: 제공사가 이전 프로젝트 기록을 근거로 고객에게 제시한 벤치마크(관측). 고객 미들웨어가 사내에 있으면 미들웨어 런타임도 사내망 안에 있어야 합니다."}, {"t": "table", "title": "옵션별 비교: Vault·ERP 연동 (관측 견적)", "head": ["옵션", "구성", "파트너 공수", "특징"], "num": [2], "rows": [["A. 커넥터", "Vault ↔ Fusion Manage 커넥터(powerPLM)", "21인일", "가장 단순. 지속 비용 요인은 연간 커넥터 라이선스"], ["B. 플러그인 + 미들웨어", "powerVault 기반 Vault 플러그인(PowerShell) + 고객 미들웨어(iPaaS)", "29인일", "복잡도 중간. 호출 수를 줄이고 API 버전과 분리되어 장기 유지비가 가장 낮음"], ["C. 미들웨어 전면 구현 (Vault)", "미들웨어가 Vault SOAP API를 직접 호출", "22인일", "가장 복잡. 많은 호출을 순서대로 맞춰야 하고 Vault 릴리스마다 유지보수"], ["D. 미들웨어 전면 구현 (PLM·ERP)", "미들웨어가 Fusion Manage REST API와 ERP 커넥터 사용", "23인일", "기존 API 버전이 계속 제공되어 새 API 버전마다 수정할 필요는 없었음"], ["E. 파일 적재", "제공사 데이터 로드 도구로 파일 → PLM", "18인일", "느리게 변하는 데이터와 개념 검증에 적합. 보고서 내보내기를 API로 자동화 가능"]], "note": "파트너 공수는 요구사항 검토·인계 문서·사용 사례·격주 회의(각 3인일)에 옵션별 교육·개발·속성 검토·UAT 지원을 더한 제시 총계입니다. 고객 측 공수 행은 고객이 채우도록 비워 두었습니다. 원본 표의 일부 행 합계가 총계와 맞지 않으므로 구조 참고용으로 쓰십시오."}, {"t": "callout", "kind": "tip", "title": "제안의 정석: 고객 표준 존중 + 임시 커넥터 + 장기 플러그인", "text": "관측 사례에서 제공사는 다른 iPaaS 경험이 더 많았지만, 고객은 옵션 발표 1주 뒤 '사내 표준 연동 도구만 쓴다'고 결정했습니다. 제공사는 제안을 (1) 고객 연동팀을 지원하는 역할, (2) 빠른 가치 검증을 위한 임시 커넥터, (3) 장기 유지비가 낮은 Vault 플러그인 방식으로 다시 짰습니다. 옵션 분석은 짧게 하고(고객이 1일 이내를 요청), 장단점과 하나의 권고안으로 단순하게 제시한 뒤 **고객의 선택을 서면으로 남기십시오.**"}, {"t": "sec", "id": "model", "text": "딜리버리 모델과 책임 분담"}, {"t": "p", "text": "같은 연동이라도 **누가 만드느냐**에 따라 파트너 공수가 몇 배씩 달라집니다. 견적 기준: ERP 연동(고객 미들웨어 팀 지원형) 120 / 184 / 264h, Vault–Fusion Manage 연동 40 / 120 / 176h."}, {"t": "tiles", "title": "세 가지 딜리버리 모델", "items": [{"tag": "모델 1", "title": "파트너 구축형", "text": "파트너가 커넥터·연동을 설계하고 구성해 운영 전환까지 책임집니다.", "items": ["관측: 커넥터 기반 Vault–Fusion Manage 연동 초안 960h (사용 사례, 오류 처리, 객체 교환, 속성, 데이터 교환 개념, 구성)", "고객 연동팀이 없거나 빠른 성과가 필요할 때 적합", "운영 후 유지보수 주체를 계약에 명시"]}, {"tag": "모델 2", "title": "고객 미들웨어 팀 지원형", "text": "고객 연동팀이 자사 미들웨어로 구축하고, 파트너는 요구사항·사용 사례·API 교육·매핑 검토·UAT 지원을 맡습니다.", "items": ["관측: 960h 구축안이 인터페이스당 약 180h(176–184h) 지원형으로 대체", "고객 팀의 API 학습 곡선과 가용성이 최대 위험", "원칙: \"교육을 먼저\" 실시"]}, {"tag": "모델 3", "title": "프록시 계층형", "text": "파트너가 Fusion Manage·Vault 앞에 프록시 서비스를 두고, 범용 미들웨어 호출을 여러 제품 API 호출로 번역합니다.", "items": ["관측: ERP 프록시 104 → 264h, Vault 프록시 80h", "고객 미들웨어는 단순한 엔드포인트만 호출하고, 응답에 품목 식별자를 받아 오류를 대조", "맞춤 코드이므로 소스 코드 라이선스·호스팅·지원 책임을 미리 합의"]}]}, {"t": "table", "title": "연동 라인 아이템 (관측 견적 구조)", "head": ["라인 아이템", "공수", "비고"], "num": [1], "rows": [["솔루션 요구사항 검토", "3인일", "모든 옵션 공통"], ["연동팀 인계용 요구사항 문서화", "3인일", "모든 옵션 공통"], ["사용 사례 정의·문서화", "3인일", "양방향 트리거와 필드"], ["격주 회의 (주 3h × 8주)", "3인일", "모든 옵션 공통"], ["Vault API 교육 / Fusion Manage API 교육", "4 / 3인일", "구축 전에 실시"], ["API 지원 (구축 기간)", "7인일", "옵션별. 선택 항목으로 표기된 경우 있음"], ["PowerShell 입문", "1인일", "플러그인 옵션"], ["가져오기 도구 교육 / 지원", "2 / 7인일", "파일 적재 옵션"], ["커넥터·플러그인 개발 / 인계 / 교육", "2–10 / 2 / 3인일", "커넥터 2, 플러그인 10"], ["속성 정보 검토·갱신", "2–4인일", "매핑 재작업 포함"], ["UAT 지원", "5–6인일", ""], ["Σ 옵션별 제시 총계", "18–29인일", "파트너 공수만. 고객 공수는 별도"]], "note": "다른 견적에서는 미들웨어 인터페이스당 약 22인일, 시스템당 연동 정의 자문 9–14인일이 관측되었습니다. 상세 견적은 [[estimate|03 스코핑과 견적]]의 계산기를 쓰십시오."}, {"t": "raci", "title": "연동 RACI (권장 기본값)", "roles": ["파트너", "고객 PLM 관리자", "고객 연동팀", "고객 ERP팀"], "rows": [["옵션 비교·권고안 작성", "R/A", "C", "C", "C"], ["연동 방식 결정", "C", "A", "R", "C"], ["사용 사례·요구사항 정의", "R", "A", "C", "C"], ["Master Attribute List 작성·유지", "C", "A", "R", "R"], ["API 교육", "R/A", "I", "C", "-"], ["미들웨어 구축", "C", "I", "R/A", "C"], ["ERP 측 인터페이스·계정 준비", "I", "C", "C", "R/A"], ["SIT 실행", "C", "I", "R/A", "R"], ["UAT 실행·결함 우선순위", "C", "R/A", "R", "R"], ["운영 반영·모니터링", "I", "A", "R", "R"]]}, {"t": "callout", "kind": "rule", "title": "SOW에 적을 고객 책임 문장 (관측 → 권장)", "items": ["고객은 자사가 구축한 연동을 직접 테스트합니다. 파트너는 고객이 구축한 연동을 테스트하지 않습니다.", "고객은 ERP·Vault가 채우는 필드의 값을 검토하고 확인합니다.", "연동 계정과 인터페이스는 고객 ERP 변경 절차로 준비합니다(관측: 승인 약 1주).", "운영 이관, 지속 지원, 유지보수는 연동 범위에서 제외하고 별도 계약으로 다룹니다.", "제3자 벤더 조율은 파트너 책임이 아닙니다.", "고객 연동이 준비되지 않으면 해당 UAT 단계는 보류되며 일정 영향은 범위 변경서로 다룹니다."], "text": "계약 조항은 반드시 귀사 법무 검토. 상세 문구는 [[sow|05 SOW 작성]]과 [[risk|07 리스크와 안전장치]]를 보십시오."}, {"t": "sec", "id": "mapping", "text": "필드 매핑과 Vault 단계적 연동"}, {"t": "p", "text": "매핑은 연동의 설계도입니다. 관측 프로젝트에서 데이터 필드 매트릭스는 32h로 견적했다가 68h가 들었고, 복잡한 매핑은 \"맵 하나에 이틀 정도\"였으며 ERP 쪽 속성이 Vault보다 훨씬 많았습니다. **매핑을 계획표에 넣고 재작업 시간을 따로 잡으십시오.** 견적 기준: 데이터 필드 매트릭스 32 / 68 / 100h."}, {"t": "template", "title": "Master Attribute List (마스터 속성 목록) 열 구성", "intro": "속성 하나가 한 행입니다(관측: 약 280행). 처음 5개 열은 키유저와 함께 워크숍에서 바로 채우고, 매핑 열은 나중에 채웁니다. 고객 측에 목록 관리자 역할을 지정합니다.", "sections": [{"h": "기본 정의 (워크숍에서 바로 작성)", "items": ["필드 이름", "설명", "데이터 유형·길이·소수 자릿수", "필드 ID", "소유 시스템 (PLM / ERP / 생성 시에만)"]}, {"h": "출처와 규칙", "items": ["선택 목록 출처·ERP 코드 테이블", "필수 여부 (필수 / 선택 / 조건부)", "기본값 유무와 값", "편집 가능 여부 (가능 / 불가 / 변경 지시 중에만)", "사이트(브랜치) 필드 여부", "파생·계산 여부"]}, {"h": "매핑", "items": ["Vault 속성 이름·ID와 처리 구분", "Fusion Manage 필드 ID (마스터 / 브랜치 / 공급업체 P/N / 제품 / 제품 계층)", "ERP 테이블·필드·화면 섹션", "방향 (PLM → ERP 쓰기 / ERP → PLM 쓰기)", "UAT 단계(1/2), 데이터 로드 도구 사용 여부"]}, {"h": "관리", "items": ["활성 여부 (Y / N / 보류)", "잠금 기준 버전 (ERP 버전별, Vault 업그레이드 시 재확인)", "비고·예시 값"]}]}, {"t": "table", "title": "데이터 필드 매트릭스: 소유권부터 정합니다", "head": ["영역", "소유 시스템", "예시", "PLM에서의 처리"], "rows": [["설계 속성", "PDM (Vault)", "파일 이름, 개정, 상태, 질량, 재질", "마스터에만 읽기 전용으로 표시. 질량은 실수형으로 받아 BOM 중량 집계"], ["ERP 계획·재고 속성", "ERP", "계획·재고 유형, ERP 단위, 계획 파라미터", "연동 사용자만 쓰는 읽기 전용 섹션"], ["PLM 통제 속성", "PLM", "분류, 설계 권한, 품질 요구, 인증서, 단종", "변경 지시 통제 아래에서 편집"], ["제품 정보", "PIM", "마케팅 설명, 판매 코드", "링크로 시작하고 이후 단계에서 연동"]], "note": "관측 모델: 하나의 '복합' 품목에 ERP 마스터 섹션, Vault 마스터 섹션, PLM 마스터 섹션을 두었고, 연동은 작업 중인 개정만 갱신했습니다. ERP 마스터 섹션은 사이트가 PLM 작성으로 전환하면서 PLM 마스터로 옮겼습니다."}, {"t": "list", "title": "Vault 속성 처리 구분 (관측: 속성마다 하나를 지정)", "items": ["마스터·브랜치 필드에 매핑", "PLM에서 조사·분석용으로만 유용", "접근 권한 매핑에 필요 (설계 통제 분류)", "PLM에 불필요", "매핑 안 함 / 더 이상 사용 안 함"]}, {"t": "list", "title": "필드마다 묻는 표준 질문 (관측)", "items": ["모든 사이트에서 쓰는가?", "ERP로 보내는가?", "누가 채우는가?", "최초 릴리스 후에도 편집할 수 있는가?", "허용 범위와 형식은?", "고정 목록인가, 다른 곳에서 관리하는가?", "이력 조회용으로만 필요한가?"]}, {"t": "flow", "title": "Vault–Fusion Manage 연동 4단계 (권장)", "items": [{"title": "PLM 이해", "text": "사용자·그룹·역할, 워크스페이스, 워크플로, BOM, 개정, 변경 지시를 먼저 익힘. PLM을 모르면 PDM–PLM 논의가 성립하지 않음"}, {"title": "단방향 읽기 전용", "text": "Vault → Fusion Manage로 뷰어 파일과 BOM을 게시. 변경 통제와 영향 분석은 Fusion Manage에서", "hi": true}, {"title": "Fusion Manage에서 변경", "text": "변경 프로세스는 Fusion Manage, 실제 설계 작업은 Vault에서 하고 결과를 읽기 전용으로 게시"}, {"title": "상태 제어는 마지막", "text": "Fusion Manage가 Vault 라이프사이클 상태를 바꾸는 제어는 앞 단계가 안정된 뒤 결정"}]}, {"t": "p", "text": "많은 CAD 사용자가 PDM에서 PDM+PLM으로 한 번에 넘어가는 것을 어려워했습니다. 단계를 나누면 단계마다 독립적인 가치가 생기고 견적도 단계별로 나눌 수 있습니다. 부품 구조를 PLM에 따로 두는 것은 BOM 관리가 CAD BOM을 넘어설 때만 검토합니다."}, {"t": "list", "title": "Vault 연동 사전 확인 항목 (관측)", "items": ["**버전:** 관측 시점 표준 커넥터는 Vault 2026 이상 서버가 필요했고 그보다 낮은 버전용 커넥터는 없었습니다. 서버·커넥터 버전을 스코핑에서 확인합니다.", "**품번 규칙:** 양쪽 품번이 같고 25자 이하여야 했습니다. '-'와 '/' 혼용을 정리합니다(Inventor 파일 이름에는 '/'를 쓸 수 없음).", "**생성 순서:** 관측 사례는 PLM 필수 필드(재고 유형) 때문에 품목을 PLM에서 먼저 만들고 Vault로 보냈습니다.", "**커넥터 플러그인 전제:** Vault Job Server 사용, TLS 1.2, 테넌트에 APS 앱 허용, 바뀌지 않는 고유 ID 속성, 관리 항목·연결 품목 기준 동작.", "**외부 노출:** Vault를 외부에서 호출해야 하면 Vault Gateway와 SSO·Autodesk ID 통제가 필요합니다.", "**일정 충돌:** Vault 업그레이드(연말 동결 기간 등)와 연동 UAT 일정이 겹치지 않게 합니다."]}, {"t": "sec", "id": "load", "text": "초기 데이터 로드"}, {"t": "p", "text": "초기 로드는 '한 번 올리면 끝'이 아닙니다. 관측 프로젝트는 운영 전환 전까지 사이트별로 읽기 전용 품목을 반복 적재했고, 사이트가 연동 기반 작성으로 전환되면 그 사이트의 적재를 멈췄습니다. 견적 기준: 초기 데이터 로드 48 / 140 / 200h (관측: 동기화 도구 배포·구성·교육 48h)."}, {"t": "steps", "title": "초기 데이터 로드 5단계", "items": [{"title": "추출", "text": "ERP나 데이터 웨어하우스에서 정해진 통합 추출 형식으로 뽑습니다. 원천과 구조는 로드 기간 동안 안정적이어야 하고, 인코딩은 원천에서 UTF-8로 요구합니다.", "meta": "담당: 고객 데이터팀 · 산출물: 샘플 추출 파일"}, {"title": "매핑", "text": "Master Attribute List로 원천 열 → 대상 필드를 정의합니다. 대상 정의는 합의 후 동결하고, 매핑을 승인·테스트한 뒤에 정기 적재를 시작합니다.", "meta": "담당: 파트너 + 고객 데이터 소유자"}, {"title": "테스트 로드", "text": "샌드박스·개발 테넌트에 소량부터 올립니다. 참조 데이터(단위, 국가, 사이트, 공급업체, ERP 코드 테이블, 작업장)를 먼저 올립니다. 가져오기 전용 역할을 만들고 필드 길이를 미리 늘립니다.", "meta": "관측: 참조 데이터 가져오기 작업 약 65건"}, {"title": "검증", "text": "필수 필드 누락 뷰, 적재 전·후 감사 파일, 샘플 대조로 확인합니다. 소유권·권한 키 누락도 봅니다.", "meta": "관측: 테스트 로드 약 3.6k건 중 약 300건 권한 키 누락"}, {"title": "델타 동기화", "text": "운영 전까지는 변경분만 반복 적재합니다. 고객이 일일 추출을 자동화하고 작업 결과 메일을 모니터링합니다. 사이트가 PLM 작성으로 전환되면 그 사이트를 동기화에서 제외합니다.", "meta": "관측: 델타 비교 2–7분"}]}, {"t": "table", "title": "기본 가져오기 도구 vs 델타 동기화 도구", "head": ["구분", "기본 가져오기 도구", "REST 기반 델타 동기화 도구"], "rows": [["입력", "엑셀 첫 시트, 첫 행 헤더, 가져오기 1회에 파일 1개", "추출 파일 목록, 원천:대상 매핑, 일치 키·복합 키, 대상 품목 목록"], ["적합한 용도", "참조 데이터, 소량 일괄 수정, UI로는 안 되는 일괄 삭제", "대량 품목·브랜치·BOM의 초기 로드와 반복 갱신"], ["갱신 방식", "기본 키 또는 복합 키로 일치 레코드를 갱신·건너뛰기·삭제", "변경분만 계산 (날짜·숫자 형식 3 = 3.00 = 003, 유니코드 정규화)"], ["넣을 수 없는 것", "관계·링크·다중 선택 목록·BOM 필드·중복 BOM 행·첨부·이미지·그리드·워크플로 상태·부 개정·과거 작성일/작성자", "필터된 선택 목록은 조회 대입이 안 되고 값 복사만 가능 (관측)"], ["안전장치", "규칙 선택(추가 / 건너뛰기 / 오류), '검증 무시' 옵션", "검토 프롬프트, maxCreates/maxUpdates, 적재 전·후 감사 파일"], ["주의", "데이터가 조금만 바뀌어도 공수가 같고 대량에는 부적합. 파일 크기 제한", "맞춤 도구이므로 소스 코드 라이선스와 지원 책임 합의 필요"]]}, {"t": "table", "title": "관측 처리량 (델타 동기화 도구)", "head": ["대상", "레코드 수", "초기 로드", "델타 비교", "건당 갱신"], "num": [1], "rows": [["마스터 품목", "~28k", "6h (단일 스레드)", "2분", "1초 미만"], ["브랜치 품목", "~500k", "13h (멀티 스레드)", "7분", "~1초"]], "note": "추출 파일은 100개 이상의 열이었습니다. 멀티 스레드 적재는 테넌트에 부담을 주므로 고객에게 넘기는 도구는 단일 스레드로 제한했습니다. 범용 iPaaS로 대량 적재하면 처리량이 약 20% 낮다는 제공사 평가도 있었습니다(관측)."}, {"t": "callout", "kind": "rule", "title": "동기화 도구의 안전장치 (관측 → 권장)", "items": ["**maxCreates / maxUpdates**: 1회 생성·갱신 상한(예: 100 / 1,000). 넘으면 중단해 대량 훼손을 막습니다.", "**검토 프롬프트**: 실행 전에 생성·갱신 건수를 사람이 확인합니다.", "**체크섬 기반 BOM 델타**: BOM을 JSON으로 만들어 MD5 체크섬을 PLM 필드와 비교하고 다를 때만 갱신합니다. 부모와 모든 자식이 일치해야 BOM이 바뀝니다.", "**사이트 포함 목록**: 추출 필터에 기대지 않고 대상 사이트를 명시해, PLM이 마스터인 사이트를 덮어쓰지 않습니다.", "**동기화 출처 보호**: 동기화 출처 필드가 비어 있거나 도구 자신의 값일 때만 갱신해, 수동 편집과 다른 연동의 값을 지킵니다.", "**감사 파일**: 실행 전·후 입력, PLM 스냅샷, 생성·갱신 내역을 XLSX로 남깁니다.", "**배치 크기**: 생성·갱신 배치는 약 1,000건 수준으로 유지합니다.", "**동기화 규칙**: 필수 필드는 채워서 보내고, 동기화에 기본값을 넣지 않습니다. 기본값은 사용자 편집을 덮어씁니다."]}, {"t": "details", "items": [{"title": "데이터 위생 교훈 (관측)", "blocks": [{"t": "list", "items": ["TSV를 엑셀로 바꾸면 날짜가 깨지고 앞자리 0이 사라집니다. 코드 값의 앞자리 0을 특히 확인하십시오.", "파일 인코딩(바이트 순서 표식) 문제가 있었습니다. 원천에서 UTF-8을 요구하십시오.", "값 안의 탭과 줄바꿈을 정리합니다.", "여러 파일에 같은 키가 있으면 마지막에 읽은 행이 이깁니다.", "일치 키의 공백이 유사 중복 레코드를 만듭니다.", "PLM 필드 길이·유형·선택 목록 값이 원천과 다르면 동기화가 반복 루프에 빠집니다.", "ERP 추출에 100배로 저장된 값처럼 원천 문제는 스크립트가 아니라 추출 쿼리에서 고칩니다.", "문제 해결 원칙: 파일의 값을 먼저 봅니다. 파일 값이 맞으면 동기화 문제, 틀리면 추출 담당 문제입니다. ERP → 웨어하우스 → 파일 체인의 소유자를 분명히 하십시오.", "ERP 추출을 반복 동기화한 결과 품목·참조 워크스페이스가 흐트러져 별도의 데이터 정제 프로젝트가 필요했습니다.", "너무 이른 대량 적재는 이후 변경을 부르고 다른 워크스트림의 주의를 분산시킬 수 있습니다."]}]}, {"title": "사이트별 운영 전환 패턴 (관측)", "blocks": [{"t": "list", "ordered": true, "items": ["ERP 데이터 웨어하우스에서 추출합니다.", "데이터 로드 도구가 사이트별로 품목과 mBOM을 읽기 전용 레코드로 적재합니다.", "사이트가 변경 관리·연동과 함께 운영 전환하면 그 사이트의 적재를 멈춥니다. 동기화 출처 플래그로 연동 레코드를 표시하고 사이트 그룹에 편집 권한을 줍니다.", "이후 품목 흐름: 생성 → 변경 지시에 추가 → Vault 문서 연결 → 변경 지시 승인 → ERP에 품목 생성."]}, {"t": "p", "text": "임시 중복 워크스페이스를 만들지 말고, 최종 마스터 품목 워크스페이스를 권한으로 읽기 전용 통제해 먼저 여는 방식이 권장되었습니다(관측). 운영 전환 전에는 개발 테넌트를 퍼지하고 다시 적재했으며, 퍼지와 운영 이관은 Autodesk 지원 요청으로 진행했으므로 요청 리드 타임을 일정에 넣으십시오."}]}]}, {"t": "sec", "id": "migrate", "text": "레거시 PLM 이관"}, {"t": "p", "text": "레거시 PLM 이관은 데이터 복사가 아니라 **프로세스 재설계**입니다. 관측된 레거시 PLM(Oracle Agile) 이관에서는 디스커버리·현행·목표 설계가 416h 예산의 약 60%를 썼고, 재견적은 +73%(721h)로 늘었으며, 착수 약 7.5개월에 보류되었습니다. 단계적 운영 전환도 불가능했습니다(전면 전환). 견적 기준: 이관 디스커버리·샌드박스 200 / 416 / 721h."}, {"t": "steps", "title": "이관 디스커버리 방법 (관측)", "items": [{"title": "현장 현행 워크숍", "text": "공장별 현행을 화이트보드로 수집하고, 7개 범주의 갭 분석(현행 → 갭 → 해결)을 작성합니다.", "meta": "산출물: 갭 분석 문서·덱"}, {"title": "필드 정의 세션", "text": "녹화된 원격 세션 약 4회 × 1h를 2주 동안 진행합니다. 기존 매핑이 있는지 먼저 묻고, 키유저가 레거시 품목 화면 → BOM 열(레거시와 ERP 화면 나란히) → ERP 전송 필드 → 변경 양식·워크플로 순으로 공유합니다.", "meta": "관측: 실제 73 / 41 / 59 / 96분, 자주 초과"}, {"title": "세션 후 요약과 숙제", "text": "아키텍트가 녹화를 다시 보고 구조화된 요약과 미결 정보 요청을 보냅니다. 숙제: 하위 분류별 필드 표시 화면, ERP 약어가 붙은 단위 목록, 선택 목록 내용, 기타 레거시 프로세스 목록.", "meta": "팁: 숙제 형식 샘플을 3개 먼저 만들어 보여줌"}, {"title": "객체·워크플로 매핑", "text": "레거시 양식과 화면을 목표 객체에 대응시킵니다(예: 변경 양식 1부 → 변경 요청, 2·3부 → 변경 지시, 실행 체크리스트 → 변경 작업). 취소, CO 없는 반려, 간이 변경, 다중 CO 같은 기존 Fusion Manage 기능을 먼저 재사용합니다.", "meta": "산출물: 목표(To-Be) v1–v3"}, {"title": "분류 통합", "text": "레거시 클래스·하위 클래스(관측: 79개)를 하나의 Items 워크스페이스로 합치고, 분류에 따라 섹션 표시를 바꿉니다.", "meta": "효과: 워크스페이스 수와 유지보수 부담 감소"}, {"title": "재견적 관문", "text": "목표 설계 승인 시점에 구축 공수를 다시 견적하고, 새 요구는 별도 범위 변경서로 분리합니다.", "meta": "관측: 추가 요구 645h를 별도 요청으로 분리"}]}, {"t": "list", "title": "이관 매핑 원칙 (관측)", "items": ["BOM 필드를 **트랜잭션 필드**(BOM에 있고 ERP로 전송: 구성품, 수량, 공정 순서, 공급 유형, 수율, 찾기 번호)와 **참조 필드**(품목 마스터에서 옴: 라이프사이클, 설명, 개정, 유형, 단위)로 나눕니다.", "단위 변환표: 레거시 값 → ERP 값 → ERP 약어. 기본 단위는 릴리스 후 잠급니다.", "값뿐 아니라 ERP 동작을 문서화합니다: 마스터 조직 생성 후 사이트 조직 활성화, 생성 시에만 쓰는 템플릿 필드, 라이프사이클 → ERP 상태.", "마스터 BOM은 ERP로 보내지 않고, 브랜치는 마스터와 다른 필드만 가집니다. mBOM은 브랜치별로 둡니다.", "개정 체계: 예비(숫자)와 양산(알파벳)을 구분하고, ECO 승인만 개정을 올리며, 단종 품목은 새 개정을 막습니다. ERP가 받지 못하는 개정 형식은 초기에 확인합니다.", "구성(configured) 품목은 방향 플래그로 구분합니다: 비구성 품목은 PLM → ERP, 구성 품목은 ERP → PLM.", "데이터 원천이 둘일 수 있습니다: BOM 구조는 ERP에서 내보내고, 이력은 레거시 PLM에만 있습니다. 레거시 관리 콘솔 접근이 VM 1대·동시 1–2명으로 제한된 경우도 있었습니다."]}, {"t": "details", "items": [{"title": "레거시 PLM 이관 RFI 12개 영역 (일반화)", "blocks": [{"t": "table", "head": ["#", "영역", "핵심 질문"], "rows": [["1", "연동 환경", "ERP 종류·버전, 향후 업그레이드·교체 일정(24개월 로드맵 서면), 미들웨어 소유자, 해당 ERP 버전용 커넥터 유무, 오류 모니터링, 레거시 PLM 지원 계약 종료일"], ["2", "레거시 범위", "변경 외 사용 모듈(공급업체, 품질·감사, 문서, NPI, 재료 사양), 사용자·사이트 수, 보관 vs 이관"], ["3", "데이터 모델", "클래스·하위 클래스 구조와 수, 하위 클래스별 필드와 표시 규칙, 선택 목록(출처, 약어 + 설명, 연쇄), 품목 유형·템플릿·조직 코드"], ["4", "소유권", "PLM vs ERP 마스터 속성, 전역 vs 사이트 속성, ERP가 생성해 돌려주는 것(BOM, 라우팅, 계획)"], ["5", "BOM", "트랜잭션 vs 참조 필드, 찾기 번호 vs ERP 순번, 공정 순서·수율·공급 유형, 중복 구성품, 공통 BOM 조직, 구성기 BOM"], ["6", "개정·라이프사이클", "개정 체계와 ERP 제약, 예비 vs 양산, 라이프사이클 → ERP 상태, Vault 개정과의 관계"], ["7", "변경 프로세스", "사이트별 상태, 사유 코드, 그룹 vs 개인 할당, 요청당 다중 변경, 요청 없는 변경, 변경 없이 닫히는 요청, 간이 경로, 릴리스 후 보강 작업과 트리거, 처분(disposition), 일괄 변경, ERP 확인 후 종료"], ["8", "연동 이벤트", "방향별 객체, 상태 필드, 오류 처리·재처리, ERP에 기록할 추적 ID"], ["9", "데이터 이관", "건수, 첨부, 감사·공급업체 레코드, 일괄 수정 관행, 컷오버 방식, 임시 파일 가져오기"], ["10", "UX·보고", "사용 중인 대시보드·목록 보고서, 역할별 작업 큐, 작업 시간 단위(시간 vs 일)"], ["11", "조직", "예산, 스폰서·의사결정자, SME 가용성, 관리자 역량, 테스터 접근, 테스트 스크립트 작성·UAT 수행 주체"], ["12", "가치", "운영 전환 전에 확보할 기준 지표, 성공 기준"]], "note": "관측 RFI 문서는 형식·기한·기준·절차·후속 조치·일정 제목만 있는 빈 양식이었고, 질문은 디스커버리 기록에서 일반화했습니다. 요청일과 회신 기한을 명시한 공식 RFI로 운영하십시오."}]}]}, {"t": "callout", "kind": "warn", "title": "ERP 로드맵이 이관의 관문입니다", "text": "관측 이관은 착수 약 7.5개월에 1년 이상 보류되었습니다. 고객 ERP 책임자가 패치 → OS → DB 업그레이드(약 9개월) → 애플리케이션 업그레이드(12–15개월) 계획을 뒤늦게 공개했고, '바뀌는 엔드포인트에 연동을 만드는 일'은 고위험으로 판단되었습니다. 레거시 PLM 지원 계약도 약 2년 연장되어 기한 압박이 사라졌습니다. **견적 전에 24개월 ERP·미들웨어·레거시 지원 로드맵을 서면으로 받고, 이름 있는 고객 연동 책임자를 확인하십시오.**"}, {"t": "list", "title": "보류 시 처리 절차 (관측)", "items": ["현재 상태를 동결하고 기록합니다 (예: 목표 설계 사실상 승인, 구축 없음).", "ERP 업그레이드 후 목표 설계를 다시 확인합니다.", "미사용 공수는 선불 시간 풀로 반환하거나 다른 워크스트림에 재배정합니다.", "보류 기간에도 고객은 필드 매트릭스와 사용 사례 작업을 계속합니다.", "월간 프로그램 점검에서 재개 조건을 추적합니다."]}, {"t": "sec", "id": "test", "text": "연동 테스트와 컷오버"}, {"t": "p", "text": "연동 테스트는 **SIT(시스템 통합 테스트)로 기술 흐름을 먼저 닫고**, 그다음 UAT에서 업무 시나리오로 확인합니다. 관측된 ERP–PLM 연동 마일스톤 계획은 '연동 준비 완료'부터 종료까지 약 3개월이었습니다. UAT 운영 전반은 [[method|08 딜리버리 방법론]]을 보십시오."}, {"t": "steps", "title": "ERP–PLM 연동 마일스톤 (관측, 약 3개월)", "items": [{"title": "커넥터 구축 완료", "text": "미들웨어 흐름과 프록시 엔드포인트를 준비합니다."}, {"title": "ERP 쓰기 확인", "text": "테스트 테넌트를 ERP 테스트 환경에 연결해 실제 쓰기를 확인합니다."}, {"title": "연동 계정 준비", "text": "ERP 변경 요청으로 연동 계정을 발급받습니다.", "meta": "관측: 승인 약 1주"}, {"title": "SIT", "text": "양방향 전송, 오류 응답, 재전송 시나리오를 실행합니다.", "meta": "산출물: SIT 최종 보고·서명"}, {"title": "UAT", "text": "Items & BOMs UAT와 함께 업무 시나리오로 확인합니다.", "meta": "산출물: UAT 최종 보고·서명"}, {"title": "결함 지원과 종료", "text": "약 3주의 결함 지원 기간 뒤 종료 보고, 교훈 정리, 서명으로 닫습니다."}]}, {"t": "list", "title": "테스트 원칙 (관측 → 권장)", "items": ["**오류를 일부러 만드십시오.** 누락 필드, 잘못된 코드, 재전송, 순서 뒤바뀜, 연결 실패를 시나리오에 넣습니다(관측 계획 메모: \"try to force errors\").", "**구축 계획에 대고 테스트하십시오.** 요구사항 ↔ 테스트 매핑, 테스트 계획(범위·방법·자원·일정·책임자), 이슈 기록 위치, 심각도 결정권자, 서명자를 먼저 정합니다.", "**고객이 자사 연동을 테스트합니다.** 파트너는 스크립트 작성과 샌드박스 시나리오를 지원합니다.", "**오류 처리 책임자는 하나로.** 프록시와 미들웨어가 각각 오류를 처리하다 서로 덮어쓴 사례가 있었습니다. 결정: 프록시는 오류를 응답 본문으로 돌려주고 미들웨어가 처리합니다.", "**BOM 완전성 검사는 CCB 전에.** BOM 없이 보낸 ECO가 ERP에 섞인 BOM을 만들었습니다. 스크립트 타임아웃 때문에 Fusion Manage 안이 아니라 프록시에서 '미릴리스 하위 품목' 재귀 검증을 돌렸습니다.", "**재전송은 중복을 만들면 안 됩니다.** mBOM 재전송이 ERP에 중복 행을 만든 사례가 있었습니다.", "**ERP 인터페이스 버전을 고정하십시오.** ERP 팀이 연동 전용 인터페이스 버전을 새로 만들어 2–4주의 재작업이 생겼습니다.", "**ERP가 PLM 소유 필드를 덮어쓸 때**의 RACI와 롤백 절차를 기록합니다.", "**UAT 전 2–3주 기능 테스트**로 키유저가 베타 테스터가 되지 않게 합니다."]}, {"t": "h", "text": "진행 중 레코드 컷오버"}, {"t": "p", "text": "운영 전환 시점에 열려 있는 ECR·ECO를 어떻게 할지 미리 정하십시오. 관측 기본 정책은 **레거시에서 끝내고, 몇 달 뒤에도 남은 건만 수동 재입력**이었습니다. 레거시 양식 데이터가 일관되지 않아 대량 가져오기는 공수 대비 가치가 낮았고, 다른 사례에서는 약 2,000건의 열린 레거시 ECR 이관을 권하지 않았습니다. 그래도 가져오기 템플릿은 준비해 두었습니다."}, {"t": "template", "title": "진행 중 ECO 가져오기 템플릿 (ECR도 유사)", "intro": "열은 워크스페이스 섹션 순서대로 묶습니다. 색상 표시: 초록 = 필수, 주황 = 스크립트·동작을 구동, 회색 = 참조용(보통 스크립트가 설정). 작업(Task) 템플릿이 따로 필요할 수 있습니다.", "sections": [{"h": "헤더", "items": ["설명자(descriptor)", "번호", "설명", "우선순위", "요청자", "설계 권한"]}, {"h": "요청 요약", "items": ["사유", "연결된 CR", "변경 범주", "간이 변경 여부", "작업 템플릿"]}, {"h": "승인", "items": ["코디네이터", "역할별 승인자·승인 여부·날짜 (관측: 7개 역할)", "영향 사이트", "알림 대상", "영향 공급업체", "외부 승인 필요 여부", "CCB 코멘트", "소유자"]}, {"h": "재고 조치 매트릭스 (CR)", "items": ["공급업체 / 공장 / 재공 / 창고 / 고객 × 해당 없음 / 반품 / 재작업 / 폐기 / 사용"]}]}, {"t": "p", "text": "관측 운영 전환 패키지에서 진행 중 레코드 지원은 22h였습니다: 가져오기 템플릿 작성 4h, 개발 테넌트 테스트 가져오기 4h, 최종 퍼지 후 가져오기·정리 4h, 코디네이터의 작업 템플릿·사이트 설정 지원 4h, 관리자 교육 지원 2h, 회의 4h."}, {"t": "checklist", "id": "data-readiness", "title": "데이터 준비 체크리스트", "items": ["ERP 종류·버전과 24개월 업그레이드 로드맵을 서면으로 받았다", "이름 있는 고객 측 연동 책임자와 미들웨어 표준(또는 부재)을 확인했다", "연동 옵션 비교와 권고안을 서면으로 제시하고 고객의 선택을 기록했다", "딜리버리 모델(구축형 / 지원형 / 프록시형)과 연동 RACI를 합의했다", "데이터 필드 매트릭스(ERP·PDM·PLM·PIM 소유권)의 작성자와 고객 측 소유자를 지정했다", "Master Attribute List의 첫 5개 열을 키유저와 함께 채웠다", "품번 규칙(길이, 특수문자, 앞자리 0)과 개정 체계의 ERP 제약을 확인했다", "샘플 추출(품목·BOM·라우팅·코드 테이블)을 UTF-8 통합 형식으로 받았다", "참조 데이터 적재 순서와 담당(누가, 어떤 방법·도구로)을 문서화했다", "동기화 안전장치(maxCreates/maxUpdates, 사이트 포함 목록, 동기화 출처 보호)를 설정했다", "사이트별 데이터 마스터 권한(읽기 전용 적재 → PLM 작성 전환 시점)을 합의했다", "SIT·UAT 계획, 고객 측 테스트 책임, 오류 처리 책임자를 정했다", "진행 중 ECR/ECO 컷오버 정책과 가져오기 템플릿을 합의했다", "맞춤 도구(동기화 도구·프록시)의 소스 코드 라이선스와 지원 책임을 합의했다"]}, {"t": "template", "title": "연동 RFI·요구사항서 템플릿", "intro": "인터페이스 하나당 한 부를 씁니다. 고객 연동팀과 ERP팀이 채우고 파트너가 검토합니다.", "sections": [{"h": "개요", "items": ["요청자, 참조 번호, 적용 범위(전역 / 지역 / 사이트)", "개정 이력과 승인표", "요약, 업무 효과, 일반 가정"]}, {"h": "현행과 목표 프로세스", "items": ["현행 프로세스 맵", "목표 프로세스 맵", "사용 사례 ID·이름·트리거·방향(PLM → ERP / ERP → PLM)"]}, {"h": "엔드포인트", "items": ["시스템 이름·버전·소유자", "위치(클라우드 / 사내), 연결 방식, 환경(개발 / 테스트 / 운영)", "사내 엔드포인트일 때 미들웨어 런타임 호스팅 인프라", "재해 복구 엔드포인트 여부"]}, {"h": "인터페이스 상세", "items": ["원천·대상 엔드포인트와 방법·검증", "변환 매핑 (Master Attribute List 참조)", "중요도(1–3), 기존 / 신규", "지연 허용(예약 / 실시간), 유형(push / pull / publish / subscribe)", "빈도·건수·성능 요구, 데이터 민감도"]}, {"h": "오류 처리와 운영", "items": ["오류 응답 형식과 처리 책임자", "재처리·재전송 규칙(중복 방지)", "상태 필드(전송 일시·상태·메시지)", "모니터링·알림, 로그 보관"]}, {"h": "테스트와 인수", "items": ["SIT 시나리오 (오류 강제 포함)", "UAT 시나리오와 업무 인수 기준", "테스트 데이터·환경 준비 책임"]}, {"h": "조직과 일정", "items": ["업무 리더, PM, 연동팀, ERP 기능 담당, 벤더 기술 담당, 운영 지원", "일정: 착수 → 디스커버리 → 설계 → 구축 → SIT → UAT → 배포 → 하이퍼케어 → 종료", "위험과 완화, 의존성"]}]}, {"t": "quiz", "items": [{"q": "고객이 자체 미들웨어 팀을 보유하고 있을 때 관측된 연동 딜리버리 모델의 변화는?", "options": ["파트너 구축 960h 안을 그대로 유지했다", "인터페이스당 약 180h의 지원형으로 바꾸었다", "연동을 범위에서 완전히 뺐다"], "answer": 1, "why": "고객이 사내 미들웨어로 직접 구축하기로 하자, 파트너는 요구사항·사용 사례·API 교육·매핑 검토·UAT 지원을 맡는 지원형으로 바뀌었습니다."}, {"q": "델타 동기화 도구의 안전장치로 적절하지 않은 것은?", "options": ["maxCreates/maxUpdates 상한", "사이트 포함 목록", "동기화에 기본값을 넣어 빈 필드를 채우기"], "answer": 2, "why": "동기화에 기본값을 넣으면 사용자 편집을 덮어씁니다. 필수 필드는 원천에서 채워 보내야 합니다."}, {"q": "Vault–Fusion Manage 연동을 단계적으로 도입할 때 가장 마지막에 결정할 것은?", "options": ["PLM 개념 교육", "Vault → Fusion Manage 단방향 읽기 전용 게시", "Fusion Manage가 Vault 라이프사이클 상태를 바꾸는 제어"], "answer": 2, "why": "PLM 이해 → 단방향 읽기 전용 → Fusion Manage에서 변경 → 상태 제어 순서가 권장됩니다. 양방향 상태 제어는 앞 단계가 안정된 뒤에 정합니다."}, {"q": "레거시 PLM 이관 견적 전에 반드시 서면으로 받아야 하는 것은?", "options": ["레거시 PLM 사용자 매뉴얼", "24개월 ERP·미들웨어·레거시 지원 로드맵", "다른 공급사의 견적서"], "answer": 1, "why": "관측 이관은 ERP 업그레이드 계획이 뒤늦게 드러나 약 7.5개월에 보류되었습니다. 바뀌는 엔드포인트에 연동을 만드는 일은 고위험입니다."}]}]}, {"id": "training", "num": "11", "group": "deliver", "title": "교육은 *역할별로* 설계합니다", "short": "교육 설계", "goal": "이 모듈을 마치면 역할별 교육 유형과 시간을 고르고, 교육 요구 분석부터 자료 제작·시점 결정·공수 견적까지 SOW에 넣을 교육 계획을 만들 수 있습니다.", "facts": [["학습 시간", "40분"], ["대상", "컨설턴트·교육 담당·PM"], ["산출물", "교육 계획·커리큘럼·피드백 양식"]], "blocks": [{"t": "lead", "text": "관측 프로젝트에서 교육은 내용보다 **대상과 시점**에서 실패했습니다. UAT 전에 넓은 대상에게 교육하자 사용자가 혼란을 느꼈고, 역할을 섞은 세션은 이해도를 떨어뜨렸습니다. 교육은 역할별로 나누고, 최종 사용자 교육은 고객이 맡도록 설계합니다."}, {"t": "sec", "id": "types", "text": "교육 유형과 기간"}, {"t": "table", "title": "역할별 교육 유형", "head": ["유형", "대상", "기간 (관측)", "진행", "자료"], "rows": [["경영진 브리핑", "스폰서·경영진", "30–60분 (권장). 운영 전환 때 경영진용 3분 설명 영상을 활용 (관측)", "PM·리드 컨설턴트", "가치 1장, 3분 설명 영상, 로드맵"], ["이해관계자 제품 교육", "코어팀, To-Be 검토자", "구현 착수 시 (관측 제안 카탈로그). 2–4h (권장)", "리드 컨설턴트", "표준 테넌트 데모, 용어집, “PLM 한 장” 그림, 워크스페이스별 흐름도"], ["키유저·UAT 테스터 교육", "테스터, 코디네이터", "트랙당 2h × 2회, 원격 (관측). 교육 2h + 질의 6h로 잡은 사례도 있음", "구성 컨설턴트", "역할별 3계층 자료(일반·고급·관리자), UAT 스크립트를 교육 가이드로 겸용"], ["최종 사용자 교육", "전 사용자", "1일 (관측 제안 카탈로그). 새 사이트당 약 3세션, 주 1회, 현지어 (관측). 리프레셔 1.5h", "고객 키유저 (train-the-trainer)", "고객이 작성한 가이드, 파트너 검토 2–4h"], ["관리자 교육 L1 운영 자립", "고객 관리자", "신기능 2h + 질의 2h(준비 포함 16h). 제안 카탈로그 3–4일. 10일 프로그램(자립 8일 + 개선 2일, 3–4개월에 걸쳐)", "리드·구성 컨설턴트", "실습 환경, 런북, 녹화 영상. 사전 과제: 자기 주도 약 1.5h 관리 기초 과정"], ["관리자 교육 L2 개발 자립", "슈퍼 관리자 6–8명", "엔터프라이즈 약 45일 (연 15일 = 전달 10일 + 자료 5일, 3년) (관측)", "리드 컨설턴트·솔루션 아키텍트", "통제된 저위험 변경 실습, 변경 거버넌스 문서"], ["스크립트·API 교육", "고객 개발자·연동팀", "스크립트는 “1일 미만으로는 가르칠 수 없다” (관측). Fusion Manage API 과정 3일, Vault API 과정 4일, 임포트 도구 2일 (관측 견적)", "연동 SME", "표준 워크스페이스로 하는 실습 13개(스크립트 과정)"], ["Train-the-trainer", "고객 사내 강사(키유저)", "3일 (관측 제안 카탈로그), 최대 6명", "교육 담당", "강사용 자료, 데모 대본, 평가 양식"], ["녹화 영상·설명 영상", "결석자, 승인자, 신규 입사자", "짧은 기능 영상 1개 제작 약 3h(복잡하면 8h). 설명 영상 3분 안팎 (관측)", "교육 담당 + 영상 협력사", "기능 우선순위표, 대본, 스토리보드"]], "note": "“관측 제안 카탈로그”는 영업 단계에서 제시된 표준 교육 기간이고, 나머지는 실제 프로젝트 관측치입니다. 강의실 교육은 과정당 최대 8명(관리자 4–6명), 고객이 교육용 PC를 수강생 수 + 1대 준비하는 조건이 관측되었습니다."}, {"t": "callout", "kind": "tip", "title": "승인자에게는 절차서 대신 짧은 영상", "text": "관측 프로젝트는 가끔 승인만 하는 사용자에게 절차서 대신 짧은 주문형 영상을 주었습니다. 역할마다 꼭 필요한 동작만 가르치는 것이 핵심입니다. 같은 이유로 품질 관리처럼 표준 프로세스가 있는 영역은 기존 시스템의 클릭 순서가 아니라 표준(OOTB) 워크플로와 결과를 가르쳤습니다."}, {"t": "sec", "id": "tna", "text": "교육 요구 분석"}, {"t": "p", "text": "관측 고객은 처음에 “관리자 교육에 정해진 경로가 없다”는 문제를 겪었고, 교육 요구를 스스로 평가한 뒤에야 계획을 세울 수 있었습니다. 요구 분석은 교육 견적의 입력값입니다. 인원·역할·언어를 모르면 세션 수를 셀 수 없습니다."}, {"t": "steps", "title": "교육 요구 분석 5단계", "items": [{"title": "역할과 인원을 셉니다", "text": "역할(작성자·검토자·조회자·승인자·관리자)별 인원을 사이트·언어별로 셉니다. 관측 예: 분류 코드 교육은 작성자·제품 관리자 약 32명과 조회자 약 95명을 3개 지역으로 나눠 운영했습니다.", "meta": "담당: 고객 교육 담당 + PM"}, {"title": "현재 역량을 조사합니다", "text": "설문으로 근속, 제품 사용 빈도(안 씀·가끔·항상·더 배우고 싶음), 마지막 교육 시점, 문제 빈도, 원인별 손실 시간, 도움 요청 경로를 묻습니다. 관측 결과 도움 요청 순서는 본인 → 동료 → 헬프데스크였고 외부 파트너는 마지막이었습니다.", "meta": "관측 설문 문항"}, {"title": "관리자 자기 평가를 받습니다", "text": "관리자 후보는 자기 평가를 하고 약 1.5h의 자기 주도 관리 기초 과정을 먼저 마칩니다. 컨설팅은 남은 공백만 다룹니다.", "meta": "관측"}, {"title": "교육 요구 매트릭스를 만듭니다", "text": "사이트 / 언어 / 역할 / 인원 / 과정 수 / 형식 / 강사. 과정당 8명을 기준으로 과정 수를 계산합니다(관측: 18명 = 3과정, 53명 = 8과정).", "meta": "관측 양식"}, {"title": "역할별 경로를 확정합니다", "text": "역할마다 유형·순서·형식(실시간·녹화·현지어)을 정하고, 누가 가르치는지(파트너·고객 강사)를 RACI에 넣습니다([[team|09 팀과 거버넌스]]).", "meta": "산출물: 교육 계획"}]}, {"t": "table", "title": "교육 요구 매트릭스 (예시 양식)", "head": ["사이트", "언어", "역할", "인원", "과정 수", "형식", "강사"], "num": [3, 4], "rows": [["A 공장", "한국어", "키유저", "6", "1", "실시간 2h × 2", "파트너"], ["A 공장", "한국어", "최종 사용자", "40", "5", "실시간 1일", "고객 키유저"], ["B 공장", "영어", "최종 사용자", "18", "3", "실시간 + 녹화", "고객 키유저"], ["전사", "한국어", "승인자", "60", "-", "주문형 영상", "-"], ["본사 IT", "한국어", "관리자", "4", "1", "실습 3일", "파트너"]], "note": "값은 예시입니다(권장 양식). 관측된 매트릭스는 약 30개 사이트, 6개 언어에 걸쳐 지역·국가·사이트·교육 언어·역할별 인원과 과정 수를 관리했습니다."}, {"t": "sec", "id": "timing", "text": "교육 시점과 순서"}, {"t": "callout", "kind": "warn", "title": "UAT 전에 넓게 가르치면 역효과가 납니다", "text": "관측 사례: 단종 관리 프로세스를 UAT 전에 지역 전체 사용자에게 교육했더니 “따라가기 어렵고, 너무 복잡하고, 일부는 동작하지 않았다”는 반응이 나왔습니다. 역할이 섞인 세션에서는 누가 분석·승인하고 누가 요청만 하는지 혼동했습니다. 팀은 **핵심 제품 관리자와 먼저 UAT → 이후 지역별 교육**으로 순서를 바꿨고, 사용자 유형별 역할·책임 개요를 교육 앞에 넣었습니다."}, {"t": "gantt", "title": "교육 순서 (권장, 관측 교훈 반영)", "subtitle": "테스트되지 않은 프로세스를 넓은 대상에게 가르치지 않습니다", "cols": ["착수", "설계", "구축", "UAT 직전", "UAT", "PROD 확인", "운영 전환", "확산"], "rows": [{"label": "경영진 브리핑", "start": 0, "len": 1, "kind": "std", "text": "가치·역할"}, {"label": "이해관계자 제품 교육", "start": 0, "len": 2, "kind": "std", "text": "To-Be 검토 전"}, {"label": "관리자 교육 L1", "start": 2, "len": 3, "kind": "run", "text": "실습 위주"}, {"label": "키유저·테스터 교육", "start": 3, "len": 1, "kind": "gate", "text": "2h × 2"}, {"label": "Train-the-trainer", "start": 5, "len": 1, "kind": "std", "text": "사내 강사"}, {"label": "최종 사용자 교육", "start": 5, "len": 2, "kind": "run", "text": "고객 키유저 진행"}, {"label": "녹화·리프레셔", "start": 6, "len": 2, "kind": "opt", "text": "결석자·신규"}, {"label": "관리자 교육 L2", "start": 7, "len": 1, "kind": "opt", "text": "운영 후"}], "legend": [{"kind": "std", "text": "교육"}, {"kind": "run", "text": "핵심 교육"}, {"kind": "gate", "text": "UAT 진입 조건"}, {"kind": "opt", "text": "후속"}]}, {"t": "list", "title": "시점 규칙", "items": ["키유저·테스터 교육은 **UAT 직전**에 합니다. 리프레셔는 UAT 전에 1.5h로 열고, 일정 안내는 약 5주 전에 보냈습니다(관측).", "최종 사용자 교육은 **운영 전환 직전**, 운영 테넌트 확인 테스트와 나란히 진행했습니다(관측). 운영 테넌트가 아직 없으면 dev를 교육 환경으로 쓰되, 그동안 구성을 동결해야 합니다.", "관리자 교육은 확산을 지원할 수 있도록 가능한 한 일찍 시작합니다. 실습은 실제 작업(퍼지·재로드, 사용자 온보딩)과 겹치게 잡습니다.", "원격 UAT는 효과가 떨어진다고 평가되었습니다. 키유저가 UAT 전에 온라인 교육을 마치게 했고, 사용자가 UAT에 들어가려면 1–1.5일의 적응 기간과 스크립트 이해가 필요했습니다(관측).", "파일럿 사이트의 키유저가 다음 사이트를 가르칩니다. 관측 확산 계획에서 파트너는 1–2번째 사이트, 고객 팀은 3–4번째 사이트를 맡았고, 이미 운영 중인 사이트의 키유저가 지원 팀에 들어갔습니다.", "용어(사이트·위치·부문·브랜치 등)를 맞추는 용어집과 “PLM 한 장” 그림을 교육 전에 준비합니다(관측 요구).", "교육 일정이 사내 행사와 겹쳐 결석이 많았던 사례가 있습니다. 녹화본을 고객 학습 시스템에 올립니다."]}, {"t": "sec", "id": "ttt", "text": "최종 사용자 교육은 고객이 합니다"}, {"t": "p", "text": "관측된 후기 계약의 SOW 대부분은 교육을 범위에서 빼거나 train-the-trainer로 한정했습니다. 파트너는 테스터와 관리자를 가르치고, 고객 키유저가 현지어로 최종 사용자를 가르칩니다. 파트너는 고객이 만든 자료를 **상한 시간 안에서** 돕습니다(관측: 교육 자료 작성 지원 최대 4h, 교육 가이드 검토 약 2h). 운영 후 파트너가 주 1–2h 지원을 제안한 사례도 있습니다."}, {"t": "tiles", "items": [{"tag": "파트너", "title": "가르치는 대상", "items": ["테스터·코디네이터(2h × 2)", "고객 관리자(L1·L2)", "사내 강사(train-the-trainer)", "고객 연동팀(API)"]}, {"tag": "고객", "title": "가르치는 대상", "items": ["최종 사용자(현지어, 사이트당 약 3세션)", "신규 입사자·결석자(녹화본)", "다음 확산 사이트"]}, {"tag": "파트너", "title": "만드는 것", "items": ["UAT 교육 자료(3계층)", "관리자 실습과 런북", "강사용 데모 대본"]}, {"tag": "고객", "title": "만드는 것", "items": ["최종 사용자 가이드·SOP", "UAT 스크립트(교육 가이드 겸용)", "사내 커뮤니케이션"]}]}, {"t": "list", "title": "SOW에 넣을 교육 문구 예시 (관측 기반)", "items": ["최종 사용자 교육과 전사 확산은 고객 책임입니다.", "파트너는 키유저(UAT 테스터) 교육을 트랙당 2시간 세션 최대 2회, 원격으로 제공합니다.", "고객이 교육 자료를 작성하며, 파트너의 참여는 최대 N시간의 검토로 한정합니다.", "교육 환경·계정·데이터 세트·회의실은 고객이 준비합니다. 데이터 세트는 완성 상태가 아니라 시작 상태로 준비합니다.", "참석 인원이 부족해도 환불이나 추가 세션의 사유가 되지 않습니다."]}, {"t": "callout", "kind": "rule", "title": "계약 조항은 반드시 귀사 법무 검토", "text": "위 문구는 관측된 개념을 옮긴 예시입니다. 교육 범위·취소·참석 조건은 계약 효력에 영향을 주므로 SOW에 넣기 전에 귀사 법무 검토를 받으십시오. SOW 구조는 [[sow|05 SOW 작성]]을 보십시오."}, {"t": "sec", "id": "curricula", "text": "샘플 커리큘럼과 피드백 양식"}, {"t": "p", "text": "아래 시간 배분은 관측된 교육 주제를 묶은 **권장안**입니다. 관측된 형식(관리자 3–4일 제안 카탈로그, 키유저 2h × 2)에 맞췄습니다. 주제는 관측된 관리자 교육 과정, 관리자 교육 1일차 주제, 3계층 UAT 교육 자료에서 가져왔습니다."}, {"t": "table", "title": "관리자 L1 운영 자립 과정 (3일 = 24h, 권장)", "head": ["일차", "주제", "시간"], "num": [2], "rows": [["사전", "자기 주도 관리 기초 과정(관측 약 1.5h). 데이터베이스 개념과 기초 스크립트(가능하면 JavaScript) 이해", "1.5h"], ["1일", "개요: 개념, 탐색, 라이선스, 데이터 거버넌스, 빠른 성과를 고르는 법", "1h"], ["1일", "보안 모델: 사용자·그룹·역할, 계층형 역할, 소유자·추가 소유자, 섹션 권한", "2h"], ["1일", "워크스페이스: 유형, 섹션, 필드·피클리스트, 계산 필드, 디스크립터, 관계", "2.5h"], ["1일", "워크플로: 상태·전이, 잠금, 에스컬레이션, 마일스톤, 위임", "2.5h"], ["2일", "탭: BOM, 그리드, 영향 항목, 첨부, where-used", "1.5h"], ["2일", "임포트·익스포트: 임포트 역할, 일괄 수정 전 백업, 스크립트 재실행 주의", "2h"], ["2일", "보고서·대시보드·인쇄 뷰", "1.5h"], ["2일", "스크립트 읽기: 조건·검증·액션·라이브러리, 오류 로그 확인(수정은 L2)", "1h"], ["2일", "고객 앱 운영 실습: 사이트·승인자 목록, 작업 템플릿, 사용자 온보딩", "2h"], ["3일", "샌드박스→운영 반영 절차, 구성 추출·비교 도구, 변경 로그", "2h"], ["3일", "운영 업무: 변경 요청 접수·분류, 지원 케이스 제기, 릴리스 노트 확인", "2h"], ["3일", "실전 실습: 환경 퍼지·재로드에 참여, 런북 작성", "3h"], ["3일", "평가, 피드백 양식, 다음 단계(L2 여부 공동 평가)", "1h"], ["Σ 합계 (사전 과정 제외)", "", "24h"]], "note": "L1 성공 기준(관측): 고객 관리자 팀이 파트너 없이 실행·모니터링·문제 해결을 한다, 소유·변경 거버넌스를 문서화한다(“저위험 변경”의 정의 포함), 환경 재설정을 마치고 검증한다. L2(개발 자립)는 L1을 마친 뒤 공동 평가로 시작 여부를 정합니다. 관측 리스크: 참여자 시간 부족, 교육 후 지식 미정착, 소수 인원 의존. 완화책은 실습 워크숍·런북·동행 작업·녹화·감독 하 실행이었습니다."}, {"t": "table", "title": "키유저·UAT 테스터 교육 (2h × 2, 설계 변경 트랙 예시, 권장)", "head": ["회차", "주제", "분"], "num": [2], "rows": [["1회차", "북극성 그림·워크스페이스 맵, 사용자 유형별 역할·책임 개요", "15"], ["1회차", "로그인·SSO, 대시보드, 프로필, 알림, 위임, 뷰·필터·북마크", "20"], ["1회차", "ECR 생성·제출·평가·승인·취소: 시연 후 실습", "45"], ["1회차", "ECO 준비·수행·검토·종료, 변경 작업", "30"], ["1회차", "질의와 다음 회차 과제", "10"], ["2회차", "고급: 다사이트 변경, 외부 이해관계자, 알림·확인, 편차 승인", "30"], ["2회차", "보고서·차트, 할 일 목록 관리", "20"], ["2회차", "UAT 스크립트 워크스루(스크립트 = 교육 가이드), 결함 기록 방법과 심각도", "40"], ["2회차", "`[DEV]`·`[UNUSED]` 표시의 의미, 이번 UAT에서 범위 밖이거나 읽기 전용인 섹션", "20"], ["2회차", "UAT 일정, 지원 채널, 질의", "10"], ["Σ 합계 (2회 × 2h)", "", "240"]], "note": "관측된 3계층 자료(일반 사용자 / 고급 사용자 / 관리자, 각 35–54장, 시연 포함)를 일반·고급 두 회차로 압축한 권장안입니다. 관리자 부분은 위 L1 과정으로 넘깁니다. UAT 기간에는 주 2회 1h 공동 테스트 세션을 최소 3주 운영한 사례가 있습니다([[method|08 딜리버리 방법론]])."}, {"t": "template", "title": "교육 후 피드백 양식 (예/아니오)", "intro": "관측된 양식입니다. 행은 교육에서 실습한 작업, 열은 작업마다 답하는 예/아니오 질문입니다.", "sections": [{"h": "행: 실습한 작업 (예시)", "items": ["품목 생성", "CAD·문서 연결", "변경 번호 부여", "분류 지정", "편집", "링크·첨부 추가", "워크플로 상태 변경", "BOM 포함·미포함 릴리스", "내보내기·임포트"]}, {"h": "열: 작업마다 예/아니오", "items": ["혼자 수행할 수 있었습니까?", "쉬웠습니까?", "시간이 충분했습니까?", "매일 쓰겠습니까?", "업무가 더 명확해집니까?", "의견(자유 기술)"]}, {"h": "집계와 활용", "items": ["작업별 “아니오” 비율이 높은 항목을 리프레셔·영상 주제로 올림", "세션 수·참석자·숙련 인원을 기록해 도입 지표로 사용(관측: 참석 수를 도입 근거로 활용)"]}]}, {"t": "sec", "id": "materials", "text": "교육 자료와 영상 만들기"}, {"t": "p", "text": "자료 제작은 과소 견적되기 쉽습니다. 관측된 업그레이드 교육 콘텐츠는 144h 견적에 실제 156–172h가 들었습니다. 전체 기능을 담으려면 113–148h가 필요했지만 콘텐츠에 쓸 수 있는 시간은 80–120h였습니다. 그래서 **기능 우선순위표(feature league table)** 로 범위를 시간 예산에 맞췄습니다."}, {"t": "steps", "title": "기능 우선순위표로 범위 맞추기", "items": [{"title": "기능 목록을 섹션별로 만듭니다", "text": "릴리스·프로세스별로 가르칠 기능을 나열합니다."}, {"title": "검토자가 0–10점을 매깁니다", "text": "사이트 대표 약 10명이 기능마다 점수를 주고, 합계로 순위를 정합니다. 첫날 점수 워크숍으로 시작했습니다.", "meta": "관측"}, {"title": "기능마다 공수를 붙입니다", "text": "최소 1h, 8h = 1인일. 짧은 기능 영상은 약 3h, 복잡하면 8h. 영상 제작 여부(Y/N)와 예상 분량(분)을 적습니다.", "meta": "관측: 기능 38개 ≈ 113h"}, {"title": "예산에서 끊습니다", "text": "순위대로 공수를 누적해 예산에서 자릅니다. 나머지는 다음 릴리스나 고객 제작으로 넘깁니다.", "meta": "관측: 96h 중 80h를 콘텐츠에 배정"}, {"title": "검토·수정 시간을 따로 잡습니다", "text": "고객 검토 뒤 수정 공수(관측 +12h)를 견적에 넣고, 쓰지 않으면 반환합니다. 남은 시간은 착수·계획·종료와 30분 회의 8회에 썼습니다.", "meta": "관측 교훈"}]}, {"t": "list", "title": "영상·자료 제작 규칙 (관측)", "items": ["해상도와 학습 시스템 패키징 형식을 녹화 전에 확정합니다. 720p는 대화 상자가 읽히지 않아 전부 1080p로 다시 녹화했고, 파일 크기가 두 배가 되었습니다.", "모듈 구성은 개요 슬라이드 → 전용 교육 환경 실습 → 참/거짓 확인 문제입니다. 모듈당 30–40장이고, 대본에 구간별 시간(예: 0–30초)을 적습니다.", "고객이 준 파일은 쓰기 전에 검증합니다. 고객 QA에서 파일 누락, 잘못된 상태의 데이터, 중복 슬라이드, 동작하지 않는 단계 등 약 30건이 나왔습니다.", "제품 결함에 걸린 실습은 빼고 지원 케이스를 엽니다. 대본 작성은 예상보다 오래 걸렸습니다.", "설명 영상은 3분 안팎으로 줄입니다(관측: 4분 30초 → 3분 40초, 3분 44초 → 2분 40초). 대본 순서는 긴급성 → 이유 → 무엇 → 방법·시기 → 누구 → 사람에게 주는 효과 → 조직에 주는 효과입니다.", "설명 영상에는 타사 브랜드를 넣지 않고, 확정되지 않은 기능은 단정하지 않고 가능성으로 표현합니다.", "자료 준비는 달력 기준 약 2주가 걸렸습니다. 교육 일정보다 최소 2주 먼저 자료 작업을 시작합니다.", "교육 환경은 번호를 붙인 수강생 계정 여러 개와 강사 계정 하나, 정리된 교육용 데이터로 꾸립니다. 정리되지 않은 데이터로 키유저를 가르친 뒤 표준 교육 환경을 따로 만든 사례가 있습니다."]}, {"t": "sec", "id": "pricing", "text": "교육 공수 견적"}, {"t": "p", "text": "교육 공수 = 세션 시간 × 세션 수 + 준비 + 자료 제작 + 검토 반영입니다. [[estimate|03 스코핑과 견적]]의 교육 항목 세 개를 아래 S/M/L에서 고르고, 인원·트랙·지역 세션 수로 조정합니다. 금액은 귀사 단가로 계산합니다."}, {"t": "table", "title": "교육 견적 항목 (S / M / L)", "head": ["견적 항목", "S", "M", "L", "근거"], "num": [1, 2, 3], "rows": [["관리자 교육", "16h", "80h", "360h", "S: 신기능 2h + 질의 2h + 준비 (관측). M: 3일 실습 과정 + 준비 (관측치 기반 추정). L: 관리 도구를 포함한 관리자 자립 패키지 (관측)"], ["키유저·UAT 테스터 교육", "16h", "32h", "64h", "트랙당 2h × 2회 기준 (관측). 트랙 수·지역 세션 수에 따라 증가. 자료 준비는 달력 기준 약 2주"], ["교육 자료 작성 지원", "8h", "40h", "144h", "S: 고객 자료 검토 지원(관측 최대 4h)에 여유를 더한 값. L: 기능 영상·슬라이드 콘텐츠 제작 96–144h (관측)"]]}, {"t": "list", "title": "준비 비율 (관측 → 권장)", "items": ["신기능 관리자 교육은 전달 4h(교육 2h + 질의 2h)에 견적 16h였습니다. 처음 만드는 교육은 **준비를 전달 시간의 약 2–3배**로 잡습니다(권장).", "같은 과정을 반복할 때는 강사 준비 15–20%를 더합니다(관측: 외부 강사 시간의 약 16%가 준비).", "준비 시간이 공수에 포함된다는 점을 착수 때 고객과 합의합니다. 세션 대비 준비가 4:1이 되자 고객이 이의를 제기해 무상 처리한 사례가 있습니다.", "스크립트 교육은 관리자 교육에서 떼어 별도 항목으로 견적합니다(관측: 스크립트는 1일 미만으로 가르칠 수 없음)."]}, {"t": "table", "title": "계산 예시 (권장)", "head": ["교육", "계산", "공수"], "num": [2], "rows": [["키유저·테스터 교육 (2트랙)", "전달 2h × 2회 × 2트랙 = 8h + 준비 16h(2배) + 질의 시간 6h + 자료 갱신 2h", "32h"], ["관리자 교육 L1 (3일)", "전달 24h + 준비 48h(2배) + 런북·평가 8h", "80h"], ["기능 영상 30개", "짧은 영상 25개 × 3h + 복잡 영상 5개 × 8h = 115h + 검토 반영 약 10%", "~127h"], ["Σ 교육 소계", "PM 15%와 예비 공수는 견적 계산기에서 일괄 적용", "~239h"]]}, {"t": "callout", "kind": "source", "title": "이 모듈의 근거", "text": "관측: 관리자 신기능 교육 16h, 트랙당 2×2h 테스터 교육, 10일 관리자 프로그램, 엔터프라이즈 관리자 자립 약 45일(슈퍼 관리자 6–8명), 콘텐츠 제작 96–144h, 짧은 기능 영상 약 3h, 제안 카탈로그(관리자 3–4일, 최종 사용자 1일, train-the-trainer 3일). 커리큘럼 시간 배분, 준비 비율, 계산 예시는 권장입니다."}, {"t": "checklist", "id": "training-plan", "title": "교육 계획 체크리스트", "items": ["역할별 인원·언어·사이트를 담은 교육 요구 매트릭스를 만들었다", "역할마다 교육 유형·시점·강사(파트너 또는 고객)를 정하고 RACI에 넣었다", "키유저·테스터 교육은 UAT 직전, 최종 사용자 교육은 운영 전환 직전으로 잡았다", "넓은 대상 교육은 UAT 이후로 미루고, 사용자 유형별 역할 개요를 앞에 넣었다", "SOW에 최종 사용자 교육은 고객 책임, 자료 지원은 최대 N시간으로 적었다", "관리자 L1 성공 기준과 L2 시작 결정 시점을 합의했다", "교육 환경·계정·시작 상태 데이터 세트·결석자용 녹화를 준비했다", "자료 검토·수정 시간과 준비 비율을 견적에 넣었다", "교육 후 피드백 양식과 출석 기록을 준비했다"]}, {"t": "quiz", "items": [{"q": "UAT 전에 지역 전체 사용자에게 교육했을 때 관측된 결과는?", "options": ["도입이 빨라졌다", "혼란이 커져 핵심 사용자 UAT 후 지역 교육으로 순서를 바꿨다", "결함이 줄었다"], "answer": 1, "why": "테스트되지 않은 프로세스를 넓은 대상에게 가르치자 “따라가기 어렵고 복잡하다”는 반응이 나왔습니다. 핵심 사용자와 UAT를 먼저 하고 교육을 넓혔습니다."}, {"q": "최종 사용자 교육의 기본 분담은?", "options": ["파트너가 모든 사이트에서 직접 교육한다", "파트너가 사내 강사를 교육하고, 고객 키유저가 현지어로 최종 사용자를 교육한다", "교육 없이 매뉴얼만 배포한다"], "answer": 1, "why": "관측된 SOW 대부분이 최종 사용자 교육을 고객 책임으로 두고, 파트너는 train-the-trainer와 상한 있는 자료 지원만 맡았습니다."}, {"q": "처음 만드는 3일(전달 24h) 관리자 교육의 견적으로 가장 가까운 것은?", "options": ["24h", "약 80h (준비 2배 + 런북·평가)", "360h"], "answer": 1, "why": "처음 만드는 교육은 준비가 전달의 약 2–3배입니다. 견적 항목 “관리자 교육” M 값 80h와 맞습니다. 360h는 관리 도구까지 포함한 자립 패키지입니다."}, {"q": "가르칠 기능이 예산보다 많을 때 관측된 방법은?", "options": ["모든 기능을 짧게 줄여 넣는다", "검토자 점수로 기능 순위를 매기고 예산에서 끊는다", "고객에게 묻지 않고 공수를 늘린다"], "answer": 1, "why": "기능 우선순위표로 사이트 대표가 0–10점을 매기고, 기능별 공수를 누적해 예산에서 잘랐습니다."}]}]}, {"id": "support", "num": "12", "group": "run", "title": "운영 전환 이후를 *반복 사업*으로 만드는 법", "short": "지원·도입 확산", "goal": "운영 전환(Go-live) 전에 지원 계층·하이퍼케어·CCB·테넌트 규율을 설계하고, 고객 자립·도입 측정·가치 검증을 거쳐 갱신과 AMS(운영 지원 서비스) 계약으로 이어 갈 수 있습니다.", "facts": [["학습 시간", "45분"], ["대상", "PM·지원·영업"], ["산출물", "지원 체계·성공 계획·QBR 안건"]], "blocks": [{"t": "lead", "text": "운영 전환은 프로젝트의 끝이지만 고객 관계의 시작입니다. 관측 고객에서 사용자 확산, 개선 요청, 다음 단계 사업은 **모두 운영 전환 이후에** 일어났습니다. 이 모듈은 그 시기를 파트너의 반복 사업으로 설계하는 방법을 다룹니다."}, {"t": "sec", "id": "model", "text": "지원 계층과 책임자"}, {"t": "p", "text": "관측 운영 모델은 다섯 계층이었습니다. 핵심은 **고객 중앙 관리자 팀이 1차 관문**이라는 점입니다. 고객 사내 서비스 데스크 건수는 공급사 지원 케이스보다 훨씬 많았습니다. 계층마다 책임자 이름을 운영 전환 전에 적으십시오."}, {"t": "tiles", "items": [{"tag": "0단계", "title": "셀프 헬프", "text": "고객 관리자 팀이 큐레이션합니다.", "items": ["지식 베이스·FAQ", "녹화 교육·웨비나", "사용자 커뮤니티·아이디어 포털", "역할별 퀵 가이드"]}, {"tag": "1단계", "title": "사이트 키유저·챔피언", "text": "사용법 질문의 1차 응답자입니다.", "items": ["사용법 안내, 재현 정보 수집", "로컬 IT: 환경·네트워크·보안 소프트웨어", "관측: 업데이트 후 급증한 케이스가 보안 소프트웨어 설정 문제로 밝혀져 \"현장에서 먼저 점검\"을 요청"]}, {"tag": "2단계", "title": "고객 중앙 관리자 팀", "text": "운영의 실질적 소유자입니다.", "items": ["사내 서비스 데스크 큐", "변경 요청 트래커와 CCB", "DEV 구성 → PROD 반영", "사용자 관리(퇴사자 비활성화, 미결 레코드 위임)", "데이터 로드, 보고, 자체 연동"]}, {"tag": "3단계", "title": "파트너", "text": "AMS 계약의 범위입니다.", "items": ["2단계가 풀지 못한 구성·스크립트 문제", "개선 시간 버킷, CCB 참여", "릴리스 회귀 점검", "Autodesk 케이스 작성 지원"]}, {"tag": "4단계", "title": "Autodesk 지원", "text": "제품 자체의 문제를 다룹니다.", "items": ["제품 결함·장애 케이스", "결함 추적과 우회책", "제품 격차는 아이디어 포털·제품 피드백으로"]}]}, {"t": "p", "text": "관측 사례에서는 고객이 공급사 지원 케이스를 직접 열고 케이스 번호를 계정 팀에 전달했습니다. 파트너 계약에서는 **누가 Autodesk 케이스를 여는지, 파트너가 어디까지 대신하는지**를 SOW에 적으십시오(권장). 계층 설계의 상세 역할은 [[team|09 팀과 거버넌스]]를 참고하십시오."}, {"t": "table", "title": "심각도별 응답 목표: 관측 기준과 파트너 SLA 권장", "head": ["심각도", "정의(권장)", "관측 응답", "관측 해결·우회", "파트너 SLA 권장"], "rows": [["Sev1 / P1", "운영 테넌트 사용 불가, 다수 사이트 업무 중단", "1h (24×7, 전화 전용)", "24시간(현지 업무 시간)", "응답 1–2 업무시간, 우회책 1 영업일, 당번 지정"], ["Sev2 / P2", "핵심 워크플로·연동 장애, 우회 가능", "2h", "5일", "응답 4 업무시간, 우회책 3–5 영업일"], ["Sev3 / P3", "일부 기능 오류, 사용법 문의", "4–8h", "30일", "응답 1 영업일, 월간 개선 버킷 또는 다음 배포"], ["P4 개선 요청", "신규 기능·동작 변경", "지원 케이스 아님", "–", "CCB 경유, 2 영업일 내 접수 확인"]], "note": "관측 값은 엔터프라이즈 우선 지원 계약에서 판매된 목표로, 파트너 SLA 설계의 참고 기준입니다. Sev1은 지정 담당자가 전화로 확인해야 했고, 그렇지 않으면 Sev2로 처리되었습니다. 기능 요청은 지원 케이스가 아니며, 지원 측이 문제를 재현할 수 있어야 했습니다."}, {"t": "callout", "kind": "warn", "title": "제품 결함의 해결 시간은 약속하지 마십시오", "text": "파트너 SLA는 **응답, 분류, 우회책, Autodesk 에스컬레이션**까지만 약속합니다. 제품 결함 수정은 Autodesk 일정을 따릅니다. 24×7 대응은 실제 당번 인력이 있을 때만 파십시오. 관측 Sev1에서는 고객도 24×7 인력을 대기시킬 의무가 있었습니다. 계약 조항은 반드시 귀사 법무 검토를 거치십시오."}, {"t": "details", "items": [{"title": "케이스 작성 체크리스트 (관측)", "blocks": [{"t": "list", "items": ["영향: 사용자 수, 발생 빈도, 사이트", "재현 단계, 사용 데이터, 오류 메시지", "핵심 연락처와 원격 세션 가능 시간", "최근 변경·배포 내역", "이미 시도한 조치", "첨부: 화면 녹화, 스크린샷, 로그", "심각도와 그 근거"]}]}, {"title": "월간 지원 리뷰 안건 (관측 → 파트너 적용)", "blocks": [{"t": "list", "items": ["지난 60일 케이스 현황과 미결 케이스 표", "결함 상태: 케이스 → 결함 번호 → 우회책 문서", "반복·회피 가능 오류 분석(분기)", "최근 30일 제품 업데이트 소식", "진행 중인 개선·교육 활동", "Q&A: 고객이 미리 보낸 질문 우선"]}]}]}, {"t": "sec", "id": "hypercare", "text": "하이퍼케어와 첫 12개월"}, {"t": "p", "text": "관측 하이퍼케어는 **짧고 상한이 분명했습니다.** \"운영 전환 후 지원 요건 결정\"은 운영 전환 전 과업이었고, 고객은 운영 전환 후 역할과 책임을 문서로 확인해야 했습니다. 작업 방식이 크게 바뀌어 되돌릴 수 없는 경우에 하이퍼케어를 권했습니다."}, {"t": "table", "head": ["항목", "관측", "권장"], "rows": [["운영 전환 지원 시간", "8–16h, 최대 3일. PDM 이관은 최대 5일", "S 16h / M 24h / L 40h"], ["하이퍼케어 기간", "분류 체계 운영 전환 후 2주, 계획상 사후 지원 1개월, 이관 프로젝트 하이퍼케어 14h", "2–4주 + 시간 상한 병기"], ["지원 리듬", "착수 콜 후 ~5주간 주간 지원 콜, 주간 프로젝트 회의 재개", "첫 2주는 일일 15분 점검 → 이후 주간"], ["종료(클로즈아웃)", "운영 전환 ~2개월 후, 교훈 포함", "같음"], ["범위", "결함 수정 중심. 운영 전환 지원 시간을 작은 사후 변경에 재사용한 사례 있음", "재사용 허용 여부를 SOW에 명시"]]}, {"t": "callout", "kind": "rule", "title": "하이퍼케어 SOW 문구에 넣을 것", "items": ["\"최대 N시간\"과 기간(시작일·종료일)을 함께 적습니다.", "범위: 결함 분류·수정, 사용법 질문, 데이터 로드 오류 대응.", "제외: 개선 요청(CCB 백로그로 이관), 최종 사용자 교육, 고객 자체 연동 수정.", "종료 기준: 미결 P1·P2 0건, 미결 항목의 2단계 이관 완료.", "남은 시간 처리: 소멸 / AMS 버킷 이월 / 작은 사후 변경에 사용 중 택일. 상세: [[sow|05 SOW 작성]]"]}, {"t": "gantt", "title": "운영 전환 후 첫 12개월 (권장)", "subtitle": "관측된 리듬을 파트너 운영 계획으로 옮겼습니다", "cols": ["M1", "M2", "M3", "M4", "M5", "M6", "M7", "M8", "M9", "M10", "M11", "M12"], "rows": [{"label": "하이퍼케어", "start": 0, "len": 1, "kind": "run", "text": "2–4주"}, {"label": "주간 지원 콜", "start": 0, "len": 2, "kind": "std", "text": "~5주"}, {"label": "종료(클로즈아웃)", "start": 1, "len": 1, "kind": "gate", "text": "~2개월"}, {"label": "가치 기준선 측정", "start": 0, "len": 2, "kind": "std", "text": "1–2개월 차"}, {"label": "관리자 자립 Level 1", "start": 1, "len": 3, "kind": "std", "text": "운영 자립"}, {"label": "월간 CCB·개선 버킷", "start": 1, "len": 11, "kind": "run", "text": "매월"}, {"label": "첫 QBR", "start": 2, "len": 1, "kind": "gate", "text": "이후 M6·M9·M12"}, {"label": "사이트 확산 웨이브", "start": 3, "len": 9, "kind": "std", "text": "분기별 웨이브"}, {"label": "6개월 가치 평가·DEV 재동기화", "start": 5, "len": 1, "kind": "gate", "text": "M6"}, {"label": "관리자 자립 Level 2", "start": 5, "len": 4, "kind": "opt", "text": "개발 자립"}, {"label": "헬스 체크·갱신 증거", "start": 10, "len": 2, "kind": "opt", "text": "연 1회"}], "legend": [{"kind": "std", "text": "정기 활동"}, {"kind": "run", "text": "AMS 핵심"}, {"kind": "gate", "text": "검토 관문"}, {"kind": "opt", "text": "선택·연간"}], "note": "관측: 종료는 운영 전환 ~2개월 후, 기준선은 1–2개월 차, 가치 평가는 6개월 차, DEV 재동기화는 분기~반기, QBR은 연 4회. 다사이트 확산은 분기별 웨이브로 진행되었습니다."}, {"t": "checklist", "id": "support-ready", "title": "운영 전환 전 지원 체계 준비", "items": ["0–4단계 지원 계층마다 책임자 이름과 연락 경로를 문서화했다", "Autodesk 케이스를 누가 여는지, 파트너가 어디까지 대신하는지 합의했다", "심각도 정의, 응답 목표, P1 연락 체계(전화·당번)를 고객과 합의했다", "하이퍼케어 기간·시간 상한·범위·종료 기준을 SOW에 적었다", "변경 요청 트래커와 월간 CCB 일정을 만들고 파트너 참석을 확정했다", "DEV/PROD 규칙, 변경 로그, 유지보수 시간대, 배포 체크리스트를 승인받았다", "ERP·Vault 연동용 개발 샌드박스를 분리해 DEV 호출이 운영 시스템에 닿지 않게 했다", "UAT 스크립트를 회귀 테스트 세트로 정리해 Fusion Manage 또는 공유 저장소에 두었다", "고객 관리자 3명 이상을 지정하고 Level 1 교육 일정을 잡았다", "맞춤 스크립트·웹 앱의 소스 코드 사용권과 인계 패키지 일정을 확정했다", "MAU 목표와 사이트 × 역량 매트릭스의 기준 스냅샷을 만들었다", "가치 기준선 측정 계획(1–2개월 차)과 측정 책임자를 정했다", "사이트별 챔피언과 운영 전환 커뮤니케이션 계획을 확정했다", "케이스 작성 체크리스트와 셀프 헬프 자료 위치를 키유저에게 배포했다"]}, {"t": "sec", "id": "change", "text": "변경 요청·CCB와 테넌트 규율"}, {"t": "p", "text": "운영 전환 직후부터 개선 요청이 쏟아집니다. 관측된 다사이트 설계 변경 롤아웃 + Items & BOMs 파일럿에서는 **약 11개월 동안 ~130건**이 접수되었습니다. 요청 트래커와 CCB가 없으면 이 요청이 그대로 맞춤화 폭주가 됩니다."}, {"t": "stats", "items": [{"value": "~130건", "label": "약 11개월간 접수된 운영 전환 후 변경 요청"}, {"value": "~1/10", "label": "CCB에서 반려된 비율 (정당한 반려)"}, {"value": "~85%", "label": "우선순위 낮음·중간 요청 비율"}, {"value": "~83%", "label": "설계 변경 롤아웃에서 나온 요청 비율"}]}, {"t": "flow", "title": "요청 라이프사이클 (관측)", "items": [{"title": "생성·준비", "text": "요청자, 사이트, 유형, 우선순위"}, {"title": "검토·영향 분석", "text": "고객 관리자 + 파트너"}, {"title": "CCB 검토", "text": "승인 / 반려 / 보류 / 제품 지원 대기", "hi": true}, {"title": "DEV 변경", "text": "사이트가 DEV에서 테스트·승인"}, {"title": "PROD 반영", "text": "유지보수 시간대 배포"}, {"title": "완료", "text": "변경 로그·교육 자료 갱신"}]}, {"t": "bars", "title": "요청 유형 구성 (관측)", "subtitle": "절반 이상이 구성·스크립트·워크플로 작업 — 월간 개선 시간 버킷의 근거입니다", "unit": "%", "items": [{"label": "워크스페이스 구성", "value": 25, "hi": true}, {"label": "문제(이슈)", "value": 16}, {"label": "스크립트", "value": 15}, {"label": "워크플로", "value": 12}, {"label": "기능 개선", "value": 11}, {"label": "명확화·문의", "value": 9}, {"label": "API·웹 앱", "value": 5}, {"label": "권한", "value": 5}], "note": "트래커 한 줄에 고객 CCB 번호, 사내 서비스 데스크 요청 번호, 지원 케이스 번호를 함께 연결했습니다. 열 구성: CCB 번호 | 요약 | 상태 | 사이트 | 유형 | 요청자 | 우선순위 | 연결 번호 | 워크스트림 | 환경 | 날짜별 비고."}, {"t": "list", "title": "파트너 컨설턴트가 요청을 걸러내는 질문", "items": ["**표준 기능(OOTB)으로 먼저 되는가?** 표준에 가깝게 시작하고 반복 개선합니다.", "**지금 꼭 필요한가, 미룰 수 있는가?** 우선순위를 \"지금 / 다음 분기 / 보류\"로 나눕니다.", "**모든 사이트에 해당하는가?** 아니면 전역 변경 대신 사이트별 작업 템플릿을 씁니다.", "**설계된 동작인가?** 예: 담당자 부재는 구성 변경이 아니라 위임으로 해결합니다.", "**다른 변경이나 예정된 ERP 연동이 이미 해결하는가?**", "**SOP가 기존 경로를 요구하는가?** 그렇다면 반려하고 근거를 남깁니다.", "UAT 중 접수된 개선 요청은 운영 전환 범위에 넣지 않고 백로그로 보냅니다."]}, {"t": "h", "text": "DEV/PROD 규율"}, {"t": "p", "text": "관측 사례에서는 운영 전환 후 DEV에서 실험을 하다 운영 중인 구성까지 DEV와 PROD가 어긋났습니다. 아래 절차는 그 문제를 고치려고 도입한 테넌트 유지 절차입니다. 테넌트 구성 원칙은 [[method|08 딜리버리 방법론]]과 함께 보십시오."}, {"t": "steps", "items": [{"title": "DEV에서 개발·내부 테스트", "text": "공유 변경 로그에 목적·범위·영향을 적고, 실험 중인 변경과 승인된 변경을 구분해 표시합니다.", "meta": "담당: 고객 관리자·파트너"}, {"title": "고객 UAT(DEV)와 변경 요청 패키지", "text": "UAT 후 고객이 문서, 테스트 결과, 사용자 피드백을 묶어 변경 요청을 준비합니다.", "meta": "담당: 고객 키유저"}, {"title": "변경 자문 위원회(CAB) 승인", "text": "PROD 반영 여부와 배포 일정을 결정합니다.", "meta": "담당: 고객 CCB·CAB"}, {"title": "유지보수 시간대 배포", "text": "배포 체크리스트로 반영하고 PROD에서 스모크 테스트합니다. 반려·실패한 구성은 DEV에서도 즉시 지웁니다.", "meta": "담당: 고객 관리자(파트너 지원)"}, {"title": "정기 재동기화와 감사", "text": "분기 또는 반기마다 PROD 기준으로 DEV를 재동기화하고, 문서화되지 않은 변경을 감사합니다. 테넌트 비교 도구로 차이를 확인합니다.", "meta": "주기: 분기~반기"}]}, {"t": "callout", "kind": "example", "title": "관측 사고: 대형 이전이 기존 레코드를 깨뜨림", "text": "큰 워크스페이스·라이프사이클·스크립트 묶음을 PROD로 옮기자 기존 레코드가 깨져 되돌리고 다시 승인받아야 했습니다. 변경은 작게 나눠 옮기고, ERP 개발·Vault 개발 샌드박스를 따로 두어 DEV의 연동 호출이 운영 시스템에 닿지 않게 하십시오."}, {"t": "h", "text": "SaaS 릴리스 대응"}, {"t": "p", "text": "Fusion Manage는 SaaS라 업데이트가 자동으로 적용되고 모든 사용자가 같은 버전을 씁니다. 고객이 업그레이드 시점을 고르지 않으므로 파트너의 가치는 **사전 영향 분석과 회귀 확인**에 있습니다. 아래 표에서 \"권장\"은 관측 기록이 없는 항목입니다."}, {"t": "table", "head": ["활동", "근거", "내용"], "rows": [["릴리스 노트 검토", "권장", "스크립트·연동·웹 앱·보고에 미칠 영향을 분류하고 키유저에게 요약 공유"], ["회귀 테스트", "관측", "UAT 마스터 테스트 스크립트를 Fusion Manage에 두고 변경마다 갱신했습니다. 핵심 시나리오를 업데이트 후 다시 실행합니다"], ["스크립트 점검", "관측", "상태 이름으로 참조하는 스크립트는 이름 변경 시 수정 비용이 컸습니다. ID 기반 참조를 권장합니다"], ["연동 확인", "권장", "ERP·Vault 연동 스모크 테스트와 오류 로그 확인"], ["일정 충돌 회피", "관측", "사이트 운영 전환 중에는 업데이트 테스트를 피했고, 연말 ERP 동결은 운영 전환 리스크로 관리했습니다"], ["교육 자료 갱신", "관측", "개선 릴리스마다 교육 가이드를 갱신했습니다"]]}, {"t": "sec", "id": "independence", "text": "고객 자립 경로"}, {"t": "p", "text": "고객 자립은 파트너 매출을 줄이는 일이 아닙니다. 관측 사례에서 이전 단계의 지식 이전이 약하자 고객은 \"그렇게 도움이 많이 필요하다면 지난번 지식 이전은 뭐였나\"라며 다음 서비스를 거절했습니다. **자립을 유료 워크스트림으로 설계**하고, 자립 이후의 고급 작업을 AMS로 파십시오. 교육 설계는 [[training|11 교육 설계]]를 참고하십시오."}, {"t": "steps", "items": [{"title": "Level 1 운영 자립", "text": "운영·모니터링·문제 해결을 스스로 합니다. 강의보다 실제 작업(환경 퍼지·DEV 재적재)에 참여하며 배우고, 감사 출력 해석과 주간·격주 정상 동작 점검을 익힙니다.", "meta": "관측: 슈퍼 관리자 6–8명, 프로그램 총 ~45일"}, {"title": "Level 2 개발 자립", "text": "빌드·테스트 주기, 진단 로깅 같은 통제된 저위험 변경을 수행합니다. 개발 소유를 누가 가질지는 Level 1 이후 공동 평가로 정합니다.", "meta": "Level 1 완료 후에만 시작"}, {"title": "인계 패키지", "text": "맞춤 스크립트·웹 앱의 소스 코드 사용권 계약, 소스 코드, README·배포 가이드·도움말, \"저위험 변경\" 정의, 데이터 로드 도구, 사용자 관리 도구.", "meta": "운영 전환 전 일정 확정"}, {"title": "지속 역량 유지", "text": "신규 관리자 온보딩과 심화 교육을 정기 항목으로 둡니다. 관측: 슈퍼 관리자 교육 연 ~15일, 데이터 모델 유지 월 1인일(영향 분석·소규모 변경).", "meta": "AMS 또는 연간 SOW"}]}, {"t": "table", "title": "관측된 관리자 교육 프로그램 구성 (~45일)", "head": ["구성", "기간"], "rows": [["사용자 설정(계정·그룹·권한)", "~10일"], ["제3자 데이터 정제", "~5일"], ["데이터 로드 도구·구성·거버넌스·데이터 모델 유지", "~30일"], ["Σ 합계", "~45일"]], "num": [1], "note": "별도로, 데이터 로드 도구 자립 과정은 원격 10일(자립 8일 + 개선 2일)을 3–4개월에 걸쳐 진행했습니다. 성공 기준: 관리자 팀이 파트너 없이 실행·모니터링·문제 해결, 소유·거버넌스 모델과 \"저위험 변경\" 정의 문서화, 통제된 변경 시연."}, {"t": "callout", "kind": "rule", "title": "맞춤 도구는 지원 경계가 있는 제품으로 다루십시오", "items": ["맞춤 스크립트·웹 앱·도구는 Autodesk 지원 대상이 아닙니다. 인계 후 유지 책임자를 계약에 적습니다.", "관측: 소스 코드 사용권 계약이 늦어져 코드 배포가 막혔고, 프로그램 최상위 리스크가 되었습니다.", "관측: \"전 세계 관리자 2명뿐\"이 리스크로 지적되었습니다. 최소 3명 교차 교육을 권장합니다.", "관측 리스크: 참석자 시간 부족, 교육 후 지식 미정착, 소수 인원 의존. 대응: 녹화, 런북, 섀도잉, 감독하의 실행.", "계약 조항은 반드시 귀사 법무 검토를 거치십시오."]}, {"t": "sec", "id": "adoption", "text": "도입 측정과 확산 프로그램"}, {"t": "callout", "kind": "warn", "title": "2년 후 활성 사용자 147명, 목표는 3,000–5,000명", "text": "관측된 한 설계 변경 롤아웃은 운영 전환 2년 후 활성 사용자가 목표의 ~3–5%에 그쳤습니다. 변경 관리 없이 \"IT 롤아웃을 던져 놓은\" 결과였습니다. 계정은 수천 개가 프로비저닝되어 있었지만 MAU는 수백 명 수준이었습니다. 원인: 스프레드시트 대비 효익이 보이지 않음, 사이트 오너 부재, 역할 기반이 아닌 교육, 빠른 성과를 알리지 않음, 스폰서 이탈. 변경 관리 투입 후 7–9개 사이트, 활성 사용자 ~200명으로 회복 중이었습니다."}, {"t": "table", "title": "도입 지표 (관측 정의)", "head": ["지표", "정의", "주기", "주의"], "rows": [["MAU 대비 목표", "월간 활성 사용자 ÷ 목표 사용자", "월", "프로비저닝 계정 수가 아닙니다"], ["워크스페이스별 활동", "설계 변경, Items & BOMs 등 영역별 활성 사용자", "월", "확산이 한 영역에 몰리는지 확인"], ["사이트 × 역량 매트릭스", "사이트별 PDM, 설계 변경, Items & BOMs, 공급업체, 제품 관리 적용 여부(0/1)", "분기 스냅샷", "지연 일정은 취소선, 막힌 항목은 표시"], ["워크플로 경유 변경 비율", "전체 변경 중 Fusion Manage 워크플로로 처리된 비율", "월", "스프레드시트 병행 운영 탐지"], ["ERP–PLM 코드 불일치 추세", "월간 쿼리로 불일치 건수 추적", "월", "데이터 오너·스튜어드 지정"], ["프로세스 KPI", "백로그, 처리 시간, 대기 일수, 월 완료 건수", "월", "개인이 아니라 프로세스 단위"], ["거버넌스 KPI", "기한 초과 %, 긴급 변경 %, 에스컬레이션", "월", "집계 수준으로만 공개"]]}, {"t": "tiles", "title": "확산 프로그램 구성 요소", "items": [{"tag": "사람", "title": "챔피언 네트워크", "text": "사이트마다 변화 담당자 1명을 둡니다. 큰 전체 콜보다 소그룹·1:1 멘토링이 효과적이었습니다."}, {"tag": "사람", "title": "실천 커뮤니티", "text": "월 90분 세션. 산출물: 현행/목표 템플릿, 재사용 솔루션 패턴, 플레이북, 교훈 저장소. 리스크: 참여 저조, 경영진 지원 부재."}, {"tag": "소통", "title": "6개월 커뮤니케이션 캠페인", "items": ["M1 착수·인식: 임원 메시지, 인포그래픽", "M2 연동 심층: \"품목의 DNA\", 3분 인터뷰 영상, FAQ", "M3 엔지니어링 효율 사례", "M4 제조·컴플라이언스", "M5 혁신·지속가능성", "M6 성과 축하: 로드맵 인포그래픽"]}, {"tag": "소통", "title": "녹화 우선", "text": "관측 온보딩 웨비나: 안내 ~44명 → 등록 16명 → 실시간 참석 6명. 녹화본과 챔피언을 주 채널로 쓰십시오."}, {"tag": "증거", "title": "성공 사례", "text": "가치 실현 1페이지(과제·솔루션·결과·핵심 지표·인용)로 만듭니다. 고객 승인과 개인 동의서가 있어야 공개할 수 있습니다."}, {"tag": "확산", "title": "확산 플레이북", "items": ["사이트 간 롤아웃 정렬 콜", "준비도 점검: 준비됨? 막힘? 지원 필요?", "1–2개 사이트 4주 패스트트랙", "롤아웃 키트: 1페이지 안내, 짧은 영상, 준비도 체크리스트", "경영진 하향 메시지"]}]}, {"t": "p", "text": "관측된 회복 방법은 3단계였습니다. **진단·전략**(장애 요인 분석, 리더십 재참여, 챔피언 네트워크) → **신규 2–3개 사이트 파일럿·최적화** → **KPI로 확산·정착**. 조직 차원은 Kotter, 개인 차원은 ADKAR 같은 변경 관리 모델을 함께 썼습니다. 변경 관리는 구성 작업과 별도 라인 아이템으로 견적하십시오([[estimate|03 스코핑과 견적]])."}, {"t": "details", "items": [{"title": "직원 대표 기구의 \"감시\" 우려와 대응 (관측)", "blocks": [{"t": "p", "text": "관측 사례는 공동결정 제도가 있는 국가에서 직원 대표 기구의 승인이 일부 사이트 운영 전환을 ~12개월 막은 경우입니다. 한국에서도 노사협의회·개인정보 관점에서 비슷한 질문이 나올 수 있으므로 운영 전환 전에 준비하십시오(권장). 계약·노무 판단은 반드시 귀사 법무 검토를 거치십시오."}, {"t": "table", "head": ["우려", "대응·안전장치"], "rows": [["승인 시간을 개인별로 비교·순위화", "목적 제한과 비사용 약속을 문서화: 순위·개인 성과표 없음, 워크플로 시간은 인사 평가에 쓰지 않음"], ["지연 대시보드와 자동 에스컬레이션의 압박", "대시보드는 프로세스·팀·사이트 수준 집계만, 실명 목록 없음, 병목은 구조 문제로 표현"], ["영구적인 승인 이력 추적", "컴플라이언스·근본 원인 분석을 위한 조직 기억으로 설명, 보존·삭제 기간 문서화"], ["클라우드 호스팅과 해외 관리자 접근", "호스팅·데이터 보호·관리자 접근 정책과 \"누가 무엇을 보는가\"를 초기에 설명, 역할 기반 제한"], ["새로운 감시 범주인가?", "ERP·PDM·품질 시스템도 이미 거래 로그를 남긴다는 일관성 원칙: 같거나 더 엄격한 규칙 적용"]]}, {"t": "p", "text": "근거로 쓴 메시지: 효과는 개인을 빠르게 만든 데서가 아니라 **상태 확인·재작업·확인 반복 같은 조정 낭비를 없앤 데서** 나왔습니다. 대시보드에 사용자별 업무량 보기를 넣으면 이 약속과 충돌하므로 운영 전환 전에 정리하십시오."}]}]}, {"t": "sec", "id": "value", "text": "성공 계획·QBR·가치 검증"}, {"t": "p", "text": "관측된 성공 관리 주기는 **결과 식별 → SMART 가치 지표 → 성공 계획 → 정기 리뷰(월간 현황·QBR) → 정량 결과**였습니다. 원칙은 \"공급사의 계획이 아니라 고객의 계획\"입니다. 파트너는 구조·책임·가치 증거를, 고객은 이해관계자 정렬·거버넌스 참여·실행을 맡습니다. 성공 계획은 계약이 아니라 살아 있는 관리 문서입니다."}, {"t": "template", "title": "성공 계획 (Success Plan)", "intro": "운영 전환 전에 초안을 만들고 첫 QBR에서 고객과 확정합니다. 분기마다 갱신합니다.", "sections": [{"h": "고객 사업 과제와 스폰서", "items": ["과제명과 목표(고객 언어), 고객 가치 문장", "경영진 스폰서, 과제 오너, 사이트 오너"]}, {"h": "과제별 페이지", "items": ["목표와 마일스톤 (마일스톤 | 시점 | 담당)", "상태와 장애 요인, 최근 갱신일", "과제 / 필요 / 솔루션", "가치 목표와 핵심 리스크", "리뷰 리듬"]}, {"h": "지표 3수준", "items": ["전술: 사용(MAU, 워크스페이스별 활동)", "운영: 프로세스 영향(처리 시간, 기한 초과 %, 재작업)", "전략: 사업 가치(고객이 정의)", "표 형식: 지표 | 설명 | 담당 | 목표"]}, {"h": "도입 계획", "items": ["MAU 목표와 사이트 웨이브", "챔피언, 커뮤니케이션 일정, 교육 계획"]}, {"h": "거버넌스", "items": ["책임: 스폰서, 사이트 오너, 양측 기술 리드, PM", "QBR 일정, 월간 지원 리뷰, 월간 CCB", "에스컬레이션 경로"]}, {"h": "가치 검증 레지스터", "items": ["과제 | 3년 가치(시간) | 효익 유형(확정 / 추정 / 비재무) | 고객 검증자 | 근거 | 실제 실현"]}, {"h": "다음 단계 후보", "items": ["확장 과제, 비즈니스 케이스 상태, 필요한 결정"]}]}, {"t": "table", "title": "QBR 90분 안건 (관측)", "head": ["순서", "내용", "시간"], "rows": [["1", "환영과 목표", "5분"], ["2", "고객 업데이트: 우선순위 / 진척·가치 / 지원·정렬 세 질문", "10분"], ["3", "성과와 도입: MAU 대비 목표, 사이트 × 역량 매트릭스, 지원 현황", "10분"], ["4", "지난 90일 진척과 가치: 승인된 가치 vs 예측", "15분"], ["5", "가치 실현 리스크: 리스크 | 공동 대응 | 결정 요청", "15분"], ["6", "혁신·제품 로드맵", "15분"], ["7", "다음 90일: 마일스톤, 담당", "15분"], ["8", "공동 우선순위 합의", "5분"], ["Σ 합계", "", "90분"]], "num": [2], "note": "다음 QBR은 이전 QBR의 리스크와 마일스톤을 상태와 함께 다시 봅니다. 관측 사례는 QBR을 고객 사이트를 돌며 하이브리드로 열고, 모든 지역이 참석할 수 있는 시간에 맞췄습니다. 지연 비용은 경영진에게 \"지연 개월 수\"로 보여 주었습니다."}, {"t": "h", "text": "가치 검증 방법"}, {"t": "steps", "items": [{"title": "기준선 측정", "text": "운영 전환 후 1–2개월 안에 처리 시간, 건수, 관리 공수의 기준선을 잡습니다. 과거 날짜를 \"승인된 기준선\"으로 제시하지 않습니다.", "meta": "담당: 파트너 PM + 고객 오너"}, {"title": "가치 인터뷰", "text": "운영 1년 이상 된 사이트 3곳의 사용자 7명처럼 역할을 섞어 고릅니다. 30–60분, 진행자·기록자·시간 관리자. \"감사가 아님\"으로 시작하고 항상 숫자를 묻습니다. 포커스 그룹(4–8명) → 표적 1:1 → 설문 순서가 효과적이었습니다.", "meta": "관측 방법"}, {"title": "설문", "text": "~10분, 6개 섹션(맥락, 사용, 프로세스 품질, 스프레드시트 대비 가치, 자유 의견, 후속 동의). 중립 없는 4점 척도로 바꾸고, 측정할 수 없는 \"% 감소\" 응답은 받지 않았습니다.", "meta": "고객이 배포, 파트너가 질문·분석"}, {"title": "계산", "text": "주당 절감 시간 × 45–46주 × 대상 사용자·사이트. 금액이 필요하면 고객이 자신의 시간당 원가로 환산합니다.", "meta": "시간 단위로만 보고"}, {"title": "검증 레지스터 기록", "text": "효익 유형(확정 / 추정 / 비재무), 고객 검증자, 근거, 실제 실현을 적습니다. 슬라이드마다 출처와 신뢰도(상·중·하)를 남깁니다.", "meta": "QBR마다 갱신"}, {"title": "6개월 가치 평가와 종료 보고", "text": "검증된 동인만 합한 보수적 하한을 헤드라인으로, 나머지는 금액화하지 않은 추가 효과로 보고합니다.", "meta": "운영 전환 후 6개월"}]}, {"t": "table", "title": "인터뷰 기준값으로 쓴 관측 결과", "head": ["KPI", "관측 결과"], "rows": [["긴급 변경 처리 시간", "며칠 → 몇 시간"], ["변경 1건당 관리 공수", "2–4h → 0.5–1.5h"], ["CCB 회의 시간", "−40–60%"], ["코디네이터 처리량", "3–5배, ~1 → ~0.5 FTE"], ["엔지니어 절감 시간", "집중 사용자 주 2–3h, 코디네이터 주 ~8h"], ["감사 준비", "며칠 → 몇 분"]], "note": "한 프로그램의 관측치입니다. 고객 인터뷰에서 \"우리도 이 정도인가?\"를 묻는 기준점으로만 쓰고, 그대로 약속하지 마십시오."}, {"t": "callout", "kind": "rule", "title": "가치 주장의 원칙", "items": ["예상 ≠ 실현. 관측 중간 시점에 승인된 가치는 ~12%, 나머지 ~88%는 예측이었습니다.", "효익마다 확정 / 추정 / 비재무로 분류하고 고객 측 검증자 이름을 받습니다.", "절약한 시간을 \"현금\"이라고 부르지 않습니다. 스폰서는 그 시간을 어디에 재배치했는지 묻습니다.", "인터뷰 기반 재산정이 원래 비즈니스 케이스의 ~8배로 나온 사례도 있었지만, 헤드라인은 보수적 하한을 유지합니다.", "가치 산정 상세: [[sell|02 영업·디스커버리]]"]}, {"t": "sec", "id": "ams", "text": "갱신·확장과 AMS 오퍼 설계"}, {"t": "p", "text": "관측 계정에서 갱신 논의는 \"고객이 이 계약의 ROI를 증명해야 한다\"는 전제로 진행되었습니다. 갱신과 확장은 **증거가 쌓인 결과**에만 붙었습니다. 갱신 시계와 고객 측 일정은 [[sell|02 영업·디스커버리]]를 참고하십시오."}, {"t": "list", "title": "갱신·확장을 증거에 묶는 방법 (관측)", "items": ["QBR마다 승인된 가치 vs 예측, 가치 실현 리스크, 활성 사용자 추세를 보여 줍니다.", "계약 마지막 해에는 갱신 필요 사항을 식별하고 헬스 체크를 합니다.", "새 계약이 시작되면 이전 계약을 공식 종료하고, 첫 90일 안에 성공 계획을 검증·갱신합니다.", "다음 단계 비즈니스 케이스(공급업체 관리 0단계 이후, 신규 품목 요청 등)는 성공 계획 리뷰와 현장 방문에서 나왔습니다.", "보류된 과제의 미사용 공수는 다른 워크스트림(예: 공급업체 관리)으로 돌렸습니다.", "관측 갱신 리스크: \"구현이 끝나면 다음 갱신은 컨설팅이 훨씬 줄어든다.\" AMS와 확장 로드맵으로 미리 대비합니다([[roadmap|13 로드맵]])."]}, {"t": "callout", "kind": "source", "title": "배경: 관측 계약의 상업 구조", "text": "관측 고객은 사용량 기반(소비형) 라이선스를 썼습니다. 활성 사용자 수와 사용 일수가 곧 소비량이었고, 개발 테넌트 로그인도 소비에 잡혀 따로 보정해야 했습니다. 도입 지표가 그대로 갱신 규모 논의의 근거가 된 이유입니다. 컨설팅은 엔터프라이즈 계약의 선불 컨설팅 시간 풀에서 워크스트림별 요청서 단위로 차감했습니다. 파트너 모델로는 **SOW + 범위 변경서(Change Request) + 선불 시간 풀(retainer)/고정가/T&M**으로 옮깁니다. 라이선스 상업 조건은 이 가이드의 범위 밖입니다."}, {"t": "table", "title": "AMS 구성 요소 (권장)", "head": ["구성 요소", "내용", "관측 근거", "권장 규모"], "rows": [["관리자 대행", "사용자·그룹·권한, 퇴사자 비활성화·위임, 데이터 로드 실행·로그 확인, 사내 1차 문의 응답", "전담·외부 관리자 서비스를 제안했음. 고객 내부 1차 지원 기준선: 주 4건 × 1h", "8–16h/월"], ["개선 시간 버킷", "소규모 구성·워크플로·스크립트 변경, 영향 분석", "데이터 모델 유지 풀 월 1인일. 다사이트 롤아웃에서 요청 ~130건/11개월(월 ~12건), 85%가 저·중 우선순위", "S 8h / M 16–24h / L 40h(월)"], ["CCB 참여·요청 검토", "월간 CCB, OOTB 우선 검토, 백로그 정리", "파트너 컨설턴트가 월간 CCB에 참석", "2–4h/월"], ["릴리스 회귀 점검", "릴리스 노트 영향 분석, 회귀 스크립트 실행, 연동 스모크 테스트, 변경 요약", "관측 기록 없음", "4–16h/릴리스"], ["헬스 체크", "테넌트 구성 검토, 모범 사례 권고, DEV/PROD 차이 감사, 보고서", "연 1회 기술 헬스 리뷰. 엔터프라이즈 헬스 체크 평균 ~10인일", "연 1회 16–80h"], ["지원 리뷰·QBR", "월간 지원 리뷰, 분기 QBR 준비·진행, 가치 레지스터 갱신", "월간 지원 콜, 연 4회 QBR", "2h/월 + 8h/분기"], ["관리자 교육 갱신", "신규 관리자 온보딩, Level 2 심화", "슈퍼 관리자 교육 연 ~15일", "필요 시 별도 SOW"]], "note": "권장 규모는 관측치 기반 추정입니다. 첫 3개월 실적(요청 건수, 소요 시간)으로 다시 맞추십시오."}, {"t": "table", "title": "월간 AMS 패키지 예 (권장)", "head": ["구성", "S", "M", "L"], "rows": [["관리자 대행", "8h", "12h", "16h"], ["개선 시간 버킷", "8h", "20h", "40h"], ["CCB 참여·요청 검토", "2h", "3h", "4h"], ["지원 리뷰", "2h", "2h", "4h"], ["릴리스 회귀 점검(월 환산 적립)", "2h", "4h", "8h"], ["Σ 월 합계", "22h", "41h", "72h"]], "num": [1, 2, 3], "note": "S = 단일 사이트·워크스페이스 소수, M = 다사이트·연동 1–2개, L = 다사이트 확산 중·스크립트 다수. QBR 준비와 연 1회 헬스 체크는 별도 항목으로 견적합니다([[estimate|03 견적 계산기]])."}, {"t": "list", "title": "AMS 계약에 적을 규칙 (권장)", "items": ["월 고정 시간 + 응답 목표(심각도 표) + 해결 책임 범위(제품 결함 수정 제외).", "미사용 시간 처리: 관측 선불 모델에서는 남은 시간이 풀로 돌아가고 서비스 종료일에 소멸했습니다. 이월 한도를 명시합니다.", "버킷을 넘는 요청은 다음 달로 이월하거나 범위 변경서로 처리합니다.", "제외: Autodesk 제품 결함 수정, 고객 자체 연동, 최종 사용자 교육, 신규 워크스페이스 구축(별도 SOW).", "매월 사용 보고(요청 | 유형 | 시간 | 상태), 분기마다 버킷 크기 재검토.", "상업 구조: [[commercial|06 계약과 상업 모델]], 문구: [[sow|05 SOW 작성]]. 계약 조항은 반드시 귀사 법무 검토를 거치십시오."]}, {"t": "quiz", "items": [{"q": "운영 전환 후 도입 수준을 보고할 때 기준으로 써야 하는 것은?", "options": ["프로비저닝된 계정 수", "MAU 대비 목표와 사이트 × 역량 매트릭스", "교육 참석자 수"], "answer": 1, "why": "관측 사례는 계정이 수천 개 프로비저닝된 동안 MAU는 수백 명이었습니다. 활성 사용자와 사이트별 적용 상태로 보고해야 실제 확산이 보입니다."}, {"q": "UAT 중 키유저가 새 기능 개선을 요청했습니다. 올바른 처리는?", "options": ["운영 전환 범위에 바로 추가한다", "백로그에 올려 운영 전환 후 CCB에서 검토한다", "하이퍼케어 시간으로 처리한다"], "answer": 1, "why": "UAT 중 개선 요청은 운영 전환 범위에 넣지 않습니다. CCB에서 OOTB 우선 원칙으로 검토하고 개선 시간 버킷이나 별도 SOW로 처리합니다."}, {"q": "DEV 테넌트를 PROD 기준으로 재동기화하는 관측 주기는?", "options": ["매주", "분기 또는 반기", "재동기화하지 않는다"], "answer":
