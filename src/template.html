<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>{{CSS}}</style>
</head>
<body>
<button class="menu-btn" id="menubtn" type="button" aria-label="Menu">☰</button>
<aside class="side" id="side">
  <div class="brand">
    <img alt="Autodesk" src="data:image/svg+xml;base64,{{LOGO}}">
    <div class="prod">{{PRODUCT}}</div>
    <div class="sub">{{SUBTITLE}}</div>
    <div class="ver">{{VERSION}}</div>
  </div>
  <div class="prog"><span id="progtxt"></span><div class="track"><div class="fill" id="progfill"></div></div><div class="tt" id="tottime"></div></div>
  <div class="savebox">
    <button type="button" class="sbtn" id="savebtn">{{SAVE}}</button>
    <div class="smsg" id="savemsg">{{AUTOSAVE}}</div>
    <div class="sio"><button type="button" class="lnk" id="expbtn" title="{{EXPHINT}}">{{EXPORT}}</button> · <button type="button" class="lnk" id="impbtn" title="{{EXPHINT}}">{{IMPORT}}</button><input type="file" id="impfile" accept="application/json" hidden></div>
  </div>
  <a class="bldlink" href="#m-builder">{{BUILDER}} →</a>
  <div class="search"><input id="q" type="search" placeholder="{{SEARCH}}" aria-label="{{SEARCH}}"></div>
  <nav id="nav" aria-label="Modules"></nav>
  <div class="langs">{{LANGS}}</div>
</aside>
<main class="main" id="main"></main>
<script>window.ACADEMY = {{DATA}};</script>
<script>{{JS}}</script>
</body>
</html>
